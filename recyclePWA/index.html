<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>RECYCLE — sort the garbage, sell the good stuff</title>
<meta name="description" content="A mobile process-sim about running a recycling line. Get paid to take garbage, liberate the bags, sort it clean into bales, sell the good stuff and dodge the landfill bill.">
<meta name="theme-color" content="#1F1D1B">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RECYCLE">
<meta property="og:type" content="website">
<meta property="og:title" content="RECYCLE">
<meta property="og:description" content="Run a recycling line: take the garbage, sort it clean, sell the good stuff, dodge the landfill bill.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F1D1B'/%3E%3Crect x='13' y='13' width='21' height='21' rx='5' fill='%23D98E48'/%3E%3Ccircle cx='42' cy='42' r='11' fill='%237FA86B'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F1D1B'/%3E%3Crect x='13' y='13' width='21' height='21' rx='5' fill='%23D98E48'/%3E%3Ccircle cx='42' cy='42' r='11' fill='%237FA86B'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1c1916">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">

</head>
<body>
<div id="menu">
  <div class="logo">RE<b>CYCLE</b></div>
  <button class="mbtn" id="btnResume" style="display:none"><span id="mResume">Resume</span><div class="sub" id="mResumeSub">continue your current run</div></button>
  <button class="mbtn flag" id="btnCareer"><span id="mCareer">Career</span><div class="sub" id="mCareerSub">Learn the line, then run your plant.</div></button>
  <button class="mbtn" id="btnAtelier"><span id="mAtelier">Atelier</span><div class="sub" id="mAtelierSub">Financial challenge. No tutorial.</div></button>
  <button class="mbtn" id="btnSandbox"><span id="mSandbox">Sandbox</span><div class="sub" id="mSandboxSub">Infinite feed. No fail. Figure it out.</div></button>
  <button class="mbtn" id="btnDemo"><span id="mDemo">Reference plant</span><div class="sub" id="mDemoSub">A full plant already running.</div></button>
  <button class="mbtn" id="btnLoad" style="display:none"><span id="mLoad">Load game</span><div class="sub" id="mLoadSub">Resume a saved career or sandbox, or import a file.</div></button>
  <input type="file" id="importFile" accept="application/json,.json" style="display:none">
  <div id="langRow"><button data-lang="en" class="on">EN</button><button data-lang="fr">FR</button></div>
</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <button id="menuBtn" aria-label="Home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
    <div class="stat" id="cashStat"><span class="lbl">Cash</span><span class="val">&#8364;2000</span></div>
    <div class="stat" id="pnlStat"><span class="lbl">Yesterday</span><span class="val">&#8212;</span></div>
    <div class="stat" id="divStat"><span class="lbl">Recycling</span><span class="val">0%</span></div>
    <div class="stat" id="clockStat"><span class="val" id="clockVal">00:00</span></div>
    <button id="saveBtn" aria-label="Save"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button>
    <button id="undoBtn" aria-label="Undo" disabled>&#8630;</button>
  </div>
  <div id="chint"></div>
  <div id="coach"><div class="chead2"><span class="cstep" id="coachStep"></span><span class="cprog2" id="coachProg2"></span></div><div class="cobj" id="coachObj"></div><div class="ctxt" id="coachTxt"></div></div>
  <div id="viewTech" class="vpanel"></div>
  <div id="viewObj" class="vpanel"></div>
  <div id="viewCon" class="vpanel"></div>
</div>
<div id="phaseBar"><div class="pbInfo"><span id="pbName"></span><span id="pbNum"></span></div><div class="pbTrack"><div id="pbFill"></div></div></div>
<div id="dock">
  <button class="pbtn" id="play" aria-label="Play/Pause"></button>
  <div id="speed"><div class="sp on" data-s="1">1&#215;</div><div class="sp" data-s="2">2&#215;</div><div class="sp" data-s="4">4&#215;</div><div class="sp" data-s="8">8&#215;</div></div>
  <div id="spacer"></div>
  <button class="pbtn" id="connBtn" aria-label="Connect" style="display:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 12h8"/><circle cx="5" cy="12" r="2.6"/><circle cx="19" cy="12" r="2.6"/></svg></button>
  <button class="pbtn" id="fleetBtn" aria-label="Fleet"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v9H3z"/><path d="M14 9h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.7"/><circle cx="17.5" cy="18" r="1.7"/></svg></button>
  <button id="addBtn"><span class="plus">&#65291;</span><span class="lbl">Add</span></button>
</div>
<div id="legend" class="hide" aria-label="material legend"></div>
<nav id="tabbar" class="hide">
  <button data-v="process" class="on"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Process</button>
  <button data-v="tech"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="18" r="2.4"/><path d="M12 7v4M12 11l-5 5M12 11l5 5"/></svg>R&amp;D</button>
  <button data-v="obj"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 11l2 2 4-4"/></svg>Goals<span class="dot"></span></button>
  <button data-v="con"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h4"/></svg>Contracts</button>
</nav>
<div id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div id="toasts"></div>
<div id="coachTut" class="hide"><div class="chead"><span class="cstep" id="coachTutStep"></span><span class="cprog" id="coachProg"></span></div>
  <div class="ctext" id="coachText"></div><button id="coachNext" style="display:none">Got it</button></div>
<div id="ov"><h1 id="ovT"></h1><p id="ovP"></p><div class="s" id="ovS"></div>
  <div class="btnrow"><button class="bigbtn ghost" id="ovMenu">Menu</button><button class="bigbtn primary" id="ovRetry">Retry</button></div></div>
<div id="brief"><div class="briefDone" id="briefDone"></div><div class="ph" id="briefPh"></div><h1 id="briefT"></h1><p id="briefB"></p>
  <div class="btnrow"><button class="bigbtn primary" id="briefGo">Start</button></div></div>
<div id="confirmM"><div class="cbox"><p id="confirmMsg"></p><div class="btnrow"><button class="bigbtn ghost" id="confirmNo">Cancel</button><button class="bigbtn primary" id="confirmYes">Confirm</button></div></div></div>
<div id="infoM"><div class="cbox"><h3 id="infoT"></h3><div id="infoB" class="idesc"></div><div class="btnrow"><button class="bigbtn primary" id="infoClose">Close</button></div></div></div>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
<script>
// PWA install — guarded so file:// and headless harnesses are unaffected
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1"))
  navigator.serviceWorker.register("sw.js");
</script>

</body>
</html>
