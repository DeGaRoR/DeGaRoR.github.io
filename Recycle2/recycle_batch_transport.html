<style>
  :root{--bg:#1F1D1B;--card:#2A2724;--card2:#332F2B;--line:#403A34;--text:#EDE6DD;--muted:#A89E92;
    --accent:#D98E48;--accent2:#7d5631;--good:#7FA86B;--bad:#C25B4E;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:none;overscroll-behavior:none;}
  body{display:flex;flex-direction:column;height:100dvh;}
  canvas{display:block;touch-action:none;}
  #wrap{flex:1;position:relative;overflow:hidden;}
  #cv{width:100%;height:100%;}
  #hud{position:absolute;top:0;left:0;right:0;padding:max(8px,env(safe-area-inset-top)) 12px 10px;
    display:flex;align-items:center;gap:14px;pointer-events:none;z-index:12;
    background:linear-gradient(var(--bg),rgba(31,29,27,0));}
  .stat{display:flex;flex-direction:column;line-height:1.05;}
  #cashStat{pointer-events:auto;cursor:pointer;}
  #cashStat .lbl::after{content:" \2630";opacity:.5;font-size:9px;}
  .stat .lbl{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
  .stat .val{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;}
  .val.low{color:var(--bad);}
  #clockStat{margin-left:auto;text-align:right;pointer-events:none;}
  #clockStat .val{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em;font-weight:600;}
  #cwrap{flex:1;min-width:0;max-width:180px;}
  #cbar{height:5px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden;}
  #cbar>i{display:block;height:100%;background:var(--accent);width:0;}
  #menuBtn{pointer-events:auto;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--text);flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  #phaseBar{flex:0 0 auto;display:none;flex-direction:column;gap:4px;padding:6px 12px 5px;background:var(--card2);border-top:1px solid var(--line);z-index:5;}
  #phaseBar.on{display:flex;}
  #phaseBar .pbInfo{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;}
  #phaseBar #pbName{color:var(--text);font-weight:600;letter-spacing:.02em;}
  #phaseBar #pbNum{color:var(--muted);font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,monospace;}
  #phaseBar .pbTrack{height:5px;border-radius:3px;background:#2a2622;overflow:hidden;}
  #phaseBar #pbFill{height:100%;width:0;border-radius:3px;background:var(--accent);}
  #dock{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px max(8px,env(safe-area-inset-bottom));background:var(--card2);border-top:1px solid var(--line);z-index:5;}
  .pbtn{width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .pbtn.on{background:var(--accent);color:#23170c;border-color:var(--accent);}
  #speed{display:flex;gap:4px;}
  .sp{width:32px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;}
  .sp.on{color:#23170c;background:var(--accent);border-color:var(--accent);}
  #spacer{flex:1;}
  #addBtn{height:42px;padding:0 16px;border-radius:11px;border:none;background:var(--accent);color:#23170c;font-size:14px;font-weight:700;}
  #chint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:#171513;border:1px solid var(--accent2);border-radius:20px;padding:7px 16px;font-size:12.5px;color:var(--accent);z-index:6;display:none;pointer-events:none;white-space:nowrap;}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:31;}
  #scrim.show{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;border-top:1px solid var(--line);transform:translateY(110%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:32;padding:8px 16px max(18px,env(safe-area-inset-bottom));max-height:72dvh;overflow-y:auto;}
  .sheet.show{transform:translateY(0);}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px;}
  .sheet h3{margin:0 0 2px;font-size:18px;} .sheet .real{font-size:12px;color:var(--muted);margin-bottom:12px;}
  .sheet .sx{position:absolute;top:8px;right:10px;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--muted);border:1px solid var(--line);font-size:15px;line-height:1;z-index:3;padding:0;}
  .ihead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 40px 11px 0;}
  .ihead h3{margin:0;}
  .iacts{display:flex;gap:6px;flex:0 0 auto;}
  .ibtn{width:32px;height:32px;border-radius:9px;background:var(--card2);color:var(--muted);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0;}
  .ibtn.on{color:var(--accent);border-color:var(--accent);} .ibtn.danger{color:var(--bad);} .ibtn.warn{color:var(--accent);}
  .idesc{color:var(--muted);font-size:12.5px;line-height:1.55;margin-top:6px;border-top:1px solid var(--line);padding-top:9px;}
  .idesc p{margin:0 0 8px;} .idesc p:last-child{margin-bottom:0;}
  .slbl{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:11px 0 5px;font-weight:800;}
  .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .row .k{color:var(--muted);} .row .v{font-weight:600;}
  .desc{font-size:12.5px;color:var(--muted);line-height:1.5;margin:10px 0 2px;}
  .btnrow{display:flex;gap:10px;margin-top:14px;}
  .bigbtn{flex:1;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:700;}
  .bigbtn.primary{background:var(--accent);color:#23170c;} .bigbtn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line);}
  .bigbtn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad);}
  .palgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:4px;}
  .slotbar{display:flex;justify-content:space-between;align-items:center;margin:2px 0 12px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);font-size:12px;}
  .slotbar span{color:var(--muted);} .slotbar b{font-variant-numeric:tabular-nums;color:var(--good);font-size:13px;}
  .slotbar b.full{color:var(--bad);}
  .palcard{padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:flex;gap:9px;align-items:center;}
  .palcard.cant{opacity:.4;} .palcard canvas{width:34px;height:34px;flex:0 0 34px;}
  .palcard .pt{font-size:13px;font-weight:600;} .palcard .pc{font-size:11px;color:var(--accent);font-weight:600;} .palcard .pd{font-size:10px;color:var(--muted);}
  .seg{display:flex;gap:8px;margin:8px 0;}
  .seg .o{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);text-align:center;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;}
  .seg .o.on{border-color:var(--accent);background:#3a3026;} .seg .o .dot{width:9px;height:9px;border-radius:50%;}
  .seg.wrap{flex-wrap:wrap;} .seg.wrap .o{flex:0 1 auto;}
  input[type=range]{width:100%;accent-color:var(--accent);}
  .compbar{display:flex;height:14px;border-radius:4px;overflow:hidden;border:1px solid var(--line);margin-top:6px;background:#211f1d;}
  .compbar i{height:100%;}
  .complegend{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px;font-size:11px;color:var(--muted);}
  .complegend span{display:flex;align-items:center;gap:4px;} .complegend .d{width:8px;height:8px;border-radius:2px;}
  #menu{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 0%,#2a2622,#161412);display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:28px 32px;text-align:center;overflow-y:auto;}
  #menu.hide{display:none;}
  #menu .logo{font-size:40px;font-weight:800;letter-spacing:.14em;} #menu .logo b{color:var(--accent);}
  #menu .tag{color:var(--muted);font-size:14px;margin:10px 0 38px;max-width:300px;line-height:1.5;}
  #menu .mbtn{width:260px;max-width:80vw;padding:14px;margin:6px 0;border-radius:14px;font-size:16px;font-weight:700;background:var(--card);color:var(--text);border:1px solid var(--line);transition:background .15s,border-color .15s,color .15s;}
  #menu .mbtn.flag{background:var(--accent);color:#23170c;border-color:var(--accent);}
  #langRow{display:flex;width:fit-content;margin:24px auto 0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;}
  #langRow button{background:transparent;color:var(--muted);border:none;border-radius:999px;padding:7px 22px;font-weight:700;font-size:12.5px;letter-spacing:.05em;transition:background .15s,color .15s;cursor:pointer;}
  #langRow button.on{background:var(--accent);color:#23170c;}
  #confirmM{position:fixed;inset:0;background:rgba(15,13,12,.62);z-index:55;display:none;align-items:center;justify-content:center;padding:28px;}
  #confirmM.show{display:flex;}
  #confirmM .cbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:330px;width:100%;text-align:center;}
  #confirmM .cbox p{color:var(--text);margin:0 0 18px;line-height:1.5;font-size:15px;}
  #confirmM .btnrow{display:flex;gap:10px;} #confirmM .btnrow button{flex:1;}
  #infoM{position:fixed;inset:0;background:rgba(15,13,12,.62);z-index:56;display:none;align-items:center;justify-content:center;padding:28px;}
  #infoM.show{display:flex;}
  #infoM .cbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:340px;width:100%;text-align:left;max-height:72dvh;overflow-y:auto;}
  #infoM .cbox h3{margin:0 0 10px;} #infoM .cbox .idesc{border:none;margin:0 0 14px;padding:0;}
  #menu .sub{font-size:11px;color:var(--muted);margin-top:3px;font-weight:400;}
  #menu .mbtn.flag .sub{color:#23170c;opacity:.72;font-weight:500;}
  #ov{position:fixed;inset:0;background:rgba(15,13,12,.93);z-index:45;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;}
  #ov.show{display:flex;}
  #ov h1{font-size:28px;margin:0 0 6px;} #ov h1.win{color:var(--good);} #ov h1.loss{color:var(--bad);}
  #ov p{color:var(--muted);max-width:330px;line-height:1.55;font-size:14px;margin:0 0 18px;} #ov .s{font-size:13px;margin-bottom:20px;}
  #ov .btnrow{width:280px;max-width:80vw;}
  #brief{position:fixed;inset:0;background:rgba(15,13,12,.94);z-index:46;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;}
  #brief.show{display:flex;}
  #brief .briefDone{display:none;width:280px;max-width:80vw;margin:0 0 18px;padding:12px 15px;border-radius:12px;background:rgba(127,168,107,.13);border:1px solid var(--good);animation:bdpop .42s cubic-bezier(.2,.9,.3,1.2) both;text-align:left;}
  #brief .briefDone.on{display:block;}
  #brief .briefDone .bdTitle{color:var(--good);font-weight:800;font-size:15px;}
  #brief .briefDone .bdSub{color:var(--text);font-size:12.5px;margin-top:4px;font-variant-numeric:tabular-nums;}
  @keyframes bdpop{from{opacity:0;transform:translateY(-10px) scale(.96);}to{opacity:1;transform:none;}}
  #brief .ph{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;}
  #brief h1{font-size:23px;margin:0 0 14px;color:var(--text);}
  #brief p{color:var(--muted);max-width:340px;line-height:1.62;font-size:14.5px;margin:0 0 22px;}
  #brief .btnrow{width:280px;max-width:80vw;}
  #toasts{position:fixed;left:0;right:0;bottom:74px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;padding:0 14px;}
  .toast{background:#171513;border:1px solid var(--line);border-radius:11px;padding:9px 14px;font-size:13px;max-width:440px;box-shadow:0 6px 20px rgba(0,0,0,.4);}
  #coach{position:fixed;top:calc(env(safe-area-inset-top) + 58px);left:8px;right:8px;margin:0 auto;max-width:520px;z-index:28;
    background:linear-gradient(180deg,#2b2620,#221f1b);border:1px solid var(--accent);border-radius:13px;padding:11px 13px;box-shadow:0 10px 28px rgba(0,0,0,.5);transition:transform .25s ease,opacity .25s ease;}
  #coach.hide{transform:translateY(-14px);opacity:0;pointer-events:none;}
  #coach.done{border-color:var(--good);}
  #coach .chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:10px;}
  #coach .cstep{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:800;}
  #coach.done .cstep{color:var(--good);}
  #coach .cprog{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;}
  #coach .ctext{font-size:13.5px;line-height:1.5;color:var(--text);}
  #coach button{margin-top:9px;width:100%;background:var(--accent);color:#23170c;border:none;border-radius:9px;padding:9px;font-weight:700;font-size:13px;}
  .toast.warn{border-color:var(--accent2);}
  /* ── meta views (R&D / Goals) + tab bar ── */
  #tabbar{flex:0 0 auto;display:flex;gap:6px;padding:6px 8px max(6px,env(safe-area-inset-bottom));background:#1c1a18;border-top:1px solid var(--line);position:relative;z-index:31;}
  #tabbar.hide{display:none;}
  #legend{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:3px 10px;background:#161412;border-top:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:none;}
  #legend::-webkit-scrollbar{display:none;}
  #legend.hide{display:none;}
  #legend .lg{display:inline-flex;align-items:center;gap:3px;font-size:8.5px;color:var(--muted);font-weight:600;flex:0 0 auto;letter-spacing:.2px;}
  #legend .lg i{width:8px;height:8px;border-radius:50%;display:inline-block;}
  #legend .lg.bag i{border-radius:2px;}
  #tabbar button{flex:1;background:transparent;border:none;color:var(--muted);padding:8px 4px 6px;border-radius:11px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;cursor:pointer;position:relative;}
  #tabbar button svg{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  #tabbar button.on{color:var(--accent);background:rgba(217,142,72,.1);}
  #tabbar .dot{position:absolute;top:4px;left:50%;margin-left:6px;width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px #1c1a18;display:none;}
  #tabbar button.hasnew .dot{display:block;}
  .vpanel{position:absolute;inset:0;z-index:10;background:radial-gradient(130% 90% at 50% 15%,#252220,#15130f 72%);display:none;flex-direction:column;padding-top:52px;}
  .vpanel.on{display:flex;}
  .vhead{flex:0 0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);}
  .vhead .vt{font-size:13px;font-weight:800;letter-spacing:.06em;}
  .vhead .bank{margin-left:auto;text-align:right;}
  .vhead .bank .l{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .vhead .bank .v{font-size:18px;font-weight:800;color:var(--accent);line-height:1.05;font-family:ui-monospace,Menlo,monospace;transition:color .2s;}
  .vhead .bank .v.flash{color:var(--good);}
  .vbody{flex:1;overflow-y:auto;padding:14px 14px 22px;}
  .ohd{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:14px 4px 9px;display:flex;align-items:center;gap:9px;}
  .ohd:first-child{margin-top:0;} .ohd::after{content:"";flex:1;height:1px;background:var(--line);}
  .ohd .rdy{color:var(--accent);letter-spacing:0;}
  .obj{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;overflow:hidden;transition:transform .34s cubic-bezier(.4,0,.2,1),opacity .3s,max-height .34s,margin .34s,padding .34s,border-width .34s;}
  .obj.swipe{transform:translateX(-115%);opacity:0;max-height:0!important;margin:0;padding-top:0;padding-bottom:0;border-width:0;}
  .obj .oc{width:36px;height:36px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--card2);border:1px solid var(--line);}
  .obj .oc svg{stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .obj .ob{flex:1;min-width:0;} .obj .on2{font-size:13.5px;font-weight:700;}
  .obj .bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden;} .obj .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;}
  .obj .mt{display:flex;align-items:center;justify-content:space-between;margin-top:7px;}
  .obj .pg{font-size:10px;color:var(--muted);} .obj .rw{font-size:13px;font-weight:800;color:var(--accent);white-space:nowrap;}
  .obj .clm{background:var(--accent);color:#23170c;border:none;border-radius:9px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer;}
  .obj.claimable{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent2) inset;}
  .obj.locked{opacity:.5;} .obj.locked .oc svg{stroke:var(--muted);}
  .tag{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:20px;border:1px solid var(--accent2);color:var(--accent);margin-left:7px;vertical-align:1px;}
  .tcl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin:16px 4px 9px;color:var(--tc);} .tcl:first-child{margin-top:0;}
  .tc{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--tc);border-radius:11px;padding:11px 13px;margin-bottom:8px;display:flex;gap:12px;align-items:center;}
  .tc .tn{font-size:13.5px;font-weight:700;} .tc .tf{font-size:11px;color:var(--muted);margin-top:2px;}
  .tc .tr{margin-left:auto;flex:0 0 auto;}
  .tc .tbtn{background:var(--accent);color:#23170c;border:none;border-radius:9px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;}
  .tc .tbtn.own{background:transparent;color:var(--tc);border:1px solid var(--tc);} .tc .tbtn.lock{background:var(--card2);color:var(--muted);cursor:not-allowed;}
  .tc.lockd{opacity:.5;}
  .rstage{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;}
  .rworld{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
  svg.rlinks{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
  .rnode{position:absolute;width:54px;height:54px;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;background:#221f1c;border:2px solid var(--line);cursor:pointer;transition:transform .12s,box-shadow .2s,border-color .2s,background .2s;}
  .rnode .ring{position:absolute;inset:-5px;border-radius:50%;border:1.5px solid transparent;opacity:0;}
  .rnode.avail{border-color:var(--c);} .rnode.avail .ring{border-color:var(--c);opacity:.35;animation:rpulse 2.4s ease-in-out infinite;}
  .rnode.owned{background:var(--c);border-color:var(--c);box-shadow:0 0 15px -4px var(--c);} .rnode.owned svg{stroke:#1c1814;}
  .rnode.locked{opacity:.42;}
  .rnode.poor{opacity:.82;} .rnode.poor .ring{display:none;} .rnode.poor .rc{color:var(--accent);} /* reqs met, just need bank: dim, price in amber (the blocker) */
  .rnode.root{width:66px;height:66px;background:radial-gradient(circle,#3a342d,#241f1b);border-color:var(--accent);box-shadow:0 0 22px -6px var(--accent);cursor:pointer;}
  .rnode.root .rlbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;white-space:nowrap;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--accent);}
  .rnode .rlbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;max-width:88px;text-align:center;line-height:1.12;font-size:9.5px;font-weight:600;letter-spacing:.01em;color:var(--muted);}
  .rnode.avail .rlbl{color:var(--text);} .rnode.owned .rlbl{color:var(--c);} .rnode.poor .rlbl{color:var(--accent);}
  .bkgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .bkrow{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--card2);}
  .bkrow .pt{font-size:13px;font-weight:600;}
  .rnode svg{stroke:var(--c);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .rnode .rc{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;color:var(--muted);white-space:nowrap;font-family:ui-monospace,Menlo,monospace;}
  .rnode.avail .rc{color:var(--text);} .rnode.owned .rc{color:var(--c);}
  .rnode .chk{position:absolute;top:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:#1c1814;color:var(--c);font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:800;}
  @keyframes rpulse{0%,100%{opacity:.16}50%{opacity:.46}}
  .rzoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:7px;}
  .rzoom button{width:36px;height:36px;border-radius:9px;background:rgba(42,39,36,.92);border:1px solid var(--line);color:var(--text);font-size:17px;font-weight:700;cursor:pointer;}
  .rnode.target{animation:rtarget 1.3s ease-in-out infinite;} .rnode.target .ring{border-color:var(--c);opacity:.7;animation:rpulse 1.3s ease-in-out infinite;}
  @keyframes rtarget{0%,100%{box-shadow:0 0 4px 1px var(--c);}50%{box-shadow:0 0 17px 4px var(--c);}}
  #tabbar button.hasfocus{color:var(--accent);} #tabbar button.hasfocus::after{content:"";position:absolute;inset:2px;border-radius:11px;border:1.5px solid var(--accent);opacity:.45;animation:rpulse 1.6s ease-in-out infinite;pointer-events:none;}
  .trow{display:flex;justify-content:space-between;gap:14px;padding:9px 2px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);}
  .trow b{color:var(--text);font-weight:700;}
  .treq{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.5;}
</style>

<script>
"use strict";
/* ╔══════════════════════════════════════════════════════════════════════════╗
 * ║  RECYCLE — NON-NEGOTIABLES (NNG). The 6 rules no change may violate.        ║
 * ║  These are the code-level distillation; RECYCLE_BIBLE.md holds the fuller   ║
 * ║  design-level set. If a feature needs one of these bent, it's the wrong     ║
 * ║  feature. (Kept to 6 deliberately — see the note below the list.)           ║
 * ╠══════════════════════════════════════════════════════════════════════════╣
 * ║  ── CORE (truth of the simulation) ──                                       ║
 * ║  NNG-1  MASS IS CONSERVED. Every item reaches exactly one sink; transforms  ║
 * ║         never fabricate or vanish mass; sinks tally tonnage + composition.  ║
 * ║         The gated transfer exists to enforce this: a move commits only when ║
 * ║         the source HAS the item AND the destination HAS room (checked       ║
 * ║         before release) — backpressure/starvation are emergent, never faked.║
 * ║  NNG-2  WYSIWYG, EMERGENT, NEVER SCRIPTED. The screen is the real sim state.║
 * ║         Stalls, jams, deadlocks fall out of the rules, not scripted events; ║
 * ║         the renderer may draw a subset under load but NEVER a fabricated     ║
 * ║         item, and never a silent freeze (every stall is a named state).     ║
 * ║  NNG-3  THE MONEY IS REAL AND RECONCILES. Every cash flow is weight-based   ║
 * ║         (mass × rate); the P&L reconciles to cash to the cent; rates are    ║
 * ║         anchored to real Belgium figures and live in ONE central ECON block ║
 * ║         (the single tunable source of truth). Tipping in / disposal out are ║
 * ║         both charged on actual weight.                                      ║
 * ║  ── CODE STRUCTURE ──                                                        ║
 * ║  NNG-4  ENGINE IS PURE; UI IS A SEPARATE LAYER. The ENGINE block carries    ║
 * ║         zero DOM and talks out only through the UI{} hook object. The        ║
 * ║         harness loads the engine block ALONE (between the @ENGINE-START@/    ║
 * ║         @ENGINE-END@ sentinels): a green suite in isolation PROVES the       ║
 * ║         decoupling. v1 ships as one file → PWA; that's not a licence to      ║
 * ║         couple.                                                             ║
 * ║  NNG-5  THE HARNESS IS THE ARBITER; NOTHING SHIPS RED. Behavioral changes   ║
 * ║         are validated headlessly before a session is done; runs are         ║
 * ║         deterministic per seed; balance-band changes are deliberate and     ║
 * ║         documented, never silent. Implement first, then test.               ║
 * ║  ── UI ──                                                                    ║
 * ║  NNG-6  THE PLAYER IS NEVER LIED TO AND NEVER DEAD-ENDED. Problems surface  ║
 * ║         as honest readable states (STARVED / JAMMED / BLINDED / WRONG-SIZE);║
 * ║         completion is tonnage-and-spec, never time-gated (tiers are         ║
 * ║         cosmetic); a cash crunch is recoverable, not a hard game-over.      ║
 * ╠══════════════════════════════════════════════════════════════════════════╣
 * ║  Why 6: each carries one rider so the real count of rules is ~12 — gated    ║
 * ║  transfers sit under NNG-1, named-states under NNG-2/6, central-config under ║
 * ║  NNG-3, single-file under NNG-4. Six crisp heads beat twelve nags nobody     ║
 * ║  rereads; the Bible keeps the exhaustive design list.                       ║
 * ╚══════════════════════════════════════════════════════════════════════════╝
 */
/* RECYCLE — changelog
 * v0.6.0-dev35 Output (export) inspector revamp. Dropped the meaningless "Throughput" row on storage (exports
 *         sell on arrival -- the rate meant nothing). Buyer + supplier selectors wrap with content-sized chips
 *         instead of stretching; the buyer chip is just name + product dot. Added Product (target + purity),
 *         Price /t, On-spec/bale price RANGE (0.8-1.2x base over a 0.5 t bale), Off-spec/bale (a loss), an
 *         explicit On-spec rule (>=threshold target, LIBERATED only, contaminant caps) + a grading note. New euroF.
 * v0.6.0-dev34 Money readability + toast fix. Toasts now render above the palette/sheet (z-index 30->60) so
 *         "Not enough cash" is visible instead of hiding behind the Add panel. Global budget (HUD cash, R&D /
 *         Goals balance) and equipment cost (capex + R&D node costs) now display in k\u20AC; all amounts use a
 *         thin no-break-space thousands separator (e.g. 2\u202F000 k\u20AC). The P&L keeps full \u20AC but gains the
 *         same separator.
 * v0.6.0-dev33 Bugfix: careers created before the dev30 economy reset carried an old-scale bank (which reads
 *         as ~0 against the rescaled capex), so a "new career" off a cached save started broke and couldn't even
 *         place the first unit. Careers now carry an economy version (ECON_V); loading one older than current
 *         reseeds the bank to ECON.startCash. newCareer stamps the current version.
 * v0.6.0-dev32 UI polish. The top HUD bar (cash / recycling / clock / home) now persists across all three
 *         views -- it was sitting under the R&D and Goals panels (z-index); lifted above them and the panels
 *         inset below it, so the same live bar shows everywhere. Burger glyph replaced with a home icon. The
 *         start menu scrolls when it overflows a short iframe (safe-centred, overflow-y auto) so the language
 *         row / Sandbox button stay reachable on small screens. Menu tagline under the logo removed.
 *         Fix: the R&D tree no longer collapses to just the root during the tutorial (the dev27 tree-lock
 *         hid every non-focus node, so chapters with no R&D step showed nothing) -- the full tree now shows
 *         with locked nodes dimmed, the current step's node still highlighted and panned to.
 * v0.6.0-dev31 Contract model correction (pre-v1). Contracts/agreements are CONTINUOUS and never expire --
 *         only achievements track tonnage. The pmc career is now continuous from the first frame (plain
 *         standard/film contracts stay finite/legacy); the tonnage-gated phase-completion path is dead for it.
 *         Tutorial chapters advance when the COACH finishes one (new tutNextChapter(), feed untouched), the last
 *         chapter sets tutorialComplete -- there is no graduation-on-tonnage. The Intake gains a "None (idle)"
 *         supplier that stops the feed (explicit stop). Progress bar now tracks cumulative on-spec EXPORT toward
 *         the first milestone (100 t), never a contract quota. continuous/phases/progress/objectives re-baselined
 *         to the chapter+export model. Liberation model untouched.
 *         Suppliers: blue (PMC, Wasteminster) vs grey (fully-mixed, Binfinity) carry distinct composition, BAG
 *         COLOUR, and gate price -- grey is metal-poor + film/paper-heavy and pays a higher gate (volume play)
 *         while blue yields better product (margin play); the per-supplier gate now drives tipping income, and
 *         the bag sprite + legend take the active supplier's colour.
 *         Finite storage (4b): storage units hold realistic per-role volumes (input ~1 day / buffer ~hours /
 *         output ~days) via capOf(n) while process units keep the small BUF_CAP backpressure buffer; the
 *         real-estate branch (yard exts) now also enlarges the bunkers (storeCap ×1.5 each).
 * v0.6.0-dev30 Economy + storage realism, slice 4a -- the capital reset (P2-4, step 4). Every number now sits
 *         in a real-world ballpark per RECYCLE_ECONOMY.md: start cash EUR2,000,000 (small-plant budget); per-unit
 *         capex in real EUR (intake/output 40k, opener 80k, magnet 35k, eddy 90k, air 120k, NIR 300k, baler 180k,
 *         pick 50k, splitter 20k, buffer 25k); campaign tonnages (tutorial phases 150/200/300 t); phase + objective
 *         rewards 40-80k; tech-node R&D costs 35k-1M (unlock-nodes stay free -- capex is the real spend); base 20
 *         machine slots, yard exts +15/+20/+25; sim fast-forward bumped (x0.04) + an 8x speed so a campaign contract
 *         still plays in ~2-4 min. Per-tonne flows (tipping/landfill/elec/prices) UNCHANGED. Balance/tech/objectives/
 *         progress/guardrails re-baselined to the new scale (ratios identical, only magnitudes moved). Finite storage next.
 * v0.6.0-dev29 Organic tech tree, slice 3a (P2-4, step 3). The tree is now one 1->N dependency tree laid out
 *         by req topology (not class columns): techNodes() places children in their parent's angular sector,
 *         radius = depth. Nodes are coloured by their fx-family (8 families in CL_META: equipment / sorting /
 *         cost / logistics / real estate / HR / subsidies / sales). req rewired diegetically -- the eddy opens
 *         sort/cost/logistics, trained sorters hang off the pick cabin. New levers: Subsidies (+price), HR
 *         (+picking), and Sales nodes that unlock suppliers/buyers (TECHMOD.price/suppliers/buyers; Wasteminster
 *         + one buyer per spec free by default). Subsidy lifts sale price in the sell path. Intake Supplier + Output Buyer pickers (slice 3b) wire to the unlocked roster; Binfinity has a stream so switching it changes the feed.
 * v0.6.0-dev28 Agreement loop (P2-4, step 2). COMPANIES registry (12 named suppliers + 8 buyers, per-language
 *         name map via coName(), default EN) + defaultBuyer() per spec. The PMC tutorial is a structured
 *         agreement with Wasteminster Council as supplier (shown in the P&L; balance sheet colours inflows
 *         green, outflows orange). Career now GRADUATES from the guided tutorial into continuous operation:
 *         no win screen, the feed runs off the supplier’s stream, the tonnage cap lifts, the tree unlocks.
 *         Career starts straight into the tutorial (no contract picker). Supplier/buyer pickers on the units
 *         land with the tree rework (dev29).
 * v0.6.0-dev27 R&D + Goals legibility. Tech nodes show their NAME (not the price) on the tree face;
 *         price + effect stay in the tap sheet. The tree is LOCKED during the tutorial -- only the root
 *         and the node the tutorial points at render, so it is not a field of faint locked "ghost"
 *         circles and you cannot research ahead of the guide. Goals view fully localised: objective
 *         names, headers (Progression/Milestones), Claim/Requires/All-claimed chrome and the equipment
 *         tag all route through tr(); French strings added.
 * v0.6.0-dev26 Clock + calendar; time-medal retired (P2-4, step 1). The HUD gains a date/time readout
 *         (year/day-month, HH:MM) off a pure calendar(t): 12 months x 30 days, season-derived for the
 *         parked night/seasonal cycle. The cosmetic gold/silver/bronze time-medal is gone from the win
 *         screen and balance sheet (performance is P&L + Recycling %, not speed); tierFor/G.tier stay in
 *         state pending the continuous-career rework that removes the win screen entirely.
 * v0.6.0-dev25 Unit cap made visible + yard progression (P2-3). The machine-slot cap already existed (base 10 +
 *         tech); now the Add sheet shows a \u201cMachine slots X / N\u201d bar (amber\u2192red when full, hidden in sandbox), and
 *         the yard line is a real ladder: Yard extension I/II/III (+3/+4/+5, chained) taking the cap 10\u219213\u219217\u219222.
 *         Storage units (intake/output/buffer) stay uncapped.
 * v0.6.0-dev24 Top stat: \u201cRecycling\u201d, recovery-based (playtest fix). The HUD/P&L stat is renamed from
 *         Diversion to Recycling and now reads recovered on-spec product \u00f7 total intake (new run-total counter
 *         G.deliveredTot), instead of (intake\u2212landfill)\u00f7intake. Stockpiling can no longer fake 100% \u2014 held
 *         material isn\u2019t recovered, so it can\u2019t pad the number; the stat now starts at 0% and is earned up. (A
 *         recent-window version of this rate comes with the P5 telemetry.)
 * v0.6.0-dev23 Tech-tree core = \u201cBase equipment\u201d (P2-2). The R&D root is no longer an anonymous \u201cFacility\u201d
 *         trunk: it\u2019s now \u201cBase equipment\u201d \u2014 an owned, labelled node (equipment icon + \u2713) that tapping opens a
 *         sheet listing the starting kit (intake/output/buffer/opener/magnet/baler), the gear every contract begins
 *         with. Tier-1 research still branches from it (unchanged __root chaining); purely structural/presentational.
 * v0.6.0-dev22 Storage split (P2-1). The generic \u201cStorage + role toggle\u201d is replaced by three palette
 *         units \u2014 Intake / Output / Buffer \u2014 each placing a role-keyed storage node (one engine, unchanged).
 *         The inspector role toggle is gone (role is fixed by what you place); the inspector title and on-canvas
 *         labels read the role name. Output\u2019s sell-spec selector is now generated from SPECS, so Aluminium is
 *         selectable (it wasn\u2019t \u2014 a latent gap) and any future product appears automatically. Landfill stays an
 *         Output set to dispose. Tutorial/help copy updated to the new unit names; FR strings added. Old saves
 *         (source/export/landfill/mixer) still migrate via MIG.
 * v0.6.0-dev21 Phase-complete celebration beat (item 4, part 2). Clearing a phase now leads the next briefing
 *         with a green \u201c\u2713 <phase> complete\u201d banner showing +reward banked and the on-spec tonnage recovered
 *         this phase (engine records G.lastPhase at the completion point; applyPhase keeps a per-product
 *         baseline). Replaces the flat \u201cPhase complete\u201d toast. Pops in with a small spring. FR strings added.
 * v0.6.0-dev20 Phase progress bar + on-spec totaliser foundation (item 4, part 1). New pure engine accessor
 *         phaseProgress() reports fill toward the phase\u2019s feed-tonnage quota (G.delivered/tonnage). A slim bar
 *         above the play dock shows \u201cPhase i/n \u00b7 <product> \u2014 x.x / N t\u201d, tinted with the product colour, filling
 *         live as you process. Foundation for P5 telemetry: per-material lifetime on-spec mass now accrues into
 *         CAREER.counters.onSpec{} at settlement (run-level per-material already in G.sold). Phase-complete
 *         celebration beat still to come (part 2).
 * v0.6.0-dev19 ONE career account (playtest). Killed the cash/bank split: research, objective rewards, and
 *         contract settlement now all move the same money as tipping/sales/capex \u2014 G.cash is the live balance
 *         and CAREER.bank is just its persisted carry between contracts (fresh career seeds it with the starting
 *         capital; a new contract carries the balance instead of resetting). The R&D/Goals header now reads
 *         \u201cBalance\u201d and shows the same number as the top-left Cash. (Career tech still persists across runs \u2014 a
 *         true \u201cnew career\u201d reset comes with the career manager; that\u2019s why a replayed tutorial can skip unlocks.)
 * v0.6.0-dev18 Onboarding clarity (playtest). R&D tree now distinguishes the two lock reasons: a node whose
 *         prerequisites aren\u2019t met stays heavily greyed (\u201clocked\u201d), while one you simply can\u2019t afford yet shows
 *         normally-lit with its price in amber (\u201cpoor\u201d) \u2014 so it\u2019s clear WHY a node is unavailable. Coach overlay
 *         no longer covers the first card in the Goals/R&D panels: those panels now reserve space under the
 *         fixed coach (measured, refreshed on step/view/resize).
 * v0.6.0-dev17 Hit-testing, the real cause (playtest). \u201cHitboxes too low, top grabs too easily\u201d was a
 *         stale-canvas bug: #cv is CSS-sized (100%/100%) but the backing store is set manually in resize(),
 *         which only fires on window \u2018resize\u2019 \u2014 mobile URL bars resize the canvas WITHOUT that event, so
 *         the browser stretched a stale backing store (a vertical scale the hit-math didn\u2019t know about, worse
 *         farther from the top). Fix: ResizeObserver + visualViewport listeners + a size-drift guard at
 *         pointerdown keep the backing store locked to the display. Added a #hit URL-hash overlay (hit regions
 *         + last-tap crosshair) for on-device verification.
 * v0.6.0-dev16 Hit-testing, the robust way (playtest). Root cause of \u201chitbox not on the visual / barely
 *         selectable\u201d: the pointer\u2192world transform read raw viewport coords and ignored where the canvas
 *         actually sits (HUD, safe-area insets, the mobile URL bar), so every tap was offset and fell through to
 *         pan. Fix is the standard node-editor pattern \u2014 one shared transform via getBoundingClientRect
 *         (syncRect on resize + each gesture), plus ports tested FIRST at finger size (screen-px radius / zoom)

function capOf(n){if(!n||n.type!=="storage")return BUF_CAP; // process units keep the small backpressure buffer

// Single disposal path — ALWAYS charges on actual weight (mass × landfillGate) and books the

function dumpToLandfill(mass){G.landfill+=mass;const c=mass*ECON.landfillGate;G.cash-=c;G.ledger.landfill+=c;}

function homeNode(cls){ if(cls==="loader")return G.nodes.find(isFeeder)||null; if(cls==="ctruck")return G.nodes.find(isLandfill)||null; if(cls==="forklift")return G.nodes.find(isExport)||null; return null; }
function ensureFleet(){ if(!G||!G.fleet||!G.vehicles)return;
  for(const cls in G.fleet){ const h=homeNode(cls); if(!h)continue;
    let have=0; for(const v of G.vehicles)if(v.cls===cls)have++;
    for(let k=have;k<G.fleet[cls];k++)
      G.vehicles.push({id:G.vehId++,cls,state:"idle",home:h.id,fromId:null,toId:null,payload:blankBuf(),baleLoad:[],t0:0,eta:0}); } }
// Pending job queue. SCANS NODES IN ASCENDING ID ORDER for determinism (NNG-5).
function buildJobs(){const jobs=[];
  for(const n of G.nodes){
    // LOADER: a feeder with UNCOMMITTED room (≥ one full load, after subtracting what loaders already en
    //   route will deliver) + a WIRED bunker holding material. Multiple loaders may serve one feeder — the
    //   room-accurate reservation (in advanceVehicles) keeps their combined delivery ≤ room, so a larger
    //   fleet scales a single intake instead of idling (a loader was previously capped at one per feeder).
    if(isFeeder(n)){
      let committed=0; for(const v of G.vehicles)if(v.cls==="loader"&&v.toId===n.id&&v.state!=="idle")committed+=(v.state==="toDest"||v.state==="unloading")?cnt(v.payload):LOGI.loaderCap;
      if(capOf(n)-cnt(n.inBuf)-committed < LOGI.loaderCap)continue;
      const e=G.edges.find(e=>e.to===n.id&&isBunker(nodeById(e.from))&&cnt(nodeById(e.from).inBuf)>0);
      if(e)jobs.push({cls:"loader",fromId:e.from,toId:n.id}); }
    // CONTAINER TRUCK: a bulk zone with ≥1 FULL container + a WIRED landfill with room (dedup on the source bulk).
    if(isBulk(n)){ if(bulkFullCount(n)<=0)continue;
      if(G.vehicles.some(v=>v.cls==="ctruck"&&v.fromId===n.id&&v.state!=="idle"))continue;
      const e=G.edges.find(e=>e.from===n.id&&isLandfill(nodeById(e.to))&&cnt(nodeById(e.to).inBuf)<capOf(nodeById(e.to)));
      if(e)jobs.push({cls:"ctruck",fromId:n.id,toId:e.to}); }
    // FORKLIFT: a baler with ≥1 stored bale + a WIRED export zone with room (dedup on the source baler).
    if(TYPES[n.type].isBaler){ if(!n.bales||n.bales.length<=0)continue;
      if(G.vehicles.some(v=>v.cls==="forklift"&&v.fromId===n.id&&v.state!=="idle"))continue;
      const e=G.edges.find(e=>e.from===n.id&&isExport(nodeById(e.to))&&nodeById(e.to).bales.length<LOGI.exportCap);
      if(e)jobs.push({cls:"forklift",fromId:n.id,toId:e.to}); }
  }
  return jobs;}
// Assign queued jobs to idle pool vehicles of the matching class, in queue order.
function dispatchJobs(){G.jobs=buildJobs();
  for(const job of G.jobs){const v=G.vehicles.find(x=>x.cls===job.cls&&x.state==="idle");
    if(!v){ if(job.cls==="loader"){const f=nodeById(job.toId);if(f)f.state="noloader";} continue; } // job exists but pool exhausted
    const s=nodeById(job.fromId),h=nodeById(v.home)||s;if(!s)continue;
    v.state="toSource";v.fromId=job.fromId;v.toId=job.toId;v.job=job;v.t0=G.t;
    v.eta=G.t+vehTransit(h.x,h.y,s.x,s.y);}}
// Advance every in-flight vehicle one step off G.t/eta (no wall clock → deterministic, NNG-5).
// Load/unload are gated both ways (only what the source HAS / the dest has ROOM) → backpressure is
// emergent and mass is conserved (NNG-1). The loader reserves dest room at load time, so its payload
// always fits at unload; the unload still hard-gates on cap as a belt-and-braces invariant.
function advanceVehicles(dt){ ensureFleet();
  if(G.vehicles&&G.vehicles.length){
    for(const v of G.vehicles){
      if(v.state==="idle"||G.t<v.eta)continue;                 // parked, or still travelling/dwelling
      if(v.state==="toSource"){v.state="loading";v.eta=G.t+LOGI.loadDwell;}
      else if(v.state==="loading"){                            // load ≤cap from source→payload, reserving dest room
        const s=nodeById(v.fromId),d=nodeById(v.toId);
        if(s&&d&&v.cls==="loader"){
          let inflight=0;for(const o of G.vehicles)if(o!==v&&o.cls==="loader"&&o.toId===d.id&&(o.state==="toDest"||o.state==="unloading"))inflight+=cnt(o.payload);
          const room=capOf(d)-cnt(d.inBuf)-inflight;               // reserve only room not already spoken for by inbound loaders (keeps idle loaders empty)
          const q=Math.max(0,Math.min(LOGI.loaderCap-cnt(v.payload),cnt(s.inBuf),room));
          for(let k=0;k<q;k++){const pt=popParticle(s.inBuf);if(!pt)break;v.payload[pt.mat][pt.st]++;}}
        else if(s&&d&&v.cls==="ctruck"){ // haul ONE full container whole (bulk zone → landfill)
          let idx=-1;for(let i=0;i<(s.containers?s.containers.length:0);i++)if(cnt(s.containers[i])>=LOGI.containerCap){idx=i;break;}
          if(idx>=0){const c=s.containers[idx];for(const m of MAT)for(let z=0;z<ST;z++){v.payload[m][z]+=c[m][z];c[m][z]=0;}}}
        else if(s&&d&&v.cls==="forklift"){ // pull ≤FORK_BALES bales baler→export, reserving export room
          const room=LOGI.exportCap-d.bales.length,take=Math.max(0,Math.min(LOGI.forkBales,s.bales.length,room));
          for(let k=0;k<take;k++)v.baleLoad.push(s.bales.shift());}
        v.state="toDest";v.t0=G.t;v.eta=G.t+vehTransit(s?s.x:0,s?s.y:0,d?d.x:0,d?d.y:0);}
      else if(v.state==="toDest"){v.state="unloading";v.eta=G.t+LOGI.unloadDwell;}
      else if(v.state==="unloading"){                          // deposit at dest, hard-gated (never overfill)
        const d=nodeById(v.toId);
        if(d&&v.baleLoad&&v.baleLoad.length){ while(v.baleLoad.length&&d.bales.length<LOGI.exportCap)d.bales.push(v.baleLoad.shift()); } // bale carrier → export
        else if(d)for(const m of MAT)for(let z=0;z<ST;z++){let take=v.payload[m][z];
          while(take>0&&cnt(d.inBuf)<capOf(d)){d.inBuf[m][z]++;v.payload[m][z]--;take--;}}
        v.state="idle";v.home=v.toId;v.job=null;}
    }
  }
  dispatchJobs();
}
function tick(dt){
  if(G.finished)return; G.energy=0;
  // 0. inbound — SUPPLIER TRUCKS tip into BUNKERS (S-BATCH-1). The supplier stream accrues a "due" mass
  //    per bunker; each full truckload (supTruck) dumps what FITS and tips on the dumped weight (NNG-3,
  //    booking moves from per-particle to per-load, same totals). What doesn't fit DIVERTS — no landfill,
  //    no tip (fork C turn-away); the bunker reads BUNKER-FULL. Loaders drain bunker→feeder (stage 3d).
  for(const b of G.nodes){ if(!isBunker(b))continue;
    b.state=(cnt(b.inBuf)>=capOf(b))?"bunkerfull":"ok";                   // WYSIWYG: full is full every tick, not only when a truck bounces (NNG-2)
    if(cnt(b.inBuf)<capOf(b)*0.5)G.overflowAlerted=false;                 // re-arm the full-alert once the bunker drains
    const _idle=b.supplier==="__none";
    const _str=(G.continuous&&!_idle)?supplierStream((b.supplier&&b.supplier!=="__none")?b.supplier:(G.contract&&G.contract.supplier)):null;
    const _comp=(_str&&_str.comp)||G.contract.comp,_fr=(_str&&_str.feedRate)||G.contract.feedRate||5,_gate=(_str&&_str.gate)||ECON.tipping;
    if(_idle)continue;
    if(!(G.continuous||G.delivered<G.contract.tonnage))continue;          // tutorial tonnage gate
    b.truckDue=(b.truckDue||0)+_fr*dt/PMASS;                              // particles the stream owes this bunker
    while(b.truckDue>=LOGI.supTruck&&(G.continuous||G.delivered<G.contract.tonnage)){
      b.truckDue-=LOGI.supTruck;
      let load=Math.min(LOGI.supTruck,capOf(b)-cnt(b.inBuf));             // dump what fits; remainder diverts
      if(!G.continuous)load=Math.min(load,Math.max(0,Math.ceil((G.contract.tonnage-G.delivered)/PMASS))); // don't overshoot the quota
      for(let k=0;k<load;k++){let r=rng(),a=0,p="paper";for(const m of MAT){a+=_comp[m]||0;if(r<a){p=m;break;}}b.inBuf[p][0]++;}
      if(load>0){const m=load*PMASS;G.cash+=m*_gate;G.ledger.tipping+=m*_gate;G.delivered+=m;G.deliveredTot+=m;b.truckFlash=1;}
      if(capOf(b)-cnt(b.inBuf)<=0||(load<LOGI.supTruck&&cnt(b.inBuf)>=capOf(b))){ // truck turned away on a full bunker
        b.state="bunkerfull"; if(!G.overflowAlerted){G.overflowAlerted=true;G.running=false;if(UI.onOverflow)UI.onOverflow();} }
    }
  }
  // 2. advance sprites
  for(const e of G.edges){const dst=nodeById(e.to);if(!dst){for(const s of e.sprites)if(P.length<600)P.push(s);e.sprites.length=0;continue;}
    const dl=TYPES[dst.type];
    for(let i=e.sprites.length-1;i>=0;i--){const s=e.sprites[i];s.t+=e.speed*dt*(s.bale?0.5:1);if(s.t<1)continue;
      if(s.bale){ // bale token
        if(isSell(dst)){sellBale(dst,s.bale);dst.truckFlash=1;killSprite(e,i);} // accounted on arrival (graded + paid)
        else if(isBulk(dst)){ if(bulkRoom(dst)>=cnt(s.bale)){for(const m of MAT)for(let z=0;z<ST;z++)for(let k=0;k<s.bale[m][z];k++)bulkAdd(dst,m,z);killSprite(e,i);} else s.t=1; } // into containers, or stall if the zone is full
        else{for(const m of MAT)for(let z=0;z<ST;z++)dst.inBuf[m][z]+=s.bale[m][z];killSprite(e,i);} // misrouted: unpack
      } else { // material particle
        if(isBulk(dst)){ if(bulkAdd(dst,s.mat,s.st))killSprite(e,i); else s.t=1; } // into the active container, or stall (CONTAINER-FULL)
        else if(isSell(dst)){dst.looseHit=1;dumpToLandfill(PMASS);killSprite(e,i);} // loose unbaled at a seller -> wasted
        else if(hasRoom(dst)){dst.inBuf[s.mat][s.st]++;killSprite(e,i);}
        else s.t=1;
      }
    }
  }
  // 3. process units (skip Output sinks, balers, and BUNKERS — a bunker drains by loader, not by belt)
  for(const n of G.nodes){const t=TYPES[n.type];if(isOutput(n)||t.isBaler||isBunker(n)||isBulk(n)||isLandfill(n)||isExport(n))continue;
    let cap=isInput(n)?(n.rate||5):(t.cap||5);
    if(t.isPick){cap=n.workers*PICK_RATE;const w=n.workers*WAGE*dt;G.cash-=w;G.wageTot+=w;G.ledger.labour+=w;}
    if(t.wrappable){ if(n.downtime>0){n.downtime=Math.max(0,n.downtime-dt);cap=0;}
      else{const mult=n.wrap>=WRAP_BLIND?0:(n.wrap<=WRAP_SOFT?1:1-(n.wrap-WRAP_SOFT)/(WRAP_BLIND-WRAP_SOFT));
        n.blinded=n.wrap>=WRAP_BLIND;cap=cap*mult;}
      n.wrap=Math.max(0,n.wrap-WRAP_DECAY*dt);}
    if(!isInput(n))cap=techCap(n.type,cap);
    G.carry[n.id]=(G.carry[n.id]||0)+cap*dt/PMASS;let budget=Math.floor(G.carry[n.id]);G.carry[n.id]-=budget;
    n.load=cnt(n.inBuf)>0?Math.min(1.5,cnt(n.inBuf)/(capOf(n)*0.45)):0;
    let jammed=false,wrong=false,did=0;
    for(let k=0;k<budget;k++){if(cnt(n.inBuf)<=0)break;const pt=popParticle(n.inBuf);if(!pt)break;
      let mat=pt.mat,st=pt.st,nst=st,port,wrapAdd=0;
      if(t.isPick){const isT=mat===n.target;const take=isT?rng()<techPickEff(PICK_EFF):rng()<PICK_FALSE;port=take?"R":"O";}
      else if(t.opener){ // liberate bag -> item at 100% (every bag opened); immune to film
        if(st===0&&rng()<techOpenEff(OPEN_EFF))nst=1; else nst=st;
        port="O";}
      else if(t.pass)port="O";
      else if(t.isSplit){let toA=rng()<n.ratio;if(rng()<SPLIT_NOISE)toA=!toA;port=toA?"A":"B";}
      else{ if(t.needsItem&&st===0){port=t.other;wrong=true;} // optical sorter ejects bagged material (lost yield)
        else{const bp=t.prob[mat]!==undefined?t.prob[mat]:t.prob.default,p=techProb(n.type,mat,bp);port=rng()<p?t.accept:t.other;}}
      const e=outEdge(n,port);
      // Doubly-gated transfer (NNG #3): commit only if the destination has room; otherwise
      // restore the particle UNCHANGED (no resize, no wrap side-effect) and stall. This is the
      // clean backpressure rule and fixes the wrap leak the old pop-then-jam had on a full output.
      if(!e||e.sprites.length>=EDGE_MAX){n.inBuf[mat][st]++;jammed=true;break;}
      n.wrap+=wrapAdd;

    n.jam=jammed?Math.min(1,n.jam+0.12):Math.max(0,n.jam-0.08);
    if(t.kW){ if(t.wrappable){ if(n.downtime<=0&&cnt(n.inBuf)>0)G.energy+=techKW(n.type,t.kW)*dt; } else if(did>0)G.energy+=techKW(n.type,t.kW)*dt; }
    if(did>0&&G.mode==="career"){const f=CAREER.counters.flags;if(f&&f.ran)f.ran[n.type]=true;} // objective: this unit ran
    // failure state
    n.idle = (did===0&&cnt(n.inBuf)===0) ? (n.idle||0)+dt : 0;
    if(t.wrappable&&n.downtime>0)n.state="clearing";
    else if(t.wrappable&&n.blinded)n.state="blinded";
    else if(jammed)n.state="jammed"; else if(wrong)n.state="bagged"; else if(n.load>1.02)n.state="overloaded";
    else if(n.idle>STARVE_T)n.state="starved"; else n.state="ok";
  }

  //     (stage 3d), not emitted onto a belt. When the internal stack is full the baler jams (BALER-FULL).
  for(const n of G.nodes){if(!TYPES[n.type].isBaler)continue;
    const movedIn=cnt(n.inBuf);
    for(const m of MAT)for(let z=0;z<ST;z++){n.bale[m][z]+=n.inBuf[m][z];n.inBuf[m][z]=0;}
    let jam=false;
    while(cnt(n.bale)>=BALE_N){
      if(n.bales.length>=LOGI.balerBales){jam=true;break;}                 // BALER-FULL: stack is full, await a forklift
      const tok=blankBuf();for(let k=0;k<BALE_N;k++){const p=popParticle(n.bale);if(!p)break;tok[p.mat][p.st]++;}
      n.bales.push(tok);
    }
    n.jam=jam?Math.min(1,n.jam+0.12):Math.max(0,n.jam-0.08);
    n.idle = (movedIn>0||cnt(n.bale)>0)?0:(n.idle||0)+dt; n.state = jam?"balerfull":(n.idle>STARVE_T?"starved":"ok");
    if(TYPES[n.type].kW && movedIn>0) G.energy+=techKW(n.type,TYPES[n.type].kW)*dt;
  }
  // 3c. outbound disposal (S-BATCH-2). The LANDFILL TRUCK is a per-zone cadence arrival (not a pool
  //     vehicle): every LF_CADENCE it hauls ≤ LF_TRUCK containers off-map and books the landfill charge
  //     on their ACTUAL mass (dumpToLandfill, unchanged rate). Bulk zones surface CONTAINER-FULL here.
  for(const n of G.nodes){

      if(n.evacT>=LOGI.lfCadence){ n.evacT-=LOGI.lfCadence;

    else if(isBulk(n)){ n.state=(bulkRoom(n)<=0)?"containerfull":"ok"; }
    else if(isExport(n)){ // CLIENT TRUCK: sell bales bounded by the buyer's offtake (Infinity ⇒ sell-on-arrival)

      else { n.offAllow=Math.min((n.offAllow||0)+off*dt,LOGI.cliTruck*bm); q=Math.min(LOGI.cliTruck,n.bales.length,Math.floor(n.offAllow/bm+1e-9)); }
      for(let i=0;i<q;i++){ sellBale(n,n.bales.shift()); if(off!==Infinity)n.offAllow-=bm; n.truckFlash=1; }

  // 5. completion

        if(cnt(n.bale)>0){const tok=blankBuf();for(const m of MAT)for(let z=0;z<ST;z++)tok[m][z]=n.bale[m][z];n.bales.push(tok);n.bale=blankBuf();}

      for(const v of G.vehicles){
        if(v.baleLoad&&v.baleLoad.length){const d=nodeById(v.toId);while(v.baleLoad.length){const b=v.baleLoad.shift();if(d&&isExport(d))d.bales.push(b);else dumpToLandfill(cnt(b)*PMASS);}}
        if(v.payload&&cnt(v.payload)>0){dumpToLandfill(cnt(v.payload)*PMASS);v.payload=blankBuf();}}
      // final client truck: sell every export bale (uncapped at close)

      // final landfill truck: bulk containers + landfill piles + any legacy dispose heap

        if(isLandfill(n)&&cnt(n.inBuf)>0){dumpToLandfill(cnt(n.inBuf)*PMASS);n.inBuf=blankBuf();}
        if(isDispose(n)&&n.disposeHeap>0){dumpToLandfill(n.disposeHeap*PMASS);n.disposeHeap=0;}}
      G.minCash=Math.min(G.minCash,G.cash);
      if(!G.scenario){const win=contractWon();endGame(win,win?"win":(G.cash<=0?"red":"offspec"));} // plain contract: finite challenge (legacy)
      else{const ph=G.scenario.phases[G.phaseIdx];

function techNodes(){const CX=500,CY=410,RING=145; // organic 1->N tree: position follows req topology, not class
  const kids={};for(const id in TECH_META){const rq=(TECH[id]&&TECH[id].req)||[];const par=rq.length?rq[0]:"__root";(kids[par]=kids[par]||[]).push(id);}
  const nodes=[{id:"__root",name:"Base equipment",cl:"root",g:"units",x:CX,y:CY,root:true}];
  (function place(id,depth,a0,a1){const ch=kids[id]||[];const seg=(a1-a0)/Math.max(1,ch.length);
    ch.forEach((cid,i)=>{const ca0=a0+i*seg,ca1=ca0+seg,a=(ca0+ca1)/2,r=depth*RING;
      nodes.push(Object.assign({id:cid,x:CX+r*Math.cos(a),y:CY+r*Math.sin(a),root:false},TECH_META[cid]));
      place(cid,depth+1,ca0,ca1);});})("__root",1,-Math.PI/2,-Math.PI/2+2*Math.PI);
  return nodes;}

      miny=Math.min(miny,n.y-n.h/2-50);maxy=Math.max(maxy,n.y+n.h/2+46);}
    const bw=maxx-minx,bh=maxy-miny,z=Math.min(1.1,Math.max(0.5,Math.min(VW/bw,VH/bh)));

  const scn=SCENARIOS.pmc;
  const scnCard='<div class="palcard" data-scn="pmc" style="display:block;border-color:var(--accent)"><div class="pt">\uD83C\uDF93 Tutorial \u2014 '+scn.name+'</div>'+
    '<div class="pd" style="margin:4px 0">'+scn.phases.length+' phases on one line \u00B7 ferrous \u2192 aluminium \u2192 PET \u00B7 learn the machines as you unlock them</div></div>';
  showSheet('<h3>'+tr("Pick a contract")+'</h3><div class="real">'+tr("new here? start with the tutorial")+'</div><div class="palgrid" style="grid-template-columns:1fr">'+scnCard+card("standard")+card("film")+'</div>');
  sheet.querySelectorAll(".palcard[data-scn]").forEach(c=>c.addEventListener("click",()=>startNew("career",c.dataset.scn)));
  sheet.querySelectorAll(".palcard[data-ck]").forEach(c=>c.addEventListener("click",()=>startNew("career",c.dataset.ck)));}
document.getElementById("btnResume").addEventListener("click",()=>{
  if(hasResumable()){document.getElementById("menu").classList.add("hide");last=0;}
  else{const sv=loadSave();if(sv&&sv.nodes&&sv.nodes.length){try{restoreGame(sv);document.getElementById("menu").classList.add("hide");last=0;}catch(e){}}}});
document.getElementById("btnCareer").addEventListener("click",()=>startNew("career","pmc")); // auto-PMC: career starts in the tutorial, then graduates to continuous
document.getElementById("btnSandbox").addEventListener("click",()=>startNew("sandbox","standard"));
resize();
{let _sv=null;try{_sv=loadSave();}catch(e){_sv=null;}
 let _ok=false;
 if(_sv&&_sv.nodes&&_sv.nodes.length&&!_sv.finished){
   try{restoreGame(_sv);
     if(G&&G.nodes.some(n=>!TYPES[n.type]))throw new Error("incompatible save");
     document.getElementById("menu").classList.add("hide");setTimeout(()=>toast("Resumed your saved game","warn"),350);_ok=true;}
   catch(e){clearSave();_ok=false;}}
 showMenu();/* no hidden default game: the menu reflects the real (none) resumable state */}
if(cashStatEl)cashStatEl.addEventListener("click",()=>showBalanceSheet());
document.querySelectorAll("#langRow button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
loadCareer();
try{const _ps=localStorage.getItem("recycle.phasesnap");if(_ps)_phaseSnap=JSON.parse(_ps);}catch(e){}
try{const _l=localStorage.getItem("recycle.lang");if(_l==="fr")LANG_CUR="fr";}catch(e){}
document.documentElement.lang=LANG_CUR;applyLang();
requestAnimationFrame(loop);
</script>
