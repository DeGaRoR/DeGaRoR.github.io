<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vivarioops · skin prototype</title>

<!-- The trunk's tokens, because render/creature.js reads them through token()
     and throws on a missing one. A stylesheet link, not an edit. -->
<link rel="stylesheet" href="../../trunk/ui/tokens.css">

<!-- Own import map. The app's index.html is untouched; this points at the same
     already-committed vendor build, which carries SkinnedMesh/Bone/Skeleton in
     three.core.js. Nothing is added to vendor/. -->
<script type="importmap">
{ "imports": { "three": "../../vendor/three-0.185.1/three.module.js" } }
</script>

<style>
  /* proto/ is outside gate/trunk.js APP_ROOTS, so N16 does not scan this file.
     Kept plain on purpose: this page is scaffolding, not product. */
  html, body { margin: 0; height: 100%; background: #05090d; color: #dbe6f0;
               font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  canvas { display: block; }
  #panel { position: fixed; top: 0; left: 0; width: 250px; max-height: 100%;
           overflow-y: auto; padding: 10px 12px; background: rgba(6,12,18,.86);
           border-right: 1px solid #16222d; }
  #panel h1 { font-size: 12px; margin: 0 0 8px; letter-spacing: .08em; text-transform: uppercase; color: #7189a0; }
  .row { margin: 7px 0; }
  .row > label { display: block; color: #7189a0; }
  .row output { float: right; color: #dbe6f0; }
  input[type=range] { width: 100%; }
  select, input[type=number] { width: 100%; background: #0b1117; color: #dbe6f0;
                               border: 1px solid #16222d; padding: 3px; font: inherit; }
  button { background: #16222d; color: #dbe6f0; border: 1px solid #24333f;
           padding: 4px 8px; font: inherit; cursor: pointer; }
  .check { color: #dbe6f0; }
  #hud { position: fixed; top: 0; right: 0; padding: 10px 12px; text-align: right;
         background: rgba(6,12,18,.72); color: #7189a0; white-space: pre; }
  #hud b { color: #dbe6f0; font-weight: normal; }
  #note { position: fixed; bottom: 0; left: 0; right: 0; padding: 6px 12px;
          background: rgba(6,12,18,.72); color: #7189a0; text-align: center; }
  #err { position: fixed; inset: 0; padding: 40px; background: #1a0709; color: #ffb4bd;
         white-space: pre-wrap; display: none; z-index: 10; }
</style>
</head>
<body>
<div id="panel">
  <h1>skin prototype</h1>

  <div class="row">
    <label for="genome">genome</label>
    <select id="genome"></select>
  </div>
  <div class="row">
    <label for="seed">random seed</label>
    <input type="number" id="seed" value="1" step="1">
  </div>
  <div class="row"><button id="reroll">reroll ⟳</button></div>

  <div class="row">
    <label for="mode">experiment</label>
    <select id="mode">
      <option value="shell-sdf">3 · shell, field envelope</option>
      <option value="shell-loft">3 · shell, lofted envelope</option>
      <option value="anatomy">2 · anatomy loft (replaces body)</option>
      <option value="sdf">1 · SDF reconstruction (replaces body)</option>
    </select>
  </div>

  <div class="row">
    <label for="inflate">shell offset <output id="inflateOut"></output></label>
    <input type="range" id="inflate" min="0.02" max="0.9" step="0.01" value="0.32">
  </div>
  <div class="row">
    <label for="opacity">shell opacity <output id="opacityOut"></output></label>
    <input type="range" id="opacity" min="0.02" max="0.7" step="0.01" value="0.16">
  </div>
  <div class="row">
    <label for="inner">inner body</label>
    <select id="inner">
      <option value="full">full (membrane + organ)</option>
      <option value="flesh">flesh + organ</option>
      <option value="flat">flat</option>
      <option value="none">hidden</option>
    </select>
  </div>

  <div class="row">
    <label for="blend">waist / field blend <output id="blendOut"></output></label>
    <input type="range" id="blend" min="0" max="1.6" step="0.01" value="0.9">
  </div>
  <div class="row">
    <label for="res">section detail <output id="resOut"></output></label>
    <input type="range" id="res" min="1" max="8" step="0.5" value="3">
  </div>

  <div class="row">
    <label for="drive">gait drive <output id="driveOut"></output></label>
    <input type="range" id="drive" min="0" max="3" step="0.05" value="1">
  </div>
  <div class="row">
    <label for="speed">gait speed <output id="speedOut"></output></label>
    <input type="range" id="speed" min="0" max="2" step="0.05" value="1">
  </div>
  <div class="row">
    <label class="check"><input type="checkbox" id="holdOn"> hold at limit</label>
    <input type="range" id="hold" min="-1" max="1" step="0.02" value="1">
  </div>

  <div class="row"><label class="check"><input type="checkbox" id="showRef" checked> side-by-side reference</label></div>
  <div class="row"><label class="check"><input type="checkbox" id="wire"> wireframe</label></div>
  <div class="row"><label class="check"><input type="checkbox" id="weights"> bone weight colours</label></div>
  <div class="row"><label class="check"><input type="checkbox" id="bones"> bone axes</label></div>
</div>

<div id="hud"></div>
<div id="note">drag to orbit · wheel to zoom · left: current renderer as it ships · right: the experiment</div>
<div id="err"></div>

<script type="module">
  window.addEventListener('error', (e) => {
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = (e.error && e.error.stack) || e.message || String(e);
  });
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
