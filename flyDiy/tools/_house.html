<!DOCTYPE html>
<!--
  HOUSE BENCH (G229) — the wooden-house designer. Serve from the repo root
  (launch: flydiy-house) and open /flyDiy/tools/_house.html.

  Alaska: bright painted board walls, a ribbed metal roof, and the whole thing
  standing off a wet sloping beach on posts. The model is four independent
  layers (see _house_gen.js) — VOLUME, ROOF, STANCE, FITTINGS — and the four
  presets are the reference photographs expressed in them. There is no "house
  type" anywhere: 'village house' and 'cannery shed' are the same generator.

  THE BENCH DRAWS BOTH MESHES. Every rebuild produces the near mesh (lod 0)
  and the far mesh (lod 1) from the same numbers, reports both tri counts and
  the silhouette difference between them, and can show them side by side. That
  is the deliverable the user asked for — high AND low poly — and it is only
  honest if the low one is a construction rather than a decimation, which is
  what GATE HOUSE (`node tools/_house_check.js`) holds.
-->
<meta charset="utf-8">
<title>flyDiy — house bench</title>
<style>
  :root{--bg:#12151a;--fg:#dfe6ee;--dim:#7d8996;--acc:#5db3ff;--grid:#242a33}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  header{padding:8px 12px;border-bottom:1px solid var(--grid);display:flex;
    gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:13px;margin:0}
  label{color:var(--dim);display:inline-flex;gap:5px;align-items:center}
  select,button{background:#1a1f27;color:var(--fg);border:1px solid var(--grid);
    padding:3px 8px;border-radius:4px;font:inherit}
  main{display:flex;height:calc(100vh - 40px)}
  #view{position:relative;flex:1;min-width:0}
  canvas{display:block;width:100%;height:100%}
  aside{border-left:1px solid var(--grid);overflow-y:auto;overflow-x:hidden;
    padding:10px;width:340px;flex:none;resize:horizontal;direction:rtl;
    min-width:250px;max-width:70vw}
  aside>*{direction:ltr}
  .r{display:flex;gap:6px;align-items:center;margin:5px 0;min-width:0}
  .r span.k{color:var(--dim);width:104px;flex:none;overflow:hidden;

  input[type=range]{flex:1;min-width:30px;accent-color:var(--acc)}
  .v{width:48px;flex:none;text-align:right;color:var(--acc)}
  #stat{position:absolute;left:10px;top:8px;color:var(--dim);z-index:2}
  #chk{position:absolute;left:10px;bottom:10px;z-index:2;
    background:rgba(18,21,26,.84);border:1px solid var(--grid);

  .ok{color:#6fd08c} .warn{color:#e8c15a} .bad{color:#ff6b5a}
  .hd{color:#7d8996;letter-spacing:.14em;font-size:9px;margin:6px 0 3px}

<script>
'use strict';
(() => {
const G = window.HOUSE_GEN;
const SH = window.SHED_GEN;
const BG = window.BIG_GEN;
const $ = id => document.getElementById(id);
const D2R = Math.PI / 180;
// TWO GENERATORS, ONE BENCH. The shed is a different MODEL of a building — a
// pile of members rather than a set of surfaces — so it is a different
// generator with its own rows and its own presets, and the bench switches
// between them. The materials, the light, the LOD ledger and the gate are
// shared: a shed beside a house has to be made of the same wood.
let GEN = G;
let P = Object.assign({}, G.DEF);

// ---- scene ----------------------------------------------------------------
let yaw = -0.75, pitch = 0.30, ZOOM = 1, drag = null, panD = null;
let centre = new THREE.Vector3(), centreOv = null, fitR = 12;
const cv = $('c');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true,
                                           preserveDrawingBuffer: true });
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12151a);

// ---------------------------------------------------------------------------
// THE LIGHT RIG (the user: "The current viewer has very little shading, can we
// do better? It's hard to judge PBR textures without anything to reflect, to
// shade and to light.")
// ---------------------------------------------------------------------------
// Three lamps and a 64x32 gradient could not answer that, and the reason is
// physical: a PBR surface is only as legible as what is around it. A rough
// plank needs a broad source to smear, a metal roof needs a SUN to catch, and
// both need something dark on one side or the shape disappears. So:
//
//   A REAL SKY, painted as an equirectangle and run through PMREM — zenith,
//   haze, horizon, ground bounce, AND A SUN DISC in the right place. The disc
//   is what puts a highlight on the galvanising and a glint on the gutter;
//   without it the metal sets are grey paint.
//   THE SUN AS A SHADOW-CASTING LIGHT at the same azimuth and elevation, its
//   ortho frustum fitted to the building. Contact shadow under the eaves and
//   the deck is most of what makes a house read as solid.
//   ACES TONE MAPPING and an exposure dial, because the sky is brighter than
//   the paint and clipping it is what made everything look flat.
//   FOUR MOODS off the game's own sky rows (afternoon, golden, overcast, blue
//   hour): the same judgement call in four different lights, which is how you
//   find out that a finish only works at noon.
const MOODS = [
  { name: 'afternoon', zen: [0.32, 0.50, 0.78], hor: [0.72, 0.80, 0.88],
    gnd: [0.20, 0.22, 0.17], sun: [1.00, 0.94, 0.82], sunI: 3.0, disc: 26,
    amb: 0.55, ev: 1.05 },
  { name: 'golden',    zen: [0.22, 0.36, 0.62], hor: [0.95, 0.72, 0.44],
    gnd: [0.22, 0.19, 0.13], sun: [1.00, 0.78, 0.48], sunI: 2.4, disc: 34,
    amb: 0.50, ev: 1.15 },
  { name: 'overcast',  zen: [0.62, 0.66, 0.72], hor: [0.78, 0.80, 0.83],
    gnd: [0.26, 0.27, 0.24], sun: [0.90, 0.92, 0.95], sunI: 0.45, disc: 0,
    amb: 1.05, ev: 1.00 },
  { name: 'blue hour', zen: [0.10, 0.16, 0.34], hor: [0.40, 0.46, 0.66],
    gnd: [0.10, 0.12, 0.14], sun: [0.72, 0.78, 1.00], sunI: 0.55, disc: 10,
    amb: 0.45, ev: 1.35 },
];
// AND A CAPTURED ONE (the user: "give this an hdr for lighting and
// reflections please"). The painted moods above are a gradient with a disc in
// it, and there is a limit to what you can judge against them: a scanned
// plank needs a source with STRUCTURE in it to smear, a metal roof needs
// something worth reflecting, and the difference between a good normal map
// and a bad one only shows when the light has edges. So the dome can also be
// a photograph — src/viewer/house_tex.js's HOUSE_SKIES, baked from
// assets/house_sky/*.hdr by tools/house_sky_prep.py.
//
// THREE THINGS COME OFF ONE FILE and they must agree or the model floats:
// the ENVIRONMENT (the RGBE equirect, decoded to half floats and run through
// PMREM — this is the ambient and every reflection), the BACKDROP (the
// tone-mapped jpeg, so what you see behind the house is the same sky that is
// lighting it), and the SUN, whose direction, colour and share of the total
// were measured in the float data at bake time. The azimuth slider then yaws
// the BUILDING rather than moving a lamp inside the photograph, because in a
// photograph the sun is where it is: what is still yours to choose is which
// way the house faces. The elevation slider does nothing here, for the same
// reason.
const SKIES = (typeof HOUSE_SKIES !== 'undefined' && HOUSE_SKIES) || {};
const SKY_KEYS = Object.keys(SKIES);
const skyOf = i => (i >= MOODS.length ? SKIES[SKY_KEYS[i - MOODS.length]] : null);
{
  const sel = $('moodSel');
  MOODS.forEach((m, i) => sel.add(new Option(m.name, String(i))));
  SKY_KEYS.forEach((k, i) => sel.add(
    new Option(SKIES[k].name + ' (hdr)', String(MOODS.length + i))));
  sel.value = SKY_KEYS.length ? String(MOODS.length) : '0';
}

// RGBE -> half float, once per sky. The image is four bytes a pixel: three
// mantissas and a shared exponent, which is the whole of Radiance's format
// and decodes in one exp2. Half float rather than float32 because linear
// filtering of an RGBA16F texture is core in WebGL2 and of an RGBA32F one is
// an extension — and PMREM samples this with LINEAR.
const ENVC = new Map();
function envTexture(sky) {
  const img = sky.env;
  if (!img.complete || !img.naturalWidth) return null;
  if (ENVC.has(sky)) return ENVC.get(sky);
  const w = img.naturalWidth, h = img.naturalHeight;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g2 = c.getContext('2d');
  g2.drawImage(img, 0, 0);
  const src = g2.getImageData(0, 0, w, h).data;
  const half = THREE.DataUtils.toHalfFloat;
  const out = new Uint16Array(w * h * 4);
  for (let i = 0, n = w * h; i < n; i++) {
    const e = src[i * 4 + 3];
    const k = e ? Math.pow(2, e - 136) : 0;
    out[i * 4] = half(src[i * 4] * k);
    out[i * 4 + 1] = half(src[i * 4 + 1] * k);
    out[i * 4 + 2] = half(src[i * 4 + 2] * k);
    out[i * 4 + 3] = half(1);
  }
  const t = new THREE.DataTexture(out, w, h, THREE.RGBAFormat,
                                  THREE.HalfFloatType);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  ENVC.set(sky, t);
  return t;
}

const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
const fill = new THREE.HemisphereLight(0xbdd2ea, 0x4a4436, 0.5);
scene.add(fill);
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
let envRT = null;

const hdrDir = new THREE.Vector3(0.3, 0.5, 0.8);
function sunDir() {
  if (skyOf(+$('moodSel').value)) return hdrDir.clone();
  const az = (+$('sunAz').value) * D2R, el = (+$('sunEl').value) * D2R;
  return new THREE.Vector3(Math.cos(el) * Math.sin(az), Math.sin(el),
                           Math.cos(el) * Math.cos(az));
}

// the sky is rotated, not the sun: a photograph's sun is where it is
let skyRot = 0;
const BGC = new Map();
function bgTexture(sky) {
  const img = sky.bg;
  if (!img.complete || !img.naturalWidth) return null;
  if (!BGC.has(sky)) {
    const t = new THREE.Texture(img);
    t.mapping = THREE.EquirectangularReflectionMapping;
    t.encoding = THREE.sRGBEncoding;
    t.needsUpdate = true;
    BGC.set(sky, t);
  }
  return BGC.get(sky);
}

function buildSkyHDR(sky) {
  const t = envTexture(sky);
  if (!t) {                       // still loading: paint one and come back
    sky.env.addEventListener('load', () => buildSky(), { once: true });
    return false;
  }
  // THE ROTATION TURNS THE BUILDING, NOT THE SKY. An equirect background and
  // a PMREM cube both sample in world space with no offset to give, and
  // re-rolling two images on every drag of a slider is silly when the whole
  // model — house, site plane and tide — already hangs off one group. So the
  // azimuth slider yaws that group: the sun stays where the photograph put
  // it and the house faces a different way, which is the question anybody
  // actually asks of a site.
  const az = (+$('sunAz').value) * D2R;
  skyRot = az;
  if (envRT) envRT.dispose();
  envRT = pmrem.fromEquirectangular(t);
  scene.environment = envRT.texture;
  const bg = bgTexture(sky);
  if (bg) scene.background = bg;
  else {
    scene.background = new THREE.Color(sky.hor[0], sky.hor[1], sky.hor[2]);
    sky.bg.addEventListener('load', () => buildSky(), { once: true });
  }
  // THE MEASURED SUN. `direct` is the share of the sphere's light that came
  // from the disc; on this sunset it is 0.06, which is why the shadow is a
  // soft one and should be. The floor keeps a shadow readable at all — a
  // bench with no contact shadow cannot be judged — and the ceiling stops a
  // hard noon sky from blowing out the dome that is already lighting it.
  const d = sky.sun;
  sun.color.setRGB(sky.sunCol[0], sky.sunCol[1], sky.sunCol[2]);
  sun.intensity = Math.max(0.55, Math.min(3.0, sky.direct * 6.5 + 0.45));
  fill.intensity = 0;             // the dome IS the fill here
  // and the exposure this sky asks for, measured: EV_ANCHOR over the
  // cosine-weighted upper hemisphere, which is the light that actually
  // falls on a roof. A sunset normalised to the same sphere mean as a noon
  // still delivers half the downward radiance, and reading a plank in it
  // otherwise means chasing the exposure dial by hand.
  // ... DIVIDED BY WHAT THE SUN ADDS ON TOP OF THE DOME (G302). The dome
  // already holds the disc's energy (`direct` is its share: 0.70 on the
  // alps), and the directional light stood on it AGAIN for the shadows -
  // a lawn of albedo 0.16 read sRGB 225, every pale wall 'shone like
  // teeth', and no ground darkening could show through the tone curve's
  // shoulder. The sun's irradiance on the flat, over the dome's own
  // (the ev anchor's unit), is what the exposure gives back.
  const sunDown = sun.intensity * Math.max(0, d[1] / Math.hypot(d[0], d[1], d[2]));
  renderer.toneMappingExposure = (+$('expo').value) * (sky.ev || 1) / (1 + sunDown);
  hdrDir.set(d[0], d[1], d[2]).normalize();
  return true;
}

function buildSky() {
  const mi = +$('moodSel').value;
  const sky = skyOf(mi);
  if (sky && buildSkyHDR(sky)) return;
  skyRot = 0;
  const M = MOODS[Math.min(mi, MOODS.length - 1)];
  const W = 256, H = 128;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const img = g.createImageData(W, H);
  const d = sunDir();
  const px = (v, i) => Math.max(0, Math.min(255, Math.round(v * 255)));
  for (let y = 0; y < H; y++) {
    const theta = (y + 0.5) / H * Math.PI;           // 0 = zenith
    const cy = Math.cos(theta), sy = Math.sin(theta);
    for (let x = 0; x < W; x++) {
      const phi = (x + 0.5) / W * Math.PI * 2 - Math.PI;
      const dir = [sy * Math.sin(phi), cy, sy * Math.cos(phi)];
      let col;
      if (cy >= 0) {
        const t = Math.pow(1 - cy, 2.2);             // horizon haze
        col = [M.zen[0] + (M.hor[0] - M.zen[0]) * t,
               M.zen[1] + (M.hor[1] - M.zen[1]) * t,
               M.zen[2] + (M.hor[2] - M.zen[2]) * t];
      } else {
        const t = Math.min(1, -cy * 3);
        col = [M.hor[0] * (1 - t) + M.gnd[0] * t,
               M.hor[1] * (1 - t) + M.gnd[1] * t,
               M.hor[2] * (1 - t) + M.gnd[2] * t];
      }
      if (M.disc > 0) {
        const dot2 = dir[0] * d.x + dir[1] * d.y + dir[2] * d.z;
        const ang = Math.acos(Math.max(-1, Math.min(1, dot2)));
        const disc = Math.exp(-Math.pow(ang / 0.055, 2)) * M.disc;
        const glow = Math.exp(-Math.pow(ang / 0.55, 2)) * M.disc * 0.10;
        col = [col[0] + (disc + glow) * M.sun[0],
               col[1] + (disc + glow) * M.sun[1],
               col[2] + (disc + glow) * M.sun[2]];
      }
      const i = (y * W + x) * 4;
      img.data[i] = px(col[0]); img.data[i + 1] = px(col[1]);
      img.data[i + 2] = px(col[2]); img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.encoding = THREE.sRGBEncoding;
  if (envRT) envRT.dispose();
  envRT = pmrem.fromEquirectangular(t);
  scene.environment = envRT.texture;
  scene.background = new THREE.Color(M.hor[0] * 0.45, M.hor[1] * 0.47,
                                     M.hor[2] * 0.52);
  t.dispose();
  sun.color.setRGB(M.sun[0], M.sun[1], M.sun[2]);
  sun.intensity = M.sunI;
  fill.intensity = M.amb;
  fill.color.setRGB(M.hor[0], M.hor[1], M.hor[2]);
  fill.groundColor.setRGB(M.gnd[0], M.gnd[1], M.gnd[2]);
  renderer.toneMappingExposure = (+$('expo').value) * M.ev;
}
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 600);
let root = null;
let BUILT = { hi: null, lo: null };

// THE SITE, drawn from the generator's own ground function — one plane, so a
// post that lands on it in the model lands on it on screen too.
let PATH = null;                         // the worn path, from the build
function siteMesh(g, R, foot) {
  const grp = new THREE.Group();
  const N = 2;
  const pos = [], idx = [];
  const uv = [];
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
    const x = -R + 2 * R * i / N, z = -R + 2 * R * j / N;
    pos.push(x, g(x, z), z);
    uv.push(x, z);                              // metres, like every other UV
  }
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const a = i * (N + 1) + j;
    idx.push(a, a + 1, a + N + 2, a, a + N + 2, a + N + 1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position',
    new THREE.BufferAttribute(new Float32Array(pos), 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uv), 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const gm = new THREE.MeshStandardMaterial({
    color: 0x87906f, roughness: 0.96, metalness: 0,
    side: THREE.DoubleSide });
  const SS = (typeof SITE_TEX_SETS !== 'undefined') && SITE_TEX_SETS;
  if (SS && SS.grass005) {                     // the aerodrome's field grass
    const mk = (img, srgb) => {
      const t = new THREE.Texture(img);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = 8;
      if (srgb) t.encoding = THREE.sRGBEncoding;
      t.repeat.set(1 / SS.grass005.tile, 1 / SS.grass005.tile);
      const ok = () => { t.needsUpdate = true; draw(); };
      if (img.complete && img.naturalWidth) t.needsUpdate = true;
      else img.addEventListener('load', ok);
      return t;
    };
    gm.map = mk(SS.grass005.diff, true);
    gm.normalMap = mk(SS.grass005.nor, false);
    gm.roughnessMap = mk(SS.grass005.rough, false);
    gm.color.setHex(0xffffff);
  }
  // THE CONTACT SHADOW ON THE GRASS. The site is not the house's mesh, so it
  // gets none of the baked occlusion; this is the generator's own ground
  // patch, driven by the footprint it publishes.
  // the skirt does the footprint now; the shader patch keeps only the path
  if (foot) G.shadeGround(gm, foot, { path: PATH || [], strength: (P.aoGround === undefined || P.aoGround) ? 0 : 0.55 });
  const gmesh = new THREE.Mesh(geo, gm);
  gmesh.receiveShadow = true;
  grp.add(gmesh);
  const grid = new THREE.GridHelper(2 * R, Math.round(R), 0x39424e, 0x2a313a);
  grid.material.transparent = true; grid.material.opacity = 0.35;
  grid.rotation.z = -P.slopeX * D2R;
  grid.rotation.x = P.slopeZ * D2R;
  grp.add(grid);
  return grp;
}

function addBuild(parent, built, dx) {
  const grp = new THREE.Group();
  grp.position.x = dx || 0;
  for (const k of GEN.BAGS) built.bags[k].mesh(grp, (GEN.MAT || G.MAT)[k]);
  // the ground shadow skirt (G281): polygons on the ground, drawn after the
  // opaque site, never into depth
  if (built.bags.aoskirt) {
    const sk = built.bags.aoskirt.mesh(grp, G.MAT.aoskirt);
    if (sk) { sk.renderOrder = 5; sk.castShadow = false; sk.receiveShadow = false; }
  }
  // the smoke, drawn last and never into depth (its material says so)
  if (built.bags.smoke) {
    const sm = built.bags.smoke.mesh(grp, G.MAT.smoke);
    if (sm) { sm.renderOrder = 10; sm.castShadow = false; sm.receiveShadow = false; }
  }
  parent.add(grp);
  return grp;
}

// THE BAKE IS 30-60 ms AND A SLIDER IS 60 A SECOND. So a drag builds WITHOUT
// occlusion and the bake follows a quarter of a second after the hand stops:
// the shape answers immediately, the light catches up. Everything that is not
// a drag (a preset, a select, a dice roll) bakes straight away.
let aoFast = false, aoTimer = null;
function buildFast() {
  aoFast = true;
  build();
  clearTimeout(aoTimer);
  aoTimer = setTimeout(() => { aoFast = false; build(); }, 240);
}

// a prop on the ground stands on the ground's own normal, so a bin on a
// twelve-degree beach leans with the beach and not into it
function tiltToGround(o, g, x, z, ry) {
  const e = 0.12;
  const gx = (g(x + e, z) - g(x - e, z)) / (2 * e);
  const gz = (g(x, z + e) - g(x, z - e)) / (2 * e);
  const n = new THREE.Vector3(-gx, 1, -gz).normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), n);
  const yaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), ry || 0);
  o.quaternion.copy(q.multiply(yaw));
}

// the pier kit is a set of baked props (src/pier/*.js): stand each one the
// plan names, where it names it. Every instance shares one upload per prop.
function addPier(grp, plan, dx) {
  const PIER = new THREE.Group();
  PIER.name = 'pier';
  for (const m of plan.modules.concat(plan.boats)) {
    if (!PROP_REG.props[m.key]) {
      console.warn('pier: no baked prop ' + m.key);
      continue;
    }
    PIER.add(propPlace(THREE, m.key, m.x + dx, m.z, m.ry, m.y));
  }
  grp.add(PIER);
  return PIER;
}
if (typeof window !== 'undefined')
  window.PROP_LANDED = () => { draw(); };
// the dust on the props (G283): dark at the foot, clean above - see props.js
{
  const D = { barrel_plastic: [0.3, 0.7], drum_steel: [0.3, 0.7], bin_metal: [0.3, 0.7],
              bin_metal_rust: [0.3, 0.75], bottle_propane: [0.2, 0.6], bottle_lpg: [0.22, 0.6],
              compressor: [0.35, 0.7], stove_barrel: [0.3, 0.7], crate_wood_a: [0.15, 0.6],
              crate_wood_b: [0.2, 0.6], crate_wood_c: [0.15, 0.6], tyre: [0.1, 0.6], work_trestle: [0.3, 0.6],
              handtruck: [0.3, 0.6], box_cardboard: [0.12, 0.5], jerrycan: [0.12, 0.6], jerrycan_green: [0.15, 0.6],
              bags_stack: [0.1, 0.5], bags_lean: [0.2, 0.55], bags_flat: [0.08, 0.5], bags_stand: [0.25, 0.55],
              bag_compost: [0.15, 0.5], planter: [0.25, 0.6], stepladder: [0.3, 0.6], stool_wood: [0.15, 0.5],
              chair_lounge: [0.2, 0.5], table_wood: [0.2, 0.5], picnic_table: [0.2, 0.55],
              chair_wood: [0.2, 0.5], stool_wood2: [0.15, 0.5], stool_fold: [0.15, 0.5], oil_tin: [0.06, 0.5] };
  for (const k in D) propDust(k, D[k][0], D[k][1]);
}

function build() {
  if (root) {
    root.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    scene.remove(root);
  }
  root = new THREE.Group();
  // under a captured sky the sun cannot be moved, so the building turns
  // instead: one yaw on the group that carries the house, the site plane and
  // the tide, so all three stay in register (see buildSkyHDR)
  root.rotation.y = skyRot;
  scene.add(root);
  GEN.applyFinish(P);
  const t0 = performance.now();
  const PB = aoFast ? Object.assign({}, P, { ao: 0 }) : P;
  const hi = GEN.build(PB, 0);
  const lo = GEN.build(PB, 1);
  const ms = performance.now() - t0;
  BUILT = { hi, lo };
  const mode = +$('lodSel').value;
  if (mode === 2) {
    const gap = P.L + Math.max(6, P.w * 0.8);
    addBuild(root, hi, -gap / 2);
    addBuild(root, lo, gap / 2);
  } else addBuild(root, mode === 1 ? lo : hi, 0);
  // THE PIER AND ITS BOATS: instanced off the plan the generator published,
  // through the same factory the hangar uses (props.js). A prop whose bytes
  // are still on the wire arrives as an empty group and fills itself; the
  // redraw is hooked on PROP_LANDED below.
  if (hi.stats.pier && mode !== 1) addPier(root, hi.stats.pier, 0);
  // and the two people for scale (G255), placed by their feet where the plan
  // put them - the same factory, the same late-landing fetch
  if (hi.stats.people && mode !== 1)
    for (const q of hi.stats.people)
      if (PROP_REG.props[q.key]) root.add(propPlace(THREE, q.key, q.x, q.z, q.ry, q.y));
  // THE YARD (G273): every prop the plan placed, stood where it stands - a
  // thing on the ground is tilted to the ground under it, a thing on a wall
  // is turned to face off it
  PATH = hi.stats.path || [];
  if (hi.stats.yard && mode !== 1)
    for (const q of hi.stats.yard) {
      if (!PROP_REG.props[q.key]) { console.warn('yard: no baked prop ' + q.key); continue; }
      const o = propPlace(THREE, q.key, q.x, q.z, q.ry, q.y);
      if (q.on === 'ground') tiltToGround(o, hi.stats.ground, q.x, q.z, q.ry);
      root.add(o);
    }
  // the blue water butt under the pipe, when the barrel is the baked one
  if (hi.stats.barrel && hi.stats.barrel.prop && mode !== 1 && PROP_REG.props[hi.stats.barrel.prop]) {
    const b = hi.stats.barrel;
    const o = propPlace(THREE, b.prop, b.x, b.z, b.ry, hi.stats.ground(b.x, b.z));
    tiltToGround(o, hi.stats.ground, b.x, b.z, b.ry);
    root.add(o);
  }
  // and the wall lamp, when the lamp is the baked fixture (mount at its plate)
  if (hi.stats.lit && mode !== 1)
    for (const L of hi.stats.lit.lights)
      if (L.prop && PROP_REG.props[L.prop])
        root.add(propPlace(THREE, L.prop, L.mx, L.mz, L.ry, L.my));
  // THE LAMPS ARE REAL LIGHTS (G253): the generator drew the fixture and
  // published where its glass is; the bench stands a point light in it. No
  // light without emitting geometry — the aeroplane's rule, kept.
  if (hi.stats.lit)
    for (const L of hi.stats.lit.lights) {
      const pl = new THREE.PointLight(
        new THREE.Color(L.col[0], L.col[1], L.col[2]),
        L.k * (P.lightK || 2.2) * 2.4, L.range, 2);
      pl.position.set(L.x + L.nx * 0.16, L.y - 0.04, L.z + L.nz * 0.16);
      root.add(pl);
    }
  if ($('ground').checked) {
    const R2 = Math.max(18, P.L * 1.6 + (hi.stats.pier ? hi.stats.pier.z1 * 0.6 : 0));
    root.add(siteMesh(hi.stats.ground, R2, hi.stats.aoFoot));
    // the tide, when the building stands in it: one plane, and the piles are
    // already cut to the seabed under them
    if (P.water) {
      const g2 = new THREE.PlaneGeometry(R2 * 2.2, R2 * 2.2);
      g2.rotateX(-Math.PI / 2);
      const m2 = new THREE.Mesh(g2, new THREE.MeshStandardMaterial({
        color: 0x2b4a58, roughness: 0.12, metalness: 0.15,
        transparent: true, opacity: 0.72, side: THREE.DoubleSide }));
      m2.position.y = P.waterY;
      m2.receiveShadow = true;
      root.add(m2);
    }
  }

  if ($('wire').checked)
    root.traverse(o => { if (o.material && !o.material.wireframe) {
      o.material = o.material.clone(); o.material.wireframe = true; } });

  const box = new THREE.Box3().setFromObject(root);
  box.getCenter(centre);
  fitR = box.getSize(new THREE.Vector3()).length() * 0.55;
  // the sun's frustum is fitted to what it has to shadow, or the map is spent
  // on empty grass and the eaves get no contact shadow at all
  const d = sunDir().multiplyScalar(Math.max(14, fitR * 2.4));
  sun.position.copy(centre).add(d);
  sun.target.position.copy(centre);
  sun.target.updateMatrixWorld();
  const S = Math.max(8, fitR * 1.5);
  sun.shadow.camera.left = -S; sun.shadow.camera.right = S;
  sun.shadow.camera.top = S; sun.shadow.camera.bottom = -S;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = Math.max(40, fitR * 6);
  sun.shadow.camera.updateProjectionMatrix();
  $('stat').textContent =
    'high ' + hi.stats.tris + ' tris / ' + hi.stats.verts + ' v   ·   ' +
    'low ' + lo.stats.tris + ' tris / ' + lo.stats.verts + ' v   ·   ' +
    (lo.stats.tris / hi.stats.tris * 100).toFixed(1) + '%   ·   ' +
    ms.toFixed(1) + ' ms' + (aoFast ? '   ·   baking…' : '');
  checks(hi, lo);
  syncVis();
  draw();
  smokeLoop();
}

// THE SMOKE MOVES. The bench draws on demand; a column of smoke wants a clock.
// One requestAnimationFrame loop, alive only while there is smoke to move,
// scrolling the shader's noise upward at a third of a metre a second.
let smokeRAF = 0;
function smokeLoop() {
  if (smokeRAF) return;
  const tick = () => {
    smokeRAF = 0;
    if (!BUILT || !BUILT.hi.stats.smoke) return;
    G.SMOKE_U.uTime.value = performance.now() / 1000;
    draw();
    smokeRAF = requestAnimationFrame(tick);
  };
  smokeRAF = requestAnimationFrame(tick);
}

// ---- the checks that make this a bench, not a viewer ----------------------
// Building geometry has known numbers too: a stair you can walk down, a rail
// you cannot fall over, a pitch that sheds snow, headroom under the ridge, and
// a crawl space that keeps timber out of the wet. Plus the two things only a
// generator can get wrong — dropped openings, and a low mesh that is not the
// same house as the high one.
function checks(hi, lo) {
  const S = hi.stats, rows = [];
  if (GEN === SH) return shedChecks(hi, lo);
  if (GEN === BG) return bigChecks(hi, lo);
  const row = (label, val, cls, note) =>
    rows.push('<div><span style="color:#7d8996">' + label + '</span> ' +
      '<b class="' + (cls || '') + '">' + val + '</b>' +
      (note ? ' <span style="color:#4a525c">' + note + '</span>' : '') + '</div>');
  const head = t => rows.push('<div class="hd">' + t + '</div>');

  head('THE BUILDING');
  row('footprint', S.footprint.toFixed(1) + ' m&sup2;', '',
      S.area.toFixed(0) + ' m&sup2; over ' + P.storeys + ' storey' +
      (P.storeys > 1 ? 's' : ''));
  row('ridge height', S.ridgeY.toFixed(2) + ' m', '',
      'eave ' + (S.eaveY - S.floorY).toFixed(2) + ' above floor');
  const p12 = S.pitch12;
  row('roof pitch', S.pitch.toFixed(1) + '&deg;',
      p12 >= 4 ? 'ok' : (p12 >= 3 ? 'warn' : 'bad'),
      p12.toFixed(1) + ':12 &mdash; snow wants 4:12+');
  const ov = Math.min(P.eaveOver, P.hip ? P.eaveOver : P.rakeOver);
  row('overhang', ov.toFixed(2) + ' m', ov >= 0.30 ? 'ok' : 'warn',
      'rain off the walls: 0.30 m+');
  const hr = S.headroom;
  row('headroom at ridge', hr.toFixed(2) + ' m',
      hr >= 2.1 ? 'ok' : (hr >= 1.5 ? 'warn' : 'bad'), 'top storey, want 2.1');

  head('THE STANCE');
  if (P.stance === 0) row('stands on', 'a slab', '', 'no posts');
  else if (Math.round(P.stance) === 4)
    row('stands on', 'skids', '', 'blocked up, no crawl space by design');
  else {
    row('posts', String(S.posts), '',
        'longest free length ' + S.postFree.toFixed(2) + ' m');
    const sl = S.postFree / Math.max(0.01, P.postSz);
    row('slenderness', sl.toFixed(0), sl <= 20 ? 'ok' : (sl <= 28 ? 'warn' : 'bad'),
        'free length / size, want &lt; 20');
    const cl = S.clearance;
    row('crawl space', cl.toFixed(2) + ' m',
        cl >= 0.45 ? 'ok' : (cl >= 0.25 ? 'warn' : 'bad'),
        'timber out of the wet: 0.45 m');
  }
  const gd = Math.abs(P.slopeZ) + Math.abs(P.slopeX);
  row('site slope', P.slopeZ.toFixed(1) + '&deg; / ' + P.slopeX.toFixed(1) + '&deg;',
      '', gd > 0.5 ? 'across / along the ridge' : 'flat');

  if (P.porch) {
    head('THE DECK');
    row('deck', S.deckArea.toFixed(1) + ' m&sup2;', '',
        P.porchD.toFixed(2) + ' m deep');
    if (P.railStyle > 0)
      row('rail height', S.railH.toFixed(2) + ' m',
          S.railH >= 0.90 ? 'ok' : 'bad', 'guard: 0.90 m');
    if (S.stair) {
      const st = S.stair;
      const twoRG = 2 * st.rise + st.run;
      row('stair', st.n + ' &times; ' + (st.rise * 1000).toFixed(0) + ' mm', '',
          'going ' + (st.run * 1000).toFixed(0) + ' mm');
      row('2R + G', (twoRG * 1000).toFixed(0) + ' mm',
          twoRG > 0.60 && twoRG < 0.66 ? 'ok' : 'warn', 'want 600-660');
      row('rise', (st.rise * 1000).toFixed(0) + ' mm',
          st.rise <= 0.200 ? 'ok' : 'bad', 'max 200 mm');
    }
  }

  if (P.lights && S.lit) {
    row('lights', S.lit.windows + ' windows lit, ' + S.lit.lights.length +
        ' lamp' + (S.lit.lights.length === 1 ? '' : 's'),
        S.lit.windows + S.lit.lights.length ? 'ok' : 'warn',
        S.lit.bulbs + ' bulbs on the rails');
  }
  if (S.pier) {
    const pr = S.pier;
    row('pier', pr.modules.length + ' modules, ' + (pr.z1 - pr.z0).toFixed(1) +
        ' m', 'ok', 'deck at ' + pr.y.toFixed(2) + ', ' + pr.tris + ' tris');
    row('boats', pr.boats.length ? pr.boats.map(b => b.key.slice(5)).join(', ')
        : 'none', pr.boats.length ? 'ok' : 'warn',
        pr.boats.length ? pr.boats.map(b => b.depth.toFixed(1) + ' m').join(', ')
                        + ' of water' : (P.boats ? 'none afloat here' : ''));
  }
  if (P.dormers || P.cupola || P.water || P.firewood || P.openFront) {
    head('THE EXTRAS');
    if (P.dormers)
      row('dormers', S.dormers + ' built',
          S.dormSkipped ? 'warn' : 'ok',
          (S.dormClamped ? S.dormClamped + ' shortened to fit' : '') +
          (S.dormSkipped ? (S.dormClamped ? ', ' : '') + S.dormSkipped +
           ' refused: the roof is too shallow' : ''));
    if (S.cupola)
      row('belfry', S.cupola.sides + '-sided', '',
          'apex ' + S.cupola.top.toFixed(2) + ' m, ' +
          (S.cupola.top - S.ridgeY).toFixed(2) + ' above the ridge');
    if (P.water)
      row('in the water', S.inWater + ' of ' + S.posts + ' legs',
          S.inWater ? 'ok' : 'warn', 'tide at ' + P.waterY.toFixed(2));
    if (P.firewood) row('cordwood', String(S.firewood), '', 'rounds stacked');
    if (P.openFront)
      row('open side', ['-', 'front', 'right end', 'back', 'left end'][
        Math.round(P.openFront)], '', 'posts and a header, no wall');
  }

  head('THE MATERIALS');
  {
    // WHAT EVERY SLOT IS ACTUALLY WEARING. Asked of the materials themselves,
    // so "all materials have full PBR" is a reading rather than a claim.
    const rep = G.finishReport();
    const full = rep.filter(r => r.full).length;
    const glassy = rep.filter(r => r.glassy).length;
    row('PBR', full + ' of ' + rep.length + ' slots',
        full === rep.length ? 'ok' : 'bad',
        'albedo + normal + roughness (' + glassy + ' glass, no maps by design)');
    const kinds = {};
    for (const slot of ['wall', 'trim', 'deck', 'floor', 'post', 'roof'])
      kinds[slot] = G.SET_KIND[G.setFor(P, slot)] || '-';
    row('kinds', Object.keys(kinds).map(k => k + ':' + kinds[k]).join(' '), '',
        'planks on walls and floors, veneer on boards, sheet on roofs');
  }
  const L = G.libSets();
  if (!L) row('library', 'not loaded', 'warn', 'flat colours stand in');
  else {
    const dens = [];
    for (const slot of ['wall', 'roof', 'trim', 'deck']) {
      const k = S.sets[slot], set = L[k];
      if (!set) continue;
      dens.push(set.px / set.tile);
      row(slot, set.name, '',
          set.px + 'px / ' + set.tile + ' m = ' +
          Math.round(set.px / set.tile) + ' px/m');
    }
    const sp = Math.max.apply(null, dens) / Math.min.apply(null, dens);
    row('texel density', Math.round(Math.min.apply(null, dens)) + '-' +
        Math.round(Math.max.apply(null, dens)) + ' px/m',
        sp <= 2 ? 'ok' : 'warn', 'spread ' + sp.toFixed(2) + ':1 on this house');
    if (S.ribbedRoof)
      row('drawn seams', 'off', 'ok', 'the roof sheet is ribbed already');
  }
  if (P.gutter) {
    row('gutter', S.gutterLen.toFixed(1) + ' m', '',
        P.gutter === 1 ? 'half round' : 'box');
    if (S.downpipe)
      row('downpipe', S.downpipe.clear.toFixed(2) + ' m clear',
          S.downpipe.clear > 0.05 && S.downpipe.clear < 0.6 ? 'ok' : 'bad',
          'shoe above the ground');
  }

  head('THE GENERATOR');
  if (S.ao)
    row('baked occlusion', 'mean ' + (S.ao.mean * 100).toFixed(0) + '%', 'ok',
        'darkest ' + (S.ao.min * 100).toFixed(0) + '%, ' +
        S.ao.cell.toFixed(2) + ' m cells');
  row('openings dropped', String(S.dropped),
      S.dropped === 0 ? 'ok' : 'warn',
      S.dropped ? 'no room under the roof line' : 'every one placed');
  row('clean geometry',
      (S.nan + S.degen) === 0 ? 'clean' : (S.nan + ' NaN, ' + S.degen + ' degenerate'),
      (S.nan + S.degen) === 0 ? 'ok' : 'bad', 'GATE HOUSE holds this');
  const ratio = lo.stats.tris / Math.max(1, hi.stats.tris);
  row('low / high', (ratio * 100).toFixed(1) + '%',
      ratio < 0.30 ? 'ok' : 'warn', lo.stats.tris + ' of ' + hi.stats.tris);
  const A = hi.stats.bbox, B = lo.stats.bbox;
  let worst = 0;
  for (const k of ['x0','y0','z0','x1','y1','z1'])
    worst = Math.max(worst, Math.abs(A[k] - B[k]));
  row('silhouette delta', worst.toFixed(3) + ' m',
      worst < 0.32 ? 'ok' : 'bad', 'same house, fewer boards');

  $('chk').innerHTML = rows.join('');
}

// WHAT A PLANK-BY-PLANK SHED IS JUDGED BY: how many sticks are in it, how
// many boards, how many are missing, and what all that costs.
// THE BIG BUILDING'S REPORT (G312): what it is, what it opens, its slot
function bigChecks(hi, lo) {
  const S = hi.stats, rows = [];
  const row = (label, val, cls, note) =>
    rows.push('<div><span style="color:#7d8996">' + label + '</span> ' +
      '<b class="' + (cls || '') + '">' + val + '</b>' +
      (note ? ' <span style="color:#4a525c">' + note + '</span>' : '') + '</div>');
  const head = t => rows.push('<div class="hd">' + t + '</div>');
  head('THE BUILDING');
  row('footprint', S.footprint.toFixed(0) + ' m&sup2;', '', P.L + ' x ' + P.w + ' m');
  row('eave / ridge', S.eave.toFixed(2) + ' / ' + S.ridge.toFixed(2) + ' m', '', S.kind + ' roof');
  head('THE OPENINGS');
  row('roller doors', String(S.rollers.length), '', S.rollers.map(r => r.w.toFixed(1) + 'x' + r.h.toFixed(1) + ' ' + Math.round(r.open * 100) + '% up').join(', '));
  row('door', S.door ? S.door.w.toFixed(2) + ' x ' + S.door.h.toFixed(2) + ' m' : 'none');
  row('windows', S.strips + ' strips' + (S.shop ? ', a shop window' : ''));
  row('dock', S.dock ? (S.dock.x1 - S.dock.x0).toFixed(1) + ' m long, ' + (S.dock.z1 - S.dock.z0).toFixed(1) + ' deep' : 'none');
  head('THE SIGN SLOT');
  row('sign', S.sign ? S.sign.w.toFixed(1) + ' x ' + S.sign.h.toFixed(1) + ' m' : 'none',
      '', S.sign ? 'at ' + S.sign.x.toFixed(1) + ', ' + S.sign.y.toFixed(1) + ' facing +z (a billboard fills it)' : '');
  head('THE MESH');
  row('high / low', hi.stats.tris.toLocaleString() + ' / ' + lo.stats.tris.toLocaleString() + ' tris', '',
      Object.keys(S.per).map(k => k + ' ' + S.per[k]).join(' · '));
  row('baked occlusion', S.ao ? 'yes' : 'off');
  return rows.join('');
}
function shedChecks(hi, lo) {
  const S = hi.stats, rows = [];
  const row = (label, val, cls, note) =>
    rows.push('<div><span style="color:#7d8996">' + label + '</span> ' +
      '<b class="' + (cls || '') + '">' + val + '</b>' +
      (note ? ' <span style="color:#4a525c">' + note + '</span>' : '') + '</div>');
  const head = t => rows.push('<div class="hd">' + t + '</div>');
  head('THE SHED');
  row('footprint', S.footprint.toFixed(1) + ' m&sup2;', '',
      P.L.toFixed(2) + ' x ' + P.w.toFixed(2) + ' m');
  row('ridge', S.ridgeY.toFixed(2) + ' m', '',
      'wall ' + P.wallH.toFixed(2) + ' m');
  row('members', String(S.members), '', 'sticks of timber, each placed');
  row('boards', String(S.boards), '',
      S.missing + ' missing off the walls');
  row('shake', (P.shake * 100).toFixed(0) + '%',
      P.shake > 1.1 ? 'warn' : 'ok', 'jitter on every member');
  head('THE MATERIALS');
  {
    const rep = G.finishReport();
    const full = rep.filter(r => r.full).length;
    row('PBR', full + ' of ' + rep.length + ' slots',
        full === rep.length ? 'ok' : 'bad', 'albedo + normal + roughness');
  }
  const L2 = G.libSets();
  if (!L2) row('library', 'not loaded', 'warn', 'flat colours stand in');
  else {
    for (const slot of ['wall', 'roof', 'trim']) {
      const k = G.setFor(P, slot), set = L2[k];
      if (!set) continue;
      row(slot, set.name, '', set.px + 'px / ' + set.tile + ' m = ' +
          Math.round(set.px / set.tile) + ' px/m');
    }
  }
  head('THE GENERATOR');
  row('clean geometry',
      (S.nan + S.degen) === 0 ? 'clean'
        : (S.nan + ' NaN, ' + S.degen + ' degenerate'),
      (S.nan + S.degen) === 0 ? 'ok' : 'bad', 'GATE HOUSE holds this');
  if (S.ao)
    row('baked occlusion', 'mean ' + (S.ao.mean * 100).toFixed(0) + '%', 'ok',
        'darkest ' + (S.ao.min * 100).toFixed(0) + '%');
  const ratio = lo.stats.tris / Math.max(1, hi.stats.tris);
  row('low / high', (ratio * 100).toFixed(1) + '%',
      ratio < 0.35 ? 'ok' : 'warn', lo.stats.tris + ' of ' + hi.stats.tris);
  const A = hi.stats.bbox, B = lo.stats.bbox;
  let worst = 0;
  for (const k of ['x0', 'y0', 'z0', 'x1', 'y1', 'z1'])
    worst = Math.max(worst, Math.abs(A[k] - B[k]));
  row('silhouette delta', worst.toFixed(3) + ' m',
      worst < 0.35 ? 'ok' : 'bad', 'same shed, fewer sticks');
  $('chk').innerHTML = rows.join('');
}

function draw() {
  const r = cv.parentElement.getBoundingClientRect();
  const dp = devicePixelRatio || 1;
  renderer.setSize(r.width * dp, r.height * dp, false);
  cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
  const R = fitR / ZOOM, C = centreOv || centre;
  camera.position.set(C.x + R * Math.sin(yaw) * Math.cos(pitch),
                      C.y + R * Math.sin(pitch),
                      C.z + R * Math.cos(yaw) * Math.cos(pitch));
  camera.lookAt(C);
  renderer.render(scene, camera);
}

// ---- panel ----------------------------------------------------------------
// One row per parameter, grouped, with the family-dependent rows HIDDEN rather
// than removed — a slider that vanishes and comes back keeps its drag, and the
// panel never rebuilds under the mouse.
const ui = $('ui');
const rowEls = [];
function mkRow(parent, spec) {
  const k = spec[0], label = spec[1], lo = spec[2], hi = spec[3],
        st = spec[4], names = spec[5], when = spec[6];
  const d = document.createElement('div');
  d.className = 'r';
  if (names) {
    d.innerHTML = '<span class="k">' + label + '</span><select style="flex:1">' +
      names.map((n, i) => '<option value="' + i + '"' +
        (Math.round(P[k]) === i ? ' selected' : '') + '>' + n + '</option>')
        .join('') + '</select>';
    parent.appendChild(d);
    d.querySelector('select').onchange = e => { P[k] = +e.target.value; build(); };
  } else {
    d.innerHTML = '<span class="k">' + label + '</span>' +
      '<input type="range" min="' + lo + '" max="' + hi + '" step="' + st +
      '" value="' + P[k] + '"><span class="v">' + fmt(P[k], st) + '</span>';
    parent.appendChild(d);
    const inp = d.querySelector('input'), vv = d.querySelector('.v');
    inp.oninput = e => { P[k] = +e.target.value; vv.textContent = fmt(P[k], st);
                         buildFast(); };
  }
  rowEls.push({ el: d, key: k, when: when, spec: spec });
}
const fmt = (v, st) => st >= 1 ? String(Math.round(v))
  : (st >= 0.05 ? (+v).toFixed(2) : (+v).toFixed(3));
function syncVis() {
  for (const r of rowEls) {
    r.el.style.display = (!r.when || r.when(P)) ? '' : 'none';
    const inp = r.el.querySelector('input');
    if (inp) { inp.value = P[r.key];
               r.el.querySelector('.v').textContent = fmt(P[r.key], r.spec[4]); }
    const sel = r.el.querySelector('select');
    if (sel) sel.value = String(Math.round(P[r.key]));
  }
}
function buildPanel() {
  ui.innerHTML = ''; rowEls.length = 0;
  for (const grp of GEN.ROWS) {
    const det = document.createElement('details');
    det.open = ['plan', 'roof', 'stance', 'the shed', 'the cladding']
      .indexOf(grp[0]) >= 0;
    const sum = document.createElement('summary');
    sum.textContent = grp[0];
    det.appendChild(sum);
    ui.appendChild(det);
    for (const spec of grp[1]) mkRow(det, spec);
  }
}

// ---- presets and export ---------------------------------------------------
const psel = $('presetSel');
function fillPresets() {
  psel.innerHTML = '';
  for (const n of Object.keys(GEN.PRESETS)) {
    const o = document.createElement('option'); o.value = n; o.textContent = n;
    psel.appendChild(o);
  }
}
function applyPreset(n) {
  P = Object.assign({}, GEN.DEF, GEN.PRESETS[n] || {});
  buildPanel(); syncVis(); build();
}
$('modelSel').onchange = e => {
  GEN = e.target.value === 'shed' ? SH : (e.target.value === 'big' ? BG : G);
  fillPresets();
  applyPreset(psel.value);
};
psel.onchange = e => applyPreset(e.target.value);
const rollOne = sd => {
  P = GEN === SH ? SH.randomShed(sd) : (GEN === BG ? BG.randomBig(sd) : G.randomHouse(sd));
  buildPanel(); syncVis(); build();
  $('stat').textContent = 'random ' + (GEN === SH ? 'shed' : (GEN === BG ? 'big building' : 'house')) +
    ', seed ' + sd;
};
$('rndBtn').onclick = () => {
  const sd = (parseInt($('seed').value, 10) || 1);
  rollOne(sd);
  $('seed').value = String(sd + 1);            // the next one is one along
};
$('seed').onchange = () => rollOne(parseInt($('seed').value, 10) || 1);
$('resetBtn').onclick = () => applyPreset(psel.value);
for (const id of ['lodSel', 'ground', 'wire']) $(id).onchange = build;
$('peopleLod').onchange = () => { window.PROP_LOD_FORCE = +$('peopleLod').value; build(); };
for (const id of ['moodSel', 'sunAz', 'sunEl', 'expo'])
  $(id).oninput = $(id).onchange = () => { buildSky(); build(); };

const configJSON = () => {
  const d = {};
  for (const k in P) if (P[k] !== GEN.DEF[k]) d[k] = P[k];
  return JSON.stringify({ model: GEN === SH ? 'shed' : (GEN === BG ? 'big' : 'house'), P: d }, null, 1);
};
const dl = (text, name, mime) => {
  const el = document.createElement('a');
  el.href = URL.createObjectURL(new Blob([text], { type: mime }));
  el.download = name; el.click();
};
$('jsonBtn').onclick = () => {
  const t = configJSON();
  dl(t, 'house_config.json', 'application/json');
  if (navigator.clipboard) navigator.clipboard.writeText(t);
  $('stat').textContent = 'config downloaded + copied to clipboard';
};
$('impBtn').onclick = () => {
  const t = prompt('paste config JSON ({P:{...}})');
  if (!t) return;
  try {
    const cfg = JSON.parse(t);
    if (cfg.P) Object.assign(P, cfg.P);
    syncVis(); build();
    $('stat').textContent = 'config imported';
  } catch (e) { $('stat').textContent = 'import failed: ' + e.message; }
};
// OBJ, one file per tier, groups named by material — the meshes the game (or
// Blender, when a build wants finishing by hand) actually consumes.
function toOBJ(built, tag) {
  const out = ['# flyDiy house bench (G229) — ' + tag,
               '# ' + JSON.stringify(configJSON())];
  let base = 1, vt = 1;
  for (const k of GEN.BAGS) {
    const d = built.bags[k].data();
    if (!d.idx.length) continue;
    out.push('g ' + k, 'usemtl ' + k);
    // the baked occlusion leaves as a VERTEX COLOUR: `v x y z r g b` is the
    // one extension every DCC tool reads, and it is the only way an OBJ can
    // carry what was baked
    for (let i = 0; i < d.pos.length; i += 3) {
      const a = d.ao ? d.ao[i / 3] : 1;
      out.push('v ' + d.pos[i].toFixed(4) + ' ' + d.pos[i + 1].toFixed(4) +
               ' ' + d.pos[i + 2].toFixed(4) + ' ' + a.toFixed(3) + ' ' +
               a.toFixed(3) + ' ' + a.toFixed(3));
    }
    for (let i = 0; i < d.uv.length; i += 2)
      out.push('vt ' + d.uv[i].toFixed(4) + ' ' + d.uv[i + 1].toFixed(4));
    for (let i = 0; i < d.idx.length; i += 3) {
      const a = d.idx[i] + base, b = d.idx[i + 1] + base, c = d.idx[i + 2] + base;
      const ta = d.idx[i] + vt, tb = d.idx[i + 1] + vt, tc = d.idx[i + 2] + vt;
      out.push('f ' + a + '/' + ta + ' ' + b + '/' + tb + ' ' + c + '/' + tc);
    }
    base += d.pos.length / 3; vt += d.uv.length / 2;
  }
  return out.join('\n') + '\n';
}
$('objBtn').onclick = () => {
  dl(toOBJ(BUILT.hi, 'lod 0 (near)'), 'house_hi.obj', 'text/plain');
  dl(toOBJ(BUILT.lo, 'lod 1 (far)'), 'house_lo.obj', 'text/plain');
  $('stat').textContent = 'house_hi.obj + house_lo.obj downloaded';
};

// ---- interaction ----------------------------------------------------------
const viewEl = $('view');
viewEl.addEventListener('mousedown', e => {
  if (e.button === 1 || e.button === 2) {
    panD = [e.clientX, e.clientY, (centreOv || centre).clone()];
    e.preventDefault();
  } else drag = [e.clientX, e.clientY, yaw, pitch];
});
viewEl.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mouseup', () => { drag = null; panD = null; });
addEventListener('mousemove', e => {
  if (panD) {
    const r = cv.getBoundingClientRect();
    const wpp = 2 * (fitR / ZOOM) * Math.tan(camera.fov * Math.PI / 360) /
                Math.max(1, r.height);
    const e0 = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
    const e1 = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
    centreOv = panD[2].clone()
      .addScaledVector(e0, -(e.clientX - panD[0]) * wpp)
      .addScaledVector(e1, (e.clientY - panD[1]) * wpp);
    draw(); return;
  }
  if (!drag) return;
  yaw = drag[2] + (e.clientX - drag[0]) * 0.008;
  pitch = Math.max(-0.6, Math.min(1.35, drag[3] + (e.clientY - drag[1]) * 0.006));
  draw();
});
viewEl.addEventListener('wheel', e => {
  e.preventDefault();
  ZOOM = Math.max(0.2, Math.min(30, ZOOM * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
  draw();
}, { passive: false });
viewEl.addEventListener('dblclick', () => { ZOOM = 1; centreOv = null; draw(); });
addEventListener('resize', draw);
if (typeof ResizeObserver !== 'undefined')
  new ResizeObserver(() => draw()).observe(viewEl);

// THE PAYLOAD ARRIVES AFTER THE FIRST FRAME. Every consumer in this repo
// degrades by design and updates itself on load; the bench draws on demand
// rather than on a clock, so it has to be told.
(() => {
  const L = G.libSets();
  if (!L) return;
  let pending = 0;
  for (const k in L)
    for (const m of ['diff', 'nor', 'rough', 'paint']) {
      const img = L[k][m];
      if (!img || (img.complete && img.naturalWidth)) continue;
      pending++;
      img.addEventListener('load', () => { if (--pending <= 0) draw(); draw(); });
    }
})();

window.HOUSE_UI = {
  // A GETTER, NOT A CAPTURE. `P` is re-pointed whenever the model or the
  // preset changes, so exporting the object itself hands out a stale one —
  // which is exactly what happened: parameters set through HOUSE_UI.P landed
  // on a house nobody was drawing any more.
  get P() { return P; },
  set P(v) { P = v; },
  get gen() { return GEN; },
  build, draw, applyPreset,
  get built() { return BUILT; },
  get scene() { return scene; }, get root() { return root; },
  get cam() { return camera; },
  setView: (y, p, z, c) => { yaw = y; pitch = p; if (z) ZOOM = z;
    centreOv = c ? new THREE.Vector3(c[0], c[1], c[2]) : null; draw(); } };
fillPresets();
buildPanel();
buildSky();
applyPreset(Object.keys(G.PRESETS)[0]);
})();
</script>
