<!DOCTYPE html>
<!--
  CAGE5 — clone of CAGE4 (bubble-canopy / round-top variant) PLUS the
  COCKPIT CREW layer (_cage_crew.js): seats ported from the game's seat
  generator, procedural controls (stick / yoke / side stick, throttle as
  wall lever / dash push-pull / console quadrant, pedals, optional centre
  console) and the ATD-01 IK dummy from Downloads/mannequin_poser.html,
  auto-laced to the controls. Serve from repo root (launch: flydiy-node)
  and open /flyDiy/tools/_cage5.html.

  The cage template is read as METRES here — the dummy is the calibration
  instrument for sizing the aeroplane (eye point, head clearance and
  reach shortfalls print in the status line).
-->
<meta charset="utf-8">
<title>flyDiy — cage5, crew &amp; cockpit</title>
<style>
  :root{--bg:#12151a;--fg:#dfe6ee;--dim:#7d8996;--acc:#5db3ff;--grid:#242a33}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  header{padding:8px 12px;border-bottom:1px solid var(--grid);display:flex;
    gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:13px;margin:0}
  label{color:var(--dim);display:inline-flex;gap:5px;align-items:center}
  select,button{background:#1a1f27;color:var(--fg);border:1px solid var(--grid);
    padding:3px 8px;border-radius:4px;font:inherit}
  main{display:flex;height:calc(100vh - 40px)}
  #view{position:relative;flex:1;min-width:0}
  canvas{display:block;width:100%;height:100%}
  aside{border-left:1px solid var(--grid);overflow-y:auto;
    overflow-x:hidden;padding:10px;width:340px;flex:none;
    resize:horizontal;direction:rtl;min-width:240px;max-width:70vw}
  aside>*{direction:ltr}
  .r{display:flex;gap:6px;align-items:center;margin:5px 0;min-width:0}
  .r.wrap{flex-wrap:wrap}
  .r span.k{color:var(--dim);width:92px;flex:none;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .r select{min-width:60px;flex:1}
  .r button{flex:none}
  input[type=range]{flex:1;min-width:30px;accent-color:var(--acc)}
  .v{width:46px;flex:none;text-align:right;color:var(--acc)}
  .leg{display:flex;gap:5px;align-items:center;margin:3px 0}
  .sw{width:13px;height:13px;border-radius:3px;flex:none}
  #stat{position:absolute;left:10px;top:8px;color:var(--dim);z-index:2}
  h2{font-size:11px;color:var(--dim);margin:14px 0 4px;text-transform:uppercase}
  details{margin:8px 0;border:1px solid var(--grid);border-radius:5px;
    padding:2px 8px}
  details details{margin:6px 0;border-color:#1b2029}
  summary{cursor:pointer;color:var(--dim);font-size:11px;
    text-transform:uppercase;padding:4px 0}
</style>

<header>
  <h1>cage5 — crew &amp; cockpit</h1>
  <label>subsurf <select id="lvl">
    <option>0</option><option>1</option><option selected>2</option><option>3</option>
  </select></label>
  <label><input type="checkbox" id="cage"> cage</label>
  <label><input type="checkbox" id="wire"> wireframe</label>
  <label><input type="checkbox" id="color" checked> sections</label>
  <button id="resetBtn">reset</button>
  <button id="objBtn">export OBJ</button>
</header>

<main>
  <div id="view"><span id="stat"></span><canvas id="c"></canvas></div>
  <aside id="ui"></aside>
</main>

<script>
// Page-level DERIVED SELECTORS — one intent writes several raw params
// (the ride-along philosophy: high-level choice, derived details, manual
// override still possible afterwards in the sliders).
(() => {
  const CU = window.CAGE_UI, P = CU.P;
  const $g = sel => document.querySelector(`details[data-g="${sel}"]`);
  const mkSel = (host, label, opts, apply) => {
    if (!host) return;
    const d = document.createElement('div'); d.className = 'r';
    d.innerHTML = `<span class="k">${label}</span><select style="flex:1">` +
      opts.map(o => `<option>${o}</option>`).join('') + '</select>';
    host.querySelector('summary').after(d);
    d.querySelector('select').onchange = e => {
      apply(e.target.value); CU.syncSliders(); CU.build();
    };
  };
  // NOSE CONFIGURATION (user ruling 2026-08-18: two REAL options —
  // pusher / wing engines were hypothetical and are dropped). The
  // choice derives noseFinish + rear aperture + cap crease.
  mkSel($g('2 · engine'), 'configuration',
    ['engine nose-mounted', 'aero nose'], v => {
      if (v === 'engine nose-mounted') {
        P.noseFinish = 0; P.rearAperture = 0; P.crCap = 2;
      }
      if (v === 'aero nose') {
        P.noseFinish = 1; P.rearAperture = 0; P.crCap = 2;
      }
    });
  // SEATING STARTERS: template application — writes section values ONCE,
  // everything stays editable after (plays with the save system).
  // DECOUPLED from the crew layout (user 2026-08-19): the starter sizes
  // the CABIN, the seat layout is its own control — one intent per
  // slider, and you can put a tandem pair in a wide cabin if you want.
  // DOWNGRADED at the same time: the old widths came from the oversized
  // template (0.45 halfW = a 0.90 m cabin for a single-seater). These
  // are real light-aircraft cabins measured across the seats — Cub-class
  // 0.66 m for single/tandem, ~1.05 m side-by-side.
  const START = {
    'single':         { halfW: 0.33, roofHalfW: 0.26, pilotLen: 0.42,
                        paxCount: 0 },
    'tandem 2':       { halfW: 0.34, roofHalfW: 0.27, pilotLen: 0.42,
                        paxCount: 1, paxLen: 0.85 },
    'side-by-side 2': { halfW: 0.525, roofHalfW: 0.41,
                        pilotLen: 0.42, paxCount: 1, paxLen: 0.91 },
    'passenger':      { halfW: 0.55, roofHalfW: 0.43, pilotLen: 0.45,
                        paxCount: 3, paxLen: 0.95, boomLen: 4.6 },
  };
  mkSel($g('4 · cabin/dimensions'), 'starter',
    ['—'].concat(Object.keys(START)), v => {
      if (START[v]) Object.assign(P, START[v]);
    });
})();
</script>
