<!DOCTYPE html>
<!--
  ISLAND BENCH — the layers on the terrain, and trees sized by the canopy.

  ISLAND-ANNETTE.md ruled the world's inputs: elevation (IFSAR 5 m), class
  (WorldCover), canopy height (Meta/WRI 1 m), density (IFSAR radar), and one
  macro tint (Landsat, low weight, never sampled as colour). This is where
  they are LOOKED AT together before any of it goes near the game: every
  layer alone, then the composite with each one's weight on a slider, then
  trees planted from class x canopy around the camera, so the question
  "is the canopy layer good enough to size the trees" has a picture.

  The terrain is the baked quadtree asset (terrain_bake.js), drawn exactly as
  _terrain.html draws it; the layers are island_prep.py's raw grids, uploaded
  as textures and sampled by world position. Nothing here is the game's
  material (W1 is written once, in TSL); this is the calibration of what W1
  will be given.

  Serve from the repo root and open
  /flyDiy/tools/_island.html?asset=flyDiy/bench/terrain/jolene5_e2&grid=flyDiy/bench/jolene/dem
-->
<meta charset="utf-8">
<title>flyDiy — island bench</title>
<style>
  :root{--bg:#12151a;--fg:#dfe6ee;--dim:#7d8996;--acc:#5db3ff;--grid:#242a33}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  header{padding:8px 12px;border-bottom:1px solid var(--grid);display:flex;
    gap:12px;align-items:center;flex-wrap:wrap}
  h1{font-size:13px;margin:0}
  label{color:var(--dim);display:inline-flex;gap:5px;align-items:center}
  select,button,input[type=text]{background:#1a1f27;color:var(--fg);
    border:1px solid var(--grid);padding:3px 8px;border-radius:4px;font:inherit}
  button.on{border-color:var(--acc);color:var(--acc)}
  main{display:flex;height:calc(100vh - 41px)}
  #view{position:relative;flex:1;min-width:0}
  canvas{display:block;width:100%;height:100%}
  aside{border-left:1px solid var(--grid);overflow-y:auto;padding:10px;width:300px;flex:none}
  #stat{position:absolute;left:10px;top:8px;color:var(--dim);z-index:2;text-shadow:0 1px 3px #000;white-space:pre}
  h2{font-size:10px;color:var(--dim);margin:14px 0 5px;letter-spacing:.12em}
  table{border-collapse:collapse;width:100%;font-size:11px}
  td{padding:1px 0} td.n{text-align:right;color:var(--acc)}
  .row{display:flex;align-items:center;gap:6px;margin:3px 0}
  .row label{flex:1} .row input[type=range]{flex:2} .row output{width:44px;text-align:right;color:var(--acc)}
  .row input[type=color]{width:26px;height:18px;border:0;padding:0;background:none}
  .lay select{padding:1px 2px;font-size:10px;max-width:74px} .lay button{padding:0 4px;font-size:9px} .lay output{width:30px}
  .hint{color:var(--dim);font-size:10px;margin-top:8px;line-height:1.5}
  #probe{white-space:pre-wrap;color:var(--fg)}
</style>

<header>
  <h1>island bench</h1>
  <label>terrain <input type="text" id="asset" size="28"></label>
  <label>grid <input type="text" id="grid" size="22"></label>
  <button id="load">load</button>
  <label>paint <select id="paint">
    <option value="stack">the stack</option>
    <option value="class">class (smoothed)</option>
    <option value="tint">Landsat tint</option>
    <option value="radar">radar (ORI)</option>
    <option value="canopy">canopy height</option>
    <option value="shade">canopy shade (normalised)</option>
    <option value="ndvi">NDVI</option>
    <option value="height">height</option>
    <option value="snow">snow mask</option>
    <option value="normal">normal (radar bump)</option>
    <option value="bump">bump band (fine - coarse)</option>
    <option value="ttype">terrain type (the combined map)</option>
    <option value="splat">splat (the textures by terrain type)</option>
  </select></label>
  <button id="trees" class="on">trees</button>
  <button id="wire">wireframe</button>
  <button id="lod" class="on">distance LOD</button>
  <span id="msg" style="color:var(--dim)"></span>
</header>

<main>
  <div id="view"><span id="stat"></span><canvas id="c"></canvas></div>
  <aside id="ui"></aside>
</main>

<script src="../vendor/three.min.js"></script>
<script src="../src/core/19_terrain_codec.js"></script>
<script src="../src/core/28b_ground_fields.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
$('asset').value = P.get('asset') || 'flyDiy/bench/terrain/jolene5_e2';
$('grid').value = P.get('grid') || 'flyDiy/bench/jolene/dem';

// ---- the knobs (one table, the aside is generated from it) -----------------
const K = {
  reclass:    { label: 'tree->heath below canopy (m)', min: 0, max: 5, step: 0.5, v: 2.5 },
  classBlur:  { label: 'class contour blur (m)',   min: 0, max: 200, step: 5, v: 25 },
  edgeNoise:  { label: 'class edge wobble (m)',    min: 0, max: 60, step: 2, v: 0 },
  radarLevel: { label: 'radar colour level (0=raw)', min: 0, max: 4, step: 1, v: 1 },
  bumpFine:   { label: 'bump fine level',          min: 0, max: 3, step: 1, v: 1 },
  bumpCoarse: { label: 'bump coarse level',        min: 1, max: 4, step: 1, v: 4 },
  bump:       { label: 'radar bump strength',      min: 0, max: 3, step: 0.05, v: 0.2 },
  bumpScale:  { label: 'radar bump step (m)',      min: 10, max: 80, step: 5, v: 10 },
  bumpNear:   { label: 'bump fades in from (m)',   min: 0, max: 1500, step: 25, v: 150 },
  bumpFar:    { label: 'bump full by (m)',         min: 100, max: 4000, step: 50, v: 700 },
  shadeK:     { label: 'canopy shade depth',       min: 0, max: 1, step: 0.05, v: 0.45 },
  seaFade:    { label: 'sea shelf width (m)',      min: 50, max: 1000, step: 25, v: 350 },
  snow:       { label: 'snowline (m)',             min: 300, max: 1200, step: 10, v: 890 },
  sunAz:      { label: 'sun azimuth (deg)',        min: 0, max: 360, step: 5, v: 300 },
  sunEl:      { label: 'sun elevation (deg)',      min: 5, max: 80, step: 1, v: 40 },
  treeR:      { label: 'tree radius (km)',         min: 0.5, max: 6, step: 0.25, v: 2.25 },
  treeD:      { label: 'stems per 100 m2 (tree cover)', min: 0.2, max: 8, step: 0.2, v: 3 },
  treeS:      { label: 'tree height x',            min: 0.5, max: 2, step: 0.05, v: 1.0 },
  treeMin:    { label: 'min canopy (m)',           min: 0, max: 10, step: 0.5, v: 1 },
  cliffLo:    { label: 'cliff from slope (deg)',   min: 10, max: 60, step: 1, v: 32 },
  cliffHi:    { label: 'cliff full at (deg)',      min: 10, max: 70, step: 1, v: 42 },
  oldLo:      { label: 'old growth from canopy (m)', min: 2, max: 30, step: 0.5, v: 14 },
  oldHi:      { label: 'old growth full at (m)',   min: 2, max: 35, step: 0.5, v: 20 },
  denseLo:    { label: 'dense scrub from canopy (m)', min: 0, max: 5, step: 0.1, v: 1 },
  denseHi:    { label: 'dense scrub full at (m)',  min: 0, max: 6, step: 0.1, v: 2.5 },
  splatWobble:{ label: 'splat edge wobble (m)',    min: 0, max: 40, step: 1, v: 8 },
  splatBlend: { label: 'splat blend radius (cells)', min: 0.5, max: 3, step: 0.1, v: 1.6 },
  beachRot:   { label: 'beach pattern base angle (deg)', min: -180, max: 180, step: 5, v: 90 },   // 90: the pack's ripples run along its U axis; turned to lie along the shore (the user, 2026-09-20)
  triK:       { label: 'triplanar sharpness (0 = off)', min: 0, max: 16, step: 1, v: 6 },
  detailFrom: { label: 'detail fades from (m)',     min: 0, max: 2000, step: 25, v: 150 },
  detailTo:   { label: 'detail gone by (m)',        min: 50, max: 4000, step: 25, v: 900 },
  macroFrom:  { label: 'macro colour from (m)',     min: 0, max: 10000, step: 100, v: 800 },
  macroTo:    { label: 'macro colour full by (m)',  min: 100, max: 30000, step: 100, v: 6000 },
  macroMix:   { label: 'macro colour strength',     min: 0, max: 1, step: 0.05, v: 0.85 },
  macroNear:  { label: 'macro tint under the detail', min: 0, max: 1, step: 0.05, v: 0.25 },
  hDepth:     { label: 'height blend depth (1 = soft)', min: 0.02, max: 1, step: 0.02, v: 0.2 },
  hexOn:      { label: 'hex tiling (0 off, 1 on)',    min: 0, max: 1, step: 1, v: 1 },
  hexN:       { label: 'hex cells per tile',          min: 0.5, max: 6, step: 0.5, v: 2 },
  hexRot:     { label: 'hex rotation range (deg)',    min: 0, max: 180, step: 5, v: 180 },
  seamDepth:  { label: 'zone seam depth (1 = soft)',  min: 0.02, max: 1, step: 0.02, v: 0.45 },
  macroExp:   { label: 'macro exposure (x)',          min: 0.5, max: 5, step: 0.1, v: 2.2 },
  nrmK:       { label: 'normal map strength',         min: 0, max: 3, step: 0.05, v: 1 },
  specK:      { label: 'specular strength',           min: 0, max: 2, step: 0.05, v: 0.6 },
  pudCell:    { label: 'puddle field offset (m)',      min: 0, max: 400, step: 5, v: 0 },
  pudCover:   { label: 'puddle wet (the field)',      min: 0, max: 0.8, step: 0.01, v: 0.32 },
  pudEdge:    { label: 'puddle edge (noise units)',    min: 0.002, max: 0.05, step: 0.001, v: 0.01 },
  pudSlope:   { label: 'puddle field scale (x)',       min: 0.5, max: 8, step: 0.5, v: 3 },   // CODES[3].poolScale: the pool field read at x this - smaller pools
  lakeEdge:   { label: 'lake edge width (m)',          min: 0.2, max: 8, step: 0.2, v: 1 },
  para:       { label: 'parallax (m, x the code)',     min: 0, max: 1.5, step: 0.05, v: 0 },
  paraSteps:  { label: 'parallax steps',               min: 2, max: 24, step: 1, v: 10 },
};
// the eight class GROUPS the smooth weight fields carry, and which palette
// row colours each (40 cropland shares 50's colour; 70 snow is the snow layer)
const GROUPS = [10, 20, 30, 50, 60, 80, 90, 100];
// THE STACK — Photoshop's model: layers bottom to top, each a SOURCE drawn
// with a BLEND MODE at an OPACITY. The default stack is yesterday's composite.
// The recipe is what W1 will be handed; `export` prints it.
const SOURCES = ['class', 'tint', 'radar', 'canopy', 'shade', 'ndvi', 'height', 'snow', 'normal', 'bump', 'ttype', 'splat'];
const BLENDS = ['normal', 'multiply', 'screen', 'overlay', 'soft light', 'hard light',
                'darken', 'lighten', 'add', 'colour', 'luminosity', 'hue'];
// the user's recipe (2026-09-14, evening): the class is for the splat weights
// and the vegetation; the tint IS the colour; the radar is an overlay and the
// normals; the canopy, normalised, darkens the layers below (taller stands are
// the darker green); snow on top, over everything
let STACK = [
  { src: 'class',  mode: 'normal',     op: 1.0,  on: true },
  { src: 'tint',   mode: 'normal',     op: 1.0,  on: true },
  { src: 'radar',  mode: 'overlay',    op: 0.75, on: true },
  { src: 'shade',  mode: 'multiply',   op: 0.7,  on: true },
  { src: 'snow',   mode: 'normal',     op: 1.0,  on: true },
];
try { const saved = JSON.parse(localStorage.getItem('flydiy.island.stack.v2') || 'null'); if (saved && saved.length) STACK = saved; } catch (e) {}
const MAXL = 8;
// WorldCover class colours — the bench's palette, tuned by eye here first
const CLASSES = [
  [10, 'tree cover',   '#2f5a2c'], [20, 'shrubland',   '#7e8a44'],
  [30, 'grassland',    '#9aa75a'], [40, 'cropland',    '#b8a36a'],
  [50, 'built-up',     '#8a7d75'], [60, 'bare/sparse', '#8b8177'],
  [70, 'snow and ice', '#f2f4f8'], [80, 'water',       '#1f3b63'],
  [90, 'wetland',      '#6f8c6a'], [100,'moss/lichen', '#a3a06a'],
];

// THE TERRAIN TYPE (G405, island_prep's .ttype.u8): ONE map combined from
// class x NDVI x canopy x slope x coast - the splat weights and the spawning
// read THIS, not WorldCover. Eleven codes, painted flat here (no shore band,
// no sea override) so every cell shows its own code; `isolate` greys the rest.
const TTYPES = [
  [0, 'sea',    '#0e2a4a'], [1, 'lake',   '#2f6fb0'], [2, 'heath',  '#b9b45a'],
  [3, 'muskeg', '#7a6a3a'], [4, 'sand',   '#e8d9a0'], [5, 'scree',  '#a09a90'],
  [6, 'rock',   '#5e5a58'], [7, 'scrub',  '#7fa04c'], [8, 'forest', '#1f5a28'],
  [9, 'snow',   '#f4f6fa'], [10,'built',  '#d24a8a'],
  // DERIVED in the shader from the continuous fields, never in the map: the
  // rock's harshest slopes are the cliff, the forest's tallest canopy is old
  // growth, the scrub's tallest is dense. Smooth weights, on knobs (SPLITS).
  [11,'shingle', '#9a8f80'],   // the rocky beach - a MAP code (the prep's shore band, 2026-09-20)
  [12,'cliff',  '#3a3634'], [13,'forest old', '#0f3a18'], [14,'scrub dense', '#5a7c34'],
];
const NCODE = 17;   // 16 residential is a code now (2026-09-23); this is the arrays' width

// THE SPLAT: per effective code, up to THREE sets of the ground library mixed
// by a noise mask (Photoshop again: a mask with a cell size, a sharpness and a
// bias per pair), each set sampled in world metres over its own scale
// (default: the pack's reference). `orient: 'sea'` turns the set's V axis to
// face the sea (the beach's pattern), read off the coast SDF's gradient.
// A code with no set draws its palette colour. The library is assets/splat/
// (splat_tex_import.py) plus the lot's five (G290), all on the same contract.
// THE DEFAULT IS THE MODULE'S (src/core/28b_ground_fields.js RECIPE): one
// table for the bench and the game; the bench edits a copy and `export`
// prints it - paste it back into RECIPE to make it the default.
let SPLAT_DEFAULT = JSON.parse(JSON.stringify(GROUND_FIELDS.RECIPE.codes));
for (const k in GROUND_FIELDS.RECIPE.knobs) if (K[k]) K[k].v = GROUND_FIELDS.RECIPE.knobs[k];
let SPLAT = JSON.parse(JSON.stringify(SPLAT_DEFAULT));
try { const saved = JSON.parse(localStorage.getItem('flydiy.island.splat.v5') || 'null'); if (saved) SPLAT = saved; } catch (e) {}
// the library: filled by loadLibrary() - [{ key, metres, url, mean }] in layer order
let LIB = [];
// THE GRADE per set: { gain: '#rrggbb' (a multiplier), sat } - the sheet's
// numbers (tools/splat_sheet.py) say how far each set sits from its tier
// the first grades (the sheet, 2026-09-20 evening): dry paler than its
// heath, snowAir a dark blue-grey under a white macro, rockyB brown among
// greys, the marble cliff pink
const GRADE_DEFAULT = JSON.parse(JSON.stringify(GROUND_FIELDS.RECIPE.grade));
let GRADE = JSON.parse(JSON.stringify(GRADE_DEFAULT));
try { const sv = JSON.parse(localStorage.getItem('flydiy.island.grade.v2') || 'null'); if (sv) GRADE = sv; } catch (e) {}
function pushGrade() {
  LIB.forEach((l, i) => { const g = GRADE[l.key] || {}; const c = new THREE.Color(g.gain || '#ffffff');
    U.uGrade.value[i].set(c.r, c.g, c.b, g.sat === undefined ? 1 : g.sat); });
  try { localStorage.setItem('flydiy.island.grade.v2', JSON.stringify(GRADE)); } catch (e) {}
}
function libraryUi() {
  const el = $('libGrade'); if (!el) return;
  const hex = c => '#' + c.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
  el.innerHTML = LIB.map((l, i) => { const g = GRADE[l.key] || {};
    return `<div class="row"><span style="display:inline-block;width:18px;height:14px;background:${hex(l.mean || [128, 128, 128])};border:1px solid #000" title="mean ${(l.mean || []).map(Math.round).join(',')}"></span>` +
      `<label style="flex:1.4">${l.key} <span style="color:var(--dim)">${l.metres} m</span></label>` +
      `<input type="color" id="g_${i}" value="${g.gain || '#ffffff'}" title="gain (multiplier)">` +
      `<input type="range" id="gs_${i}" min="0" max="2" step="0.05" value="${g.sat === undefined ? 1 : g.sat}" style="flex:1" title="saturation"><output id="go_${i}">${g.sat === undefined ? 1 : g.sat}</output></div>`; }).join('') +
    `<div class="row"><button id="gReset">reset grades</button></div>`;
  LIB.forEach((l, i) => {
    $('g_' + i).oninput = e => { (GRADE[l.key] = GRADE[l.key] || {}).gain = e.target.value; pushGrade(); };
    $('gs_' + i).oninput = e => { (GRADE[l.key] = GRADE[l.key] || {}).sat = +e.target.value; $('go_' + i).textContent = e.target.value; pushGrade(); };
  });
  $('gReset').onclick = () => { GRADE = JSON.parse(JSON.stringify(GRADE_DEFAULT)); pushGrade(); libraryUi(); };
}

// ---- scene ---------------------------------------------------------------
const cv = $('c');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb6cc);
scene.fog = new THREE.Fog(0x9fb6cc, 15000, 60000);
const camera = new THREE.PerspectiveCamera(45, 1, 2, 150000);
const LU = Math.PI;
// r186 physical units: a Lambert crown sees sun/PI + hemisphere/PI; keep the sum near 1
scene.add(new THREE.HemisphereLight(0xdfe8f2, 0x33383f, 0.3 * LU));
const sun = new THREE.DirectionalLight(0xffffff, 0.75 * LU);
sun.position.set(-0.5, 0.8, 0.3); scene.add(sun);

let yaw = -0.7, pitch = 0.55, dist = 20000, drag = null;
const target = new THREE.Vector3(0, 0, 0);
function place() {
  camera.position.set(
    target.x + dist * Math.cos(pitch) * Math.sin(yaw),
    target.y + dist * Math.sin(pitch),
    target.z + dist * Math.cos(pitch) * Math.cos(yaw));
  camera.lookAt(target);
}
cv.addEventListener('pointerdown', e => drag = { x: e.clientX, y: e.clientY, b: e.button });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('pointerup', () => { if (drag) { drag = null; replantIfMoved(); } });
addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.b === 0) { yaw -= dx * 0.005; pitch = Math.max(0.02, Math.min(1.5, pitch + dy * 0.005)); }
  else { const k = dist * 0.0015;
         target.x -= (Math.cos(yaw) * dx - Math.sin(yaw) * dy) * k;
         target.z += (Math.sin(yaw) * dx + Math.cos(yaw) * dy) * k;
         if (H) target.y = Math.max(0, H(target.x, target.z)); }
  place();
});
// THE PROBE: the pointer's ray marched against the height sampler (no mesh
// raycast - the codec's H(x,z) IS the terrain), then the grid cell under the
// hit read from the raw layers: the terrain type, the cover class, the canopy.
let probeT = 0;
cv.addEventListener('pointermove', e => {
  if (drag || !H || !GRID) return;
  const now = performance.now(); if (now - probeT < 60) return; probeT = now;
  const r = cv.getBoundingClientRect();
  const nd = new THREE.Vector3((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height * 2 - 1), 0.5).unproject(camera);
  const d = nd.sub(camera.position).normalize(), o = camera.position;
  const g = (x, z) => Math.max(0, H(x, z));
  let hit = null, t0 = 0, step = Math.max(5, dist / 600);
  for (let t = step; t < 120000; t += step) {
    const x = o.x + d.x * t, z = o.z + d.z * t, y = o.y + d.y * t;
    if (y < g(x, z)) { let a = t0, b = t;   // bisect the last step
      for (let i = 0; i < 12; i++) { const m = (a + b) / 2; if (o.y + d.y * m < g(o.x + d.x * m, o.z + d.z * m)) b = m; else a = m; }
      hit = { x: o.x + d.x * b, z: o.z + d.z * b }; break; }
    t0 = t; if (y < -10 && d.y >= 0) break;
  }
  const el = $('probe'); if (!el) return;
  if (!hit) { el.textContent = '-'; return; }
  const i = Math.floor((hit.x - GRID.x0) / GRID.cell), j = Math.floor((hit.z - GRID.z0) / GRID.cell);
  if (i < 0 || j < 0 || i >= GRID.w || j >= GRID.h) { el.textContent = 'off the grid'; return; }
  const k = j * GRID.w + i, tt = L.ttype ? L.ttype[k] : -1, name = (TTYPES.find(c => c[0] === tt) || [])[1] || '?';
  const cls = L.cover ? L.cover[k] : -1, cn = (CLASSES.find(c => c[0] === cls) || [])[1] || '?';
  el.textContent = `x ${hit.x.toFixed(0)} z ${hit.z.toFixed(0)}  h ${g(hit.x, hit.z).toFixed(0)} m\n` +
    `type ${tt} ${name}  |  cover ${cls} ${cn}  |  canopy ${L.canopy ? L.canopy[k] : '?'} m  |  ndvi ${L.ndvi ? ((L.ndvi[k] / 127) - 1).toFixed(2) : '?'}`;
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.max(20, Math.min(90000, dist * (e.deltaY > 0 ? 1.12 : 0.89)));
  place(); rebuildIfLod();
}, { passive: false });
function resize() {
  const w = $('view').clientWidth, h = $('view').clientHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ---- the material: every layer, sampled by world position -----------------
const VS = `
  varying vec3 vW; varying vec3 vN;
  void main(){ vW = position; vN = normal; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const FS = `
  precision highp float;
  uniform sampler2D uCover, uCanopy, uOri, uNdvi, uTint, uW1, uW2, uOri1, uOri2, uOri3, uOri4, uCoast, uTtype, uLake;
  uniform vec3 uTCol[15]; uniform int uTOnly;   // the terrain-type palette (12 mapped + 3 derived); isolate one code (-1 = all)
  uniform highp sampler2DArray uSplat;           // the ground library, one layer per set (no default precision for arrays in ES3)
  uniform vec4 uMatA[15];                        // per code: three layer indices (-1 = none), w = orient (1 = face the sea)
  uniform vec4 uMatS[15];                        // per code: three scales (metres per repeat)
  uniform vec4 uMatM[15];                        // per code: mask cell (m), sharpness, bias A|B, bias C
  uniform vec4 uSplit;                           // cliff lo/hi (deg), old growth lo/hi (m)
  uniform vec4 uSplit2;                          // dense scrub lo/hi (m), splat wobble (m), blend width (cells)
  uniform float uBeachRot, uCodesOnly;

// ---- the asset + the grid --------------------------------------------------
async function gunzip(buf) {
  const ds = new DecompressionStream('gzip');
  return new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(ds)).arrayBuffer());
}
let ASSET = null, root = null, H = null, group = null, GRID = null, L = {};

// THE EFFECTIVE CLASS. WorldCover says "tree cover" on 20 % of cells where the
// canopy map says under 1 m - subalpine heath on the ridges, bog on the flats.
// Two layers disagreeing is information: tree cover without a canopy is
// reclassed to shrubland (heath), for the colour AND the planting. On a knob.
function effClass(k) {
  const c = L.cover[k];
  if (c === 10 && L.canopy && K.reclass.v > 0 && L.canopy[k] < K.reclass.v) return 20;
  return c;
}
function buildWeights() {
  const { w, h: gh } = GRID;
  const w1 = new Uint8Array(w * gh * 4), w2 = new Uint8Array(w * gh * 4);
  const slot = new Int8Array(256).fill(-1);
  GROUPS.forEach((g, i) => slot[g] = i); slot[40] = 3; slot[70] = -1;
  for (let k = 0; k < L.cover.length; k++) {
    const i = slot[effClass(k)]; if (i < 0) continue;
    if (i < 4) w1[k * 4 + i] = 255; else w2[k * 4 + i - 4] = 255;
  }
  const mk = d => { const t = new THREE.DataTexture(d, w, gh, THREE.RGBAFormat, THREE.UnsignedByteType);
    t.magFilter = t.minFilter = THREE.LinearFilter; t.generateMipmaps = false; t.needsUpdate = true; return t; };
  if (U.uW1.value !== blank) { U.uW1.value.dispose(); U.uW2.value.dispose(); }
  U.uW1.value = mk(w1); U.uW2.value = mk(w2);
}
function tex8(data, w, h, nearest) {
  const t = new THREE.DataTexture(data, w, h, THREE.RedFormat, THREE.UnsignedByteType);
  t.magFilter = t.minFilter = nearest ? THREE.NearestFilter : THREE.LinearFilter;
  t.generateMipmaps = false; t.needsUpdate = true; return t;
}
async function fetchU8(url) {
  const r = await fetch(url); if (!r.ok) return null;
  return new Uint8Array(await r.arrayBuffer());
}

async function load(asset, grid) {
  $('msg').textContent = 'loading…';
  const [h, t, b] = await Promise.all([
    fetch('../../' + asset + '.json').then(r => r.json()),
    fetch('../../' + asset + '.topo').then(r => r.arrayBuffer()),
    fetch('../../' + asset + '.bin').then(r => r.arrayBuffer()),
  ]);
  root = TERRAIN_CODEC.decodeRaw(h, new Uint8Array(t), await gunzip(b));
  ASSET = h; H = TERRAIN_CODEC.sampler(root, h);
  U.uHMax.value = Math.max(100, h.hMax || 1100);

  GRID = await fetch('../../' + grid + '.json').then(r => r.json());
  const { w, h: gh } = GRID;
  U.uBounds.value.set(GRID.x0, GRID.z0, w * GRID.cell, gh * GRID.cell); U.uCell.value = GRID.cell;
  const [cover, canopy, ori, ndvi, tint, o1, o2, o3, o4, coastU8, ttype, lake] = await Promise.all([
    fetchU8('../../' + grid + '.u8'), fetchU8('../../' + grid + '.canopy.u8'),
    fetchU8('../../' + grid + '.ori.u8'), fetchU8('../../' + grid + '.ndvi.u8'),
    fetchU8('../../' + grid + '.tint.rgb'),
    fetchU8('../../' + grid + '.ori1.u8'), fetchU8('../../' + grid + '.ori2.u8'),
    fetchU8('../../' + grid + '.ori3.u8'), fetchU8('../../' + grid + '.ori4.u8'), fetchU8('../../' + grid + '.coast.u8'),
    fetchU8('../../' + grid + '.ttype.u8'), fetchU8('../../' + grid + '.lake.u8')]);
  L = { cover, canopy, ori, ndvi, tint, ttype, lake };
  if (lake) { U.uLake.value = tex8(lake, w, gh, false); U.uLakeE.value.y = 1; }
  if (ttype) U.uTtype.value = tex8(ttype, w, gh, true);
  let has = 0;
  if (canopy) { U.uCanopy.value = tex8(canopy, w, gh, false); has |= 1; }
  if (cover) {
    U.uCover.value = tex8(cover, w, gh, true);
    // the eight weight fields: one-hot per EFFECTIVE class, LINEAR-filtered -
    // the smooth class field the contour blur samples. Built here, not in
    // prep: it is the class map's derivative (and the canopy's), not a source.
    buildWeights();
  }
  if (ori) { U.uOri.value = tex8(ori, w, gh, false); has |= 2; }
  [o1, o2, o3, o4].forEach((d, i) => { if (d) U['uOri' + (i + 1)].value = tex8(d, w, gh, false); else U['uOri' + (i + 1)].value = U.uOri.value; });
  if (coastU8) { U.uCoast.value = tex8(coastU8, w, gh, false); U.uHasCoast.value = 1; }
  if (GRID.layers && GRID.layers.canopy && GRID.layers.canopy.p90OverTreeCover) U.uCanP90.value = Math.max(4, GRID.layers.canopy.p90OverTreeCover);
  if (ndvi) { U.uNdvi.value = tex8(ndvi, w, gh, false); has |= 8; }
  if (tint) {
    const rgba = new Uint8Array(w * gh * 4);
    for (let i = 0, j = 0; i < tint.length; i += 3, j += 4) { rgba[j] = tint[i]; rgba[j+1] = tint[i+1]; rgba[j+2] = tint[i+2]; rgba[j+3] = 255; }
    const tt = new THREE.DataTexture(rgba, w, gh, THREE.RGBAFormat, THREE.UnsignedByteType);
    tt.magFilter = tt.minFilter = THREE.LinearFilter; tt.generateMipmaps = false; tt.needsUpdate = true;
    U.uTint.value = tt; has |= 4;
  }
  U.uHas.value = has;

  target.set((h.bounds.x0 + h.bounds.x1) / 2, 0, (h.bounds.z0 + h.bounds.z1) / 2);
  dist = h.side * 0.85; place();
  build(); plant();
  $('msg').textContent = '';
}

// ---- terrain -----------------------------------------------------------------
function drawnLeaves() {
  const out = [], useLod = $('lod').classList.contains('on');
  (function walk(n) {
    if (!n.kids) { out.push(n); return; }
    if (!useLod) { n.kids.forEach(walk); return; }
    const s = ASSET.side / (1 << n.d);
    const cx = ASSET.bounds.x0 + (n.ix + 0.5) * s, cz = ASSET.bounds.z0 + (n.iz + 0.5) * s;
    const d = Math.hypot(camera.position.x - cx, camera.position.z - cz);
    if (d > s * 6) out.push(n); else n.kids.forEach(walk);
  })(root);
  return out;
}
let IDX = null;
function build() {
  if (group) { group.traverse(o => { if (o.geometry) o.geometry.dispose(); }); scene.remove(group); }
  group = new THREE.Group(); scene.add(group);
  const N = ASSET.patch + 1, Pn = ASSET.patch;
  if (!IDX) { IDX = [];
    for (let j = 0; j < Pn; j++) for (let i = 0; i < Pn; i++) {
      const a = j * N + i; IDX.push(a, a + N, a + 1, a + 1, a + N, a + N + 1); } }
  const leaves = drawnLeaves(); let tris = 0;
  const wire = $('wire').classList.contains('on');
  for (const n of leaves) {
    const s = ASSET.side / (1 << n.d), step = s / Pn;
    const ox = ASSET.bounds.x0 + n.ix * s, oz = ASSET.bounds.z0 + n.iz * s;
    const pos = new Float32Array(N * N * 3);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const k = j * N + i; pos[k*3] = ox + i * step; pos[k*3+1] = n.h[k]; pos[k*3+2] = oz + j * step; }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setIndex(IDX); g.computeVertexNormals();
    tris += IDX.length / 3;
    group.add(new THREE.Mesh(g, wire ? MAT_WIRE : MAT));
  }
  STAT.patches = leaves.length; STAT.tris = tris; stat();
}
let lodTimer = null;
function rebuildIfLod() {
  if (!ASSET || !$('lod').classList.contains('on')) return;
  clearTimeout(lodTimer); lodTimer = setTimeout(build, 120);
}

// ---- trees: class says where, canopy says how tall ----------------------------
// A bench tree is a cone on a stem, instanced. What is being judged is the
// PLACEMENT and the SIZE the layers give, not the tree — the species and the
// models come from the tree ladder (TREE-IMPORT.md) once the sizing is trusted.
let TREES = null, plantedAt = new THREE.Vector3(1e9, 0, 1e9);
// per class, as a fraction of treeD (stems per 10 m cell in tree cover). Old
// growth here runs 300-1000 stems/ha = 3-10 per cell; the muskeg scrub far less.
const DENSITY = { 10: 1.0, 20: 0.4, 30: 0.2, 90: 0.15, 100: 0.06 };
const coneGeo = new THREE.ConeGeometry(1, 1, 6, 1); coneGeo.translate(0, 0.5, 0);
const stemGeo = new THREE.CylinderGeometry(0.06, 0.09, 1, 5); stemGeo.translate(0, 0.5, 0);
const treeMat = new THREE.MeshLambertMaterial({ color: 0xffffff, vertexColors: false });
const stemMat = new THREE.MeshLambertMaterial({ color: 0x4a3524 });
function plant() {
  if (TREES) { scene.remove(TREES); TREES.children.forEach(m => m.dispose()); TREES = null; }
  STAT.trees = 0;
  if (!GRID || !L.cover || !$('trees').classList.contains('on')) { stat(); return; }
  const { w, h, cell, x0, z0 } = GRID;
  const R = K.treeR.v * 1000, dens = K.treeD.v, hx = K.treeS.v, minC = K.treeMin.v;
  const ci0 = Math.max(0, Math.floor((target.x - R - x0) / cell)), ci1 = Math.min(w - 1, Math.ceil((target.x + R - x0) / cell));
  const cj0 = Math.max(0, Math.floor((target.z - R - z0) / cell)), cj1 = Math.min(h - 1, Math.ceil((target.z + R - z0) / cell));
  // one candidate per cell at full density; a cell is 10 m, a spruce crown ~5 m
  const MAX = 900000, out = [];
  let s = 1234567;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  outer:
  for (let j = cj0; j <= cj1; j++) for (let i = ci0; i <= ci1; i++) {
    if (out.length / 6 >= MAX) break outer;
    const k = j * w + i, cls = effClass(k);
    const d = (DENSITY[cls] || 0) * dens;
    if (d <= 0) continue;
    let can = L.canopy ? L.canopy[k] : 12;
    // heath: scattered krummholz, 1.5 m, at a third of the shrub density
    if (cls === 20 && can < minC) { if (rnd() > 0.35) continue; can = 1.5; }
    else if (can < minC) continue;
    const x = x0 + (i + 0.5) * cell, z = z0 + (j + 0.5) * cell;
    if ((x - target.x) ** 2 + (z - target.z) ** 2 > R * R) continue;
    // stems per cell: the class's share of treeD, thinned where the canopy
    // is short (scrub carries fewer, smaller stems - never none above minC)
    const n = d * Math.min(1, 0.35 + can / 12);
    for (let q = 0; q < n; q++) if (q < n - 1 || rnd() < n - q) {
      const px = x0 + (i + rnd()) * cell, pz = z0 + (j + rnd()) * cell;
      const y = H(px, pz);
      if (y <= 0.1) continue;
      const th = Math.max(1.2, can * (0.7 + 0.6 * rnd())) * hx;
      out.push(px, y, pz, th, cls, L.ndvi ? L.ndvi[k] : 200);
      if (out.length / 6 >= MAX) break;
    }
  }
  const count = out.length / 6;
  const crowns = new THREE.InstancedMesh(coneGeo, treeMat, count);
  const stems = new THREE.InstancedMesh(stemGeo, stemMat, count);
  const m = new THREE.Matrix4(), c = new THREE.Color();
  for (let t = 0; t < count; t++) {
    const x = out[t*6], y = out[t*6+1], z = out[t*6+2], th = out[t*6+3], cls = out[t*6+4], nd = out[t*6+5];
    const r = th * (cls === 10 ? 0.22 : 0.4);
    m.makeScale(r, th * 0.8, r); m.setPosition(x, y + th * 0.2, z); crowns.setMatrixAt(t, m);
    m.makeScale(r * 1.2, th * 0.25, r * 1.2); m.setPosition(x, y, z); stems.setMatrixAt(t, m);
    // colour: greener where NDVI says so, yellower on the muskeg scrub
    const g = Math.min(1, Math.max(0, (nd / 127 - 1)));
    c.setHSL(0.27 + 0.07 * g, 0.35 + 0.25 * g, 0.10 + 0.08 * (1 - g) + 0.04 * rnd());
    crowns.setColorAt(t, c);
  }
  crowns.instanceMatrix.needsUpdate = true; stems.instanceMatrix.needsUpdate = true;
  if (crowns.instanceColor) crowns.instanceColor.needsUpdate = true;
  TREES = new THREE.Group(); TREES.add(crowns, stems); scene.add(TREES);
  plantedAt.copy(target);
  STAT.trees = count; stat();
}
function replantIfMoved() {
  if (!GRID) return;
  if (target.distanceTo(plantedAt) > K.treeR.v * 300) plant();
}

      if (id === 'bumpFine') { U.uBumpFine.value = K[id].v | 0; if (K.bumpCoarse.v <= K[id].v) { K.bumpCoarse.v = K[id].v + 1; U.uBumpCoarse.value = K.bumpCoarse.v; $('k_bumpCoarse').value = K.bumpCoarse.v; $('o_bumpCoarse').textContent = K.bumpCoarse.v; } }
      if (id === 'bumpCoarse') { U.uBumpCoarse.value = K[id].v | 0; if (K.bumpFine.v >= K[id].v) { K.bumpFine.v = K[id].v - 1; U.uBumpFine.value = K.bumpFine.v; $('k_bumpFine').value = K.bumpFine.v; $('o_bumpFine').textContent = K.bumpFine.v; } } };
    el.onchange = () => { if (id.startsWith('tree')) plant(); if (id === 'reclass' && GRID) { buildWeights(); plant(); } };
  }
  CLASSES.forEach((c, i) => { $('c_' + i).oninput = e => U.uCol.value[i].set(e.target.value); });
  TTYPES.forEach((c, i) => { $('t_' + i).oninput = e => U.uTCol.value[i].set(e.target.value); });
  $('spCode').onchange = splatEdit; $('spCodes').onchange = e => U.uCodesOnly.value = e.target.checked ? 1 : 0;
  $('spReset').onclick = () => { localStorage.removeItem('flydiy.island.splat.v5'); SPLAT = JSON.parse(JSON.stringify(SPLAT_DEFAULT)); pushSplat(); splatEdit(); };
  $('spExport').onclick = () => { const t = $('recipe'); t.style.display = 'block';
    t.value = JSON.stringify({ splat: SPLAT, knobs: Object.fromEntries(['cliffLo', 'cliffHi', 'oldLo', 'oldHi', 'denseLo', 'denseHi', 'splatWobble', 'splatBlend', 'beachRot', 'detailFrom', 'detailTo', 'macroFrom', 'macroTo', 'macroMix', 'macroNear', 'macroExp', 'triK', 'hDepth', 'seamDepth', 'hexOn', 'hexN', 'hexRot', 'nrmK', 'specK', 'pudCell', 'pudCover', 'pudEdge', 'pudSlope', 'lakeEdge'].map(k => [k, K[k].v])), grade: GRADE }); t.select(); };
  splatEdit();
  $('tOnly').onchange = e => { U.uTOnly.value = +e.target.value; if ($('paint').value !== 'ttype') { $('paint').value = 'ttype'; $('paint').onchange(); } };
  $('replant').onclick = plant;
}
// the editor of ONE code's material: three sets (each a library key + its
// scale in metres), the mask's four numbers, the orientation
function splatEdit() {
  const code = +$('spCode').value;
  if (!SPLAT[code]) SPLAT[code] = { tex: [null, null, null], scale: [1, 1, 1], far: [null, null, null], farScale: [0, 0, 0], mix: [30, 1, 0, 0] };
  const m = SPLAT[code];
  if (!m.far) { m.far = [null, null, null]; m.farScale = [0, 0, 0]; }
  const opts = k => `<option value="">- none -</option>` + LIB.map(l => `<option value="${l.key}"${l.key === k ? ' selected' : ''}>${l.key} (${l.metres} m)</option>`).join('');
  const MIX = [['cell (m)', 2, 200, 1], ['sharpness', 0.1, 6, 0.1], ['bias A|B', -1, 1, 0.05], ['bias C', -1, 1, 0.05]];
  if (!m.vary) m.vary = [0, 0, 20];
  const VAR = [['hue swing (deg)', 0, 40, 1], ['value swing', 0, 0.6, 0.01], ['vary cell (m)', 2, 120, 1]];
  $('spEdit').innerHTML = [0, 1, 2].map(j =>
    `<div class="row"><label>near ${'ABC'[j]}</label><select id="spT${j}" style="flex:2">${opts(m.tex[j])}</select>` +
    `<input type="number" id="spS${j}" value="${m.scale[j] || ''}" step="0.5" min="0.1" style="width:52px" title="metres per repeat"></div>`).join('') +
    [0, 1, 2].map(j =>
    `<div class="row"><label>far ${'ABC'[j]}</label><select id="spF${j}" style="flex:2">${opts(m.far[j])}</select>` +
    `<input type="number" id="spFS${j}" value="${m.farScale[j] || ''}" step="0.5" min="0.1" style="width:52px" title="metres per repeat"></div>`).join('') +
    MIX.map(([l, lo, hi, st], j) => `<div class="row"><label>${l}</label><input type="range" id="spM${j}" min="${lo}" max="${hi}" step="${st}" value="${m.mix[j]}"><output id="spO${j}">${m.mix[j]}</output></div>`).join('') +
    VAR.map(([l, lo, hi, st], j) => `<div class="row"><label>${l}</label><input type="range" id="spV${j}" min="${lo}" max="${hi}" step="${st}" value="${m.vary[j]}"><output id="spVO${j}">${m.vary[j]}</output></div>`).join('') +
    `<div class="row"><label><input type="checkbox" id="spSea"${m.orient === 'sea' ? ' checked' : ''}> face the sea (V axis)</label></div>`;
  for (const j of [0, 1, 2]) {
    $('spT' + j).onchange = e => { m.tex[j] = e.target.value || null;
      const l = LIB.find(x => x.key === m.tex[j]); if (l) { m.scale[j] = l.metres; $('spS' + j).value = l.metres; } pushSplat(); };
    $('spS' + j).oninput = e => { m.scale[j] = +e.target.value || 1; pushSplat(); };
    $('spF' + j).onchange = e => { m.far[j] = e.target.value || null;
      const l = LIB.find(x => x.key === m.far[j]); if (l) { m.farScale[j] = l.metres; $('spFS' + j).value = l.metres; } pushSplat(); };
    $('spFS' + j).oninput = e => { m.farScale[j] = +e.target.value || 1; pushSplat(); };
  }
  MIX.forEach((_, j) => { $('spM' + j).oninput = e => { m.mix[j] = +e.target.value; $('spO' + j).textContent = e.target.value; pushSplat(); }; });
  VAR.forEach((_, j) => { $('spV' + j).oninput = e => { m.vary[j] = +e.target.value; $('spVO' + j).textContent = e.target.value; pushSplat(); }; });
  $('spSea').onchange = e => { m.orient = e.target.checked ? 'sea' : undefined; pushSplat(); };
}
function layerTable() {
  if (!GRID) return;
  const land = Object.entries(GRID.coverClasses || {}).filter(([k]) => k !== '0' && k !== '80').reduce((a, [, n]) => a + n, 0);
  CLASSES.forEach((c, i) => { const n = (GRID.coverClasses || {})[c[0]]; $('p_' + i).textContent = n && c[0] !== 80 ? (100 * n / land).toFixed(1) + '%' : ''; });
  const share = ((GRID.layers || {}).ttype || {}).shareOfLand || {};
  TTYPES.forEach((c, i) => { const v = share[c[1]]; $('q_' + i).textContent = v !== undefined ? v.toFixed(1) + '%' : (c[0] > 11 ? 'derived' : ''); });
  const rows = Object.entries(GRID.layers || {}).map(([k, v]) =>
    `<tr><td>${k}</td><td class="n">${v.source && typeof v.source === 'string' ? v.source : ''}${v.meanOverTreeCover !== undefined ? ' mean ' + v.meanOverTreeCover.toFixed(1) + ' m / p90 ' + (v.p90OverTreeCover||0).toFixed(1) : ''}${v.cloudCells !== undefined ? ' cloud ' + v.cloudCells + ' cells' : ''}</td></tr>`).join('');
  $('layers').innerHTML = `<tr><td>grid</td><td class="n">${GRID.w}×${GRID.h} @ ${GRID.cell} m</td></tr>` +
    `<tr><td>cover</td><td class="n">${GRID.cover ? 'WorldCover 10 m' : '—'}</td></tr>` + rows;
}
$('paint').onchange = () => { const v = $('paint').value; U.uMode.value = v === 'stack' ? 0 : 1 + SOURCES.indexOf(v); };
$('load').onclick = () => load($('asset').value, $('grid').value).then(layerTable).then(() => loadLibrary().then(splatEdit)).catch(e => {
  $('msg').textContent = 'failed: ' + e.message; console.error(e); });
for (const id of ['wire', 'lod']) $(id).onclick = () => { $(id).classList.toggle('on'); ASSET && build(); };
$('trees').onclick = () => { $('trees').classList.toggle('on'); plant(); };

ui(); resize(); place();
(function tick() { requestAnimationFrame(tick); renderer.render(scene, camera); })();
$('load').click();
</script>
