<!DOCTYPE html>
<!--
  ISLAND BENCH — the layers on the terrain, and trees sized by the canopy.

  ISLAND-ANNETTE.md ruled the world's inputs: elevation (IFSAR 5 m), class
  (WorldCover), canopy height (Meta/WRI 1 m), density (IFSAR radar), and one
  macro tint (Landsat, low weight, never sampled as colour). This is where
  they are LOOKED AT together before any of it goes near the game: every
  layer alone, then the composite with each one's weight on a slider, then
  trees planted from class x canopy around the camera, so the question
  "is the canopy layer good enough to size the trees" has a picture.

  The terrain is the baked quadtree asset (terrain_bake.js), drawn exactly as
  _terrain.html draws it; the layers are island_prep.py's raw grids, uploaded
  as textures and sampled by world position. Nothing here is the game's
  material (W1 is written once, in TSL); this is the calibration of what W1
  will be given.

  Serve from the repo root and open
  /flyDiy/tools/_island.html?asset=flyDiy/bench/terrain/jolene5_e2&grid=flyDiy/bench/jolene/dem
-->
<meta charset="utf-8">
<title>flyDiy — island bench</title>
<style>
  :root{--bg:#12151a;--fg:#dfe6ee;--dim:#7d8996;--acc:#5db3ff;--grid:#242a33}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  header{padding:8px 12px;border-bottom:1px solid var(--grid);display:flex;
    gap:12px;align-items:center;flex-wrap:wrap}
  h1{font-size:13px;margin:0}
  label{color:var(--dim);display:inline-flex;gap:5px;align-items:center}
  select,button,input[type=text]{background:#1a1f27;color:var(--fg);
    border:1px solid var(--grid);padding:3px 8px;border-radius:4px;font:inherit}
  button.on{border-color:var(--acc);color:var(--acc)}
  main{display:flex;height:calc(100vh - 41px)}
  #view{position:relative;flex:1;min-width:0}
  canvas{display:block;width:100%;height:100%}
  aside{border-left:1px solid var(--grid);overflow-y:auto;padding:10px;width:300px;flex:none}
  #stat{position:absolute;left:10px;top:8px;color:var(--dim);z-index:2;text-shadow:0 1px 3px #000;white-space:pre}
  h2{font-size:10px;color:var(--dim);margin:14px 0 5px;letter-spacing:.12em}
  table{border-collapse:collapse;width:100%;font-size:11px}
  td{padding:1px 0} td.n{text-align:right;color:var(--acc)}
  .row{display:flex;align-items:center;gap:6px;margin:3px 0}
  .row label{flex:1} .row input[type=range]{flex:2} .row output{width:44px;text-align:right;color:var(--acc)}
  .row input[type=color]{width:26px;height:18px;border:0;padding:0;background:none}
  .lay select{padding:1px 2px;font-size:10px;max-width:74px} .lay button{padding:0 4px;font-size:9px} .lay output{width:30px}
  .hint{color:var(--dim);font-size:10px;margin-top:8px;line-height:1.5}
</style>

<header>
  <h1>island bench</h1>
  <label>terrain <input type="text" id="asset" size="28"></label>
  <label>grid <input type="text" id="grid" size="22"></label>
  <button id="load">load</button>
  <label>paint <select id="paint">
    <option value="stack">the stack</option>
    <option value="class">class (smoothed)</option>
    <option value="tint">Landsat tint</option>
    <option value="radar">radar (ORI)</option>
    <option value="canopy">canopy height</option>
    <option value="shade">canopy shade (normalised)</option>
    <option value="ndvi">NDVI</option>
    <option value="height">height</option>
    <option value="snow">snow mask</option>
    <option value="normal">normal (radar bump)</option>
    <option value="bump">bump band (fine - coarse)</option>
  </select></label>
  <button id="trees" class="on">trees</button>
  <button id="wire">wireframe</button>
  <button id="lod" class="on">distance LOD</button>
  <span id="msg" style="color:var(--dim)"></span>
</header>

<main>
  <div id="view"><span id="stat"></span><canvas id="c"></canvas></div>
  <aside id="ui"></aside>
</main>

<script src="../vendor/three.min.js"></script>
<script src="../src/core/19_terrain_codec.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
$('asset').value = P.get('asset') || 'flyDiy/bench/terrain/jolene5_e2';
$('grid').value = P.get('grid') || 'flyDiy/bench/jolene/dem';

// ---- the knobs (one table, the aside is generated from it) -----------------
const K = {
  reclass:    { label: 'tree->heath below canopy (m)', min: 0, max: 5, step: 0.5, v: 2.5 },
  classBlur:  { label: 'class contour blur (m)',   min: 0, max: 200, step: 5, v: 25 },
  edgeNoise:  { label: 'class edge wobble (m)',    min: 0, max: 60, step: 2, v: 0 },
  radarLevel: { label: 'radar colour level (0=raw)', min: 0, max: 4, step: 1, v: 1 },
  bumpFine:   { label: 'bump fine level',          min: 0, max: 3, step: 1, v: 1 },
  bumpCoarse: { label: 'bump coarse level',        min: 1, max: 4, step: 1, v: 4 },
  bump:       { label: 'radar bump strength',      min: 0, max: 3, step: 0.05, v: 0.2 },
  bumpScale:  { label: 'radar bump step (m)',      min: 10, max: 80, step: 5, v: 10 },
  bumpNear:   { label: 'bump fades in from (m)',   min: 0, max: 1500, step: 25, v: 150 },
  bumpFar:    { label: 'bump full by (m)',         min: 100, max: 4000, step: 50, v: 700 },
  shadeK:     { label: 'canopy shade depth',       min: 0, max: 1, step: 0.05, v: 0.45 },
  seaFade:    { label: 'sea shelf width (m)',      min: 50, max: 1000, step: 25, v: 350 },
  snow:       { label: 'snowline (m)',             min: 300, max: 1200, step: 10, v: 890 },
  sunAz:      { label: 'sun azimuth (deg)',        min: 0, max: 360, step: 5, v: 300 },
  sunEl:      { label: 'sun elevation (deg)',      min: 5, max: 80, step: 1, v: 40 },
  treeR:      { label: 'tree radius (km)',         min: 0.5, max: 6, step: 0.25, v: 2.25 },
  treeD:      { label: 'stems per 100 m2 (tree cover)', min: 0.2, max: 8, step: 0.2, v: 3 },
  treeS:      { label: 'tree height x',            min: 0.5, max: 2, step: 0.05, v: 1.0 },
  treeMin:    { label: 'min canopy (m)',           min: 0, max: 10, step: 0.5, v: 1 },
};
// the eight class GROUPS the smooth weight fields carry, and which palette
// row colours each (40 cropland shares 50's colour; 70 snow is the snow layer)
const GROUPS = [10, 20, 30, 50, 60, 80, 90, 100];
// THE STACK — Photoshop's model: layers bottom to top, each a SOURCE drawn
// with a BLEND MODE at an OPACITY. The default stack is yesterday's composite.
// The recipe is what W1 will be handed; `export` prints it.
const SOURCES = ['class', 'tint', 'radar', 'canopy', 'shade', 'ndvi', 'height', 'snow', 'normal', 'bump'];
const BLENDS = ['normal', 'multiply', 'screen', 'overlay', 'soft light', 'hard light',
                'darken', 'lighten', 'add', 'colour', 'luminosity', 'hue'];
// the user's recipe (2026-09-14, evening): the class is for the splat weights
// and the vegetation; the tint IS the colour; the radar is an overlay and the
// normals; the canopy, normalised, darkens the layers below (taller stands are
// the darker green); snow on top, over everything
let STACK = [
  { src: 'class',  mode: 'normal',     op: 1.0,  on: true },
  { src: 'tint',   mode: 'normal',     op: 1.0,  on: true },
  { src: 'radar',  mode: 'overlay',    op: 0.75, on: true },
  { src: 'shade',  mode: 'multiply',   op: 0.7,  on: true },
  { src: 'snow',   mode: 'normal',     op: 1.0,  on: true },
];
try { const saved = JSON.parse(localStorage.getItem('flydiy.island.stack.v2') || 'null'); if (saved && saved.length) STACK = saved; } catch (e) {}
const MAXL = 8;
// WorldCover class colours — the bench's palette, tuned by eye here first
const CLASSES = [
  [10, 'tree cover',   '#2f5a2c'], [20, 'shrubland',   '#7e8a44'],
  [30, 'grassland',    '#9aa75a'], [40, 'cropland',    '#b8a36a'],
  [50, 'built-up',     '#8a7d75'], [60, 'bare/sparse', '#8b8177'],
  [70, 'snow and ice', '#f2f4f8'], [80, 'water',       '#1f3b63'],
  [90, 'wetland',      '#6f8c6a'], [100,'moss/lichen', '#a3a06a'],
];

// ---- scene ---------------------------------------------------------------
const cv = $('c');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb6cc);
scene.fog = new THREE.Fog(0x9fb6cc, 15000, 60000);
const camera = new THREE.PerspectiveCamera(45, 1, 2, 150000);
const LU = Math.PI;
// r186 physical units: a Lambert crown sees sun/PI + hemisphere/PI; keep the sum near 1
scene.add(new THREE.HemisphereLight(0xdfe8f2, 0x33383f, 0.3 * LU));
const sun = new THREE.DirectionalLight(0xffffff, 0.75 * LU);
sun.position.set(-0.5, 0.8, 0.3); scene.add(sun);

let yaw = -0.7, pitch = 0.55, dist = 20000, drag = null;
const target = new THREE.Vector3(0, 0, 0);
function place() {
  camera.position.set(
    target.x + dist * Math.cos(pitch) * Math.sin(yaw),
    target.y + dist * Math.sin(pitch),
    target.z + dist * Math.cos(pitch) * Math.cos(yaw));
  camera.lookAt(target);
}
cv.addEventListener('pointerdown', e => drag = { x: e.clientX, y: e.clientY, b: e.button });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('pointerup', () => { if (drag) { drag = null; replantIfMoved(); } });
addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.b === 0) { yaw -= dx * 0.005; pitch = Math.max(0.02, Math.min(1.5, pitch + dy * 0.005)); }
  else { const k = dist * 0.0015;
         target.x -= (Math.cos(yaw) * dx - Math.sin(yaw) * dy) * k;
         target.z += (Math.sin(yaw) * dx + Math.cos(yaw) * dy) * k;
         if (H) target.y = Math.max(0, H(target.x, target.z)); }
  place();
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.max(20, Math.min(90000, dist * (e.deltaY > 0 ? 1.12 : 0.89)));
  place(); rebuildIfLod();
}, { passive: false });
function resize() {
  const w = $('view').clientWidth, h = $('view').clientHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ---- the material: every layer, sampled by world position -----------------
const VS = `
  varying vec3 vW; varying vec3 vN;
  void main(){ vW = position; vN = normal; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const FS = `
  precision highp float;
  uniform sampler2D uCover, uCanopy, uOri, uNdvi, uTint, uW1, uW2, uOri1, uOri2, uOri3, uOri4, uCoast;
  uniform vec4 uBounds;            // x0, z0, w, h of the grid, world metres
  uniform float uCell;             // grid cell, metres
  uniform float uHas;              // bit 1 canopy, 2 ori, 4 tint, 8 ndvi
  uniform int uMode;               // 0 stack, else a solo source (1 + index into SOURCES)
  uniform float uSnow, uHMax, uBlur, uEdge, uBump, uBumpScale, uBumpNear, uBumpFar, uCanP90, uShadeK, uSeaFade, uHasCoast;
  uniform vec3 uCam;
  uniform int uRadarLevel, uBumpFine, uBumpCoarse;
  uniform vec3 uSun;
  uniform vec3 uCol[10]; uniform float uCls[10];
  uniform int uLN; uniform int uLSrc[8]; uniform int uLMode[8]; uniform float uLOp[8];
  varying vec3 vW; varying vec3 vN;

  // smooth value noise, for the edge wobble - continuous, unlike a per-cell hash
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float vnoise(vec2 p){
    vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
  }
  // CONTOUR SMOOTHING, done right: the class map is carried as eight
  // per-class WEIGHT FIELDS in two linearly-filtered textures. A blur of
  // weights is a smooth field by construction (a blur of nearest texels is
  // not, which is what the first version did). The sample point wobbles by
  // a smooth noise so boundaries stop following the grid.
  void weights(vec2 p, out vec4 a, out vec4 b){
    vec2 uv = (p - uBounds.xy) / uBounds.zw;
    a = texture2D(uW1, uv); b = texture2D(uW2, uv);
  }
  vec3 classSmooth(vec2 xz){
    vec2 p = xz;
    if (uEdge > 0.0) {
      vec2 q = xz / 45.0;
      p += (vec2(vnoise(q), vnoise(q + 31.0)) - 0.5) * 2.0 * uEdge;
    }
    vec4 wa, wb; weights(p, wa, wb);
    vec4 A = wa * 2.0, B = wb * 2.0; float wsum = 2.0;
    if (uBlur > 0.5) {
      for (int k = 0; k < 8; k++) {
        float an = float(k) * 0.7854; vec2 d = vec2(cos(an), sin(an));
        for (int r = 1; r <= 3; r++) {
          float w = r == 1 ? 1.0 : (r == 2 ? 0.6 : 0.3);
          weights(p + d * uBlur * float(r) * 0.4, wa, wb);
          A += wa * w; B += wb * w; wsum += w;
        }
      }
    }
    A /= wsum; B /= wsum;
    // GROUPS = 10,20,30,50,60,80,90,100 -> palette rows 0,1,2,4,5,7,8,9
    vec3 c = A.r * uCol[0] + A.g * uCol[1] + A.b * uCol[2] + A.a * uCol[4]
           + B.r * uCol[5] + B.g * uCol[7] + B.b * uCol[8] + B.a * uCol[9];
    float tot = A.r + A.g + A.b + A.a + B.r + B.g + B.b + B.a;
    return tot > 1e-3 ? c / tot : uCol[0];
  }
  float oriLevel(int l, vec2 uv){
    if (l <= 0) return texture2D(uOri, uv).r;
    if (l == 1) return texture2D(uOri1, uv).r;
    if (l == 2) return texture2D(uOri2, uv).r;
    if (l == 3) return texture2D(uOri3, uv).r;
    return texture2D(uOri4, uv).r;
  }
  // the band the bump keeps: fine level minus coarse level. The pyramid
  // levels are smooth, so their gradient is smooth - no texel weave.
  float band(vec2 uv){ return oriLevel(uBumpFine, uv) - oriLevel(uBumpCoarse, uv); }
  float luma(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
  vec3 blend(vec3 b, vec3 s, int mode){
    if (mode == 1) return b * s;
    if (mode == 2) return 1.0 - (1.0 - b) * (1.0 - s);
    if (mode == 3) return mix(2.0 * b * s, 1.0 - 2.0 * (1.0 - b) * (1.0 - s), step(0.5, b));
    if (mode == 4) return mix(b - (1.0 - 2.0 * s) * b * (1.0 - b), b + (2.0 * s - 1.0) * (sqrt(b) - b), step(0.5, s));
    if (mode == 5) return mix(2.0 * b * s, 1.0 - 2.0 * (1.0 - b) * (1.0 - s), step(0.5, s));
    if (mode == 6) return min(b, s);
    if (mode == 7) return max(b, s);
    if (mode == 8) return b + s;
    if (mode == 9) { float lb = luma(b), ls = max(luma(s), 1e-3); return s * (lb / ls); }
    if (mode == 10) { float lb = max(luma(b), 1e-3), ls = luma(s); return b * (ls / lb); }
    if (mode == 11) { float lb = luma(b), ls = max(luma(s), 1e-3); vec3 c = s * (lb / ls); return mix(vec3(lb), c, 0.7); }
    return s;
  }
  vec3 bumpNormal(vec3 n, vec2 uv){
    vec2 e = vec2(uBumpScale / uBounds.z, uBumpScale / uBounds.w);
    float l = band(uv - vec2(e.x, 0.0)), r = band(uv + vec2(e.x, 0.0));
    float d = band(uv - vec2(0.0, e.y)), u = band(uv + vec2(0.0, e.y));
    return normalize(n + vec3(-(r - l) * uBump * 8.0, 0.0, -(u - d) * uBump * 8.0));
  }
  vec3 source(int id, vec2 uv, vec3 n, float canopy, float ori, float ndvi, vec3 tint, out float alpha){
    alpha = 1.0;
    if (id == 0) return classSmooth(vW.xz);
    if (id == 1) return tint;
    if (id == 2) return vec3(ori);
    if (id == 3) return mix(vec3(0.60,0.55,0.43), vec3(0.08,0.43,0.12), clamp(canopy / 40.0, 0.0, 1.0));
    // the canopy NORMALISED (by its p90 over tree cover) as a neutral darkness:
    // multiply it under the colour and the tall stands go darker without a hue shift
    if (id == 4) return vec3(1.0 - uShadeK * clamp(canopy / uCanP90, 0.0, 1.2));
    if (id == 5) return mix(vec3(0.7,0.63,0.47), vec3(0.04,0.35,0.08), clamp(ndvi, 0.0, 1.0));
    if (id == 6) { float t = clamp(vW.y / uHMax, 0.0, 1.0);
      return mix(mix(vec3(0.16,0.42,0.18), vec3(0.72,0.66,0.45), min(1.0, t*1.6)), vec3(0.95), max(0.0, t-0.6)*2.5); }
    if (id == 7) { float north = 0.5 - 0.5 * n.z; float snowH = uSnow - 250.0 * north;   // north is -z: a north face has n.z < 0
      // snow sheds off steep ground (G409): full below 25 deg, none by 40
      alpha = smoothstep(snowH - 60.0, snowH + 60.0, vW.y) * (1.0 - smoothstep(0.436, 0.698, acos(clamp(n.y, 0.0, 1.0)))); return vec3(0.93, 0.95, 1.0); }
    if (id == 8) return n * 0.5 + 0.5;
    if (id == 9) return vec3(0.5 + band(uv) * 2.0);
    return vec3(1.0, 0.0, 1.0);
  }
  void main(){
    vec2 uv = (vW.xz - uBounds.xy) / uBounds.zw;
    float canopy = texture2D(uCanopy, uv).r * 255.0;
    float ori = oriLevel(uRadarLevel, uv);
    float ndvi = texture2D(uNdvi, uv).r * 2.0 - 1.0;
    vec3 tint = texture2D(uTint, uv).rgb;
    // THE COASTLINE IS A SIGNED DISTANCE, not the mesh's height: sampled
    // bilinearly it is a smooth curve through the 10 m cells. Positive inland.
    float sd = (texture2D(uCoast, uv).r * 255.0 - 128.0) * 4.0;
    bool sea = uHasCoast > 0.5 ? sd < 0.0 : vW.y < 0.05;
    vec3 n = normalize(vN);
    // the bank the DEM steps up at the shore flattens into a tidal flat
    if (uHasCoast > 0.5) n = normalize(mix(n, vec3(0.0, 1.0, 0.0), smoothstep(25.0, 0.0, abs(sd)) * 0.85));
    // the bump is a macro variation: it fades out as the camera comes down to
    // the ground, where the detail must come from W1's textures, not a 10 m radar
    float bumpW = smoothstep(uBumpNear, uBumpFar, distance(vW, uCam));
    if (uBump > 0.0 && bumpW > 0.0 && mod(uHas / 2.0, 2.0) >= 1.0 && !sea) n = normalize(mix(n, bumpNormal(n, uv), bumpW));
    float lambert = max(0.0, dot(n, uSun));
    float light = 0.45 + 0.7 * lambert;
    vec3 col; float alpha;
    if (uMode > 0) { col = source(uMode - 1, uv, n, canopy, ori, ndvi, tint, alpha); if (uMode - 1 == 8 || uMode - 1 == 9) light = 1.0; }
    else {
      col = vec3(0.5);
      for (int i = 0; i < 8; i++) {
        if (i >= uLN) break;
        vec3 s = source(uLSrc[i], uv, n, canopy, ori, ndvi, tint, alpha);
        col = mix(col, blend(col, s, uLMode[i]), uLOp[i] * alpha);
      }
    }
    if (sea) {
      // no bathymetry: the shelf deepens with the distance from the shore. The
      // shallows show the ground's own colour (the layers are extended past the
      // coastline) through a turquoise, the deep is the sea's blue.
      float deep = smoothstep(0.0, uSeaFade, -sd);
      // the seabed is sand and rock, lit by the radar's variation, seen through a turquoise
      vec3 bed = vec3(0.50, 0.46, 0.36) * (0.7 + 0.6 * ori);
      vec3 shallow = mix(bed, vec3(0.22, 0.45, 0.48), 0.55);
      col = mix(shallow, vec3(0.10, 0.21, 0.36), deep); light = 0.95;
      // the waterline: a thin pale lap where the sea meets the land
      col = mix(col, vec3(0.75, 0.8, 0.78), smoothstep(3.0, 0.0, -sd) * 0.35);
    } else {
      // the beach band: the first metres inland darken and dull toward the wet
      // a rocky shore is PALE: grey rock, the barnacle line, dry sand above the wet
      float shore = uHasCoast > 0.5 ? smoothstep(16.0, 0.0, sd) : 1.0 - smoothstep(0.0, 1.2, vW.y);
      vec3 rock = vec3(0.56, 0.54, 0.48) * (0.75 + 0.5 * ori);
      col = mix(col, rock, shore * 0.8);
      col = mix(col, rock * 0.78, smoothstep(2.5, 0.0, sd) * 0.5);   // the wet metre
    }
    gl_FragColor = vec4(col * light, 1.0);
  }`;

const U = {
  uCover: { value: null }, uCanopy: { value: null }, uOri: { value: null }, uNdvi: { value: null }, uTint: { value: null },
  uW1: { value: null }, uW2: { value: null }, uOri1: { value: null }, uOri2: { value: null }, uOri3: { value: null }, uOri4: { value: null },
  uRadarLevel: { value: K.radarLevel.v }, uBumpFine: { value: K.bumpFine.v }, uBumpCoarse: { value: K.bumpCoarse.v },
  uBounds: { value: new THREE.Vector4() }, uCell: { value: 10 }, uHas: { value: 0 }, uMode: { value: 0 },
  uSnow: { value: K.snow.v }, uHMax: { value: 1100 }, uBlur: { value: K.classBlur.v }, uEdge: { value: K.edgeNoise.v },
  uBump: { value: K.bump.v }, uBumpScale: { value: K.bumpScale.v }, uSun: { value: new THREE.Vector3() },
  uBumpNear: { value: K.bumpNear.v }, uBumpFar: { value: K.bumpFar.v }, uCanP90: { value: 15 }, uShadeK: { value: K.shadeK.v }, uSeaFade: { value: K.seaFade.v },
  uCam: { value: camera.position }, uCoast: { value: null }, uHasCoast: { value: 0 },

const blank = new THREE.DataTexture(new Uint8Array([0, 0, 0, 0]), 1, 1, THREE.RGBAFormat); blank.needsUpdate = true;

// ---- the asset + the grid --------------------------------------------------
async function gunzip(buf) {
  const ds = new DecompressionStream('gzip');
  return new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(ds)).arrayBuffer());
}
let ASSET = null, root = null, H = null, group = null, GRID = null, L = {};

// THE EFFECTIVE CLASS. WorldCover says "tree cover" on 20 % of cells where the
// canopy map says under 1 m - subalpine heath on the ridges, bog on the flats.
// Two layers disagreeing is information: tree cover without a canopy is
// reclassed to shrubland (heath), for the colour AND the planting. On a knob.
function effClass(k) {
  const c = L.cover[k];
  if (c === 10 && L.canopy && K.reclass.v > 0 && L.canopy[k] < K.reclass.v) return 20;
  return c;
}
function buildWeights() {
  const { w, h: gh } = GRID;
  const w1 = new Uint8Array(w * gh * 4), w2 = new Uint8Array(w * gh * 4);
  const slot = new Int8Array(256).fill(-1);
  GROUPS.forEach((g, i) => slot[g] = i); slot[40] = 3; slot[70] = -1;
  for (let k = 0; k < L.cover.length; k++) {
    const i = slot[effClass(k)]; if (i < 0) continue;
    if (i < 4) w1[k * 4 + i] = 255; else w2[k * 4 + i - 4] = 255;
  }
  const mk = d => { const t = new THREE.DataTexture(d, w, gh, THREE.RGBAFormat, THREE.UnsignedByteType);
    t.magFilter = t.minFilter = THREE.LinearFilter; t.generateMipmaps = false; t.needsUpdate = true; return t; };
  if (U.uW1.value !== blank) { U.uW1.value.dispose(); U.uW2.value.dispose(); }
  U.uW1.value = mk(w1); U.uW2.value = mk(w2);
}
function tex8(data, w, h, nearest) {
  const t = new THREE.DataTexture(data, w, h, THREE.RedFormat, THREE.UnsignedByteType);
  t.magFilter = t.minFilter = nearest ? THREE.NearestFilter : THREE.LinearFilter;
  t.generateMipmaps = false; t.needsUpdate = true; return t;
}
async function fetchU8(url) {
  const r = await fetch(url); if (!r.ok) return null;
  return new Uint8Array(await r.arrayBuffer());
}

async function load(asset, grid) {
  $('msg').textContent = 'loading…';
  const [h, t, b] = await Promise.all([
    fetch('../../' + asset + '.json').then(r => r.json()),
    fetch('../../' + asset + '.topo').then(r => r.arrayBuffer()),
    fetch('../../' + asset + '.bin').then(r => r.arrayBuffer()),
  ]);
  root = TERRAIN_CODEC.decodeRaw(h, new Uint8Array(t), await gunzip(b));
  ASSET = h; H = TERRAIN_CODEC.sampler(root, h);
  U.uHMax.value = Math.max(100, h.hMax || 1100);

  GRID = await fetch('../../' + grid + '.json').then(r => r.json());
  const { w, h: gh } = GRID;
  U.uBounds.value.set(GRID.x0, GRID.z0, w * GRID.cell, gh * GRID.cell); U.uCell.value = GRID.cell;
  const [cover, canopy, ori, ndvi, tint, o1, o2, o3, o4, coastU8] = await Promise.all([
    fetchU8('../../' + grid + '.u8'), fetchU8('../../' + grid + '.canopy.u8'),
    fetchU8('../../' + grid + '.ori.u8'), fetchU8('../../' + grid + '.ndvi.u8'),
    fetchU8('../../' + grid + '.tint.rgb'),
    fetchU8('../../' + grid + '.ori1.u8'), fetchU8('../../' + grid + '.ori2.u8'),
    fetchU8('../../' + grid + '.ori3.u8'), fetchU8('../../' + grid + '.ori4.u8'), fetchU8('../../' + grid + '.coast.u8')]);
  L = { cover, canopy, ori, ndvi, tint };
  let has = 0;
  if (canopy) { U.uCanopy.value = tex8(canopy, w, gh, false); has |= 1; }
  if (cover) {
    U.uCover.value = tex8(cover, w, gh, true);
    // the eight weight fields: one-hot per EFFECTIVE class, LINEAR-filtered -
    // the smooth class field the contour blur samples. Built here, not in
    // prep: it is the class map's derivative (and the canopy's), not a source.
    buildWeights();
  }
  if (ori) { U.uOri.value = tex8(ori, w, gh, false); has |= 2; }
  [o1, o2, o3, o4].forEach((d, i) => { if (d) U['uOri' + (i + 1)].value = tex8(d, w, gh, false); else U['uOri' + (i + 1)].value = U.uOri.value; });
  if (coastU8) { U.uCoast.value = tex8(coastU8, w, gh, false); U.uHasCoast.value = 1; }
  if (GRID.layers && GRID.layers.canopy && GRID.layers.canopy.p90OverTreeCover) U.uCanP90.value = Math.max(4, GRID.layers.canopy.p90OverTreeCover);
  if (ndvi) { U.uNdvi.value = tex8(ndvi, w, gh, false); has |= 8; }
  if (tint) {
    const rgba = new Uint8Array(w * gh * 4);
    for (let i = 0, j = 0; i < tint.length; i += 3, j += 4) { rgba[j] = tint[i]; rgba[j+1] = tint[i+1]; rgba[j+2] = tint[i+2]; rgba[j+3] = 255; }
    const tt = new THREE.DataTexture(rgba, w, gh, THREE.RGBAFormat, THREE.UnsignedByteType);
    tt.magFilter = tt.minFilter = THREE.LinearFilter; tt.generateMipmaps = false; tt.needsUpdate = true;
    U.uTint.value = tt; has |= 4;
  }
  U.uHas.value = has;

  target.set((h.bounds.x0 + h.bounds.x1) / 2, 0, (h.bounds.z0 + h.bounds.z1) / 2);
  dist = h.side * 0.85; place();
  build(); plant();
  $('msg').textContent = '';
}

// ---- terrain -----------------------------------------------------------------
function drawnLeaves() {
  const out = [], useLod = $('lod').classList.contains('on');
  (function walk(n) {
    if (!n.kids) { out.push(n); return; }
    if (!useLod) { n.kids.forEach(walk); return; }
    const s = ASSET.side / (1 << n.d);
    const cx = ASSET.bounds.x0 + (n.ix + 0.5) * s, cz = ASSET.bounds.z0 + (n.iz + 0.5) * s;
    const d = Math.hypot(camera.position.x - cx, camera.position.z - cz);
    if (d > s * 6) out.push(n); else n.kids.forEach(walk);
  })(root);
  return out;
}
let IDX = null;
function build() {
  if (group) { group.traverse(o => { if (o.geometry) o.geometry.dispose(); }); scene.remove(group); }
  group = new THREE.Group(); scene.add(group);
  const N = ASSET.patch + 1, Pn = ASSET.patch;
  if (!IDX) { IDX = [];
    for (let j = 0; j < Pn; j++) for (let i = 0; i < Pn; i++) {
      const a = j * N + i; IDX.push(a, a + N, a + 1, a + 1, a + N, a + N + 1); } }
  const leaves = drawnLeaves(); let tris = 0;
  const wire = $('wire').classList.contains('on');
  for (const n of leaves) {
    const s = ASSET.side / (1 << n.d), step = s / Pn;
    const ox = ASSET.bounds.x0 + n.ix * s, oz = ASSET.bounds.z0 + n.iz * s;
    const pos = new Float32Array(N * N * 3);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const k = j * N + i; pos[k*3] = ox + i * step; pos[k*3+1] = n.h[k]; pos[k*3+2] = oz + j * step; }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setIndex(IDX); g.computeVertexNormals();
    tris += IDX.length / 3;
    group.add(new THREE.Mesh(g, wire ? MAT_WIRE : MAT));
  }
  STAT.patches = leaves.length; STAT.tris = tris; stat();
}
let lodTimer = null;
function rebuildIfLod() {
  if (!ASSET || !$('lod').classList.contains('on')) return;
  clearTimeout(lodTimer); lodTimer = setTimeout(build, 120);
}

// ---- trees: class says where, canopy says how tall ----------------------------
// A bench tree is a cone on a stem, instanced. What is being judged is the
// PLACEMENT and the SIZE the layers give, not the tree — the species and the
// models come from the tree ladder (TREE-IMPORT.md) once the sizing is trusted.
let TREES = null, plantedAt = new THREE.Vector3(1e9, 0, 1e9);
// per class, as a fraction of treeD (stems per 10 m cell in tree cover). Old
// growth here runs 300-1000 stems/ha = 3-10 per cell; the muskeg scrub far less.
const DENSITY = { 10: 1.0, 20: 0.4, 30: 0.2, 90: 0.15, 100: 0.06 };
const coneGeo = new THREE.ConeGeometry(1, 1, 6, 1); coneGeo.translate(0, 0.5, 0);
const stemGeo = new THREE.CylinderGeometry(0.06, 0.09, 1, 5); stemGeo.translate(0, 0.5, 0);

const stemMat = new THREE.MeshLambertMaterial({ color: 0x4a3524 });
function plant() {
  if (TREES) { scene.remove(TREES); TREES.children.forEach(m => m.dispose()); TREES = null; }
  STAT.trees = 0;
  if (!GRID || !L.cover || !$('trees').classList.contains('on')) { stat(); return; }
  const { w, h, cell, x0, z0 } = GRID;
  const R = K.treeR.v * 1000, dens = K.treeD.v, hx = K.treeS.v, minC = K.treeMin.v;
  const ci0 = Math.max(0, Math.floor((target.x - R - x0) / cell)), ci1 = Math.min(w - 1, Math.ceil((target.x + R - x0) / cell));
  const cj0 = Math.max(0, Math.floor((target.z - R - z0) / cell)), cj1 = Math.min(h - 1, Math.ceil((target.z + R - z0) / cell));
  // one candidate per cell at full density; a cell is 10 m, a spruce crown ~5 m
  const MAX = 900000, out = [];
  let s = 1234567;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  outer:
  for (let j = cj0; j <= cj1; j++) for (let i = ci0; i <= ci1; i++) {
    if (out.length / 6 >= MAX) break outer;
    const k = j * w + i, cls = effClass(k);
    const d = (DENSITY[cls] || 0) * dens;
    if (d <= 0) continue;
    let can = L.canopy ? L.canopy[k] : 12;
    // heath: scattered krummholz, 1.5 m, at a third of the shrub density
    if (cls === 20 && can < minC) { if (rnd() > 0.35) continue; can = 1.5; }
    else if (can < minC) continue;
    const x = x0 + (i + 0.5) * cell, z = z0 + (j + 0.5) * cell;
    if ((x - target.x) ** 2 + (z - target.z) ** 2 > R * R) continue;
    // stems per cell: the class's share of treeD, thinned where the canopy
    // is short (scrub carries fewer, smaller stems - never none above minC)
    const n = d * Math.min(1, 0.35 + can / 12);
    for (let q = 0; q < n; q++) if (q < n - 1 || rnd() < n - q) {
      const px = x0 + (i + rnd()) * cell, pz = z0 + (j + rnd()) * cell;
      const y = H(px, pz);
      if (y <= 0.1) continue;
      const th = Math.max(1.2, can * (0.7 + 0.6 * rnd())) * hx;
      out.push(px, y, pz, th, cls, L.ndvi ? L.ndvi[k] : 200);
      if (out.length / 6 >= MAX) break;
    }

  const stems = new THREE.InstancedMesh(stemGeo, stemMat, count);
  const m = new THREE.Matrix4(), c = new THREE.Color();
  for (let t = 0; t < count; t++) {

    const r = th * (cls === 10 ? 0.22 : 0.4);
    m.makeScale(r, th * 0.8, r); m.setPosition(x, y + th * 0.2, z); crowns.setMatrixAt(t, m);
    m.makeScale(r * 1.2, th * 0.25, r * 1.2); m.setPosition(x, y, z); stems.setMatrixAt(t, m);
    // colour: greener where NDVI says so, yellower on the muskeg scrub
    const g = Math.min(1, Math.max(0, (nd / 127 - 1)));
    c.setHSL(0.27 + 0.07 * g, 0.35 + 0.25 * g, 0.10 + 0.08 * (1 - g) + 0.04 * rnd());
    crowns.setColorAt(t, c);
  }
  crowns.instanceMatrix.needsUpdate = true; stems.instanceMatrix.needsUpdate = true;
  if (crowns.instanceColor) crowns.instanceColor.needsUpdate = true;
  TREES = new THREE.Group(); TREES.add(crowns, stems); scene.add(TREES);
  plantedAt.copy(target);
  STAT.trees = count; stat();
}
function replantIfMoved() {
