<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a listening desk. One sticky transport bar on top, then a single column of takes, each a row you
   play, judge (keep / maybe / no) and annotate. Placard-style condensed labels, as on an aeroplane's panel. */
:root {
  --bg: #eef1f2;
  --panel: #ffffff;
  --ink: #17232b;
  --muted: #5b6b74;
  --line: #d4dbde;
  --accent: #0f6f7c;      /* spruce teal */
  --accent-ink: #ffffff;
  --keep: #2f7d4a;
  --maybe: #a86b00;
  --no: #a23b3b;
  --chip: #e2e8ea;
  --playing: #e6f2f3;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11181c; --panel: #182227; --ink: #e3eaed; --muted: #93a3ab; --line: #2a373e;
  --accent: #4fb3bf; --accent-ink: #0b1215; --keep: #6cc38b; --maybe: #e0a63c; --no: #e07a7a;
  --chip: #23303600; --chip: #233036; --playing: #1d3036; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11181c; --panel: #182227; --ink: #e3eaed; --muted: #93a3ab; --line: #2a373e;
  --accent: #4fb3bf; --accent-ink: #0b1215; --keep: #6cc38b; --maybe: #e0a63c; --no: #e07a7a;
  --chip: #233036; --playing: #1d3036; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line); padding-block: 12px; display: grid; gap: 10px; }
h1 { font: 700 28px/1.05 var(--display); letter-spacing: .02em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin: 0; max-width: 70ch; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.count { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; display: flex; gap: 12px; flex-wrap: wrap; }
.count b { font-weight: 500; }
.count .k { color: var(--keep); } .count .m { color: var(--maybe); } .count .n { color: var(--no); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: inherit; color: inherit; cursor: pointer; }
.chip { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 3px 10px;
  font: 600 12px var(--display); letter-spacing: .06em; text-transform: uppercase; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip:focus-visible, .v:focus-visible, .play:focus-visible, textarea:focus-visible, .ctx:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.transport { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.transport label { display: inline-flex; gap: 6px; align-items: center; }
.kbd { font: 12px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
.notice { font-size: 13px; color: var(--maybe); }

ol.takes { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
li.take { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; }
li.take.playing { background: var(--playing); border-color: var(--accent); }
li.take[data-v="keep"] { box-shadow: inset 4px 0 0 var(--keep); }
li.take[data-v="maybe"] { box-shadow: inset 4px 0 0 var(--maybe); }
li.take[data-v="no"] { box-shadow: inset 4px 0 0 var(--no); opacity: .72; }
.play { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--accent); background: transparent;
  color: var(--accent); display: grid; place-items: center; }
.play svg { width: 16px; height: 16px; fill: currentColor; }
li.take.playing .play { background: var(--accent); color: var(--accent-ink); }
.meta { min-width: 0; }
.t { font-weight: 600; overflow-wrap: anywhere; }
.who { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.who a { color: inherit; }
.data { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.verdict { display: flex; gap: 4px; }
.v { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 5px 10px;
  font: 600 13px var(--display); letter-spacing: .06em; text-transform: uppercase; }
.v.keep[aria-pressed="true"] { background: var(--keep); border-color: var(--keep); color: var(--panel); }
.v.maybe[aria-pressed="true"] { background: var(--maybe); border-color: var(--maybe); color: var(--panel); }
.v.no[aria-pressed="true"] { background: var(--no); border-color: var(--no); color: var(--panel); }
.extra { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ctx { border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 2px 9px; font-size: 12px; }
.ctx[aria-pressed="true"] { border-style: solid; border-color: var(--accent); color: var(--accent); }
textarea { flex: 1 1 220px; min-width: 0; font: 13px var(--body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; resize: vertical; min-height: 30px; }
.empty { color: var(--muted); padding: 24px 0; }
@media (max-width: 560px) {
  li.take { grid-template-columns: auto minmax(0, 1fr); }
  .verdict { grid-column: 1 / 3; }
  .extra { grid-column: 1 / 3; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>__TITLE__</h1>
      <p class="sub">__INTRO__</p>
    </div>
    <div class="bar">
      <div class="count" id="count" aria-live="polite"></div>
    </div>
    <div class="chips" id="filters" role="group" aria-label="Filter"></div>
    <div class="transport">
      <label><input type="checkbox" id="auto" checked> play the next one when a take ends</label>
      <span><span class="kbd">space</span> play/pause · <span class="kbd">↓</span><span class="kbd">↑</span> next/previous · <span class="kbd">1</span> <span class="kbd">2</span> <span class="kbd">3</span> verdict</span>
      <span class="notice" id="notice" hidden></span>
    </div>
  </header>
  <ol class="takes" id="takes"><li class="empty">Loading the takes…</li></ol>
</div>
<audio id="player" preload="none"></audio>

<script>
const BOARD = "__BOARD__";
const CONTEXTS = __CONTEXTS__;
const LABELS = __LABELS__;   // what keep / maybe / no read as on this board
let items = [], picks = {}, filter = "all", current = -1, db = null, saveTimers = {};
const $ = id => document.getElementById(id);
const player = $("player");
const PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>';
const PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>';

function fmtDur(s) { if (!s && s !== 0) return ""; const m = Math.floor(s / 60), r = Math.round(s % 60); return m + ":" + String(r).padStart(2, "0"); }
function keyOf(it) { return BOARD + "_" + it.id; }
function tagsOf(it) { return BOARD === "music" ? [it.artist] : (it.tags || []).map(t => t.split(".")[0] === "amb" ? t : t.split(".")[0]); }

function visible() {
  return items.filter(it => {
    const p = picks[keyOf(it)] || {};
    if (filter === "all") return true;
    if (filter === "unjudged") return !p.verdict;
    if (["keep", "maybe", "no"].includes(filter)) return p.verdict === filter;
    return tagsOf(it).includes(filter);
  });
}

function renderCounts() {
  const c = { keep: 0, maybe: 0, no: 0 };
  for (const it of items) { const v = (picks[keyOf(it)] || {}).verdict; if (v) c[v]++; }
  const left = items.length - c.keep - c.maybe - c.no;
  $("count").innerHTML = `<span>${items.length} takes</span><span class="k"><b>${c.keep}</b> ${LABELS[0].toLowerCase()}</span><span class="m"><b>${c.maybe}</b> ${LABELS[1].toLowerCase()}</span><span class="n"><b>${c.no}</b> ${LABELS[2].toLowerCase()}</span><span>${left} to hear</span>`;
}

function renderFilters() {
  const groups = new Map();
  for (const it of items) for (const t of tagsOf(it)) groups.set(t, (groups.get(t) || 0) + 1);
  const fixed = [["all", "All"], ["unjudged", "To hear"], ["keep", LABELS[0]], ["maybe", LABELS[1]], ["no", LABELS[2]]];
  const tags = [...groups.keys()].sort();
  const el = $("filters");
  el.innerHTML = "";
  for (const [k, label] of [...fixed, ...tags.map(t => [t, t])]) {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = label;
    b.setAttribute("aria-pressed", String(filter === k));
    b.onclick = () => { filter = k; renderFilters(); renderList(); };
    el.appendChild(b);
  }
}

function renderList() {
  const list = $("takes");
  const vis = visible();
  if (!vis.length) { list.innerHTML = '<li class="empty">Nothing here with this filter.</li>'; renderCounts(); return; }
  list.innerHTML = "";
  vis.forEach(it => {
    const p = picks[keyOf(it)] || {};
    const li = document.createElement("li");
    li.className = "take"; li.dataset.id = it.id; if (p.verdict) li.dataset.v = p.verdict;
    if (items[current] && items[current].id === it.id && !player.paused) li.classList.add("playing");
    const who = BOARD === "music"
      ? `${esc(it.artist)} · <i>${esc(it.album || "")}</i>`
      : `${esc(it.artist)} · ${esc((it.tags || []).join(", "))}`;
    li.innerHTML = `
      <button class="play" type="button" aria-label="Play ${esc(it.title)}">${li.classList.contains("playing") ? PAUSE : PLAY}</button>
      <div class="meta">
        <div class="t">${esc(it.title)}</div>
        <div class="who">${who} · <a href="${esc(it.page)}" target="_blank" rel="noopener">source</a></div>
        ${it.listen ? `<div class="who">Listen for: ${esc(it.listen)}</div>` : ""}
        <div class="data"><span>${fmtDur(it.durationS)} full</span><span>${it.lufs} LUFS</span><span>${esc(it.licence || "")}</span><span>#${it.id}</span></div>
      </div>
      <div class="verdict" role="group" aria-label="Verdict">
        <button type="button" class="v keep" aria-pressed="${p.verdict === "keep"}">${LABELS[0]}</button>
        <button type="button" class="v maybe" aria-pressed="${p.verdict === "maybe"}">${LABELS[1]}</button>
        <button type="button" class="v no" aria-pressed="${p.verdict === "no"}">${LABELS[2]}</button>
      </div>
      <div class="extra">
        ${CONTEXTS.map(c => `<button type="button" class="ctx" data-c="${c}" aria-pressed="${(p.ctx || []).includes(c)}">${c}</button>`).join("")}
        <textarea id="note_${it.id}" rows="1" placeholder="A note (what you hear, where it fits)">${esc(p.note || "")}</textarea>
      </div>`;
    li.querySelector(".play").onclick = () => toggle(it);
    li.querySelectorAll(".v").forEach(b => b.onclick = () => setVerdict(it, b.classList[1]));
    li.querySelectorAll(".ctx").forEach(b => b.onclick = () => toggleCtx(it, b.dataset.c));
    li.querySelector("textarea").onchange = e => save(it, { note: e.target.value.slice(0, 500) });
    list.appendChild(li);
  });
  renderCounts();
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function toggle(it) {
  const idx = items.indexOf(it);
  if (idx === current && !player.paused) { player.pause(); return; }
  if (idx !== current) { current = idx; player.src = it.file; }
  player.play().catch(() => {});
}
function step(d) {
  const vis = visible(); if (!vis.length) return;
  const pos = vis.findIndex(x => items[current] && x.id === items[current].id);
  const next = vis[Math.max(0, Math.min(vis.length - 1, pos + d))];
  if (next) { current = -1; toggle(next); scrollTo(next); }
}
function scrollTo(it) { const el = document.querySelector(`li.take[data-id="${it.id}"]`); if (el) el.scrollIntoView({ block: "center", behavior: "smooth" }); }
player.addEventListener("play", renderList);
player.addEventListener("pause", renderList);
player.addEventListener("ended", () => { if ($("auto").checked) step(1); else renderList(); });

function setVerdict(it, v) {
  const p = picks[keyOf(it)] || {};
  save(it, { verdict: p.verdict === v ? null : v });
}
function toggleCtx(it, c) {
  const p = picks[keyOf(it)] || {};
  const ctx = new Set(p.ctx || []); ctx.has(c) ? ctx.delete(c) : ctx.add(c);
  save(it, { ctx: [...ctx] });
}
function save(it, patch) {
  const k = keyOf(it);
  picks[k] = Object.assign({}, picks[k], patch, { id: it.id, board: BOARD, title: it.title });
  renderList();
  if (db) {
    clearTimeout(saveTimers[k]);
    saveTimers[k] = setTimeout(() => {
      db.collection("picks").doc(k).set(picks[k]).catch(() => notice("A pick could not be saved. Check that you are signed in and can edit this page."));
    }, 250);
  } else {
    try { localStorage.setItem("picks_" + BOARD, JSON.stringify(picks)); } catch (e) {}
  }
}
function notice(t) { const n = $("notice"); n.textContent = t; n.hidden = false; }

document.addEventListener("keydown", e => {
  if (e.target.matches("textarea, input")) return;
  if (e.key === " ") { e.preventDefault(); if (current >= 0) toggle(items[current]); else step(0); }
  else if (e.key === "ArrowDown") { e.preventDefault(); step(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); step(-1); }
  else if (["1", "2", "3"].includes(e.key) && current >= 0) setVerdict(items[current], ["keep", "maybe", "no"][+e.key - 1]);
});

(async () => {
  try { items = await (await fetch("index.json")).json(); }
  catch (e) { $("takes").innerHTML = '<li class="empty">The list of takes did not load. Reload the page.</li>'; return; }
  try { picks = JSON.parse(localStorage.getItem("picks_" + BOARD) || "{}"); } catch (e) {}
  renderFilters(); renderList();
  db = window.claude ? await window.claude.use("db") : null;
  if (!db) { notice("Your picks are kept in this browser only."); return; }
  db.collection("picks").onSnapshot(snap => {
    const fromDb = {};
    snap.docs.forEach(d => { const v = d.data(); if (v && v.board === BOARD) fromDb[d.id] = v; });
    picks = Object.assign({}, picks, fromDb);
    renderList();
  }, () => notice("Picks could not be loaded from the shared store; they are kept in this browser."));
})();
</script>
