<!DOCTYPE html>
<!--
  _pod_view.html - THE POD VIEWER (BELLY-POD-2, G3468): a mesh dump of the drawn aeroplane (tools/pod_shots.js writes it
  under tools/.joincache/podview/<key>.json + .bin, the cage frame: +x port, +y up, +z forward) drawn with three.js
  alone - no editor, no core - in a studio light, for quick stills of the belly pod on its aeroplane.
  ?scene=.joincache/podview/cub   &tint=1 (the pod in a flat test colour)   &cam=quarter
  window.POD_VIEW.cam(name | {yaw, pitch, dist, at:[x,y,z]}) frames and renders; .ready once the dump is drawn.
  Serve from the repo root (tools/_serve.js) and open /flyDiy/tools/_pod_view.html?scene=...
-->
<meta charset="utf-8">
<title>flyDiy - pod view</title>
<style>
  html,body{margin:0;height:100%;background:#d9dde2;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #lab{position:absolute;left:12px;top:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#39424d}
</style>
<div id="lab"></div>
<script src="../vendor/three.min.js"></script>
<script>
(async () => {
const Q = new URLSearchParams(location.search);
const base = Q.get('scene') || '.joincache/podview/cub';
const meta = await (await fetch(base + '.json')).json();
const bin = await (await fetch(base + '.bin')).arrayBuffer();
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9dde2);
// a studio environment for the metals and the gloss (a PMREM of a lit room: a soft sky over a grey floor, two panels)
{
  const env = new THREE.Scene(), g = new THREE.SphereGeometry(20, 32, 16), c = [];
  const P = g.attributes.position;
  for (let i = 0; i < P.count; i++) { const t = THREE.MathUtils.clamp(P.getY(i) / 20 * 0.5 + 0.5, 0, 1);
    const k = 0.35 + 0.65 * Math.pow(t, 0.8); c.push(k * 0.95, k * 0.97, k); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
  env.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  for (const [x, y, z, s] of [[8, 10, 6, 7], [-9, 6, -4, 5]]) {
    const p = new THREE.Mesh(new THREE.PlaneGeometry(s, s), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
    p.position.set(x, y, z); p.lookAt(0, 0, 0); env.add(p);
  }
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.04).texture;
}
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.02, 200);
const F32 = (o, n) => new Float32Array(bin, o, n), U32 = (o, n) => new Uint32Array(bin, o, n);
const box = new THREE.Box3(), podBox = new THREE.Box3();
const TINT = Q.get('tint') === '1', SINGLE = Q.get('single') === '1';   // single: the pod one-sided - an opening shows as a hole
for (const p of meta.parts) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(F32(p.pos, p.n * 3), 3));
  if (p.nor >= 0) g.setAttribute('normal', new THREE.BufferAttribute(F32(p.nor, p.n * 3), 3));
  if (p.idx >= 0) g.setIndex(new THREE.BufferAttribute(U32(p.idx, p.ni), 1));
  if (p.nor < 0) g.computeVertexNormals();
  const mats = p.col.map((c, mi) => {
    const pod = p.tag === 'pod' && mi === 0;          // (the moulding: the hardware keeps its own stainless and rubber)
    const m = new THREE.MeshStandardMaterial({
      color: pod && TINT ? 0x9fb7cf : new THREE.Color(c.c[0], c.c[1], c.c[2]),
      roughness: pod && TINT ? 0.45 : Math.max(0.25, c.r), metalness: pod && TINT ? 0 : c.mt,
      transparent: c.o < 1, opacity: c.o, side: pod && SINGLE ? THREE.FrontSide : c.side === 2 ? THREE.DoubleSide : THREE.FrontSide });
    return m;
  });
  for (const q of p.groups) g.addGroup(q.s, q.n, q.m);
  const mesh = new THREE.Mesh(g, mats.length > 1 ? mats : mats[0]);
  if (mats.length === 1) g.clearGroups();
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  g.computeBoundingBox(); box.union(g.boundingBox);
  if (p.tag === 'pod') podBox.union(g.boundingBox);
}
// the ground under the lowest point (the wheels), a soft shadow on it
const yG = box.min.y;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.22 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = yG; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(40, 80, 0xb8bec6, 0xc9ced4); grid.position.y = yG + 0.001; scene.add(grid);
scene.add(new THREE.HemisphereLight(0xf4f6fa, 0x8a8f96, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(6, 9, 5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
const sc = 7; Object.assign(key.shadow.camera, { left: -sc, right: sc, top: sc, bottom: -sc, near: 0.5, far: 40 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
scene.add(key); scene.add(key.target);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.6); fill.position.set(-5, -2, -4); scene.add(fill);
// the pod's centre (or the belly's, with no pod)
const C = new THREE.Vector3();
if (!podBox.isEmpty()) podBox.getCenter(C); else { box.getCenter(C); C.y = box.min.y + 0.45 * (box.max.y - box.min.y); }
const S = podBox.isEmpty() ? 2.2 : Math.max(1.6, podBox.max.z - podBox.min.z);
const CAMS = {
  quarter: { yaw: 0.80, pitch: -0.10, dist: 2.1 * S },
  side:    { yaw: Math.PI / 2, pitch: -0.03, dist: 2.2 * S },
  below:   { yaw: 0.55, pitch: -0.62, dist: 1.9 * S },
  aft:     { yaw: 2.35, pitch: -0.12, dist: 2.1 * S },
  front:   { yaw: 0.18, pitch: -0.10, dist: 2.2 * S },
  nose:    { yaw: 0.55, pitch: -0.22, dist: 1.0 * S, atF: -0.42 },
  noseLow: { yaw: 0.25, pitch: -0.45, dist: 0.8 * S, atF: -0.40 },
  noseTop: { yaw: 0.9, pitch: 0.12, dist: 0.55 * S, atF: -0.45 },
  profile: { yaw: Math.PI / 2, pitch: 0, dist: 1.9 * S, ortho: 1 },
  tail:    { yaw: 2.45, pitch: -0.18, dist: 1.0 * S, atF: 0.42 },
  door:    { yaw: Math.PI / 2 - 0.25, pitch: -0.12, dist: 0.95 * S, atF: 0 },
  whole:   { yaw: 0.85, pitch: 0.12, dist: 7.5, at: [box.getCenter(new THREE.Vector3()).x, box.getCenter(new THREE.Vector3()).y, box.getCenter(new THREE.Vector3()).z] },
};
function camTo(c) {
  const v = typeof c === 'string' ? CAMS[c] : c;
  const at = v.at ? new THREE.Vector3(...v.at) : v.atF != null ? C.clone().add(new THREE.Vector3(0, 0, -v.atF * S)) : C;
  // yaw 0 = from ahead (+z), PI/2 = from the port side (+x)
  cam.position.set(at.x + v.dist * Math.sin(v.yaw) * Math.cos(v.pitch), at.y + v.dist * Math.sin(v.pitch),
                   at.z + v.dist * Math.cos(v.yaw) * Math.cos(v.pitch));
  if (cam.position.y < yG + 0.03) cam.position.y = yG + 0.03;
  cam.lookAt(at);
  key.target.position.copy(at); key.position.copy(at).add(new THREE.Vector3(5, 9, 6));
  renderer.render(scene, cam);
  document.getElementById('lab').textContent = meta.key + (meta.pod ? '  pod ' + JSON.stringify(meta.pod) : '  (no pod)') +
    (meta.podInfo ? '   ' + meta.podInfo.R.len.toFixed(2) + ' x ' + (2 * meta.podInfo.R.hw).toFixed(2) + ' x ' + meta.podInfo.R.depth.toFixed(2) + ' m, ' +
     Math.round(meta.podInfo.R.litres) + ' L, ' + meta.podInfo.nt + ' tris' : '');
}
camTo(Q.get('cam') || 'quarter');
window.POD_VIEW = { ready: true, cam: camTo, scene, meta };
})();
</script>
