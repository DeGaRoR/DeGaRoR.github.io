<!DOCTYPE html>
<!--
  WEATHERING BENCH (G345) — the whole aeroplane, the game's own editor chain
  (cage8's script list verbatim, with src/viewer/aeroweather.js loaded BEFORE
  aeroskin.js as the game does), and a weathering panel over it: the four
  MACROS (age / flight / bush / rain), every fine layer as a PIN on its
  resolved strength with the derived value beside it, the palette and the
  knobs (the lab: deviations in localStorage, JSON export), the debug views,
  the camera presets, and the measurement.

  What to judge here, and the controls that judge it:
    - EXHAUST: soot leaves the real outlet and is blown aft — on the cowl,
      the flank and the belly alike (G70 could not reach the cowl). Debug 4
      paints the plume mask red.
    - MUD (bush only): what each wheel throws sits behind and above its own
      contact, as wide as its tyre, on the belly, the legs and the spats.
      Debug 4 paints it green.
    - INSECTS: forward faces only, denser low. Never on the glass by table.
    - CAVITY: dirt in the rivet flanks, tape edges and seams of the grammar
      (debug 2) and in the geometry's own grooves (debug 3, blue concave /
      red convex — the edge chips ride the red).
    - NO SHINY DIRT: debug 1 is the cover; wherever it is bright the surface
      must read matte and dielectric.
    - MEASURE: WX_BENCH.measure(layer) shoots the layer's own preset at pin 0
      and pin 1 off a render target and reports the changed pixels — a layer
      under 0.5 % is a FAIL (the G113.2 lesson: two renders that come back
      identical are an effect that is not there). measureAll() runs the table.

  Serve from the repo root (launch: flydiy-weather, port 8386) and open
  /flyDiy/tools/_weather.html.
-->
<meta charset="utf-8">
<title>flyDiy — weathering</title>
<style>
  :root{--bg:#12151a;--fg:#dfe6ee;--dim:#7d8996;--acc:#5db3ff;--grid:#242a33}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  header{padding:8px 12px;border-bottom:1px solid var(--grid);display:flex;
    gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:13px;margin:0}
  label{color:var(--dim);display:inline-flex;gap:5px;align-items:center}
  select,button{background:#1a1f27;color:var(--fg);border:1px solid var(--grid);
    padding:3px 8px;border-radius:4px;font:inherit}
  main{display:flex;height:calc(100vh - 40px)}
  #view{position:relative;flex:1;min-width:0}
  canvas{display:block;width:100%;height:100%}
  aside{border-left:1px solid var(--grid);overflow-y:auto;
    overflow-x:hidden;padding:10px;width:340px;flex:none;
    resize:horizontal;direction:rtl;min-width:240px;max-width:70vw}
  aside>*{direction:ltr}
  .r{display:flex;gap:6px;align-items:center;margin:5px 0;min-width:0}
  .r.wrap{flex-wrap:wrap}
  .r span.k{color:var(--dim);width:92px;flex:none;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .r select{min-width:60px;flex:1}
  .r button{flex:none}
  input[type=range]{flex:1;min-width:30px;accent-color:var(--acc)}
  .v{width:46px;flex:none;text-align:right;color:var(--acc)}
  .leg{display:flex;gap:5px;align-items:center;margin:3px 0}
  .sw{width:13px;height:13px;border-radius:3px;flex:none}
  #stat{position:absolute;left:10px;top:8px;color:var(--dim);z-index:2}
  h2{font-size:11px;color:var(--dim);margin:14px 0 4px;text-transform:uppercase}
  details{margin:8px 0;border:1px solid var(--grid);border-radius:5px;
    padding:2px 8px}
  details details{margin:6px 0;border-color:#1b2029}
  summary{cursor:pointer;color:var(--dim);font-size:11px;
    text-transform:uppercase;padding:4px 0}
  /* THE WEATHERING PANEL, over the view's left edge */
  #wx{position:absolute;left:10px;top:34px;bottom:10px;width:330px;z-index:3;
    overflow-y:auto;background:rgba(18,21,26,0.92);border:1px solid var(--grid);
    border-radius:6px;padding:8px 10px}
  #wx .r span.k{width:118px}
  #wx .d{width:40px;flex:none;text-align:right;color:var(--dim)}
  #wx .macro input[type=range]{accent-color:#ffb454}
  #wx .ok{color:#6fd08c} #wx .bad{color:#ff6b5a}
  #wx textarea{width:100%;height:90px;background:#0e1115;color:var(--fg);
    border:1px solid var(--grid);font:10px/1.3 ui-monospace,monospace}
  #wx table{border-collapse:collapse;width:100%;font-size:10px}
  #wx td{padding:1px 3px;border-bottom:1px solid #1b2029}
</style>
