<!DOCTYPE html>
<!--
  CAGE3 — the BUBBLE-CANOPY / round-top variant of the template cage.
  Throwaway, gitignored, not in MANIFEST. Serve from repo root (launch:
  flydiy-node) and open /flyDiy/tools/_cage3.html. _cage2.html is the
  faithful box template; this page drives the SAME generator with the
  top-shape mode on and Jodel-ish defaults.

  2026-08-17: this page previews the GAME PANEL — the curated slider tree
  agreed for the C5 swap (sections numbered per the target layout; 6 wings
  / 8 tail / 9 wheels are game-side and absent here). Macros retired, step
  fixed to crease (canonical), viewer state split into the always-open
  "view" group, frozen params corralled in "don't touch" (constants-to-be).
  Engine CONFIGURATION and seating STARTER selects derive the raw params.
-->
<meta charset="utf-8">
<title>flyDiy — cage3, bubble canopy</title>
<style>
  :root{--bg:#12151a;--fg:#dfe6ee;--dim:#7d8996;--acc:#5db3ff;--grid:#242a33}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  header{padding:8px 12px;border-bottom:1px solid var(--grid);display:flex;
    gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:13px;margin:0}
  label{color:var(--dim);display:inline-flex;gap:5px;align-items:center}
  select,button{background:#1a1f27;color:var(--fg);border:1px solid var(--grid);
    padding:3px 8px;border-radius:4px;font:inherit}
  main{display:flex;height:calc(100vh - 40px)}
  #view{position:relative;flex:1;min-width:0}
  canvas{display:block;width:100%;height:100%}
  aside{border-left:1px solid var(--grid);overflow:auto;padding:10px;
    width:300px;flex:none;resize:horizontal;direction:rtl;
    min-width:200px;max-width:60vw}
  aside>*{direction:ltr}
  .r{display:flex;gap:6px;align-items:center;margin:5px 0}
  .r span.k{color:var(--dim);width:92px;flex:none}
  input[type=range]{flex:1;accent-color:var(--acc)}
  .v{width:44px;text-align:right;color:var(--acc)}
  .leg{display:flex;gap:5px;align-items:center;margin:3px 0}
  .sw{width:13px;height:13px;border-radius:3px;flex:none}
  #stat{position:absolute;left:10px;top:8px;color:var(--dim);z-index:2}
  h2{font-size:11px;color:var(--dim);margin:14px 0 4px;text-transform:uppercase}
  details{margin:8px 0;border:1px solid var(--grid);border-radius:5px;
    padding:2px 8px}
  details details{margin:6px 0;border-color:#1b2029}
  summary{cursor:pointer;color:var(--dim);font-size:11px;
    text-transform:uppercase;padding:4px 0}
</style>

<header>
  <h1>cage3 — bubble canopy</h1>
  <label>subsurf <select id="lvl">
    <option>0</option><option>1</option><option selected>2</option><option>3</option>
  </select></label>
  <label><input type="checkbox" id="cage"> cage</label>

  <button id="resetBtn">reset</button>

</header>

<main>

<script>
// Page-level DERIVED SELECTORS — one intent writes several raw params
// (the ride-along philosophy: high-level choice, derived details, manual
// override still possible afterwards in the sliders).
(() => {
  const CU = window.CAGE_UI, P = CU.P;
  const $g = sel => document.querySelector(`details[data-g="${sel}"]`);
  const mkSel = (host, label, opts, apply) => {
    if (!host) return;
    const d = document.createElement('div'); d.className = 'r';
    d.innerHTML = `<span class="k">${label}</span><select style="flex:1">` +
      opts.map(o => `<option>${o}</option>`).join('') + '</select>';
    host.querySelector('summary').after(d);
    d.querySelector('select').onchange = e => {
      apply(e.target.value); CU.syncSliders(); CU.build();
    };
  };
  // ENGINE CONFIGURATION (user design 2026-08-17): the choice derives
  // noseFinish, the rear aperture AND the cap crease — toggling the raw
  // rearAperture alone never changed the SHAPE (the cap style was always
  // carried by crCap; the pusher preset set both, the slider did not).
  mkSel($g('2 · engine'), 'configuration',
    ['nose engine', 'pusher', 'wing engines'], v => {
      if (v === 'nose engine') { P.noseFinish = 0; P.rearAperture = 0; P.crCap = 2; }
      if (v === 'pusher')      { P.noseFinish = 1; P.rearAperture = 1; P.crCap = 3; }
      if (v === 'wing engines'){ P.noseFinish = 1; P.rearAperture = 0; P.crCap = 2; }
    });
  // SEATING STARTERS: template application — writes section values ONCE,
  // everything stays editable after (plays with the save system). Values
  // are placeholders; tune via the log/exp buttons and paste back here.
  const START = {
    'single':         { halfW: 0.45, roofHalfW: 0.36, pilotLen: 0.42,
                        paxCount: 0 },
    'tandem 2':       { halfW: 0.45, roofHalfW: 0.36, pilotLen: 0.42,
                        paxCount: 1, paxLen: 0.85 },
    'side-by-side 2': { halfW: 0.554104, roofHalfW: 0.431009,
                        pilotLen: 0.42, paxCount: 1, paxLen: 0.91 },
    'passenger':      { halfW: 0.60, roofHalfW: 0.47, pilotLen: 0.45,
                        paxCount: 3, paxLen: 0.95, boomLen: 4.6 },
  };
  mkSel($g('4 · cabin/dimensions'), 'starter',
    ['—'].concat(Object.keys(START)), v => {
      if (START[v]) Object.assign(P, START[v]);
    });
})();
</script>
