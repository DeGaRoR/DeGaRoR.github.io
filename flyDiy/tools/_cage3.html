<!DOCTYPE html>
<!--
  CAGE3 — the BUBBLE-CANOPY / round-top variant of the template cage.
  Throwaway, gitignored, not in MANIFEST. Serve from repo root (launch:
  flydiy) and open /flyDiy/tools/_cage3.html. _cage2.html is the faithful
  box template; this page drives the SAME generator with the top-shape mode
  on and Jodel-ish defaults (near-semicircular top, glass canopy).

  Thin shell over _cage_ui.js + _cage_gen.js; step 'crease' (canonical) is
  the step-1 cage + edge crease weights — the guard-loop cluster that
  caused the A-pillar frown does not exist in that mode.
-->
<meta charset="utf-8">
<title>flyDiy — cage3, bubble canopy</title>
<style>
  :root{--bg:#12151a;--fg:#dfe6ee;--dim:#7d8996;--acc:#5db3ff;--grid:#242a33}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  header{padding:8px 12px;border-bottom:1px solid var(--grid);display:flex;
    gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:13px;margin:0}
  label{color:var(--dim);display:inline-flex;gap:5px;align-items:center}
  select,button{background:#1a1f27;color:var(--fg);border:1px solid var(--grid);
    padding:3px 8px;border-radius:4px;font:inherit}
  main{display:flex;height:calc(100vh - 40px)}
  #view{position:relative;flex:1;min-width:0}
  canvas{display:block;width:100%;height:100%}
  aside{border-left:1px solid var(--grid);overflow:auto;padding:10px;
    width:300px;flex:none;resize:horizontal;direction:rtl;
    min-width:200px;max-width:60vw}
  aside>*{direction:ltr}
  .r{display:flex;gap:6px;align-items:center;margin:5px 0}
  .r span.k{color:var(--dim);width:92px;flex:none}
  input[type=range]{flex:1;accent-color:var(--acc)}
  .v{width:44px;text-align:right;color:var(--acc)}
  .leg{display:flex;gap:5px;align-items:center;margin:3px 0}
  .sw{width:13px;height:13px;border-radius:3px;flex:none}
  #stat{position:absolute;left:10px;top:8px;color:var(--dim);z-index:2}
  h2{font-size:11px;color:var(--dim);margin:14px 0 4px;text-transform:uppercase}
  details{margin:8px 0;border:1px solid var(--grid);border-radius:5px;
    padding:2px 8px}
  summary{cursor:pointer;color:var(--dim);font-size:11px;
    text-transform:uppercase;padding:4px 0}
</style>

<header>
  <h1>cage3 — bubble canopy</h1>
  <label>step <select id="step">
    <option value="0">0 — zones</option>
    <option value="1">1 — pillars + rings</option>
    <option value="2">2 — guard loops (reference)</option>
    <option value="crease" selected>crease (canonical)</option>
  </select></label>
  <label>subsurf <select id="lvl">
    <option>0</option><option>1</option><option selected>2</option><option>3</option>
  </select></label>
  <label><input type="checkbox" id="cage"> cage</label>
  <label><input type="checkbox" id="wire"> wireframe</label>
  <label><input type="checkbox" id="color" checked> sections</label>
  <label><input type="checkbox" id="curv"> curvature</label>
  <label><input type="checkbox" id="refOn"> ghost ref</label>
  <label>ref α <input type="range" id="refA" min="0" max="1" step="0.05"
    value="0.5" style="width:60px"></label>
  <button id="resetBtn">reset</button>
  <button id="objBtn">export OBJ</button>
</header>

<main>
  <div id="view"><span id="stat"></span><canvas id="c"></canvas></div>
  <aside id="ui"></aside>
</main>

<script>
// Jodel-ish defaults: near-semicircular top, full roundness, glass canopy.
window.CAGE_PAGE = {
  defaultStep: 'crease',
  defaults: {
    pillarW: 0.10,           // all pillar bands equal at the cabin's width
    apilPerp: 1,             // window pillar: even PERPENDICULAR thickness
    intOn: 1,                // interior elements on (G13)
    // user's tuned jodel (2026-08-16 screenshots): box glazing (no
    // bubble, no skylight), short cockpit, deep aft belly, snub nose,
    // cut parts ON by default (G14)
    topRound: 1, bubble: 0, topAngCeil: 52, topAngRoof: 81, topComp: 1.03,
    roofY: 0.72, aftRoofY: 0.68, aftKeelY: -0.7, tailRoofY: 0.30,
    wsRun: 0.95, wsBaseBow: 0.45, wsCeilBow: 0.30,
    noseLen: 0.44, noseW: 0.90, pfW: 0.92, noseH: 1.07,
    noseCrown: 0.16, wsBaseLift: 0.05, cowlLoops: 0, cowlEase: 0.35,
    cowlBulge: 0.99,
    paxLen: 0.91, pilotLen: 0.42, waistY: 0.06,
    skylight: 0, cutParts: 1, explodeD: 1,
  },
  groups: [
    ['canopy', [
      ['topRound',  'roundness',     0.00, 1.00, 0.01],
      ['topAngCeil','ceil angle',    25, 70, 1],
      ['topAngRoof','roof angle',    55, 88, 1],
      ['topComp',   'CC comp',       1.00, 1.15, 0.005],
      ['bubble',    'bubble glass',  0, 1, 1],
      ['botRound',  'round bottom',  0.00, 1.00, 0.01],
    ]],
    ['round nose (base)', [
      ['noseCrown', 'deck crown',    0.00, 0.50, 0.005],
      ['wsBaseLift','w/s base lift', 0.00, 0.40, 0.005],
      ['noseH',     'nose depth x',  0.05, 1.20, 0.01],
      ['noseDroop', 'nose droop',   -0.20, 0.60, 0.005],
      ['noseFinish','aero finish',   0, 1, 1],
      ['cowlLoops', 'cowl loops',    0, 2, 1],
      ['cowlEase',  'cowl ease',     0.00, 1.00, 0.01],
      ['cowlBulge', 'cowl bulge',    0.85, 1.30, 0.005],
      ['crNoseCap', 'nose cap crease', 0, 3, 0.05],
    ]],
    ['config', [
      ['rearAperture','pusher tail', 0, 1, 1],
      ['boomMidOn', 'boom ring',     0, 1, 1],
      ['boomMidT',  'boom ring t',   0.1, 0.9, 0.01],
      ['boomMidPinch','boom pinch',  0.2, 1.4, 0.01],
    ]],
  ],
  // ONE PRIMITIVE (user ruling): only the default aircraft — everything
  // derives from here. The old bizjet/sailplane/pusher presets and the
  // aero-nose experiment group are retired from the UI (code kept).
  presets: { 'default': {} },
};
</script>
<script src="../vendor/three.min.js"></script>
<script src="_cage_gen.js"></script>
<script src="_cage_ui.js"></script>
