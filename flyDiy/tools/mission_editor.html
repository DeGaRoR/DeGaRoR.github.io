<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Editor</title>
<!--
  THE MISSION EDITOR (MISSIONS-P0, futureDesigns/MISSIONS-2026-10-25.md §5) - a DEV TOOL, pure UI, no 3D. It loads the
  game's own core (the LEAN set of tools/_missions_lib.js, below, in that order: GATE MISSIONS holds the list) so the
  editor and the game agree on every verdict and on the reward. Serve flyDiy/ (any static server) and open
  tools/mission_editor.html. Reads / writes a mission pack (src/missions/*.json): load a file or the built-in pack, edit,
  Save downloads the JSON (commit it under src/missions/). Nothing is written anywhere else; the browser keeps a draft.
  THE LOOK (the user, 27 Oct: "Dark theme ... meaningful names ... a passenger picker, and an interface that resembles
  the contract one for preview like in game"): the game's own editor tokens (src/viewer/editor.css --ed-*) and type, the
  map screen's contract card (src/viewer/map_menu.js mmRow / mmBody / mmWho) reproduced for the preview.
-->
<style>
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 100 700; font-display: swap; src: url(../vendor/fonts/plex-sans-var.woff2) format('woff2'); }
:root {
  --ed-panel:#201d1a; --ed-board:#1a1815; --ed-plate:rgba(32,29,26,.94);
  --ed-ink:#f4efe6; --ed-dim:#c0b8ac; --ed-faint:#97907f;
  --ed-acc:#e6dbc9; --ed-acc-ink:#221f1b; --ed-acc-soft:rgba(230,219,201,.14);
  --ed-hair:rgba(255,248,236,.09); --ed-border:rgba(255,248,236,.14);
  --ed-btn-bg:rgba(255,255,255,.06); --ed-btn-bd:rgba(255,255,255,.18);
  --ed-field:rgba(0,0,0,.28);
  --ed-warn:#d8a07a; --ed-bad:#e08a5a; --ed-ok:#9ccf9a;
  --t-cargo:#d99a3c; --t-pax:#4f9fd6; --t-survey:#6cbf8a; --t-build:#b58fd8; --t-other:#c0b8ac;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ed-board); color: var(--ed-ink); font: 400 13.5px/1.45 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; }
button, select, input, textarea { font: inherit; color: var(--ed-ink); }
::selection { background: var(--ed-acc-soft); }
/* ---- the top bar */
.top { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; background: var(--ed-panel); border-bottom: 1px solid var(--ed-hair); }
.brand { font: 600 12px/1 'IBM Plex Sans'; letter-spacing: .16em; text-transform: uppercase; color: var(--ed-faint); white-space: nowrap; }
.file { color: var(--ed-dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file b { color: var(--ed-ink); font-weight: 500; }
.grow { flex: 1; }
.btn { background: var(--ed-btn-bg); border: 1px solid var(--ed-btn-bd); border-radius: 7px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--ed-acc); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.pri { background: var(--ed-acc); color: var(--ed-acc-ink); border-color: var(--ed-acc); font-weight: 600; }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn.ghost { background: none; border-color: transparent; color: var(--ed-dim); }
.btn.ghost:hover { color: var(--ed-ink); border-color: var(--ed-btn-bd); }
.btn.danger:hover { border-color: var(--ed-bad); color: var(--ed-bad); }
.checks { font-size: 12.5px; white-space: nowrap; }
.ok { color: var(--ed-ok); } .bad { color: var(--ed-bad); } .warn { color: var(--ed-warn); } .dim { color: var(--ed-dim); } .faint { color: var(--ed-faint); }
/* ---- the three columns */
#main { display: grid; grid-template-columns: 300px minmax(420px, 1fr) 440px; height: calc(100% - 52px); }
@media (max-width: 1200px) { #main { grid-template-columns: 1fr; height: auto; } }
#tree { background: var(--ed-panel); border-right: 1px solid var(--ed-hair); overflow: auto; padding: 8px 0 16px; }
#form { overflow: auto; padding: 18px 22px 40px; }
#side { background: var(--ed-panel); border-left: 1px solid var(--ed-hair); overflow: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 10px; }
.colHead { font: 600 10.5px/1 'IBM Plex Sans'; letter-spacing: .14em; text-transform: uppercase; color: var(--ed-faint); padding: 8px 14px 6px; display: flex; align-items: center; gap: 8px; }
#side .colHead { padding: 4px 0 0; }
/* ---- the tree */
.tn { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 3px 10px 3px 0; cursor: pointer; border-left: 2px solid transparent; }
.tn:hover { background: rgba(255,255,255,.035); }
.tn.sel { background: var(--ed-acc-soft); border-left-color: var(--ed-acc); }
.tn .ic { width: 20px; height: 20px; flex: none; display: grid; place-items: center; border-radius: 6px; font-size: 11px; color: var(--ed-dim); background: rgba(255,255,255,.05); }
.tn .ic.dot::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--t-other)); }
.tn .lb { flex: 1; min-width: 0; display: grid; }
.tn .lb b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tn .lb small { color: var(--ed-faint); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tn.ro .lb b { color: var(--ed-dim); }
.tn .badge { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: rgba(224,138,90,.16); color: var(--ed-bad); flex: none; }
.tn .badge.w { background: rgba(216,160,122,.12); color: var(--ed-warn); }
.tgroup { border-left: 1px solid var(--ed-hair); }
.tsec { font: 600 10.5px/1 'IBM Plex Sans'; letter-spacing: .14em; text-transform: uppercase; color: var(--ed-faint); padding: 16px 14px 6px; }
.tadd { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 14px 0; }
/* ---- the form */
.crumbs { color: var(--ed-faint); font-size: 12px; margin-bottom: 4px; }
.crumbs a { color: var(--ed-dim); cursor: pointer; text-decoration: none; } .crumbs a:hover { color: var(--ed-ink); }
h2.title { font: 600 20px/1.25 'IBM Plex Sans'; margin: 0 0 4px; }
.sub { color: var(--ed-dim); margin: 0 0 16px; }
.sec { background: var(--ed-panel); border: 1px solid var(--ed-hair); border-radius: 10px; padding: 12px 16px 14px; margin: 0 0 14px; }
.sec > h4 { margin: 0 0 10px; font: 600 10.5px/1 'IBM Plex Sans'; letter-spacing: .14em; text-transform: uppercase; color: var(--ed-faint); display: flex; justify-content: space-between; align-items: center; }
.sec > p.help { color: var(--ed-faint); margin: -4px 0 10px; font-size: 12.5px; }
.f { display: grid; grid-template-columns: 170px 1fr; gap: 10px; align-items: start; margin: 7px 0; }
.f > label { color: var(--ed-dim); padding-top: 6px; }
.f > label small { display: block; color: var(--ed-faint); font-size: 11.5px; line-height: 1.3; margin-top: 2px; }
.inp, select.inp, textarea.inp { width: 100%; background: var(--ed-field); border: 1px solid var(--ed-btn-bd); border-radius: 7px; padding: 6px 9px; min-height: 32px; }
textarea.inp { min-height: 64px; resize: vertical; line-height: 1.5; }
.inp:focus { outline: 2px solid var(--ed-acc); outline-offset: -1px; border-color: transparent; }
.inp:disabled { opacity: .55; }
.inp.num { width: 110px; } .inp.num.s { width: 80px; }
select.inp option { background: var(--ed-panel); }
.inl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.inl > .lbl { color: var(--ed-faint); font-size: 12.5px; }
.inl .inp { width: auto; }
.key { font: 400 11.5px/1.3 ui-monospace, Menlo, monospace; color: var(--ed-faint); margin-top: 4px; cursor: pointer; }
.key:hover { color: var(--ed-dim); }
.list { display: grid; gap: 6px; }
.li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: rgba(0,0,0,.16); border: 1px solid var(--ed-hair); border-radius: 8px; padding: 6px 8px; }
.li .inp { width: auto; }
.seg { display: inline-flex; border: 1px solid var(--ed-btn-bd); border-radius: 7px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 5px 11px; cursor: pointer; color: var(--ed-dim); border-right: 1px solid var(--ed-btn-bd); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ed-acc); color: var(--ed-acc-ink); font-weight: 600; }
.seg button:disabled { cursor: default; }
.ro-box { background: rgba(255,255,255,.04); border: 1px dashed var(--ed-border); border-radius: 10px; padding: 12px 14px; color: var(--ed-dim); margin-bottom: 14px; }
.steps { display: grid; gap: 4px; }
.steps .st { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 8px; background: rgba(0,0,0,.16); border: 1px solid var(--ed-hair); cursor: pointer; }
.steps .st:hover { border-color: var(--ed-border); }
.steps .st .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--ed-acc-soft); font-size: 11.5px; flex: none; }
details.adv { margin-top: 18px; color: var(--ed-faint); }
details.adv summary { cursor: pointer; font-size: 12.5px; }
details.adv textarea { width: 100%; min-height: 220px; font: 12px/1.45 ui-monospace, Menlo, monospace; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
/* ---- the people picker */
.pp { position: relative; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 2px; border-radius: 16px; background: var(--ed-acc-soft); border: 1px solid var(--ed-border); }
.chip img, .chip .av { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; object-position: 50% 25%; }
.chip button { background: none; border: 0; color: var(--ed-faint); cursor: pointer; padding: 0 4px; font-size: 14px; }
.chip button:hover { color: var(--ed-bad); }
.av { display: grid; place-items: center; background: var(--ed-hair); color: var(--ed-dim); font-weight: 600; font-size: 11px; }
.ppPop { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; width: 380px; max-height: 360px; overflow: auto; background: var(--ed-plate); border: 1px solid var(--ed-border); border-radius: 10px; padding: 8px; box-shadow: 0 14px 40px rgba(0,0,0,.5); backdrop-filter: blur(6px); }
.ppPop input { margin-bottom: 8px; }
.ppGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.ppGrid button { display: flex; gap: 8px; align-items: center; text-align: left; background: none; border: 1px solid transparent; border-radius: 8px; padding: 4px; cursor: pointer; }
.ppGrid button:hover { background: rgba(255,255,255,.05); }
.ppGrid button.on { background: var(--ed-acc-soft); border-color: var(--ed-acc); }
.ppGrid img, .ppGrid .av { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; object-position: 50% 25%; flex: none; }
.ppGrid span { display: grid; min-width: 0; } .ppGrid b { font-weight: 500; } .ppGrid small { color: var(--ed-faint); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ppGroup { font: 600 10px/1 'IBM Plex Sans'; letter-spacing: .14em; text-transform: uppercase; color: var(--ed-faint); margin: 8px 2px 4px; grid-column: 1 / -1; }
/* ---- the in-game card (src/viewer/map_menu.js, #mapScreen's rules, scoped to .gc) */
.gc { background: var(--ed-panel); border: 1px solid var(--ed-hair); border-radius: 10px; overflow: hidden; font: 400 14px/1.5 'IBM Plex Sans'; font-variant-numeric: tabular-nums; }
.gc .mmItem { border-bottom: 1px solid var(--ed-hair); }
.gc .mmItem:last-child { border-bottom: 0; }
.gc .mmRow { width: 100%; display: grid; grid-template-columns: 10px 40px 1fr auto 18px; gap: 10px; align-items: center; padding: 10px 16px 10px 14px; min-height: 48px; border-left: 2px solid transparent; background: none; border-top: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; }
.gc .mmItem.open .mmRow { background: var(--ed-acc-soft); border-left-color: var(--ed-acc); }
.gc .mmDot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.gc .mmFace { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; object-position: 50% 25%; background: var(--ed-hair); }
.gc .mmT { font-weight: 500; min-width: 0; }
.gc .mmSub { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.gc .mmTag { font-size: 11px; color: var(--ed-dim); border: 1px solid var(--ed-btn-bd); border-radius: 9px; padding: 0 6px; }
.gc .mmPay { font-variant-numeric: tabular-nums; }
.gc .mmMark { text-align: center; font-weight: 600; }
.gc .mmMark.ok { color: var(--ed-acc); } .gc .mmMark.no { color: var(--ed-bad); } .gc .mmMark.w { color: var(--ed-warn); }
.gc .mmBody { display: grid; gap: 12px; padding: 2px 16px 16px 36px; background: var(--ed-acc-soft); }
.gc .mmBody p { margin: 0; max-width: 42ch; font-size: 13.5px; line-height: 1.55; }
.gc .mmWho { display: flex; gap: 14px; align-items: center; }
.gc .mmFaceBig { width: 120px; height: 120px; flex: none; border-radius: 12px; object-fit: cover; object-position: 50% 25%; background: var(--ed-hair); }
.gc .mmWho span { display: grid; gap: 2px; color: var(--ed-dim); font-size: 13px; }
.gc .mmWho b { color: var(--ed-ink); font-size: 16px; font-weight: 600; }
.gc .mmRw { display: block; margin-top: 6px; font-size: 12.5px; color: var(--ed-dim); }
.gc .mmWhy { display: block; margin-top: 6px; color: var(--ed-bad); }
.gc .mmTrack { justify-self: start; font: 600 12px/1 'IBM Plex Sans'; letter-spacing: .1em; text-transform: uppercase; color: var(--ed-acc-ink); background: var(--ed-acc); border: 1px solid var(--ed-acc); border-radius: 8px; padding: 0 18px; min-height: 48px; }
.gc .face0 { display: grid; place-items: center; color: var(--ed-dim); font-weight: 600; }
.notes { background: rgba(0,0,0,.18); border: 1px solid var(--ed-hair); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: grid; gap: 6px; }
.notes ol { margin: 0; padding-left: 20px; } .notes li { margin: 2px 0; }
.notes .pay { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-variant-numeric: tabular-nums; }
/* ---- the map, the checks */
#mapWrap { position: relative; border: 1px solid var(--ed-hair); border-radius: 10px; overflow: hidden; height: 340px; background: #0b2a44; }
#map { width: 100%; height: 100%; display: block; cursor: crosshair; }
#mapHint { position: absolute; left: 8px; top: 8px; background: rgba(20,18,16,.75); color: var(--ed-dim); padding: 2px 8px; border-radius: 6px; font-size: 12px; pointer-events: none; }
#pickLbl { font-size: 12.5px; }
#val { display: grid; gap: 4px; font-size: 12.5px; max-height: 220px; overflow: auto; }
#val div { padding: 4px 8px; border-radius: 6px; background: rgba(224,138,90,.08); cursor: pointer; }
#val div.okv { background: rgba(156,207,154,.08); cursor: default; }
dialog { background: var(--ed-panel); color: var(--ed-ink); border: 1px solid var(--ed-border); border-radius: 12px; width: min(640px, 92vw); }
dialog::backdrop { background: rgba(0,0,0,.55); }
</style>
</head>
<body>
<header class="top">
  <div class="brand">Mission Editor</div>
  <div class="file" id="fileLbl"></div>
  <span class="grow"></span>
  <button class="btn" id="bBuiltin" title="Open src/missions/builtin.json (the game's contracts as missions)">Open built-in pack</button>
  <button class="btn" id="bOpen" type="button">Open file…</button><input id="fOpen" type="file" accept=".json,application/json" hidden>
  <button class="btn" id="bNew">New pack</button>
  <button class="btn ghost" id="bRetro" title="Rebuild the built-in pack from today's 72_contract_data.js (the retrofit)">Rebuild from game data</button>
  <button class="btn pri" id="bSave">Save pack</button>
  <span class="checks" id="vcount"></span>
</header>
<div id="main">
  <nav id="tree"></nav>
  <section id="form"></section>
  <aside id="side">
    <div class="colHead">In-game preview <span class="faint" style="text-transform:none;letter-spacing:0;font-weight:400">the map screen's contract card</span></div>
    <div id="card"></div>
    <div id="notes"></div>
    <div class="colHead">Map <span class="grow"></span><span id="pickLbl" class="faint" style="text-transform:none;letter-spacing:0;font-weight:400"></span><button class="btn sm" id="bFit" type="button">Fit</button></div>
    <div id="mapWrap"><canvas id="map"></canvas><div id="mapHint"></div></div>
    <div class="colHead">Checks <span class="faint" style="text-transform:none;letter-spacing:0;font-weight:400">the game's own validator</span></div>
    <div id="val"></div>
  </aside>
</div>
<dialog id="dlgRoute">
  <form method="dialog">
    <h3 style="margin-top:0">Import a drawn route</h3>
    <p class="dim">Paste a route (as saved by the game's route tool) or the game's route library; it is embedded in the mission.</p>
    <textarea id="routeTxt" class="inp" style="min-height:160px"></textarea>
    <div class="f"><label>Route name <small>when pasting a library</small></label><input id="routeName" class="inp" placeholder="optional"></div>
    <div class="f"><label>Or a file</label><input id="routeFile" type="file" accept=".json"></div>
    <menu style="display:flex;gap:8px;justify-content:flex-end;padding:0"><button class="btn" value="cancel">Cancel</button><button class="btn pri" id="routeOk" value="ok">Import</button></menu>
  </form>
</dialog>

<!-- THE GAME'S CORE: the LEAN set (tools/_missions_lib.js), in build.js MANIFEST.core's order -->
<script data-core="01_names.js" src="../src/core/01_names.js"></script>
<script data-core="26_hangar_fit.js" src="../src/core/26_hangar_fit.js"></script>
<script data-core="34_occupant.js" src="../src/core/34_occupant.js"></script>
<script data-core="38c_route.js" src="../src/core/38c_route.js"></script>
<script data-core="72_people_faces.js" src="../src/core/72_people_faces.js"></script>
<script data-core="72_people.js" src="../src/core/72_people.js"></script>
<script data-core="72_accept.js" src="../src/core/72_accept.js"></script>
<script data-core="72_contract_data.js" src="../src/core/72_contract_data.js"></script>
<script data-core="73_contracts.js" src="../src/core/73_contracts.js"></script>
<script data-core="73b_missions.js" src="../src/core/73b_missions.js"></script>
<script data-core="73c_mission_run.js" src="../src/core/73c_mission_run.js"></script>
<script data-core="79_story.js" src="../src/core/79_story.js"></script>
<!-- the island's 2-D map (map_bake.js) and the fleet's tie-down spots (fleet_spots.js --cook) -->
<script src="../src/viewer/map_pack.js"></script>
<script src="../src/viewer/fleet_spots_pack.js"></script>
<script>
'use strict';
(function () {
const $ = id => document.getElementById(id);
const el = (tag, attrs, ...kids) => { const e = document.createElement(tag); for (const k in (attrs || {})) { if (k === 'on') for (const ev in attrs.on) e.addEventListener(ev, attrs.on[ev]); else if (k === 'cls') e.className = attrs[k]; else if (k === 'style' && typeof attrs[k] === 'object') { for (const q in attrs[k]) if (q.startsWith('--')) e.style.setProperty(q, attrs[k][q]); else e.style[q] = attrs[k][q]; } else if (attrs[k] != null) e.setAttribute(k, attrs[k]); } for (const c of kids.flat(3)) if (c != null && c !== false) e.append(c.nodeType ? c : String(c)); return e; };

const DRAFT = 'flydiy.missionEditor.draft';

function safe(f) { try { return f(); } catch (e) { return null; } }

// ---- THE WORDS: what the editor calls things (the format's names stay in the file) -------------------------------------
const DO_LABEL = { carry: 'Carry cargo / people', fly: 'Fly to', land: 'Land at', photo: 'Take a photo', pass: 'Fly through', park: 'Park at a tie-down',

  ultimateG: 'Ultimate load', xwindKt: 'Crosswind limit', hydro: 'Floats', tasKmh: 'Cruise speed', enduranceMin: 'Endurance', rangeKm: 'Range', takeoffAt: 'Takes off from',

  c.append(el('div', { cls: 'gc' }, cardItem(m, true)));
  // the editor's notes: the steps in words, the preferences, the money, whether today's runtime runs it
  const rw = safe(() => missionReward(m, { pack: S.pack })), Tx = T();
  const ol = el('ol', {}, m.legs.map((L, i) => L.steps.map(st => el('li', {}, stepSentence(st),
    st.require && st.require.when ? el('span', { cls: 'faint' }, ' · ' + safe(() => contractWhenWords(st.require.when))) : null,
    st.require && st.require.plane ? el('span', { cls: 'faint' }, ' · ' + st.require.plane.map(q => safe(() => contractCritWords(q, CONTRACT_FIELDS, Tx)) || q.k).join('; ')) : null,
    m.legs.length > 1 ? el('span', { cls: 'faint' }, '  (leg ' + (i + 1) + ')') : null))));
  N.append(el('div', { cls: 'notes' }, el('b', {}, 'What the player does'), ol,
    (m.prefs || []).length ? el('div', {}, (m.prefs || []).map(p => el('div', {}, contractText('pref.' + p.need, { p: contractText('pref.' + p.k, { v: p.v }, Tx) }, Tx) + (p.need === 'bonus' ? ' (+' + p.pct + ' %)' : '')))) : null,
    m.onDone && m.onDone.say ? el('div', { cls: 'dim' }, '“' + contractText(m.onDone.say.text, {}, Tx) + '” - ' + personName(m.onDone.say.who)) : null,
    rw ? el('div', { cls: 'pay' }, el('span', { cls: 'faint' }, 'Offered'), el('span', {}, credits(rw.pay.total) + ' credits' + (rw.pay.km ? ' · ' + kmFmt(rw.pay.km) + ' km' : '')),
      el('span', { cls: 'faint' }, 'Paid'), el('span', {}, credits(rw.paid)), rw.best !== rw.paid ? [el('span', { cls: 'faint' }, 'At best'), el('span', {}, credits(rw.best) + (rw.prefs ? ' · preferences +' + rw.prefs + ' %' : ''))] : null) : null,
    rw ? el('div', { cls: rw.why ? 'warn' : 'ok' }, rw.why ? '⏳ Not playable yet: ' + rw.why : '✓ The game runs it today') : null));
}

// ---- the map (MAP_PACK: px = (x - x0) / mpp, py = (z - z0) / mpp; north up) ------------------------------------------
const cv = $('map'), cx = cv.getContext('2d');
const V = { s: 0.2, ox: 0, oy: 0, img: null, drag: null };
if (MAP) { const im = new Image(); im.onload = () => { V.img = im; drawMap(); }; im.src = '../' + ((MAP.art && MAP.art.img) || MAP.img); }
const w2s = (x, z) => [((x - MAP.x0) / MAP.mpp) * V.s + V.ox, ((z - MAP.z0) / MAP.mpp) * V.s + V.oy];
const s2w = (sx, sy) => [((sx - V.ox) / V.s) * MAP.mpp + MAP.x0, ((sy - V.oy) / V.s) * MAP.mpp + MAP.z0];
function fit(pts) {
  if (!MAP) return;
  const W = cv.clientWidth, H = cv.clientHeight; let x0 = MAP.x0, x1 = MAP.x1, z0 = MAP.z0, z1 = MAP.z1;
  if (pts && pts.length) { x0 = Math.min(...pts.map(p => p[0])) - 1500; x1 = Math.max(...pts.map(p => p[0])) + 1500; z0 = Math.min(...pts.map(p => p[1])) - 1500; z1 = Math.max(...pts.map(p => p[1])) + 1500; }
  V.s = Math.min(W / ((x1 - x0) / MAP.mpp), H / ((z1 - z0) / MAP.mpp));
  V.ox = W / 2 - ((x0 + x1) / 2 - MAP.x0) / MAP.mpp * V.s; V.oy = H / 2 - ((z0 + z1) / 2 - MAP.z0) / MAP.mpp * V.s;
}
function missionPts(m) {
  const out = [];
  const put = p => { const q = contractPlaceXZ(p, CONTRACT_FIELDS) || (missionPlaceKind(p) === 'site' ? ((S.pack.sites.find(x => x.id === p.site) || {}).at && [S.pack.sites.find(x => x.id === p.site).at.x, S.pack.sites.find(x => x.id === p.site).at.z]) : null); if (q) out.push(q); };
  for (const L of m.legs || []) for (const s of L.steps || []) { if (s.from) put(s.from); if (s.place) put(s.place); }
  for (const p of (m.route && m.route.pts) || []) out.push([p.x, p.z]);
  return out;
}
function drawMap() {
  const W = cv.width = cv.clientWidth * devicePixelRatio, H = cv.height = cv.clientHeight * devicePixelRatio;
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); cx.clearRect(0, 0, W, H);
  if (!MAP) { cx.fillStyle = '#fff'; cx.fillText('no map pack (src/viewer/map_pack.js)', 10, 20); return; }
  if (V.img) cx.drawImage(V.img, V.ox, V.oy, MAP.w * V.s, MAP.h * V.s);
  cx.font = '500 11px "IBM Plex Sans", system-ui'; cx.lineWidth = 1.5;
  for (const id of Object.keys(CONTRACT_FIELDS)) { const f = CONTRACT_FIELDS[id], [x, y] = w2s(f.x, f.z); cx.fillStyle = f.surf === 'water' ? '#4fc3f7' : '#e6dbc9'; cx.beginPath(); cx.arc(x, y, 4, 0, 7); cx.fill(); cx.fillStyle = '#f4efe6'; cx.fillText(f.name, x + 6, y + 3); }
  for (const s of S.pack.sites) { const [x, y] = w2s(s.at.x, s.at.z); cx.strokeStyle = '#b58fd8'; cx.strokeRect(x - 5, y - 5, 10, 10); cx.fillStyle = '#b58fd8'; cx.fillText(s.asset || s.id, x + 7, y + 3); }
  const m = S.sel.id && mission(S.sel.id);
  if (!m || isTut(m)) return;
  if (m.route) { cx.setLineDash([5, 4]); cx.strokeStyle = '#ffffffaa'; cx.beginPath(); m.route.pts.forEach((p, i) => { const [x, y] = w2s(p.x, p.z); i ? cx.lineTo(x, y) : cx.moveTo(x, y); }); cx.stroke(); cx.setLineDash([]); }
  m.legs.forEach((L, li) => L.steps.forEach((s, si) => {
    const on = S.sel.t === 'step' && S.sel.l === li && S.sel.s === si, col = on ? '#ff8a5c' : '#9ccf9a';
    cx.strokeStyle = col; cx.fillStyle = col;
    const fr = s.from && contractPlaceXZ(s.from, CONTRACT_FIELDS), k = missionPlaceKind(s.place);
    let to = s.place ? contractPlaceXZ(s.place, CONTRACT_FIELDS) : null;
    if (k === 'site') { const st = S.pack.sites.find(x => x.id === s.place.site); to = st ? [st.at.x, st.at.z] : null; }
    if (fr && to) { const a = w2s(fr[0], fr[1]), b = w2s(to[0], to[1]); cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(b[0], b[1]); cx.stroke(); }
    if (k === 'pt') { const [x, y] = w2s(s.place.pt[0], s.place.pt[1]); cx.beginPath(); cx.arc(x, y, Math.max(3, s.place.r / MAP.mpp * V.s), 0, 7); cx.stroke(); cx.fillText((s.id || s.do) + (s.split != null ? ' ' + s.split + 's' : ''), x + 6, y - 6); }
    if (k === 'gate') { const a = w2s(s.place.gate[0][0], s.place.gate[0][1]), b = w2s(s.place.gate[1][0], s.place.gate[1][1]); cx.lineWidth = 3; cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(b[0], b[1]); cx.stroke(); cx.lineWidth = 1.5; cx.fillText(s.id || 'gate', b[0] + 5, b[1]); }
    if (k === 'ring') { const [x, y] = w2s(s.place.ring[0], s.place.ring[2]); cx.beginPath(); cx.arc(x, y, 6, 0, 7); cx.stroke(); cx.beginPath(); cx.arc(x, y, 2, 0, 7); cx.fill(); cx.fillText((s.id || 'ring') + ' ' + s.place.ring[1] + ' m', x + 8, y); }
    if (k === 'spot') { const i0 = s.place.spot.indexOf(':'), a = s.place.spot.slice(0, i0), id = s.place.spot.slice(i0 + 1), q = (SPOTS[a] || []).find(z => z[3] === id); if (q) { const [x, y] = w2s(q[0], q[1]); cx.fillRect(x - 3, y - 3, 6, 6); } }
  }));
  if (S.sel.t === 'step') { const s = m.legs[S.sel.l].steps[S.sel.s]; if (s && missionPlaceKind(s.place) === 'spot') { const a = s.place.spot.split(':')[0]; cx.fillStyle = '#ffffff88'; for (const q of SPOTS[a] || []) { const [x, y] = w2s(q[0], q[1]); cx.fillRect(x - 2, y - 2, 4, 4); } } }
}
function pickBtn(label, key) { return el('button', { cls: 'btn sm', on: { click: () => { S.pick = Object.assign({ n: 0 }, key); $('pickLbl').textContent = 'click the map (Esc to stop)'; $('pickLbl').className = 'warn'; } } }, label); }
function applyPick(wx, wz) {
  const P = S.pick; if (!P) return;
  if (P.kind === 'siteAt') { const s = S.pack.sites[P.i]; s.at.x = Math.round(wx); s.at.z = Math.round(wz); S.pick = null; $('pickLbl').textContent = 'placed'; $('pickLbl').className = 'faint'; return changed(); }
  const m = mission(P.id), s = m && m.legs[P.l].steps[P.s]; if (!s) return;
  const k = missionPlaceKind(s.place);
  if (k === 'field') { let best = null, bd = 1e18; for (const id of Object.keys(CONTRACT_FIELDS)) { const f = CONTRACT_FIELDS[id], d = Math.hypot(f.x - wx, f.z - wz); if (d < bd) { bd = d; best = id; } } s.place = { field: best }; S.pick = null; }
  else if (k === 'pt') { s.place.pt = [Math.round(wx), Math.round(wz)]; S.pick = null; }
  else if (k === 'ring') { s.place.ring = [Math.round(wx), s.place.ring[1], Math.round(wz)]; S.pick = null; }
  else if (k === 'gate') { s.place.gate[P.n] = [Math.round(wx), Math.round(wz)]; P.n++; if (P.n > 1) S.pick = null; else $('pickLbl').textContent = 'now the second post'; }
  else if (k === 'spot') { let best = null, bd = 1e18; for (const a of Object.keys(SPOTS)) for (const q of SPOTS[a]) { const d = Math.hypot(q[0] - wx, q[1] - wz); if (d < bd) { bd = d; best = a + ':' + q[3]; } } if (best) s.place = { spot: best }; S.pick = null; }
  if (!S.pick) { $('pickLbl').textContent = 'placed'; $('pickLbl').className = 'faint'; }
  changed();
}
cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, k = e.deltaY < 0 ? 1.25 : 0.8; V.ox = mx - (mx - V.ox) * k; V.oy = my - (my - V.oy) * k; V.s *= k; drawMap(); }, { passive: false });
cv.addEventListener('mousedown', e => { V.drag = { x: e.clientX, y: e.clientY, ox: V.ox, oy: V.oy, moved: false }; });
window.addEventListener('mousemove', e => { const r = cv.getBoundingClientRect(); if (MAP && e.target === cv) { const [x, z] = s2w(e.clientX - r.left, e.clientY - r.top); $('mapHint').textContent = 'x ' + Math.round(x) + '  z ' + Math.round(z); }
  if (!V.drag) return; const dx = e.clientX - V.drag.x, dy = e.clientY - V.drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) V.drag.moved = true; if (V.drag.moved) { V.ox = V.drag.ox + dx; V.oy = V.drag.oy + dy; drawMap(); } });
window.addEventListener('mouseup', e => { const D = V.drag; V.drag = null; if (D && !D.moved && e.target === cv && MAP) { const r = cv.getBoundingClientRect(); const [x, z] = s2w(e.clientX - r.left, e.clientY - r.top); applyPick(x, z); } });
window.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.pick) { S.pick = null; $('pickLbl').textContent = 'stopped'; } if (S.pp) { S.pp = null; renderForm(); } } });
$('bFit').onclick = () => { const m = S.sel.id && mission(S.sel.id); fit(m && !isTut(m) ? missionPts(m) : null); drawMap(); };
window.addEventListener('resize', drawMap);

// ---- the route import (a 38c_route.js record, or the game's library) -----------------------------------------------------
let routeFor = null;
function openRoute(m) { routeFor = m; $('routeTxt').value = ''; $('dlgRoute').showModal(); }
$('routeFile').onchange = e => { const f = e.target.files[0]; if (f) f.text().then(t => { $('routeTxt').value = t; }); };
$('dlgRoute').addEventListener('close', () => {
  if ($('dlgRoute').returnValue !== 'ok' || !routeFor) return;
  try {
    let r = JSON.parse($('routeTxt').value);
    if (r && r.route && r.route.pts) r = r.route;                         // the draft (flydiy.routeDraw: { v, route, fly })
    if (Array.isArray(r)) { const n = $('routeName').value.trim(); r = (n && r.find(x => x && x.name === n)) || r[0]; }
    const R = routeNormalise(r);
    if (!R || R.pts.length < 2) throw new Error('not a route with 2+ points');
    routeFor.route = R; if (!routeFor.rally) routeFor.rally = { refKmh: 150, r: 300 };
    status('route imported: ' + R.name + ', ' + R.pts.length + ' points'); fit(missionPts(routeFor)); changed();
  } catch (e) { status('route import failed: ' + e.message); }
});

// ---- validation, render, I/O --------------------------------------------------------------------------------------------
function renderVal() {
  WHY = safe(() => missionPackValidate(S.pack, { spots: SPOTS })) || ['the validator threw'];
  const v = $('val'); v.innerHTML = '';
  $('vcount').innerHTML = '';
  $('vcount').append(WHY.length ? el('span', { cls: 'bad' }, '✗ ' + WHY.length + ' problem' + (WHY.length === 1 ? '' : 's')) : el('span', { cls: 'ok' }, '✓ The pack checks out'));
  if (!WHY.length) v.append(el('div', { cls: 'okv ok' }, '✓ Everything checks out - the game will agree (the same core).'));
  for (const w of WHY) v.append(el('div', { on: { click: () => { const id = w.split(/[ :]/)[0], m = mission(id); if (m) { S.sel = { t: 'mission', id }; renderAll(); } } } }, w));
}
function renderAll() { renderVal(); renderTree(); renderForm(); renderCard(); drawMap(); }
$('bSave').onclick = () => { const txt = JSON.stringify(S.pack, null, 1) + '\n'; const a = el('a', { href: URL.createObjectURL(new Blob([txt], { type: 'application/json' })), download: S.file || 'pack.json' }); document.body.append(a); a.click(); a.remove(); status('saved'); };
$('bOpen').onclick = () => $('fOpen').click();
$('fOpen').onchange = e => { const f = e.target.files[0]; if (f) f.text().then(t => { try { setPack(JSON.parse(t), f.name); } catch (er) { status('not a pack: ' + er.message); } }); };
$('bBuiltin').onclick = () => fetch('../src/missions/builtin.json').then(r => r.json()).then(p => setPack(p, 'builtin.json'), e => status('could not fetch the built-in pack (serve flyDiy/ over http): ' + e.message));
$('bNew').onclick = () => { if (confirm('Start an empty pack? (the current one stays only if saved)')) setPack(emptyPack(), 'pack.json'); };
$('bRetro').onclick = () => { if (confirm('Rebuild the built-in pack from today\'s 72_contract_data.js? (the retrofit)')) setPack(missionPackFromContracts(), 'builtin.json'); };
window.MISSION_EDITOR = { S, renderAll, setPack, mission };

const d = store.get();
let start = null; try { start = d && JSON.parse(d); } catch (e) { start = null; }
if (start && start.pack) setPack(start.pack, start.file); else setPack(missionPackFromContracts(), 'builtin.json');
requestAnimationFrame(() => { fit(); drawMap(); });
})();
</script>
