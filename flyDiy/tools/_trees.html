    cam.updateProjectionMatrix();
    target.viewport.set(i * TILE, j * TILE, TILE, TILE);
    target.scissor.set(i * TILE, j * TILE, TILE, TILE);
    target.scissorTest = true;
    renderer.setRenderTarget(target);    // re-asserts the tile rect every time
    renderer.clearDepth();
    renderer.render(sc, cam);
   }
   target.scissorTest = false;
   target.viewport.set(0, 0, N, N);
   target.scissor.set(0, 0, N, N);
  };

  U_BAKEALB.value = 1;                   // pass 1 - surface colour, no lights
  drawAll(rt);
  U_BAKEALB.value = 0;
  const swap = [];                       // pass 2 - the tree's own normals
  staged.traverse(o => {
    if (!o.isMesh || !o.material || o.material.isShaderMaterial) return;
    swap.push([o, o.material]);
    o.material = normalMatFor(o.material);
  });
  drawAll(rtN);
  for (const [o, mm] of swap) o.material = mm;
  renderer.setViewport(0, 0, cv.width, cv.height);
  renderer.setRenderTarget(pRT);
  renderer.autoClear = pAC;
  renderer.toneMapping = pTM;
  renderer.shadowMap.enabled = pSh;
  renderer.shadowMap.autoUpdate = pAU;
  renderer.setClearColor(pCol, pA);
  U_SHARP.value = prevSharp;
  U_BAKECUT.value = prevBakeCut;
  for (const [m, a2c, at] of bakeRestore) { m.alphaToCoverage = a2c; m.alphaTest = at; m.needsUpdate = true; }
  // The sheet leaves the GPU here: a render target cannot carry a mip chain we
  // built ourselves, and holding one per prototype costs 4 MB of VRAM apiece.
  // The cutoff is U_ICUT, the point the impostor's alpha curve is centred on -
  // a coverage target only means anything against the threshold it will be
  // tested at.
  const mkTex = ms => {
    const t = new THREE.DataTexture(ms[0].data, N, N, THREE.RGBAFormat);
    t.mipmaps = ms;
    t.generateMipmaps = false;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.magFilter = THREE.LinearFilter;
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
    t.flipY = false;
    t.needsUpdate = true;
    return t;
  };
  const mips = buildAtlasMips(rt, N, IMP_G, TILE, Math.round(255 * U_ICUT.value));
  // The NORMAL sheet takes a STRAIGHT chain. Coverage preservation is an alpha
  // correction fitted to keep a cutout's silhouette alive as it shrinks; a
  // normal has no silhouette to keep, and rescaling its alpha would only make
  // the two sheets disagree about where the tree is.
  const mipsN = buildAtlasMips(rtN, N, IMP_G, TILE, Math.round(255 * U_ICUT.value), true);
  const tex = mkTex(mips), nrm = mkTex(mipsN);
  rt.dispose(); rtN.dispose();
  return { tex: tex, nrm: nrm, cy: cy, diam: 2 * M, tile: TILE, mips: mips.length };
}

// ==========================================================================
// THE IMPOSTOR FIELD — CPU billboarding, one draw call per prototype
//
// The first attempt built the quad in the VERTEX shader from modelMatrix, the
// way src/viewer/render_world.js does for its InstancedMesh. It never drew:
// the program linked, the quad submitted two triangles, and reading the
// instance scale out of modelMatrix column 1 returned zero, which collapsed
// every billboard to a horizontal line. Rather than keep probing a shader
// that cannot be printf'd, the geometry is now built on the CPU in WORLD
// SPACE and the mesh carries no transform at all — so there is no matrix to
// read wrongly, and `project_vertex` does its ordinary job.
//
// What stays from the game's version is the part that is actually clever: the
// HEMI-OCTAHEDRAL fold and the three-tap barycentric blend in the fragment
// shader. The CPU writes a per-vertex view direction; the shader folds it,
// picks the cell's three nearest baked views and blends them. A nearest-view
// pick would make the whole forest flip at once when the aeroplane turns.
//
// AND THIS IS A FLIGHT SIM, so the fold's orientation is the point. The
// hemi-octahedron puts STRAIGHT DOWN at the centre of the square and the
// horizon ring on its edge — which is the right distribution for something
// that spends its life looking down at trees from a few hundred metres, and
// the wrong one for a first-person game. G is 8 here rather than the game's
// 4: 64 baked views instead of 16, because a shallow overhead angle changes
// a conifer's silhouette fast and that is exactly the angle we fly at.
// ==========================================================================
const IMP_FIELDS = [];

// ==========================================================================
// WHY AN IMPOSTOR NEEDS ITS ALPHA HARDENED BACK
//
// The atlas holds a CUTOUT: a tile is single-sampled, so every texel is either
// leaf or not. The three-tap blend then mixes three of those binary masks, and
// where the views disagree - which is most of a conifer's crown - it hands back
// a FRACTION. Alpha-to-coverage reads that fraction as screen coverage and
// draws the crown see-through, which is the ghost the bench was showing: turn
// A2C off and the same tree fills in at once.
//
// So the blended alpha is put back through a contrast curve before anything
// reads it as coverage. A gain rather than the screen-space sharpen the leaves
// use, because fwidth is a function of how big the quad lands on screen and an
// impostor's whole job is to be small: the sharpen collapses at exactly the
// distance this has to work at, which is the same trap that turned the bake
// into bare trunks. A gain is scale-free.
// ==========================================================================
// The gain belongs to the FAMILY, not to the bench. Measured against their own
// geometry, the species do not want the same number: a dense cedar's impostor
// came out covering twice the pixels of the model it stands for, while a larch
// - thin needles, mostly air - was still thinner than its own tree. One global
// number cannot be right for both, so `impa` sits on the collection's rail
// beside `alpha` and `stick`.
const U_ICUT   = { value: 0.40 };  // where the curve is centred
const U_ISOLID = { value: 1.0 };   // 0 = averaged silhouette, 1 = the union
// HOW ROUND A BILLBOARD'S CROWN IS ALLOWED TO BE, and why it needs to be round
// at all when there is a real baked normal to hand.
//
// MEASURED: the normal sheet's average vector keeps a length of 0.78-1.0 all
// the way down its mip chain. That is not a mip problem, it is the answer to
// the question - the leaf cards in these packs very nearly AGREE, and what they
// agree on is facing the bake camera. So the baked normal of a whole crown is
// one direction, pointing at the eye. Two consequences, and they are exactly
// the two faults the far band showed:
//
//   NO RELIEF. One normal over the crown means one N.L over the crown, so the
//   billboard lights up as a flat cutout where the geometry beside it has a lit
//   flank and a shaded one.
//
//   TOO DARK. A normal pointing at the EYE is the worst case for a sun that is
//   anywhere else. Every low sun in the rig lands near the terminator of every
//   billboard at once.
//
// The remedy is the one SpeedTree's billboards use: a HEMISPHERE normal built
// from the quad's own uv, in the billboard's own basis - a genuine outward
// normal of a sphere the size of the crown, so the left of the crown faces
// left and the top faces up, and the sun finds a side of it. It follows the
// camera, which is inherent to a billboard and the reason this is a dial.
const U_ISPH = { value: 0 };   // MEASURED: 0 keeps the most relief, see below
// AND ONE DIAL FOR THE WHOLE FAR BAND. `implight` is a per-family gamma on the
// ALBEDO and it is fitted, not tasted; this multiplies what the tier finally
// emits, after the sun and the ambient have had it. Two different jobs and they
// do not substitute for each other: a gamma changes the relationship between a
// tree's dark and light parts, this changes how much of the stand's light the
// billboards keep. When the far band reads dark against the geometry, this is
// the dial to reach for first.
const U_ILIT = { value: 0.6 };
// WHERE EACH SERIES' ALPHA CURVE IS CENTRED, instead of the crown's 0.40.
//
// MEASURED by isolating the three series against black: the pale, speckled
// trees the stand was showing are the STAND series, not the snag - three fixes
// aimed at the snag changed the picture not at all, which is what a wrong
// suspect looks like. A stand tree is a crown on a GENERATED STICK, and that
// stick is 0.045 of the crown's footprint: one or two texels wide in the tile.
// The curve at 0.40 is right for a leaf texel only one of three views carries,
// but a stick arrives at 0.2-0.3 along its whole length, so it clears the
// threshold in places and fails it in others and the pole comes and goes every
// few pixels - then alpha-to-coverage dithers what survives into flecks.
//
// Lower centre, same gain: anything the sheet says is there is promoted to
// solid, so the stick is continuous and A2C has nothing fractional to scatter.
// A crown edge is barely touched - it is a slightly fatter silhouette, which is
// the trade the coverage-preserving mips already make and for the same reason.
const STAND_CUT = 0.15;
const SNAG_CUT = 0.10;

// `light` trims the tile against the model it stands for. It is a TRIM and not
// a correction of the physics: an orthographic bake of a sparse crown keeps the
// outermost lit needles and drops the shaded interior the eye sees through the
// real thing, so a thin species reads brighter than its own geometry and a
// dense one, whose baked self-shadow is sharper than the stand's, reads darker.
// Measured against the geometry at the same camera: larch 1.53x, realistic fir
// 1.40x, spruce 1.30x too bright; georgeous fir 0.72x and cedar 0.74x too dark.
// The atlas lookup, written once because two materials need it: the one that
// draws the billboard and the one that casts its shadow.
const IMP_SAMPLE = [
  'vec3 dI = normalize(vImpDir);',
  'vec2 pp = vec2(dI.x, dI.z) / (abs(dI.x) + abs(dI.z) + max(dI.y, 0.0) + 1e-5);',
  'vec2 oc = clamp(vec2(pp.x + pp.y, pp.x - pp.y), -1.0, 1.0);',
  'vec2 gp = (oc * 0.5 + 0.5) * (uG - 1.0);',
  'vec2 g0 = min(floor(gp), uG - 2.0);',
  'vec2 gf = gp - g0;',
  'vec2 cB = vec2(1.0, 0.0), cC = vec2(0.0, 1.0), cA; vec3 wB;',
  'if (gf.x + gf.y < 1.0) { cA = vec2(0.0); wB = vec3(1.0 - gf.x - gf.y, gf.x, gf.y); }',
  'else { cA = vec2(1.0); wB = vec3(gf.x + gf.y - 1.0, 1.0 - gf.y, 1.0 - gf.x); }',
  'vec2 qv = (vUv * (1.0 - 2.0 / float(IMP_TILE_JS)) + 1.0 / float(IMP_TILE_JS)) / uG;',
  // hoisted: the normal sheet is sampled at exactly these three points
  'vec2 uvA = (g0 + cA) / uG + qv;',
  'vec2 uvB = (g0 + cB) / uG + qv;',
  'vec2 uvC = (g0 + cC) / uG + qv;',
  'vec4 t0 = texture2D(map, uvA);',
  'vec4 t1 = texture2D(map, uvB);',
  'vec4 t2 = texture2D(map, uvC);',
  'float aMix = dot(wB, vec3(t0.a, t1.a, t2.a));',
  'vec3 rgbI = (t0.rgb * wB.x + t1.rgb * wB.y + t2.rgb * wB.z) / max(aMix, 1e-4);',
  'float aSol = max(max(t0.a, t1.a), t2.a);',
  'float aOut = clamp((mix(aMix, aSol, uISolid) - uICut) * uIGain + 0.5, 0.0, 1.0);',
];

// ==========================================================================
// AN IMPOSTOR THAT CASTS ITS OWN SILHOUETTE
//
// The billboard faces the CAMERA, so the stock depth pass drew a quad edge-on
// to the light and sampled the whole sheet: every tree laid a solid rectangle
// on the ground, which is why the cast was switched off entirely and the far
// band sat in a stand with no shade under it.
//
// The fix is a depth material of the impostor's own. In the shadow pass the
// "camera" IS the light, so `cameraPosition` is the light's position - and the
// quad can be rebuilt about its centre to face THAT instead, and the same
// octahedral fold then picks the view of the tree the light actually sees.
// The shadow is the tree's real silhouette from the sun's side, not a card
// turned the wrong way. It costs two extra attributes, both static.
// ==========================================================================
// ==========================================================================
// THE IMPOSTOR CASTS THROUGH THE ENGINE, NOT BESIDE IT
//
// The ground decal that came before this was the right shape and the wrong
// everything else: a flat black quad at a fixed opacity, so it was paler and
// softer than every other shadow in the stand, it could not fall on another
// tree or up a slope, and it knew nothing about the light rig it was meant to
// belong to.
//
// So the impostor goes back into the real shadow map, and the trick that makes
// it work is a SECOND MESH on a LAYER OF ITS OWN. The billboard faces the
// camera and would cast a rectangle turned the wrong way; this caster faces
// the LIGHT, is built in world space on the CPU like the billboard is, and
// sits on a layer the eye's camera does not render and the shadow camera does.
// It is never drawn, only cast from.
//
// Everything else then comes for free, which is the point: the darkness is the
// rig's, the softness is the shadow map's PCF, it falls on other trees and on
// the terrain, and it rotates and stretches with the sun because the map does
// the projecting. And it needs no custom attribute or custom depth shader -
// three.js's own alpha-tested depth path handles a plain map + alphaTest, and
// the fixed side view of the atlas is selected by baking the tile's offset
// straight into the caster's UVs.
// ==========================================================================
// HOW THE CASTER STAYS INVISIBLE, and the trap that is not.
//
// The obvious way is a layer the eye's camera does not render. It does not
// work: three.js tests a shadow caster against the VIEWING camera's layers,
// not the shadow camera's - `renderObject( scene, camera, shadowCamera, ... )`
// tests `object.layers.test( camera.layers )` - so putting the caster on its
// own layer removes it from the shadow map as well, and the impostors go back
// to casting nothing at all.
//
// So it stays on the default layer and writes nothing instead: colorWrite off,
// depthWrite off. It costs one draw call that touches no pixel, and the shadow
// pass - which builds its own depth material and copies map and alphaTest off
// this one - is untouched by either flag.
function impostorCasterMaterial(atlas) {
  return new THREE.MeshBasicMaterial({
    map: atlas.tex, alphaTest: 0.5, side: THREE.DoubleSide,
    colorWrite: false, depthWrite: false,
  });
}

// AND WHY IT NEEDS A DEPTH MATERIAL OF ITS OWN AFTER ALL. getDepthMaterial
// copies `alphaTest` and `alphaMap` onto the depth material it builds, but NOT
// `map` - and three.js's alphamap_fragment reads the GREEN channel, not alpha,
// so handing it the tile sheet would cut the silhouette out of the foliage's
// colour. So the atlas rides its own uniform, as it must anyway: a
// MeshDepthMaterial's map is not refreshed by the renderer the way a lit
// material's is.
//
// The projection is left ALONE. The caster's own `position` attribute already
// holds the light-facing quad, built on the CPU beside the billboard's, so the
// stock project_vertex is exactly right - and a plain attribute binds where a
// custom one added for the depth program alone does not.
function impostorCasterDepth(atlas) {
  const m = new THREE.MeshDepthMaterial({
    depthPacking: THREE.RGBADepthPacking, alphaTest: 0.5,
  });
  m.onBeforeCompile = sh => {
    sh.uniforms.uAtlas = { value: atlas.tex };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', ['#include <common>', 'varying vec2 vUvI;'].join(NL))
      .replace('#include <begin_vertex>', ['#include <begin_vertex>', 'vUvI = uv;'].join(NL));
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>',
        ['#include <common>', 'uniform sampler2D uAtlas;', 'varying vec2 vUvI;'].join(NL))
      // the uv already points at the tile the SUN sees - see layShadows
      .replace('#include <map_fragment>', 'diffuseColor.a *= texture2D(uAtlas, vUvI).a;');
  };
  return m;
}

// AN IMPOSTOR IS AN ORDINARY SURFACE WITH A BAKED NORMAL.
//
// Everything before this tried to fix the shading at the draw and could not,
// because the fault was in the texture: the sheet held a photograph taken under
// one sun, and a photograph cannot be re-lit. A MeshBasicMaterial made that
// visible (no lights at all); a MeshLambertMaterial with the shadow mask patched
// over its output made it slightly less visible on the shaded face and still did
// nothing at sunset or at night. The sheet is a G-BUFFER now - see U_BAKEALB -
// so the right material is the plain one:
//
//   MeshStandardMaterial, roughness 1, metalness 0, with `normal` replaced by
//   the baked world normal. That single substitution buys the whole lighting
//   rig at once, because it is the SAME rig: sun direction and colour through
//   `lights_fragment_begin`, the hemisphere fill and the environment through
//   `lights_fragment_maps`, the shadow map through the per-light shadow term,
//   and the leaf wrap and translucency through the very same LEAF_GLSL the
//   geometry foliage is shaded with. Nothing here knows what time of day it is.
//
// The albedo is decoded from sRGB by hand because the stock <map_fragment> is
// replaced wholesale by the atlas fold, and the sheet was written through the
// renderer's own output encoding.
// A BARE TRUNK IS NOT A CROWN AND MUST NOT BE TREATED LIKE ONE.
//
// MEASURED, by dumping the sheet: the snag's albedo tile is a clean tan
// skeleton. What shredded it into a string of detached dots was the DRAW. The
// alpha curve is centred on uICut = 0.40, which is right for foliage - a leaf
// texel that only one of the three views carries should not be drawn solid. A
// snag's branch is one texel wide and mip-softened, so it arrives at 0.2-0.3
// along its whole length: above the curve's centre it survives, below it is
// discarded, and the branch comes and goes every few pixels. Alpha-to-coverage
// then dithers what is left.
//
// So the curve's CENTRE rides on the material. A snag's is low: anything the
// sheet says is there at all is drawn, and the branch is continuous and very
// slightly thick - which is the same trade the coverage-preserving mips make,
// and for the same reason. A thing that is too thin to resolve should read as
// present, not as flickering.
// AND ALPHA-TO-COVERAGE IS THE OTHER HALF OF IT. A2C turns a fragment's alpha
// into an MSAA COVERAGE MASK: alpha 0.5 writes half the samples, in a dither
// pattern. That is exactly right for a crown edge, where the pattern lands on a
// leaf silhouette the eye already reads as broken. On a branch one pixel wide it
// is the whole branch - the regular grid of detached tan dots the snags were
// showing IS the dither, magnified by there being nothing else in the pixel. A
// hard cutout is the right rule for a thin solid thing: drawn or not, no
// half-samples to scatter.
function impostorMaterial(atlas, gain, light, solid, cut, a2c) {
  const m = new THREE.MeshStandardMaterial({
    map: atlas.tex, alphaTest: 0.28, side: THREE.DoubleSide, transparent: false,
    roughness: 1, metalness: 0,
  });
  m.alphaToCoverage = (a2c === false) ? false : A2C;
  // the gain is kept reachable so the dial can move it without a rebuild
  m.userData.uIGain = { value: gain === undefined ? 6 : gain };
  m.userData.uILight = { value: light === undefined ? 1 : light };
  m.userData.uISolid = (solid === undefined) ? U_ISOLID : { value: solid };
  m.userData.uICut = (cut === undefined) ? U_ICUT : { value: cut };
  m.onBeforeCompile = sh => {
    sh.uniforms.uG = { value: IMP_G };
    sh.uniforms.uIGain = m.userData.uIGain;
    sh.uniforms.uILight = m.userData.uILight;
    sh.uniforms.uICut = m.userData.uICut;
    sh.uniforms.uISolid = m.userData.uISolid;
    sh.uniforms.uISph = U_ISPH;
    sh.uniforms.uILit = U_ILIT;
    sh.uniforms.uNrm = { value: atlas.nrm };
    sh.uniforms.uWrap = U_WRAP;
    sh.uniforms.uSSS = U_SSS;
    sh.uniforms.uSSSP = U_SSSP;
    // the whole billboard takes the leaf terms. A trunk is a few percent of an
    // impostor's pixels at the range one is drawn at, and a separate leafness
    // mask would cost a third sheet to save something nobody can see.
    sh.uniforms.uLeaf = { value: 1 };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>',
        ['#include <common>', 'attribute vec3 impDir;', 'varying vec3 vImpDir;'].join(NL))
      .replace('#include <begin_vertex>',
        ['#include <begin_vertex>', 'vImpDir = impDir;'].join(NL));
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>',
        ['#include <common>',
         'uniform float uG, uIGain, uICut, uISolid, uILight, uISph, uILit;',
         'uniform sampler2D uNrm;', 'varying vec3 vImpDir;',
         // LEAF_GLSL's own dials, which hookTint declares for the geometry
         'uniform float uWrap, uSSS, uSSSP, uLeaf;',
         // written out rather than borrowed: <map_fragment> and its
         // mapTexelToLinear are replaced below, so the decode has to be here
         'vec3 impSRGB(vec3 c) {',
         '  return mix(pow((c + 0.055) / 1.055, vec3(2.4)), c / 12.92,',
         '             step(c, vec3(0.04045)));',
         '}'].join(NL))
      .replace('#include <map_fragment>',
        IMP_SAMPLE.concat([
          // A GAMMA, NOT A MULTIPLY. Every collection needed brightening after
          // the bake went to a binary mask, and a flat multiply took the trunk
          // with it - the larch's pale bark went white, as if it had lost its
          // texture. A gamma lifts the dark end and leaves what is already
          // bright where it is, which is the correction that was actually
          // wanted: the foliage was dark, the bark was not.
          'vec3 rgbT = pow(clamp(rgbI, 0.0, 1.0), vec3(1.0 / max(uILight, 0.05)));',
          'diffuseColor *= vec4(impSRGB(rgbT), aOut);',
          // ---- and now the other half of the G-buffer ----
          // The same three taps, un-premultiplied by the normal sheet's OWN
          // alpha: its mips are a straight average, so an empty texel pulls a
          // normal toward (-1,-1,-1) unless it is divided back out.
          'vec4 n0 = texture2D(uNrm, uvA);',
          'vec4 n1 = texture2D(uNrm, uvB);',
          'vec4 n2 = texture2D(uNrm, uvC);',
          'float nW = dot(wB, vec3(n0.a, n1.a, n2.a));',
          'vec3 nEnc = (n0.rgb * wB.x + n1.rgb * wB.y + n2.rgb * wB.z) / max(nW, 1e-4);',
          'vec3 nBake = nEnc * 2.0 - 1.0;',
          'if (dot(nBake, nBake) < 1e-4) nBake = dI;',   // no leaf: face the eye
          // the hemisphere, in the billboard's own basis - same right/up the
          // bake camera and the CPU quad are built with, pole fallback included
          'vec3 rgtW = abs(dI.y) > 0.999 ? vec3(1.0, 0.0, 0.0)',
          '                              : normalize(vec3(dI.z, 0.0, -dI.x));',
          'vec3 upW = cross(dI, rgtW);',
          'vec2 spN = vUv * 2.0 - 1.0;',
          'vec3 nSph = normalize(rgtW * spN.x + upW * spN.y',
          '                      + dI * sqrt(clamp(1.0 - dot(spN, spN), 0.0, 1.0)));',
          'vec3 nImpW = normalize(mix(normalize(nBake), nSph, uISph));',
          // the lighting chain works in VIEW space
          'vec3 nImpV = normalize((viewMatrix * vec4(nImpW, 0.0)).xyz);'])
          .join(NL).replace(/IMP_TILE_JS/g, String(atlas.tile || IMP_TILE)))
      // the substitution that buys the rig: both of them, because
      // lights_fragment_maps reads geometryNormal for the environment
      .replace('#include <normal_fragment_maps>',
        ['#include <normal_fragment_maps>', 'normal = nImpV;',
         'geometryNormal = nImpV;'].join(NL))
      // and the leaf terms, verbatim from the geometry foliage
      .replace('#include <lights_fragment_end>',
        ['#include <lights_fragment_end>', LEAF_GLSL,
         // THE TIER'S OWN GAIN, on everything the lights put in - see U_ILIT.
         // All four terms, and the specular ones are not an afterthought: at
         // roughness 1 the physical model's MULTISCATTER term rides on the sky
         // irradiance and not on the albedo, and it measured 39.7 of the far
         // band's 55.6 luminance. Scaling only the diffuse left a floor that
         // ate the dial - twelve times the gain moved the stand by 36%.
         'reflectedLight.directDiffuse *= uILit;',
         'reflectedLight.indirectDiffuse *= uILit;',
         'reflectedLight.directSpecular *= uILit;',
         'reflectedLight.indirectSpecular *= uILit;'].join(NL));
  };
  return m;
}

// one field per prototype: every instance of that tree, in one buffer
// `sink` is the collection's own dial - how far the model is pushed into the
// ground to bury the roots it was authored with. The atlas is baked from the
// tree as it stands, roots and all, so the billboard has to be buried by the
// same amount or the flare sits proud of the ground where the geometry's does
// not. It scales with the instance: a tree drawn 1.2x larger has roots 1.2x
// deeper.
function makeImpField(atlas, gain, light, sink, solid, cut, a2c) {
  const F = { atlas: atlas, items: [], mesh: null, gain: gain, light: light,
              sink: sink || 0, solid: solid, cut: cut, a2c: a2c };
  F.add = (x, y, z, s) => F.items.push(x, y, z, s);
  F.build = () => {
    const n = F.items.length / 4;
    if (!n) return null;
    const g = new THREE.BufferGeometry();
    const pos = new Float32Array(n * 4 * 3);
    const dir = new Float32Array(n * 4 * 3);
    const uv = new Float32Array(n * 4 * 2);
    const idx = new (n * 4 > 65535 ? Uint32Array : Uint16Array)(n * 6);
    for (let i = 0; i < n; i++) {
      uv.set([0, 0, 1, 0, 1, 1, 0, 1], i * 8);
      const v = i * 4;
      idx.set([v, v + 1, v + 2, v, v + 2, v + 3], i * 6);
    }
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('impDir', new THREE.BufferAttribute(dir, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);   // never culled
    F.mesh = new THREE.Mesh(g, impostorMaterial(F.atlas, F.gain, F.light, F.solid,
                                                F.cut, F.a2c));
    F.mesh.frustumCulled = false;
    F.mesh.castShadow = false;
    F.mesh.receiveShadow = true;     // it takes the map now; see impostorMaterial
    // applyShadows() re-enables castShadow on everything in the stage, and
    // without a depth material of its own the billboard is back to laying a
    // solid rectangle. The decal below IS its shadow; flag both out of the map.
    F.mesh.userData.noShadow = true;
    F.mesh.matrixAutoUpdate = false;      // the vertices ARE world space

    // the caster's UVs are the fixed side tile, cell (0,0), inset by half a
    // texel so the neighbouring views cannot bleed into the silhouette
    const suv = new Float32Array(n * 4 * 2);
    const sg = new THREE.BufferGeometry();
    sg.setAttribute('position',
      new THREE.BufferAttribute(new Float32Array(n * 4 * 3), 3).setUsage(THREE.DynamicDrawUsage));
    sg.setAttribute('uv', new THREE.BufferAttribute(suv, 2).setUsage(THREE.DynamicDrawUsage));
    sg.setIndex(new THREE.BufferAttribute(idx.slice(0), 1));
    sg.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
    F.shadowMesh = new THREE.Mesh(sg, impostorCasterMaterial(F.atlas));
    F.shadowMesh.customDepthMaterial = impostorCasterDepth(F.atlas);
    F.shadowMesh.frustumCulled = false;
    F.shadowMesh.matrixAutoUpdate = false;
    F.shadowMesh.castShadow = true;
    F.shadowMesh.receiveShadow = false;
    F.shadowMesh.userData.noShadow = true;       // applyShadows must not touch it
    F.mesh.add(F.shadowMesh);             // rides along wherever the field goes
    F.layShadows();
    return F.mesh;
  };
  // The casters do not depend on the eye at all, so they are laid once and only
  // re-laid when the SUN moves. Same right/up convention as the bake and the
  // billboard, so the tile is read with the roll it was drawn at.
  F.layShadows = () => {
    if (!F.shadowMesh) return;
    let sx = sun.position.x - sun.target.position.x,
        sy = sun.position.y - sun.target.position.y,
        sz = sun.position.z - sun.target.position.z;
    const sl = Math.hypot(sx, sy, sz) || 1; sx /= sl; sy /= sl; sz /= sl;
    let rx, ry = 0, rz;
    if (Math.abs(sy) > 0.999) { rx = 1; rz = 0; }
    else { rx = sz; rz = -sx; const q = Math.hypot(rx, rz) || 1; rx /= q; rz /= q; }
    const ux = ry * sz - rz * sy, uy = rz * sx - rx * sz, uz = rx * sy - ry * sx;
    // WHICH VIEW THE SUN SEES. The atlas holds 64 of them; picking cell (0,0)
    // always would give a side elevation whatever the sun's elevation, so a
    // high sun would cast the tree's profile instead of its crown. The same
    // hemi-octahedral fold the draw shader uses, run on the CPU against the
    // LIGHT's direction, picks the nearest baked view - and because the caster
    // is re-laid whenever the sun moves, the silhouette turns with it.
    const den = Math.abs(sx) + Math.abs(sz) + Math.max(sy, 0) + 1e-5;
    const ppx = sx / den, ppy = sz / den;
    const ocx = Math.min(1, Math.max(-1, ppx + ppy));
    const ocy = Math.min(1, Math.max(-1, ppx - ppy));
    const gi = Math.round((ocx * 0.5 + 0.5) * (IMP_G - 1));
    const gj = Math.round((ocy * 0.5 + 0.5) * (IMP_G - 1));
    const TL = F.atlas.tile || IMP_TILE;
    const u0 = (gi + 1 / TL) / IMP_G, u1 = (gi + 1 - 1 / TL) / IMP_G;
    const v0 = (gj + 1 / TL) / IMP_G, v1 = (gj + 1 - 1 / TL) / IMP_G;
    // V IS FLIPPED against the billboard's. The billboard is read from the
    // near face of its quad and the caster from the far one - the shadow map
    // looks at it from the light's side - so the tile's vertical axis comes
    // out reversed, and the crown landed where the trunk should be.
    const suvA = F.shadowMesh.geometry.attributes.uv;
    for (let i = 0; i < F.items.length / 4; i++)
      suvA.array.set([u0, v1, u1, v1, u1, v0, u0, v0], i * 8);
    suvA.needsUpdate = true;

    const arr = F.shadowMesh.geometry.attributes.position.array;
    const half = F.atlas.diam * 0.5, cyOff = F.atlas.cy;
    const n = F.items.length / 4;
    const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
    for (let i = 0; i < n; i++) {
      const x = F.items[i * 4], y = F.items[i * 4 + 1],
            z = F.items[i * 4 + 2], sc = F.items[i * 4 + 3];
      const ox = x, oy = y + cyOff * sc, oz = z;
      const hs = half * sc, o = i * 12;
      for (let c = 0; c < 4; c++) {
        const a = corners[c][0] * hs, b = corners[c][1] * hs;
        arr[o + c * 3]     = ox + rx * a + ux * b;
        arr[o + c * 3 + 1] = oy + ry * a + uy * b;
        arr[o + c * 3 + 2] = oz + rz * a + uz * b;
      }
    }
    F.shadowMesh.geometry.attributes.position.needsUpdate = true;
  };

  // rebuilt whenever the eye moves: four corners and one direction per tree
  F.update = cam => {
    if (!F.mesh) return;
    const n = F.items.length / 4;
    const pos = F.mesh.geometry.attributes.position.array;
    const dir = F.mesh.geometry.attributes.impDir.array;
    const cx = cam.position.x, cy = cam.position.y, cz = cam.position.z;
    const half = F.atlas.diam * 0.5, cyOff = F.atlas.cy;
    for (let i = 0; i < n; i++) {
      const x = F.items[i * 4], y = F.items[i * 4 + 1],
            z = F.items[i * 4 + 2], s = F.items[i * 4 + 3];
      const ox = x, oy = y + cyOff * s, oz = z;          // the tree's own centre
      let dx = cx - ox, dy = cy - oy, dz = cz - oz;
      const dl = Math.hypot(dx, dy, dz) || 1;
      dx /= dl; dy /= dl; dz /= dl;
      // right = up x dir, flattened; up = dir x right. At the pole the world
      // up is useless, so fall back the same way the bake's camera does.
      let rx, ry, rz;
      if (Math.abs(dy) > 0.999) { rx = 1; ry = 0; rz = 0; }
      else { rx = dz; ry = 0; rz = -dx; const rl = Math.hypot(rx, rz) || 1; rx /= rl; rz /= rl; }
      // up = dir x right, NOT right x dir. The other order is the negative,
      // which flips every billboard upside down.
      const ux = dy * rz - dz * ry, uy = dz * rx - dx * rz, uz = dx * ry - dy * rx;
      const hs = half * s;
      const o = i * 12, d = i * 12;
      const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
      for (let c = 0; c < 4; c++) {
        const a = corners[c][0] * hs, b = corners[c][1] * hs;
        pos[o + c * 3]     = ox + rx * a + ux * b;
        pos[o + c * 3 + 1] = oy + ry * a + uy * b;
        pos[o + c * 3 + 2] = oz + rz * a + uz * b;
        dir[d + c * 3]     = dx;
        dir[d + c * 3 + 1] = dy;
        dir[d + c * 3 + 2] = dz;
      }
    }
    F.mesh.geometry.attributes.position.needsUpdate = true;
    F.mesh.geometry.attributes.impDir.needsUpdate = true;
    if (F.shadowMesh) {
      const k = (sun.position.x - sun.target.position.x).toFixed(1) + ',' +
                (sun.position.y - sun.target.position.y).toFixed(1);
      if (k !== F._sunKeyRaw) { F._sunKeyRaw = k; F.layShadows(); }
    }
  };
  return F;
}

function updateImpFields() {
  for (const F of IMP_FIELDS) F.update(camera);
  for (const F of VAR_FIELDS) F.update(camera);
}

// One atlas per prototype — kept only while it is still TRUE.
//
// This cache is what kept the far band bare. The key was the tree's name and
// nothing else, so the first atlas baked in a session outlived every fix made
// after it: the one that mattered was the cutout guard below, and the stale
// tile it had already stored carried a zero alpha channel. Every fragment then
// failed the impostor's alpha test and the quad drew nothing at all, while a
// fresh bake of the same tree, with the same code, was correct. Measured on
// fir_tree_georgeous | Fir01_LOD0: cached max alpha 0 over 0 texels, fresh
// max alpha 255 over 215 184.
//
// So the key now carries a SIGNATURE of everything the bake looks at — the
// collection's own corrections, the mip rebuild, and the sky, exposure and
// leaf shading the tile is lit by. An atlas whose signature has moved is
// disposed, not drawn from. A cache that cannot say what it holds is a bug
// with a hit rate.
function impBakeSig(name) {
  const t = tuneOf(name);
  // How many maps have actually decoded is PART OF THE SIGNATURE, so an atlas
  // baked while a texture was still in flight is superseded the moment it
  // lands rather than outliving the session.
  const built = cache[name];
  let nMap = 0, nReady = 0;
  if (built) for (const m of built.mats) if (m.map) { nMap++; if (m.map.image) nReady++; }
  // AND WHAT NO LONGER BELONGS HERE. The sheet used to hold shaded RGB, so
  // the sky, the exposure and the leaf terms were all baked into it and every
  // one of them had to invalidate the atlas - changing the light meant fifteen
  // rebakes. It holds ALBEDO and NORMALS now: none of those reach it, and the
  // ones that do are the ones that change the tree itself. The AO is new to
  // the list for the same reason - it is IN the albedo now.
  return [t.hue, t.sat, t.light, t.bark, t.alpha, t.sink, t.dead, t.stick,
          MIPFIX ? 1 : 0, U_AOBAKE.value,
          CROWN_STRETCH, CROWN_W, TRUNK_DARK, nMap, nReady].join(',');
}
function impostorFor(key, proto, name, tile) {
  const sig = impBakeSig(name) + ',' + (tile || IMP_TILE);
  const hit = IMP_CACHE.get(key);
  if (hit && hit.sig === sig) return hit;
  if (hit && hit.tex) hit.tex.dispose();    // 4 MB a tile-sheet; do not leak them
  if (hit && hit.nrm) hit.nrm.dispose();    // and the normal sheet is a second
  const at = bakeImpostor(proto, tile);
  if (at) at.sig = sig;
  IMP_CACHE.set(key, at);
  return at;
}

async function showForest() {
  clearStage();
  man.visible = true;
  const picked = INDEX.assets.filter(a => PICK[a.name] && a.renderable &&
    a.trees.length && !a.trees.every(t => t.merged));
  $('msg').textContent = 'building stand...';

  // the ground first, because the trees are placed onto it
  forestGround = null;
  if (FOREST.ground !== 'plane') {
    const gb = await ensureLoaded(FOREST.ground);
    const ga = INDEX.assets.find(x => x.name === FOREST.ground);
    if (gb && ga) {
      retint(ga.name);
      const holder = new THREE.Group();
      const saveC = CUR; CUR = ga;
      for (const G of ga.terrain) { const h = buildGroup(gb, G); if (h) holder.add(h); }
      CUR = saveC;
      if (holder.children.length) { stage.add(holder); forestGround = holder; }
    }
  }
  ground.visible = !forestGround;
  grid.visible = !forestGround;

  const ray = new THREE.Raycaster();
  const down = new THREE.Vector3(0, -1, 0);
  const groundY = x0z => {
    if (!forestGround) return 0;
    ray.set(new THREE.Vector3(x0z[0], 1e4, x0z[1]), down);
    const hit = ray.intersectObject(forestGround, true)[0];
    return hit ? hit.point.y : null;
  };
  const groundY0 = () => groundY([0, 0]);

  // THE EYE IS CHOSEN BEFORE THE TREES, because the rung a tree gets is a
  // function of how far away it will actually be. Setting the camera at the
  // end and banding from the origin would have put the finest rung on the far
  // side of the stand.
  const my0 = groundY0();
  const base = my0 === null ? 0 : my0;
  man.position.set(0, base, 0);
  target.set(0, base + 14, 0);
  dist = FOREST.radius * 0.9; yaw = 0.5; pitch = 0.16; place();
  const eyeX = camera.position.x, eyeZ = camera.position.z;

  // ==========================================================================
  // THE LADDER, AND WHERE A TREE SITS ON IT
  //
  // Four rungs by distance from the eye, and TWO SERIES to choose between at
  // each rung. Which series a tree gets is not random: it is how far the tree
  // stands from an EDGE. A tree at the rim of a stand, or at the lip of a
  // glade, is lit from the side and furnished to the ground - that is the
  // specimen shape. A tree with neighbours all round it is shaded out below
  // and carries only a stretched top third. Getting that wrong is what makes
  // a game forest read as a field of identical christmas trees.
  //
  // The GLADES are what make the test worth running: scatter a few no-tree
  // pockets through the stand and suddenly edges are everywhere, not just at
  // the rim, so the two series interleave the way they would on real ground.
  // ==========================================================================
  const gRand = rng(FOREST.seed * 7919 + 13);
  const glades = [];
  for (let k = 0; k < FOREST.glades; k++) {
    const ga = gRand() * Math.PI * 2;
    const gr = (0.25 + 0.6 * gRand()) * FOREST.radius;
    glades.push({ x: Math.cos(ga) * gr, z: Math.sin(ga) * gr,
                  r: FOREST.radius * (0.06 + 0.10 * gRand()) });
  }

  // prototypes: the whole ladder, both series, per subject
  const protos = [];
  for (const a of picked) {
    const built = await ensureLoaded(a.name);
    if (!built) continue;
    await texturesReady();                 // the bake reads these; see imageTex
    retint(a.name);
    if (!MEAS[a.name] || !MEAS[a.name].px) MEAS[a.name] = measureAsset(a.name, built);
    for (const G of subjectsOf(a).slice(0, 6)) {
      const near = protoOf(built, a, G, false);
      if (!near) continue;
      const pr = { a: a, G: G, near: near };
      // rung 0-2 as meshes, rung 3 as a field; the specimen series first
      pr.spec = [near,
                 makeVariant(near, 'foliage', a, G),
                 makeVariant(near, 'halfFoliage', a, G)];
      pr.forest = [makeVariant(near, 'fFull', a, G),
                   makeVariant(near, 'crownStick', a, G),
                   makeVariant(near, 'crownHalf', a, G)];
      for (let k = 0; k < 3; k++) {
        if (!pr.spec[k]) pr.spec[k] = near;
        if (!pr.forest[k]) pr.forest[k] = pr.spec[k];
      }
      if (FOREST.impostor) {
        pr.atlasS = impostorFor(a.name + '|' + G.name, near, a.name);
        pr.atlasF = impostorFor(a.name + '|' + G.name + '|forest', pr.forest[0], a.name);
        if ((tuneOf(a.name).dead || 0) > 0) {
          pr.snag = stripFoliage(near) || null;
          if (pr.snag) pr.atlasD = impostorFor(a.name + '|' + G.name + '|snag',
                                               pr.snag, a.name, IMP_TILE_HI);
        }
      }
      protos.push(pr);
    }
    for (const G of a.billboards.slice(0, 2)) {
      const b = protoOf(built, a, G, false);
      if (b) protos.push({ a: a, G: G, near: b, spec: [b, b, b], forest: [b, b, b],
                           billboardOnly: true });
    }
  }
  for (const a of picked) a._nProto = protos.filter(p => p.a === a).length || 1;
  if (!protos.length) { $('msg').textContent = 'nothing selected'; render(); return; }
  const planted = {};

  IMP_FIELDS.length = 0;
  if (FOREST.impostor) for (const p of protos) {
    const t = tuneOf(p.a.name);
    // the three series, TAGGED - a field that cannot say which series it is
    // cannot be isolated, and an artefact blamed on the wrong one costs three
    // fixes that change nothing
    if (p.atlasS) { p.fieldS = makeImpField(p.atlasS, t.impa, t.implight, t.sink);
                    p.fieldS.kind = 'specimen'; IMP_FIELDS.push(p.fieldS); }
    // the stand tree stands on a stick; see STAND_CUT
    if (p.atlasF) { p.fieldF = makeImpField(p.atlasF, t.impa, t.implight, t.sink,
                                            undefined, STAND_CUT);
                    p.fieldF.kind = 'stand'; IMP_FIELDS.push(p.fieldF); }
    // the snag: its own alpha curve and no coverage dither, see impostorMaterial
    if (p.atlasD) { p.fieldD = makeImpField(p.atlasD, t.impa, t.implight, t.sink, 1,
                                            SNAG_CUT, false);
                    p.fieldD.kind = 'snag'; IMP_FIELDS.push(p.fieldD); }
  }
  const rand = rng(FOREST.seed);
  // the three boundaries ride on ONE dial, so the whole ladder moves together
  const b0 = FOREST.split, b1 = FOREST.split * 2.2, b2 = FOREST.split * 4.5;
  const lodN = [0, 0, 0, 0], serN = [0, 0, 0];
  let placedNear = 0, placedFar = 0, deadN = 0, rejected = 0, done = 0;

  for (let tries = 0; done < FOREST.count && tries < FOREST.count * 8; tries++) {
    const ang = rand() * Math.PI * 2;
    const rr = Math.sqrt(rand()) * FOREST.radius;
    const x = Math.cos(ang) * rr, z = Math.sin(ang) * rr;
    // how far is this from the nearest edge - the rim, or the lip of a glade
    let edge = FOREST.radius - rr, inGlade = false;
    for (const g of glades) {
      const d = Math.hypot(x - g.x, z - g.z);
      if (d < g.r) { inGlade = true; break; }
      if (d - g.r < edge) edge = d - g.r;
    }
    if (inGlade) { rejected++; continue; }
    const y = groundY([x, z]);
    if (y === null) { rejected++; continue; }
    done++;

    const p = pickWeighted(protos, rand());
    const t = tuneOf(p.a.name);
    // An edge tree is always the specimen shape. An INTERIOR one usually is
    // not - but not never: a stand where every inside tree is a bare pole and
    // a tuft reads empty at density, because a real one is uneven. Some trees
    // got there first, or stand over a gap, and are furnished most of the way
    // down. `furnished` is that fraction, and it is a look decision, not a
    // measurement, so it sits on a dial.
    const rim = edge < FOREST.edge;
    const spec = rim || rand() < FOREST.mix;
    const dEye = Math.hypot(x - eyeX, z - eyeZ);
    let lod = dEye < b0 ? 0 : dEye < b1 ? 1 : dEye < b2 ? 2 : 3;
    if (p.billboardOnly) lod = Math.min(lod, 2);

    // A SNAG IS ITS OWN SERIES, and a two-rung one: the full mesh while it is
    // close, then the impostor for everything else. The stick rungs the live
    // series climbs make no sense here - there is no canopy to stand on a
    // stick - and a sheet baked at IMP_TILE_HI reads better at L1 than a
    // decimated trunk would.
    let dead = !p.billboardOnly && rand() < (t.dead || 0);
    if (dead && p.snag === undefined) p.snag = stripFoliage(p.near) || null;
    if (dead && !p.snag) dead = false;
    if (dead) deadN++;
    const series = dead ? [p.snag, null, null] : spec ? p.spec : p.forest;
    const field = dead ? p.fieldD : spec ? p.fieldS : p.fieldF;
    serN[dead ? 2 : spec ? 0 : 1]++;

    const vary = Math.exp((rand() * 2 - 1) * FOREST.spread);
    // the live series turns into a billboard at L3; a snag does at L1
    const wantField = lod === 3 || (dead && lod >= 1);
    if (wantField && field) {
      field.add(x, y - (t.sink || 0) * vary * FOREST.scale, z, vary * FOREST.scale);
      planted[p.a.name] = (planted[p.a.name] || 0) + 1;
      placedFar++; lodN[lod]++;
      continue;
    }
    if (lod === 3) lod = 2;                            // no field: fall back a rung
    const proto = series[Math.min(2, lod)] || series[0];
    const inst = proto.clone(true);
    inst.position.set(x, y - (inst.userData.sink || 0), z);
    inst.rotation.y = rand() * Math.PI * 2;
    // SIZE is one dial over the whole stand; SPREAD is how much the
    // individuals differ from each other, and it is applied in the LOG so the
    // variation is symmetric in RATIO rather than in metres: at spread s a
    // tree is as likely to be e^s times the nominal as 1/e^s times it. A
    // uniform +/- on the multiplier would make the big half of the range
    // wider than the small half, which is the wrong shape for a stand — and
    // the default 0.2 reproduces the 0.82-1.22x this used to do by fiat.
    inst.scale.multiplyScalar(vary * FOREST.scale);
    stage.add(inst);
    planted[p.a.name] = (planted[p.a.name] || 0) + 1;
    lodN[lod]++;
    if (lod === 0) placedNear++; else placedFar++;
  }

  // the fields are filled by now: turn each into its one mesh
  for (const F of IMP_FIELDS) {
    const m = F.build();
    if (m) { F.update(camera); stage.add(m); }
  }
  applyWire();
  $('msg').textContent = '';
  measureStage();
  const t = tally();
  const stats = { tris: t.tris, meshes: t.meshes, near: placedNear,
                  far: placedFar, protos: protos.length, planted: planted, dead: deadN,
                  lod: lodN, series: serN, glades: glades.length, rejected: rejected };
  paintForestPanel(stats);
  render();
  // Textures decode asynchronously, so the first measurement of a freshly
  // loaded collection reads nothing. Come back for it — a colour pass that
  // silently reports "not measured" is worse than one that waits a second.
  let tries = 0;
  const chase = setInterval(() => {
    let missing = 0;
    for (const a of picked) {
      if (MEAS[a.name] && MEAS[a.name].px) continue;
      const b = cache[a.name];
      if (b) { MEAS[a.name] = measureAsset(a.name, b); if (MIPFIX) mipFixAsset(a.name); }
      if (!MEAS[a.name] || !MEAS[a.name].px) missing++;
    }
    if (!missing || ++tries > 12) { clearInterval(chase); paintForestPanel(stats); }
    else paintForestPanel(stats);
  }, 700);
}



// ==========================================================================
// THE VARIANT GRID — which cuts are worth making, side by side
//
// The question this answers is not "does a cheaper tree exist" but "which
// cut buys the most triangles for the least look". So every subject of a
// collection is derived six ways and laid out on one shelf: SUBJECTS along X,
// VARIANTS along Z, triangle count over each. A cut that costs nothing
// visually and halves the count is the one to take; a cut that halves the
// count and ruins the silhouette is not, and both are obvious in one view.
//
// The cuts are made on CONNECTED COMPONENTS of the foliage, not on triangles:
// an island of the leaf mesh is a branch cluster, so dropping islands drops
// whole branches and leaves the survivors at full resolution. Decimating
// triangles instead would melt every leaf card into mush, which is the wrong
// trade for alpha-tested foliage.
// ==========================================================================
// ==========================================================================
// THE LADDER, AS TWO SERIES
//
// The analysis cuts did their job: the woody decomposition said that branch
// structure is more than half of a tree and reads as almost nothing past the
// first rung, so the real trunk and its branches are LOD0 and nothing else.
// Every rung after it stands the canopy on a generated stick.
//
// Two series, because a tree at the edge of a stand and a tree inside one are
// not the same shape. The FULL series is the specimen tree - the one at a
// clearing's edge, furnished to the ground. The FOREST series is the tree in a
// closed stand: only the top third carries foliage, it is stretched, and its
// crown is widened, because that is what competition does to a conifer. Each
// series ends in its own impostor, baked from its own shape - a forest tree
// baked from the specimen would put branches where the stand has none.
// ==========================================================================
const VARIANTS = [
  { key: 'full',        name: 'L0  full' },
  { key: 'foliage',     name: 'L1  stick + foliage' },
  { key: 'halfFoliage', name: 'L2  stick + half foliage' },
  { key: 'impostor',    name: 'L3  impostor' },
  { key: 'fFull',       name: 'forest L0  full' },
  { key: 'crownStick',  name: 'forest L1  stick + crown' },
  { key: 'crownHalf',   name: 'forest L2  stick + half crown' },
  { key: 'fImpostor',   name: 'forest L3  impostor' },
  { key: 'snag',        name: 'snag L0  full' },
  { key: 'snagImpostor', name: 'snag L1-3  impostor' },
];
let CROWN_STRETCH = 1.3;
let CROWN_W = 1.0;       // the crown grows sideways too, not only upward

// islands of a geometry, as lists of triangle numbers
function geoComponents(geo) {
  const idx = geo.index ? geo.index.array : null;
  const pos = geo.attributes.position;
  const nTri = idx ? idx.length / 3 : pos.count / 3;
  const nv = pos.count;
  const parent = new Int32Array(nv);
  for (let i = 0; i < nv; i++) parent[i] = i;
  const find = x => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  const uni = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[rb] = ra; };
  for (let t = 0; t < nTri; t++) {
    const a = idx ? idx[t * 3] : t * 3, b = idx ? idx[t * 3 + 1] : t * 3 + 1,
          c = idx ? idx[t * 3 + 2] : t * 3 + 2;
    uni(a, b); uni(b, c);
  }
  const map = new Map();
  for (let t = 0; t < nTri; t++) {
    const a = idx ? idx[t * 3] : t * 3;
    const r = find(a);
    let G = map.get(r);
    if (!G) { map.set(r, G = { tris: [], x: 0, y: 0, z: 0, n: 0 }); }
    G.tris.push(t);
    for (let k = 0; k < 3; k++) {
      const v = idx ? idx[t * 3 + k] : t * 3 + k;
      G.x += pos.getX(v); G.y += pos.getY(v); G.z += pos.getZ(v); G.n++;
    }
  }
  const out = [...map.values()];
  for (const G of out) { G.x /= G.n; G.y /= G.n; G.z /= G.n; }
  return { comps: out, idx: idx, nTri: nTri };
}

// keep(componentCentroidY) -> bool, on the CUTOUT meshes only
// THE CENTROID MUST BE IN WORLD SPACE, and this was the bug behind three of
// the four symptoms. A Sketchfab export carries its Z-up -> Y-up conversion
// in a WRAPPER MATRIX, not in the vertices: cedar's height runs along local Z
// (its POSITION spans 136 000 units in Z), the LOLIPOP fir's along local -Y.
// Filtering on raw geometry Y therefore cut a different axis in every pack —
// the left half off one, everything off another.
function cullFoliage(root, keep) {
  root.updateMatrixWorld(true);
  const v = new THREE.Vector3();
  root.traverse(o => {
    if (!o.isMesh || !o.material || o.material.userData.alphaMode === 'OPAQUE') return;
    const geo = o.geometry;
    if (!geo.attributes.position) return;
    const info = geoComponents(geo);
    const src = info.idx;
    const out = [];
    for (const C of info.comps) {
      v.set(C.x, C.y, C.z).applyMatrix4(o.matrixWorld);
      if (!keep(v.y)) continue;
      for (const t of C.tris) {
        for (let k = 0; k < 3; k++) out.push(src ? src[t * 3 + k] : t * 3 + k);
      }
    }
    const ng = geo.clone();
    ng.setIndex(out);
    o.geometry = ng;
  });
}

// cut the flared base off a trunk: exactly the part that gets buried
function cullRoots(root, below) {
  if (below <= 0) return;
  root.updateMatrixWorld(true);
  const v = new THREE.Vector3();
  root.traverse(o => {
    if (!o.isMesh || !o.material || o.material.userData.alphaMode !== 'OPAQUE') return;
    const geo = o.geometry, pos = geo.attributes.position;
    const idx = geo.index ? geo.index.array : null;
    const nTri = idx ? idx.length / 3 : pos.count / 3;
    const out = [];
    for (let t = 0; t < nTri; t++) {
      let y = 0;
      for (let k = 0; k < 3; k++) {
        const vi = idx ? idx[t * 3 + k] : t * 3 + k;
        v.set(pos.getX(vi), pos.getY(vi), pos.getZ(vi)).applyMatrix4(o.matrixWorld);
        y += v.y;
      }
      if (y / 3 < below) continue;
      for (let k = 0; k < 3; k++) out.push(idx ? idx[t * 3 + k] : t * 3 + k);
    }
    const ng = geo.clone();
    ng.setIndex(out);
    o.geometry = ng;
  });
}

// GROW THE CROWN SIDEWAYS. Stretching a forest tree upward alone leaves it a
// spike; a conifer closing canopy with its neighbours spreads as well as
// climbs. Only the CUTOUT meshes move - scaling the holder would fatten the
// trunk with the crown, and a 2 m bole is not what competition produces. The
// scale is taken about the tree's own vertical axis, in world space, because
// the packs do not agree on which local axis is up.
function growCrown(root, k) {
  if (Math.abs(k - 1) < 1e-3) return;
  root.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(root);
  if (!isFinite(bb.min.x)) return;
  const ax = (bb.min.x + bb.max.x) / 2, az = (bb.min.z + bb.max.z) / 2;
  const v = new THREE.Vector3(), inv = new THREE.Matrix4();
  root.traverse(o => {
    if (!o.isMesh || !o.material || o.material.userData.alphaMode === 'OPAQUE') return;
    const g = o.geometry.clone(), pos = g.attributes.position;
    if (!pos) return;
    inv.copy(o.matrixWorld).invert();
    for (let i = 0; i < pos.count; i++) {
      v.set(pos.getX(i), pos.getY(i), pos.getZ(i)).applyMatrix4(o.matrixWorld);
      v.x = ax + (v.x - ax) * k;
      v.z = az + (v.z - az) * k;
      v.applyMatrix4(inv);
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    pos.needsUpdate = true;
    o.geometry = g;
  });
}

// Remove the woody mesh entirely - what a stick is going to stand in for.
function stripBark(root) {
  const kill = [];
  root.traverse(o => {
    if (o.isMesh && o.material && o.material.userData.alphaMode === 'OPAQUE') kill.push(o);
  });
  for (const o of kill) if (o.parent) o.parent.remove(o);
}

// The stand-in stem: a tapered cylinder wearing the pack's own bark material,
// sized from the wood it replaces. `frac` is the collection's own `stick` dial.
function stickFor(c, frac) {
  const local = new THREE.Box3();
  const sp = c.position.clone(), ss = c.scale.clone();
  c.position.set(0, 0, 0); c.scale.set(1, 1, 1); c.updateMatrixWorld(true);
  let bark = null;
  c.traverse(o => {
    if (!o.isMesh || !o.material) return;
    if (o.material.userData.alphaMode !== 'OPAQUE') return;
    bark = bark || o.material;
    local.expandByObject(o);
  });
  c.position.copy(sp); c.scale.copy(ss); c.updateMatrixWorld(true);
  if (!isFinite(local.min.x)) return null;
  const hh = Math.max(0.5, local.max.y - local.min.y);
  const rr = Math.max(0.02, Math.min(local.max.x - local.min.x,
                                     local.max.z - local.min.z) * frac);
  const stg = new THREE.CylinderGeometry(rr * 0.35, rr, hh, 7, 1, true);
  {                                      // the same foot-to-crown gradient
    const sp2 = stg.attributes.position, sa = new Float32Array(sp2.count);
    for (let i = 0; i < sp2.count; i++) sa[i] = trunkShade((sp2.getY(i) + hh / 2) / hh);
    stg.setAttribute('aoV', new THREE.BufferAttribute(sa, 1));
  }
  const st = new THREE.Mesh(stg,
    bark || new THREE.MeshStandardMaterial({ color: 0x5b4636, roughness: 1 }));
  st.position.set((local.min.x + local.max.x) / 2, local.min.y + hh / 2,
                  (local.min.z + local.max.z) / 2);
  return st;
}

// ==========================================================================
// STEM OR BRANCH - told apart by MEASUREMENT, because no pack says which
//
// More than half a tree's triangles are in its branch structure, and at any
// distance where an impostor is not yet acceptable that structure is the first
// thing worth spending. But the packs give no handle on it: the woody geometry
// arrives as one bark mesh, and material names disagree across authors
// (LOLIPOP's `Branches_Mat` is wood, GEORGEOUS's `B_Branch_Mat` is leaf cards).
//
// So the split is geometric. The stem is the wood that stays near the tree's
// vertical axis; a branch is wood that leaves it. Per height band the INNERMOST
// tenth of the bark's radial spread is taken as the stem's own radius there -
// a low percentile, because in the crown the branches outnumber the trunk and
// any average would be dragged out to them - and anything past a margin of it
// is a branch. The axis itself is read off the lowest band, where the trunk is
// the only wood there is, rather than from a bounding box that a lopsided crown
// would shift.
//
// It is a heuristic and it is meant to be looked at. A pack whose bark mesh is
// only a trunk yields an EMPTY branch set, which is the honest answer.
// ==========================================================================
function barkSplit(root, keepStem) {
  root.updateMatrixWorld(true);
  const NB = 24;
  const meshes = [];
  let ymin = Infinity, ymax = -Infinity;
  const v = new THREE.Vector3();
  root.traverse(o => {
    if (!o.isMesh || !o.material || o.material.userData.alphaMode !== 'OPAQUE') return;
    const geo = o.geometry, pos = geo.attributes.position;
    if (!pos) return;
    const idx = geo.index ? geo.index.array : null;
    const nTri = idx ? idx.length / 3 : pos.count / 3;
    const cen = new Float32Array(nTri * 3);
    for (let t = 0; t < nTri; t++) {
      let x = 0, y = 0, z = 0;
      for (let k = 0; k < 3; k++) {
        const i = idx ? idx[t * 3 + k] : t * 3 + k;
        v.set(pos.getX(i), pos.getY(i), pos.getZ(i)).applyMatrix4(o.matrixWorld);
        x += v.x; y += v.y; z += v.z;
      }
      cen[t * 3] = x / 3; cen[t * 3 + 1] = y / 3; cen[t * 3 + 2] = z / 3;
      if (cen[t * 3 + 1] < ymin) ymin = cen[t * 3 + 1];
      if (cen[t * 3 + 1] > ymax) ymax = cen[t * 3 + 1];
    }
    meshes.push({ o: o, geo: geo, idx: idx, nTri: nTri, cen: cen });
  });
  if (!meshes.length) return;
  const H = Math.max(1e-3, ymax - ymin);
  const band = y => Math.max(0, Math.min(NB - 1, Math.floor((y - ymin) / H * NB)));

  // the axis, from the lowest band only
  let ax = 0, az = 0, n = 0;
  for (const M of meshes) for (let t = 0; t < M.nTri; t++) {
    if ((M.cen[t * 3 + 1] - ymin) / H > 0.08) continue;
    ax += M.cen[t * 3]; az += M.cen[t * 3 + 2]; n++;
  }
  if (!n) for (const M of meshes) for (let t = 0; t < M.nTri; t++) {
    ax += M.cen[t * 3]; az += M.cen[t * 3 + 2]; n++;
  }
  if (!n) return;
  ax /= n; az /= n;

  const rad = (M, t) => Math.hypot(M.cen[t * 3] - ax, M.cen[t * 3 + 2] - az);
  const bins = [];
  for (let b = 0; b < NB; b++) bins.push([]);
  for (const M of meshes) for (let t = 0; t < M.nTri; t++)
    bins[band(M.cen[t * 3 + 1])].push(rad(M, t));
  const thr = new Float64Array(NB);
  let last = H * 0.01;
  for (let b = 0; b < NB; b++) {
    const r = bins[b];
    if (!r.length) { thr[b] = last; continue; }
    r.sort((p, q) => p - q);
    thr[b] = Math.max(r[Math.floor(r.length * 0.10)] * 1.8, H * 0.004);
    last = thr[b];
  }

  for (const M of meshes) {
    const out = [];
    for (let t = 0; t < M.nTri; t++) {
      if ((rad(M, t) <= thr[band(M.cen[t * 3 + 1])]) !== keepStem) continue;
      for (let k = 0; k < 3; k++) out.push(M.idx ? M.idx[t * 3 + k] : t * 3 + k);
    }
    const ng = M.geo.clone();
    ng.setIndex(out);
    M.o.geometry = ng;
  }
}

function triCount(o) {
  let t = 0;
  o.traverse(m => {
    if (!m.isMesh) return;
    const g = m.geometry;
    t += (g.index ? g.index.count : g.attributes.position.count) / 3;
  });
  return Math.round(t);
}

// one derived model. `proto` is a holder from buildGroup, standing on zero.
function makeVariant(proto, kind, a, G, at) {
  if (kind === 'full') return proto.clone(true);
  const t = tuneOf(a.name);
  if (kind === 'snag') {
    const sn = stripFoliage(proto);
    return sn || null;
  }
  if (kind === 'impostor' || kind === 'fImpostor' || kind === 'snagImpostor') {
    // each series bakes from its OWN shape
    const forest = kind === 'fImpostor', snag = kind === 'snagImpostor';
    const src = forest ? makeVariant(proto, 'fFull', a, G)
              : snag ? stripFoliage(proto) : proto;
    if (!src) return null;
    const atl = impostorFor(a.name + '|' + G.name +
                            (forest ? '|forest' : snag ? '|snag' : ''),
                            src, a.name, snag ? IMP_TILE_HI : IMP_TILE);
    if (!atl) return null;
    const at = Object.assign({}, atl, { cellX: arguments[4] || 0, cellZ: arguments[5] || 0 });
    const F = makeImpField(at, t.impa, t.implight, t.sink,
                           snag ? 1 : undefined,
                           snag ? SNAG_CUT : forest ? STAND_CUT : undefined,
                           snag ? false : undefined);
    // WORLD SPACE: the field ignores any transform on its holder, so the
    // cell's own position has to go into the instance itself.
    F.add(at.cellX || 0, -(t.sink || 0), at.cellZ || 0, 1);
    const m = F.build();
    if (!m) return null;
    F.update(camera);
    // returned BARE, not wrapped: the field's vertices are world space, and
    // nesting it under a holder was the difference between the stand (which
    // adds the mesh straight to the stage, and draws) and this cell.
    m.userData.field = F;               // re-aimed every frame like the stand
    return m;
  }
  const c = proto.clone(true);
  const bb = new THREE.Box3().setFromObject(c);
  const y0 = bb.min.y, h = Math.max(0.01, bb.max.y - y0);
  if (kind === 'wood' || kind === 'branch' || kind === 'stem') {
    // THE WOODY DECOMPOSITION, and the reason it is here: more than half of a
    // full tree's triangles are branch structure that reads as almost nothing
    // at distance. `wood` is the whole bark mesh; `stem` and `branch` are its
    // two halves, so the grid can price that structure on its own.
    cullFoliage(c, () => false);
    if (kind !== 'wood') barkSplit(c, kind === 'stem');
    if (kind !== 'branch') cullRoots(c, y0 + (t.sink || 0));
    return c;
  }
  if (kind === 'fFull') {
    // the FOREST tree's LOD0: only the top third is furnished, and it is both
    // stretched and widened - the shape a conifer takes in a closed stand
    cullFoliage(c, y => (y - y0) / h > 0.62);
    growCrown(c, CROWN_W);
    c.scale.y *= CROWN_STRETCH;
    return c;
  }
  // FOLIAGE ON A STICK, the whole rest of both ladders. The canopy is kept and
  // every woody triangle is spent on one tapered cylinder; `crown*` furnishes
  // only the top third, `half*` thins what is left. The top of the crown is
  // never thinned - it is the silhouette, and it is what a distant viewer
  // actually reads.
  const crownOnly = kind === 'crownStick' || kind === 'crownHalf';
  const half = kind === 'halfFoliage' || kind === 'crownHalf';
  const st = stickFor(c, t.stick);       // measured BEFORE the wood goes
  const rr = rng(0x9e37 + kind.length * 131);
  cullFoliage(c, y => {
    const f = (y - y0) / h;
    if (crownOnly && f <= 0.62) return false;
    if (half && f < 0.78 && rr() > 0.5) return false;
    return true;
  });
  stripBark(c);
  if (crownOnly) growCrown(c, CROWN_W);
  if (st) c.add(st);
  if (crownOnly) c.scale.y *= CROWN_STRETCH;
  return c;
}

// ---- a caption over each cell -------------------------------------------
function labelSprite(text, sub) {
  const cv2 = document.createElement('canvas');
  cv2.width = 256; cv2.height = 72;
  const g = cv2.getContext('2d');
  g.fillStyle = 'rgba(10,14,20,0.72)';
  g.fillRect(0, 0, 256, 72);
  g.textAlign = 'center';
  g.fillStyle = '#5db3ff';
  g.font = 'bold 34px ui-monospace, monospace';
  g.fillText(text, 128, 34);
  if (sub) {
    g.fillStyle = '#9fb0c0';
    g.font = '22px ui-monospace, monospace';
    g.fillText(sub, 128, 62);
  }
  const t = new THREE.CanvasTexture(cv2);
  t.encoding = THREE.sRGBEncoding;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, toneMapped: false, depthTest: false }));
  sp.renderOrder = 999;
  return sp;
}

// ---- the grid ------------------------------------------------------------
function showVariants(built) {
  clearStage();
  VAR_FIELDS.length = 0;
  const subjects = subjectsOf(CUR);
  if (!subjects.length) { $('msg').textContent = 'no trees in this collection'; render(); return null; }

  let x = 0, maxH = 0, maxZ = 0;
  const stats = [];
  for (const G of subjects) {
    const base = buildGroup(built, G);
    if (!base) continue;
    const w = Math.max(6, base.userData.w * 1.5);
    x += w / 2;
    let z = 0;
    for (let vi = 0; vi < VARIANTS.length; vi++) {
      const V = VARIANTS[vi];
      const m = makeVariant(base, V.key, CUR, G, x, -z);
      if (!m) { z += w * 1.25; continue; }
      if (!m.userData.field) m.position.set(x, 0, -z);
      stage.add(m);
      if (m.userData.field) VAR_FIELDS.push(m.userData.field);
      const bb = new THREE.Box3().setFromObject(m);
      const hh = isFinite(bb.max.y) ? bb.max.y : base.userData.h;
      maxH = Math.max(maxH, hh);
      const n = m.userData.field ? 2 : triCount(m);
      const lab = labelSprite(n.toLocaleString() + ' t', V.name);
      lab.position.set(x, hh + 2.6, -z);
      lab.scale.set(w * 0.9, w * 0.25, 1);
      stage.add(lab);
      stats.push({ subject: G.name, variant: V.key, tris: n });
      z += w * 1.25;
      maxZ = Math.max(maxZ, z);
    }
    x += w / 2 + 2;
  }
  man.position.set(-2.5, 0, 0); man.visible = true;
  applyWire();
  measureStage();
  target.set(x / 2, maxH * 0.4, -maxZ / 2);
  dist = Math.max(40, Math.max(x, maxZ) * 0.85);
  yaw = 0.62; pitch = 0.30; place();
  return { cells: stats.length, stats: stats, maxH: maxH };
}
const VAR_FIELDS = [];

// ---- the stand's own panel ----------------------------------------------
// One row per collection: in or out of the mix, what its leaves MEASURE, and
// the four dials that correct them. The measurement is shown beside the dials
// deliberately — a correction you cannot see the reason for is a preference,
// and this pass is meant to be answerable.
function paintForestPanel(stats) {
  const ui = $('ui');
  const rows = INDEX.assets.filter(a => a.renderable && (a.trees.length || a.billboards.length));
  const terr = INDEX.assets.filter(a => a.renderable && a.terrain.length);
  let h = '<div class="grp">THE STAND</div><table>';
  if (stats) {
    h += '<tr><td class="k">drawn</td><td>' + stats.tris.toLocaleString() + ' tris · ' +
         stats.meshes + ' meshes</td></tr>' +
         '<tr><td class="k">ladder</td><td>' + (stats.lod || []).map((n, i) =>
             'L' + i + ' ' + n).join(' · ') + '</td></tr>' +
         '<tr><td class="k">series</td><td>' + (stats.series ? stats.series[0] : 0) +
         ' furnished · ' + (stats.series ? stats.series[1] : 0) + ' stand-shaped · ' +
         (stats.series ? stats.series[2] : 0) + ' snags' + '</td></tr>' +
         '<tr><td class="k">prototypes</td><td>' + stats.protos +
         (stats.glades ? ' · ' + stats.glades + ' glades, ' + stats.rejected + ' rejected' : '') +
         '</td></tr>';
  }
  h += '<tr><td class="k">ground</td><td><select id="fGround"><option value="plane">flat plane</option>' +
       terr.map(a => '<option value="' + a.name + '"' + (FOREST.ground === a.name ? ' selected' : '') +
         '>' + a.name.replace(/\.glb$/, '') + ' (' + a.terrain.length + ')</option>').join('') +
       '</select></td></tr>';
  h += '<tr><td class="k">trees</td><td><input type="range" id="fCount" min="20" max="2000" step="20" value="' +
       FOREST.count + '"> <i style="color:var(--acc)">' + FOREST.count + '</i></td></tr>';
  h += '<tr><td class="k">size</td><td><input type="range" id="fScale" min="0.3" max="2.5" step="0.05" value="' +
       FOREST.scale + '"> <i style="color:var(--acc)">x' + FOREST.scale.toFixed(2) + '</i></td></tr>';
  h += '<tr><td class="k">spread</td><td><input type="range" id="fSpread" min="0" max="1" step="0.02" value="' +
       FOREST.spread + '"> <i style="color:var(--acc)">' + spreadLabel(FOREST.spread) + '</i></td></tr>';
  h += '<tr><td class="k">L0 band</td><td><input type="range" id="fSplit" min="10" max="200" step="5" value="' +
       FOREST.split + '"> <i style="color:var(--acc)">' + FOREST.split + ' m · L1 ' +
       Math.round(FOREST.split * 2.2) + ' · L2 ' + Math.round(FOREST.split * 4.5) + '</i></td></tr>';
  h += '<tr><td class="k">glades</td><td><input type="range" id="fGlade" min="0" max="14" step="1" value="' +
       FOREST.glades + '"> <i style="color:var(--acc)">' + FOREST.glades + '</i></td></tr>';
  h += '<tr><td class="k">edge band</td><td><input type="range" id="fEdge" min="0" max="40" step="1" value="' +
       FOREST.edge + '"> <i style="color:var(--acc)">' + FOREST.edge + ' m specimen</i></td></tr>';
  h += '<tr><td class="k">furnished</td><td><input type="range" id="fMix" min="0" max="1" step="0.05" value="' +
       FOREST.mix + '"> <i style="color:var(--acc)">' + Math.round(FOREST.mix * 100) +
       '% of the interior</i></td></tr>';
  h += '<tr><td class="k">radius</td><td><input type="range" id="fRad" min="60" max="600" step="20" value="' +
       FOREST.radius + '"> <i style="color:var(--acc)">' + FOREST.radius + ' m</i></td></tr>';
  h += '<tr><td class="k">far tier</td><td><button id="fImp"' + (FOREST.impostor ? ' class="on"' : '') +
       '>' + (FOREST.impostor ? 'baked impostors' : 'shipped LOD / same mesh') + '</button>' +
       (FOREST.impostor ? ' <i style="color:var(--dim)">' + IMP_CACHE.size + ' atlases, ' +
         (IMP_G * IMP_G) + ' views each</i>' : '') + '</td></tr>';
  h += '<tr><td class="k">seed</td><td><input type="range" id="fSeed" min="1" max="60" step="1" value="' +
       FOREST.seed + '"> <i style="color:var(--acc)">' + FOREST.seed + '</i></td></tr>';
  h += '</table>';

  h += '<div class="grp">COLOUR — MEASURED, THEN CORRECTED</div>';
  h += '<div style="margin-bottom:6px">reference <select id="fRef">' +
       rows.map(a => '<option value="' + a.name + '"' + (REFNAME === a.name ? ' selected' : '') + '>' +

       '</select> <button id="fSuggest">suggest</button> <button id="fClear">clear all</button></div>';
  h += '<div class="note">Hue and lightness are matched to the reference; saturation is pulled ' +
       'down to the LOWEST measured in the set, never up. These are starting values — the dials are yours.</div>';

  // what each weight actually works out to, over the collections in the mix
  let shareTot = 0;
  for (const a of rows) if (PICK[a.name]) shareTot += tuneOf(a.name).proportion || 0;
  h += '<table class="fRows">';
  for (const a of rows) {
    const t = tuneOf(a.name), m = MEAS[a.name];
    const sw = m && m.rgb ? 'rgb(' + m.rgb.join(',') + ')' : '#333';
    h += '<tr><td colspan="2" style="padding-top:7px;border-top:1px solid var(--grid)">' +

         '<span class="sw" style="background:' + sw + '"></span>' +
         '<i style="color:var(--dim);font-size:10px">' +
         (m && m.px ? 'H ' + (m.h * 360).toFixed(0) + '&deg; S ' + (m.s * 100).toFixed(0) +
            '% L ' + (m.l * 100).toFixed(0) + '%' : 'not measured') + '</i></td></tr>';
    for (const dial of [['hue', -0.5, 0.5, 0.005], ['sat', 0, 1.4, 0.01],
                        ['light', 0.4, 1.8, 0.01], ['bark', 0.3, 2, 0.02],
                        ['alpha', 0, 0.9, 0.05], ['size', 0.2, 3, 0.02],
                        ['sink', 0, 4, 0.05], ['proportion', 0, 3, 0.05],
                        ['stick', 0.01, 0.3, 0.005], ['impa', 1, 20, 0.5],
