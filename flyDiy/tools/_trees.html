// ==========================================================================
// SSAO — and the one thing that dictates how it had to be built
//
// The obvious way is to render the scene into a render target and post-process
// it. That cannot be done here: a plain render target is NOT multisampled, and
// alpha-to-coverage — the fix that actually made the canopy legible — needs
// MSAA to have samples to spread coverage across. Routing the stand through an
// RT would buy occlusion and hand back the aliasing, which is a bad trade.
//
// So the scene is drawn TWICE. Once into a depth-only target, which gives the
// AO pass something to read; once to the canvas as before, with its MSAA and
// its coverage intact. The AO is then laid over the finished picture as a
// full-screen MULTIPLY, so it only ever darkens what is already there.
// Two scene renders for a hand-pumped bench is affordable; it would not be in
// the game, and W0e's frame-time gate would say so.
//
// The normals are reconstructed from depth derivatives rather than rendered,
// because a normal pass would need every cutout material's alpha test
// duplicated into it, and depth already carries the cutout for free.
// ==========================================================================
let SSAO_ON = false, SSAO_R = 1.1, SSAO_I = 0.9;
let VIEW_SKY = null;                   // the committed sky, chosen at boot
let aoRT = null, aoQuad = null, aoScene = null, aoCam = null;

function aoEnsure(w, h) {
  if (aoRT && aoRT.width === w && aoRT.height === h) return;
  if (aoRT) { aoRT.depthTexture.dispose(); aoRT.dispose(); }
  const dt = new THREE.DepthTexture(w, h);
  dt.type = THREE.UnsignedIntType;
  dt.minFilter = dt.magFilter = THREE.NearestFilter;
  aoRT = new THREE.WebGLRenderTarget(w, h, {
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
    depthTexture: dt, depthBuffer: true, stencilBuffer: false,
  });
  if (aoQuad) aoQuad.material.uniforms.tDepth.value = dt;
}

function aoBuild() {
  if (aoQuad) return;
  aoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  aoScene = new THREE.Scene();
  const frag = [
    'varying vec2 vUv;',
    'uniform sampler2D tDepth;',
    'uniform vec2 uRes;',
    'uniform float uNear, uFar, uRadius, uIntensity, uTanY, uAspect;',
    'float viewZ(vec2 uv) {',
    '  float z = texture2D(tDepth, uv).x;',
    '  return -(2.0 * uNear * uFar) / (uFar + uNear - (2.0 * z - 1.0) * (uFar - uNear));',
    '}',
    'vec3 viewPos(vec2 uv, float vz) {',
    '  vec2 ndc = uv * 2.0 - 1.0;',
    '  return vec3(ndc.x * uTanY * uAspect, ndc.y * uTanY, -1.0) * (-vz);',
    '}',
    'float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
    'void main() {',
    '  float vz = viewZ(vUv);',
    // the sky has no depth and must not be darkened
    '  if (-vz >= uFar * 0.999) { gl_FragColor = vec4(1.0); return; }',
    '  vec3 P = viewPos(vUv, vz);',
    '  vec3 N = normalize(cross(dFdx(P), dFdy(P)));',
    '  float ang = hash(gl_FragCoord.xy) * 6.2831853;',
    '  float ca = cos(ang), sa = sin(ang);',
    '  float occ = 0.0;',
    '  const int K = 20;',
    '  for (int i = 0; i < K; i++) {',
    '    float fi = (float(i) + 0.5) / float(K);',
    '    float a = fi * 6.2831853 * 3.0 + ang;',
    '    float r = uRadius * sqrt(fi);',
    // a hemisphere sample, flipped to the side the surface faces
    '    vec3 d = vec3(cos(a), sin(a), hash(vec2(fi, ang)) * 0.9 + 0.1);',
    '    if (dot(d, N) < 0.0) d = -d;',
    '    vec3 S = P + d * r;',
    '    vec4 cl = vec4(S, 1.0);',
    '    vec2 su = vec2(cl.x / (uTanY * uAspect), cl.y / uTanY) / (-cl.z);',
    '    su = su * 0.5 + 0.5;',
    '    if (su.x < 0.0 || su.x > 1.0 || su.y < 0.0 || su.y > 1.0) continue;',
    '    float sz = viewZ(su);',
    // occluded only when something sits in FRONT of the sample, and only
    // within the radius: without the range check a distant trunk shadows the
    // whole crown behind it
    '    float diff = sz - S.z;',
    '    float range = smoothstep(0.0, 1.0, uRadius / max(1e-4, abs(sz - P.z)));',
    '    occ += (diff > 0.02 ? 1.0 : 0.0) * range;',
    '  }',
    // beyond a few dozen metres a pixel's neighbours are metres apart, the
    // reconstructed normal is noise, and the pass returns a field of black
    // specks. So it fades out with distance rather than guessing.
    '  float far = 1.0 - smoothstep(60.0, 160.0, -vz);',
    '  float ao = 1.0 - uIntensity * far * (occ / float(K));',
    '  gl_FragColor = vec4(vec3(clamp(ao, 0.0, 1.0)), 1.0);',
    '}',
  ].join(NL);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      tDepth: { value: aoRT ? aoRT.depthTexture : null },
      uRes: { value: new THREE.Vector2(1, 1) },
      uNear: { value: 0.1 }, uFar: { value: 1000 },
      uRadius: { value: SSAO_R }, uIntensity: { value: SSAO_I },
      uTanY: { value: 0.5 }, uAspect: { value: 1 },
    },
    vertexShader: ['varying vec2 vUv;', 'void main() {', '  vUv = uv;',
                   '  gl_Position = vec4(position.xy, 0.0, 1.0);', '}'].join(NL),
    fragmentShader: frag,
    depthTest: false, depthWrite: false,
    blending: THREE.MultiplyBlending,     // it may only ever darken
    extensions: { derivatives: true },
  });
  aoQuad = new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), mat);
  aoQuad.frustumCulled = false;
  aoScene.add(aoQuad);
}

// laid over the finished frame, after the scene has been drawn to the canvas
function aoPass() {
  if (!SSAO_ON) return;
  const w = cv.width, h = cv.height;
  if (!w || !h) return;
  aoEnsure(w, h);
  aoBuild();
  const u = aoQuad.material.uniforms;
  u.tDepth.value = aoRT.depthTexture;
  u.uRes.value.set(w, h);
  u.uNear.value = camera.near; u.uFar.value = camera.far;
  u.uRadius.value = SSAO_R; u.uIntensity.value = SSAO_I;
  u.uTanY.value = Math.tan(camera.fov * Math.PI / 360);
  u.uAspect.value = camera.aspect;
  const prevBg = scene.background;
  scene.background = null;               // depth only; the sky writes none
  renderer.setRenderTarget(aoRT);
  renderer.clear(true, true, false);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  scene.background = prevBg;
  const prevAuto = renderer.autoClear;
  renderer.autoClear = false;
  renderer.render(aoScene, aoCam);
  renderer.autoClear = prevAuto;
}

// ---- render --------------------------------------------------------------
let frames = 0, acc = 0;
function render() {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w || cv.height !== h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  updateImpFields();
  const t0 = performance.now();
  renderer.render(scene, camera);
  aoPass();
  const ms = performance.now() - t0;
  acc += ms; frames++;
  const info = renderer.info.render;
  $('stat').textContent = info.calls + ' draw calls · ' + info.triangles.toLocaleString() + ' tris\n' +
    ms.toFixed(2) + ' ms  (avg ' + (acc / frames).toFixed(2) + ')';
}
window.addEventListener('resize', render);
// The bench is hand-pumped, not animated: every frame is a frame somebody
// asked for, so the millisecond reading beside it is the cost of THIS view.
setInterval(render, 120);

(async function boot() {
  // the committed corrections first, then anything edited since on this machine
  let COMMITTED = null;
  try {
    const f = await fetch('_trees_tuning.json');
    if (f.ok) {
      COMMITTED = await f.json();
      TUNE = COMMITTED.tuning || {};
      if (COMMITTED.master) Object.assign(MASTER, COMMITTED.master);
      if (COMMITTED.reference) REFNAME = COMMITTED.reference;
      // THE VIEW is committed too. The light, the leaf terms and the AO are
      // as much a part of a judgement as the colour is — opening the bench in
      // a different light than the one the mix was tuned under would make
      // every stored value read wrong.
      const V = COMMITTED.view;
      if (V) {
        if (V.ev !== undefined) EXPO = V.ev;
        if (V.wrap !== undefined) U_WRAP.value = V.wrap;
        if (V.sss !== undefined) U_SSS.value = V.sss;
        if (V.a2c !== undefined) A2C = !!V.a2c;
        if (V.sharp !== undefined) U_SHARP.value = V.sharp;
        if (V.mips !== undefined) MIPFIX = !!V.mips;
        if (V.shadows !== undefined) SHADOWS = !!V.shadows;
        // the baked AO replaces it; the button still turns it on to compare
        SSAO_ON = false;
        if (V.aoR !== undefined) SSAO_R = V.aoR;
        if (V.aoI !== undefined) SSAO_I = V.aoI;
        if (V.crownH !== undefined) CROWN_STRETCH = V.crownH;
        if (V.crownW !== undefined) CROWN_W = V.crownW;
        if (V.aobake !== undefined) U_AOBAKE.value = V.aobake;
        if (V.trunkao !== undefined) TRUNK_DARK = V.trunkao;
        if (V.isolid !== undefined) U_ISOLID.value = V.isolid;
        if (V.icut !== undefined) U_ICUT.value = V.icut;
        if (V.isph !== undefined) U_ISPH.value = V.isph;
        if (V.ilit !== undefined) U_ILIT.value = V.ilit;
        if (V.trueScale !== undefined) TRUE_SCALE = !!V.trueScale;
        VIEW_SKY = V.sky;
      }
    }
  } catch (e) {}
  try {
    // MERGE PER COLLECTION, not per file. Assigning the whole object replaced
    // the committed entry wholesale, so a field the bench never edits —
    // keepTop, say — was silently dropped the moment anything was tuned.
    const loc = localStorage.getItem('flydiy.trees.tuning');
    if (loc) {
      const L = JSON.parse(loc);
      for (const k in L) TUNE[k] = Object.assign({}, TUNE[k] || {}, L[k]);
    }
  } catch (e) {}
  try {
    const pk = localStorage.getItem('flydiy.trees.pick');
    if (pk) Object.assign(PICK, JSON.parse(pk));
  } catch (e) {}
  try {
    const ms = localStorage.getItem('flydiy.trees.master');
    if (ms) Object.assign(MASTER, JSON.parse(ms));
  } catch (e) {}
  try { INDEX = await (await fetch('_trees_index.json')).json(); }
  catch (e) {
    $('msg').innerHTML = '<span class="bad">no _trees_index.json — run: node tools/tree_inspect.js</span>';
    return;
  }
  INDEX.assets = INDEX.assets.filter(a => a.kind !== 'error');
  for (const a of INDEX.assets)
    for (const k of ['trees', 'shrubs', 'billboards', 'terrain'])
      if (!a[k]) a[k] = [];

  // THE COMMITTED MIX is the default: _trees_tuning.json's `included` is the
  // curated near/medium set, and the collections outside it are still loaded
  // and still measured — they carry proportion 0, so the scatter simply
  // plants none of them until somebody raises the dial.
  if (!Object.keys(PICK).length) {
    if (COMMITTED && COMMITTED.included && COMMITTED.included.length)
      for (const n of COMMITTED.included) PICK[n] = true;
    else
      for (const a of INDEX.assets)
        if (a.renderable && a.trees.length && !a.trees.some(t => t.merged)) PICK[a.name] = true;
  }

  // the chrome has to agree with the state it was given
  if (VIEW_SKY !== undefined && VIEW_SKY !== null) {
    const sel = $('sky');
    if ([...sel.options].some(o => o.value === String(VIEW_SKY))) sel.value = String(VIEW_SKY);
  }
  $('expo').value = EXPO; $('expoV').textContent = EXPO.toFixed(2);
  $('wrap').value = U_WRAP.value; $('wrapV').textContent = U_WRAP.value.toFixed(2);
  $('sss').value = U_SSS.value; $('sssV').textContent = U_SSS.value.toFixed(2);
  $('aoR').value = SSAO_R; $('aoRV').textContent = SSAO_R.toFixed(1);
  $('aoI').value = SSAO_I; $('aoIV').textContent = SSAO_I.toFixed(2);
  $('crown').value = CROWN_STRETCH; $('crownV').textContent = CROWN_STRETCH.toFixed(2);
  $('crownw').value = CROWN_W; $('crownwV').textContent = CROWN_W.toFixed(2);
  $('aobake').value = U_AOBAKE.value; $('aobakeV').textContent = U_AOBAKE.value.toFixed(1);
  $('trunkao').value = TRUNK_DARK; $('trunkaoV').textContent = TRUNK_DARK.toFixed(2);
  $('isolid').value = U_ISOLID.value; $('isolidV').textContent = U_ISOLID.value.toFixed(2);
  $('isph').value = U_ISPH.value; $('isphV').textContent = U_ISPH.value.toFixed(2);
  $('ilit').value = U_ILIT.value; $('ilitV').textContent = U_ILIT.value.toFixed(2);
  $('a2c').classList.toggle('on', A2C);
  $('mipfix').classList.toggle('on', MIPFIX);
  $('shadow').classList.toggle('on', SHADOWS);
  $('ssao').classList.toggle('on', SSAO_ON);
  $('trueScale').classList.toggle('on', TRUE_SCALE);
  renderer.shadowMap.enabled = SHADOWS;

  syncTuneBar();
  buildSky();
  place(); paintRail();
  const first = INDEX.assets.filter(a => a.renderable)
    .sort((a, b) => b.trees.length - a.trees.length)[0];
  if (first) load(first);
})();
</script>
