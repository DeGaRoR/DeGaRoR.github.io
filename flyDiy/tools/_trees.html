<!DOCTYPE html>
<!--
  TREE BENCH (W0a) — the candidates for the near asset, on a table and on a
  distance ladder.

  futureDesigns/WORLD-V2.md §8.3 is the section the user will not compromise
  on, and its rung R1 asks for a real near tree: a trunk mesh plus alpha-tested
  leaf cards, 2-8 k triangles, 3-5 species x 2-3 age classes. assets/treesRaw
  holds eleven downloads that might be that. This page is where they are
  looked at, because a poly count is not a look and neither is an opinion.

  THIS PAGE DECIDES NOTHING. tools/tree_inspect.js reads each pack's node
  GRAPH — which is the only place the truth lives — and writes the finished
  grouping into _trees_index.json: what is a tree, what is a shrub, what is
  already a billboard card, what is a rock, which glTF NODE INDICES belong to
  each, and at which LOD. This page looks up nodes by index and draws them.
  The first version derived the grouping here as well, by mesh name, and got
  a different (wrong) answer from the inspector's — so now there is one.
  Same rule as tools/props_table.py and _props.html.

  FOUR VIEWS, AND THEY ANSWER DIFFERENT QUESTIONS.
  SHELF puts every subject of one kind on a metre grid beside a 1.8 m figure —
  the view that catches a wrong scale, a wrong origin, a blown-out alpha or a
  species that is really a Christmas decoration. LADDER puts ONE subject at
  25 / 50 / 100 / 250 / 500 / 1000 m on a shallow arc, which is the only view
  that says whether an asset is worth its triangles: §1 of WORLD-V2 argues
  that 1 m geometry stops mattering past ~500 m, and this is where that
  argument is checked rather than asserted. The KIND selector switches between
  trees, shrubs, the packs' own billboard cards and the rocks — the scatter
  layer needs all four, and a forest floor with only trees is a lawn.

  WHAT IS NOT DRAWN, AND WHY. The four Poly Haven .gltf.zip trees carry
  1.5-17.2 M triangles each in a .bin of up to 900 MB. A browser is not going
  to hold that, and it should not have to: they are OFFLINE-RENDER trees, and
  their place in the ladder is as the bake source for the impostor atlas (R2)
  and the canopy shell (R3), not as the near asset. They appear in the rail
  with their numbers and are marked [offline].

  TWO CONTROLS THAT EXIST BECAUSE OF WHAT WAS MEASURED.
  `alpha` sets the cutout threshold and converts a pack's BLEND foliage to an
  alpha test — blending needs back-to-front sorting and refuses a depth
  prepass, so at forest density it is the wrong mode. But a material whose
  texture carries NO ALPHA CHANNEL cannot cut at any threshold, and the
  inspector reads that out of the PNG header, so the panel says which.
  `true scale` draws an asset at its measured size; turning it off applies the
  inspector's suggested factor, so a 739.6 m export can be judged beside a
  31.8 m one without anybody pretending the file is fixed.

  There is no GLTFLoader in vendor/ — the project bakes every shipped asset
  through its own codec (50_model_codec, 51_prop_codec, 52_char_codec). This
  page therefore carries a MINIMAL GLB reader, deliberately: POSITION /
  NORMAL / TEXCOORD_0, indices, node transforms and base-colour textures. It
  is a bench instrument, not a pipeline, and nothing it makes goes near media/.

  Serve from repo root (launch: flydiy-trees) and open
  /flyDiy/tools/_trees.html
-->

<script src="../vendor/three.min.js"></script>
<script>window.FLYDIY_ASSET_BASE = '../';</script>
<script src="../src/viewer/house_tex.js"></script>
<script src="../src/viewer/hangar_sky.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const RAW = '../assets/treesRaw/';

// ---- scene ---------------------------------------------------------------
const cv = $('c');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12151a);
scene.fog = new THREE.Fog(0x12151a, 400, 2600);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 12000);

// ==========================================================================
// THE LIGHT RIG — lifted from tools/_house.html (G222's bench)
//
// The same argument applies here and for the same reason: foliage is a PBR
// surface and a PBR surface is only as legible as what is around it. Three
// lamps and a flat hemisphere gave every collection the same soft grey wash,
// which is exactly the light in which a colour pass CANNOT be judged — no
// edges to smear, no sun to catch a waxy needle, nothing dark on one side.
//
// So the house bench's rig verbatim: a sky run through PMREM as the ambient
// and every reflection, a shadow-casting sun at the same azimuth, and ACES
// tone mapping with an exposure dial because the sky is brighter than the
// leaf and clipping it is what flattened everything.
//
// FIVE SKIES, and the choice matters more here than it does for a house.
// Four are PAINTED gradients with a disc in them (afternoon / golden /
// overcast / blue hour), and one is the CAPTURED grassland sunset from
// src/viewer/house_tex.js — a real photograph, with structure to reflect.
// The default is `overcast`, deliberately: its sun is 0.45 and its dome is
// broad and neutral, which is the only light under which the measured hue
// and saturation of a leaf texture mean what they say. Judge the MIX under
// overcast; judge the LOOK under the hdr sunset, whose sun is [1, 0.22,
// 0.05] and will make every collection agree by drowning them all in orange.
// ==========================================================================
const D2R = Math.PI / 180;
const MOODS = [
  { name: 'overcast',  zen: [0.62, 0.66, 0.72], hor: [0.78, 0.80, 0.83],
    gnd: [0.26, 0.27, 0.24], sun: [0.90, 0.92, 0.95], sunI: 0.45, disc: 0,
    amb: 1.05, ev: 1.00 },
  { name: 'afternoon', zen: [0.32, 0.50, 0.78], hor: [0.72, 0.80, 0.88],
    gnd: [0.20, 0.22, 0.17], sun: [1.00, 0.94, 0.82], sunI: 3.0, disc: 26,
    amb: 0.55, ev: 1.05 },
  { name: 'golden',    zen: [0.22, 0.36, 0.62], hor: [0.95, 0.72, 0.44],
    gnd: [0.22, 0.19, 0.13], sun: [1.00, 0.78, 0.48], sunI: 2.4, disc: 34,
    amb: 0.50, ev: 1.15 },
  { name: 'blue hour', zen: [0.10, 0.16, 0.34], hor: [0.40, 0.46, 0.66],
    gnd: [0.10, 0.12, 0.14], sun: [0.72, 0.78, 1.00], sunI: 0.55, disc: 10,
    amb: 0.45, ev: 1.35 },
];
const SKIES = (typeof HOUSE_SKIES !== 'undefined' && HOUSE_SKIES) || {};
const SKY_KEYS = Object.keys(SKIES);
const skyOf = i => (i >= MOODS.length ? SKIES[SKY_KEYS[i - MOODS.length]] : null);


// ---- THE GAME'S OWN SKY — alps_field, rebuilt from base + gain ------------
// The hangar does not ship an RGBE file the way the house bench does. It
// ships the DISPLAY picture and a per-channel log2 GAIN map, and puts the
// float radiance back in the shader:
//
//     radiance = sRGBtoLinear(base) / k * exp2(gain * gmax)
//
// (src/viewer/hangar_sky.js, HANGAR_SKY_GRADE — one panorama graded into six
// hours by a row of uniforms rather than six baked pictures.) That identity
// is all this needs: run it once on the CPU and the result is an equirect of
// real radiance, which is what PMREM wants.
//
// AT 2048x1024, NOT 8192x4096. The delivered pair is 33.5 M pixels;
// reconstructing that in JS would cost a third of a gigabyte and several
// seconds for an environment map that is about to be convolved down to a few
// mips anyway. The cost of the shortcut is honest and worth stating: the sun
// DISC is averaged down with everything else, so the dome it produces is very
// slightly softer than the delivered sky. It does not matter, because the sun
// is added separately below as a shadow-casting lamp using the row's own
// measured colour and intensity — the disc in the dome was never doing that
// job here.
//
// Only the AFTERNOON row (the ungraded panorama) is rebuilt. The other five
// hours are that same radiance through fdSkyGrade's tint / saturation / glow
// chain, which is a shader and belongs to hangar.js; porting it to get five
// more lights for a tree bench is not worth the duplication.
const ALPS = (typeof HANGAR_SKY_GRADE !== 'undefined' && HANGAR_SKY_GRADE) || null;
const ALPS_ROW = (typeof HANGAR_SKIES !== 'undefined' && HANGAR_SKIES &&
                  HANGAR_SKIES.find(r => r.key === 'alps')) || null;
let alpsState = null;                  // null | 'loading' | 'ready' | 'failed'
let alpsEnvTex = null, alpsBgTex = null;
const alpsDir = new THREE.Vector3(0.4, 0.55, 0.73);

function alpsBuild() {
  if (!ALPS) { alpsState = 'failed'; return; }
  alpsState = 'loading';
  const W = 2048, H = 1024;
  const imgs = { base: new Image(), gain: new Image() };
  let left = 2;
  const done = () => {
    if (--left) return;
    try {
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const g2 = c.getContext('2d', { willReadFrequently: true });
      g2.drawImage(imgs.base, 0, 0, W, H);
      const bd = g2.getImageData(0, 0, W, H).data;
      g2.clearRect(0, 0, W, H);
      g2.drawImage(imgs.gain, 0, 0, W, H);
      const gd = g2.getImageData(0, 0, W, H).data;

      const half = THREE.DataUtils.toHalfFloat;
      const out = new Uint16Array(W * H * 4);
      const invK = 1 / ALPS.k, gmax = ALPS.gmax;
      const s2l = v => (v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
      let best = -1, bestI = 0;
      for (let i = 0, n = W * H; i < n; i++) {
        let lum = 0;
        for (let ch = 0; ch < 3; ch++) {
          const lin = s2l(bd[i * 4 + ch] / 255) * invK;
          const rad = lin * Math.pow(2, (gd[i * 4 + ch] / 255) * gmax);
          out[i * 4 + ch] = half(rad);
          lum += rad * (ch === 0 ? 0.2126 : ch === 1 ? 0.7152 : 0.0722);
        }
        out[i * 4 + 3] = half(1);
        if (lum > best) { best = lum; bestI = i; }
      }
      const t = new THREE.DataTexture(out, W, H, THREE.RGBAFormat, THREE.HalfFloatType);
      t.mapping = THREE.EquirectangularReflectionMapping;
      t.minFilter = t.magFilter = THREE.LinearFilter;
      t.generateMipmaps = false;
      t.needsUpdate = true;
      alpsEnvTex = t;

      // THE SUN, FOUND RATHER THAN ASSUMED. The row carries a `sunUV`, but
      // whose v-origin it uses is a convention this file would have to guess
      // at. The brightest texel in the radiance IS the sun, and three.js's
      // own equirect mapping inverts to a direction — with the one ambiguity
      // (which way v runs) settled by the only physical fact available: the
      // sun is above the horizon.
      const u = ((bestI % W) + 0.5) / W, v = (Math.floor(bestI / W) + 0.5) / H;
      const phi = (u - 0.5) * Math.PI * 2;
      const cand = [v, 1 - v].map(vv => {
        const y = Math.sin((vv - 0.5) * Math.PI);
        const r = Math.sqrt(Math.max(0, 1 - y * y));
        return new THREE.Vector3(r * Math.cos(phi), y, r * Math.sin(phi));
      });
      alpsDir.copy(cand[0].y >= cand[1].y ? cand[0] : cand[1]).normalize();

      const bt = new THREE.Texture(imgs.base);
      bt.mapping = THREE.EquirectangularReflectionMapping;
      bt.encoding = THREE.sRGBEncoding;
      bt.needsUpdate = true;
      alpsBgTex = bt;
      alpsState = 'ready';
    } catch (e) { alpsState = 'failed'; }
    buildSky();
    render();
  };
  imgs.base.onload = done; imgs.gain.onload = done;
  imgs.base.onerror = () => { alpsState = 'failed'; };
  imgs.gain.onerror = () => { alpsState = 'failed'; };
  imgs.base.src = ALPS.base; imgs.gain.src = ALPS.gain;
}

function buildSkyAlps() {
  if (alpsState === 'ready') {
    if (envRT) envRT.dispose();
    envRT = pmrem.fromEquirectangular(alpsEnvTex);
    scene.environment = envRT.texture;
    scene.background = alpsBgTex;
    const row = ALPS_ROW;
    sun.color.setHex(row ? row.kc : 0xffdca8);
    sun.intensity = row ? row.keyI : 2.8;
    fill.intensity = 0;                     // the panorama IS the fill
    renderer.toneMappingExposure = EXPO * (row ? row.ex : 0.92);
    scene.fog.color.setHex(0x9fb0c4);
    hdrDir.copy(alpsDir);
    fitSun();
    return true;
  }
  if (alpsState === null) alpsBuild();
  return false;                              // paint a mood meanwhile
}

const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
const fill = new THREE.HemisphereLight(0xbdd2ea, 0x4a4436, 0.5);
scene.add(fill);
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
let envRT = null;
const hdrDir = new THREE.Vector3(0.3, 0.5, 0.8);
let SUN_AZ = 40, EXPO = 1.0, SHADOWS = true;

function sunDir() {
  const v = $('sky').value;
  if (v === 'alps' || skyOf(+v)) return hdrDir.clone();
  const az = SUN_AZ * D2R, el = 42 * D2R;
  return new THREE.Vector3(Math.cos(el) * Math.sin(az), Math.sin(el),
                           Math.cos(el) * Math.cos(az));
}

// RGBE -> half float, once per sky (the house bench's decode, verbatim): the
// image is three mantissas and a shared exponent, which is all of Radiance's
// format and comes back in one exp2. Half float because linear filtering of
// an RGBA16F texture is core in WebGL2 and PMREM samples it with LINEAR.
const ENVC = new Map();
function envTexture(sky) {
  const img = sky.env;
  if (!img.complete || !img.naturalWidth) return null;
  if (ENVC.has(sky)) return ENVC.get(sky);
  const w = img.naturalWidth, h = img.naturalHeight;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g2 = c.getContext('2d');
  g2.drawImage(img, 0, 0);
  const src = g2.getImageData(0, 0, w, h).data;
  const half = THREE.DataUtils.toHalfFloat;
  const out = new Uint16Array(w * h * 4);
  for (let i = 0, n = w * h; i < n; i++) {
    const e = src[i * 4 + 3];
    const k = e ? Math.pow(2, e - 136) : 0;
    out[i * 4] = half(src[i * 4] * k);
    out[i * 4 + 1] = half(src[i * 4 + 1] * k);
    out[i * 4 + 2] = half(src[i * 4 + 2] * k);
    out[i * 4 + 3] = half(1);
  }
  const t = new THREE.DataTexture(out, w, h, THREE.RGBAFormat, THREE.HalfFloatType);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.minFilter = t.magFilter = THREE.LinearFilter;
  t.generateMipmaps = false;
  t.needsUpdate = true;
  ENVC.set(sky, t);
  return t;
}

const BGC = new Map();
function bgTexture(sky) {
  const img = sky.bg;
  if (!img.complete || !img.naturalWidth) return null;
  if (!BGC.has(sky)) {
    const t = new THREE.Texture(img);
    t.mapping = THREE.EquirectangularReflectionMapping;
    t.encoding = THREE.sRGBEncoding;

  const d = sunDir();
  const px = v => Math.max(0, Math.min(255, Math.round(v * 255)));

    const theta = (y + 0.5) / H * Math.PI;           // 0 = zenith
    const cy = Math.cos(theta), sy = Math.sin(theta);
    for (let x = 0; x < W; x++) {
      const phi = (x + 0.5) / W * Math.PI * 2 - Math.PI;
      const dir = [sy * Math.sin(phi), cy, sy * Math.cos(phi)];

               M.zen[2] + (M.hor[2] - M.zen[2]) * t2];

               M.hor[1] * (1 - t2) + M.gnd[1] * t2,
               M.hor[2] * (1 - t2) + M.gnd[2] * t2];
      }
      if (M.disc > 0) {
        const dot2 = dir[0] * d.x + dir[1] * d.y + dir[2] * d.z;
        const ang = Math.acos(Math.max(-1, Math.min(1, dot2)));
        const disc = Math.exp(-Math.pow(ang / 0.055, 2)) * M.disc;
        const glow = Math.exp(-Math.pow(ang / 0.55, 2)) * M.disc * 0.10;

               col[1] + (disc + glow) * M.sun[1],
               col[2] + (disc + glow) * M.sun[2]];

  t.encoding = THREE.sRGBEncoding;
  if (envRT) envRT.dispose();
  envRT = pmrem.fromEquirectangular(t);
  scene.environment = envRT.texture;
  scene.background = new THREE.Color(M.hor[0] * 0.55, M.hor[1] * 0.58, M.hor[2] * 0.64);
  scene.fog.color.copy(scene.background);
  t.dispose();
  sun.color.setRGB(M.sun[0], M.sun[1], M.sun[2]);
  sun.intensity = M.sunI;
  fill.intensity = M.amb;
  fill.color.setRGB(M.hor[0], M.hor[1], M.hor[2]);
  fill.groundColor.setRGB(M.gnd[0], M.gnd[1], M.gnd[2]);
  renderer.toneMappingExposure = EXPO * M.ev;

// The shadow frustum is fitted to WHAT IS ON THE STAGE, because a stand 220 m
// across and a single tree 17 m tall cannot share one ortho box: size it for
// the forest and the shelf gets no contact shadow at all.
let STAGE_R = 20, STAGE_C = new THREE.Vector3();
function fitSun() {
  const d = sunDir().multiplyScalar(Math.max(30, STAGE_R * 2.2));
  sun.position.copy(STAGE_C).add(d);

  sun.target.updateMatrixWorld();
  const S = Math.max(12, STAGE_R * 1.15);

  sun.shadow.camera.top = S; sun.shadow.camera.bottom = -S;
  sun.shadow.camera.near = 0.5;

// called at the end of every build: the stage has changed size
function measureStage() {
  const bb = new THREE.Box3().setFromObject(stage);
  if (!isFinite(bb.min.x)) { STAGE_R = 20; STAGE_C.set(0, 0, 0); }
  else {
    bb.getCenter(STAGE_C);

  }
  stage.traverse(o => {
    if (!o.isMesh || o.userData.noShadow) return;
    o.castShadow = SHADOWS;

}

function bakeAO(root) {
  root.updateMatrixWorld(true);
  const meshes = [];
  root.traverse(o => { if (o.isMesh && o.geometry && o.geometry.attributes.position) meshes.push(o); });
  if (!meshes.length) return;
  const bb = new THREE.Box3().setFromObject(root);
  if (!isFinite(bb.min.x)) return;
  const size = bb.getSize(new THREE.Vector3());
  const diag = Math.max(0.5, Math.hypot(size.x, size.y, size.z));
  const N = 26;
  const g0 = bb.min.clone().addScalar(-diag * 0.02);
  const cell = new THREE.Vector3(
    (size.x + diag * 0.04) / N, (size.y + diag * 0.04) / N, (size.z + diag * 0.04) / N);
  cell.x = Math.max(cell.x, 1e-4); cell.y = Math.max(cell.y, 1e-4); cell.z = Math.max(cell.z, 1e-4);
  const occ = new Float32Array(N * N * N);
  const v = new THREE.Vector3();
  const idxOf = (x, y, z) => (z * N + y) * N + x;

  // drop every triangle centroid into the field
  for (const o of meshes) {
    const pos = o.geometry.attributes.position;
    const id = o.geometry.index ? o.geometry.index.array : null;
    const nTri = id ? id.length / 3 : pos.count / 3;
    for (let t = 0; t < nTri; t++) {
      let x = 0, y = 0, z = 0;
      for (let k = 0; k < 3; k++) {
        const i = id ? id[t * 3 + k] : t * 3 + k;
        v.set(pos.getX(i), pos.getY(i), pos.getZ(i)).applyMatrix4(o.matrixWorld);
        x += v.x; y += v.y; z += v.z;
      }
      const gx = Math.floor((x / 3 - g0.x) / cell.x), gy = Math.floor((y / 3 - g0.y) / cell.y),
            gz = Math.floor((z / 3 - g0.z) / cell.z);
      if (gx < 0 || gy < 0 || gz < 0 || gx >= N || gy >= N || gz >= N) continue;
      occ[idxOf(gx, gy, gz)] += 1;
    }
  }
  // a cell is "solid" on a soft curve, so one stray triangle is not a wall
  let peak = 0;
  for (let i = 0; i < occ.length; i++) if (occ[i] > peak) peak = occ[i];
  const norm = 1 / Math.max(1, peak * 0.25);
  for (let i = 0; i < occ.length; i++) occ[i] = Math.min(1, occ[i] * norm);

  // six directions, weighted to the sky: what shades a leaf is mostly above it
  const DIRS = [[0, 1, 0], [0.7, 0.7, 0], [-0.7, 0.7, 0], [0, 0.7, 0.7],
                [0, 0.7, -0.7], [0, -1, 0]];
  const W = [1.6, 1, 1, 1, 1, 0.5];
  let wTot = 0; for (const w of W) wTot += w;
  const STEPS = 8, reach = diag * 0.33;
  for (const o of meshes) {
    const geo = o.geometry;
    const pos = geo.attributes.position;
    const at = ensureAoAttr(geo, 1);
    const arr = at.array;
    const isBark = o.material && o.material.userData.alphaMode === 'OPAQUE';
    for (let i = 0; i < pos.count; i++) {
      v.set(pos.getX(i), pos.getY(i), pos.getZ(i)).applyMatrix4(o.matrixWorld);
      let sum = 0;
      for (let d = 0; d < DIRS.length; d++) {
        let hit = 0;
        for (let st = 1; st <= STEPS; st++) {
          const f = st / STEPS, r = f * reach;
          const gx = Math.floor((v.x + DIRS[d][0] * r - g0.x) / cell.x);
          const gy = Math.floor((v.y + DIRS[d][1] * r - g0.y) / cell.y);
          const gz = Math.floor((v.z + DIRS[d][2] * r - g0.z) / cell.z);
          if (gx < 0 || gy < 0 || gz < 0 || gx >= N || gy >= N || gz >= N) break;
          hit += occ[idxOf(gx, gy, gz)] * (1 - f);      // nearer counts for more
        }
        sum += W[d] * Math.min(1, hit / (STEPS * 0.35));
      }
      arr[i] = Math.max(0.18, 1 - 0.95 * (sum / wTot));
      if (isBark) arr[i] *= trunkShade((v.y - bb.min.y) / Math.max(1e-3, size.y));
    }
    at.needsUpdate = true;
  }
}

// one pass over a collection's subjects, once
function aoFixAsset(name) {
  const built = cache[name];
  if (!built) return 0;
  const a = INDEX.assets.find(x => x.name === name);
  if (!a) return 0;
  let n = 0;
  for (const G of subjectsOf(a).concat(a.shrubs || [])) {
    const h = buildGroup(built, G);
    if (!h || AO_DONE.has(G)) continue;
    AO_DONE.add(G);
    bakeAO(h);
    n++;
  }
  // anything the pass did not reach still needs the attribute, or it draws black
  for (const G of (a.terrain || []).concat(a.billboards || [])) {
    const h = buildGroup(built, G);
    if (h) h.traverse(o => { if (o.isMesh && o.geometry) ensureAoAttr(o.geometry, 1); });
  }
  return n;
}

function hookTint(mat) {
  if (mat.userData.tintHooked) return;
  mat.userData.tintHooked = true;
  mat.userData.uHue = { value: 0 };
  mat.userData.uSat = { value: 1 };
  mat.userData.uLight = { value: 1 };
  mat.userData.uLeaf = { value: mat.userData.alphaMode === 'OPAQUE' ? 0 : 1 };
  mat.userData.uCut = { value: 0.4 };
  const prev = mat.onBeforeCompile;
  mat.onBeforeCompile = sh => {
    if (prev) prev(sh);
    sh.uniforms.uHue = mat.userData.uHue;
    sh.uniforms.uSat = mat.userData.uSat;
    sh.uniforms.uLight = mat.userData.uLight;
    sh.uniforms.uSharp = U_SHARP;
    sh.uniforms.uCut = mat.userData.uCut;
    sh.uniforms.uWrap = U_WRAP;
    sh.uniforms.uSSS = U_SSS;
    sh.uniforms.uSSSP = U_SSSP;
    sh.uniforms.uLeaf = mat.userData.uLeaf;
    sh.uniforms.uAoBake = U_AOBAKE;
    sh.uniforms.uBakeCut = U_BAKECUT;
    sh.uniforms.uBakeAlb = U_BAKEALB;
    sh.vertexShader = ['attribute float aoV;', 'varying float vAoV;', ''].join(NL) +
      sh.vertexShader.replace('#include <begin_vertex>',
        ['#include <begin_vertex>', 'vAoV = aoV;'].join(NL));
    sh.fragmentShader = ['uniform float uHue;', 'uniform float uSat;',
      'uniform float uLight;', 'uniform float uWrap;', 'uniform float uSSS;',
      'uniform float uSSSP;', 'uniform float uLeaf;', 'uniform float uSharp;',
      'uniform float uCut;', 'uniform float uAoBake;', 'uniform float uBakeCut;',
      'uniform float uBakeAlb;', 'varying float vAoV;',
      ''].join(NL) +
      sh.fragmentShader
        .replace('#include <map_fragment>', ['#include <map_fragment>', TINT_GLSL].join(NL))
        // AO belongs on the AMBIENT term, not on the albedo: the sun does not
        // stop reaching a leaf because there is another leaf beside it. It goes
        // in at lights_fragment_end, beside the leaf wrap, because that is the
        // hook this material is KNOWN to reach - <aomap_fragment> is in the
        // stock shader but the injection there did nothing measurable.
        .replace('#include <lights_fragment_end>',
                 ['#include <lights_fragment_end>', LEAF_GLSL,
                  // strength as an EXPONENT, not a lerp: pow keeps the factor
                  // inside [0,1] whatever the dial does, where mix() went
                  // negative past about 5 and blew the canopy white.
                  'float _ao = pow(clamp(vAoV, 0.0, 1.0), uAoBake);',
                  // THE ALBEDO PASS. Everything the lights put in is thrown
                  // away and the surface colour written in its place - but the
                  // AO stays, because occlusion is a property of the TREE and
                  // travels with it. The bark gradient rides in the same way.
                  // AND AT WHICH STRENGTH. The geometry SPLITS its occlusion:
                  // the ambient takes the full exponent, the sun only 0.35 of
                  // it, because a leaf is not shaded from the sun by having a
                  // neighbour. A billboard has ONE albedo and cannot split, so
                  // it takes the middle. Measured with the full exponent the
                  // far band came out at 0.82x the geometry's brightness -
                  // dark cardboard behind a lit stand. What is left after this
                  // is the family's own `implight` gamma, which exists for
                  // exactly that kind of trim.
                  'if (uBakeAlb > 0.5) {',
                  '  float _aoA = pow(clamp(vAoV, 0.0, 1.0), uAoBake * 0.5);',
                  '  reflectedLight.directDiffuse = diffuseColor.rgb * _aoA;',
                  '  reflectedLight.indirectDiffuse = vec3(0.0);',
                  '  reflectedLight.directSpecular = vec3(0.0);',
                  '  reflectedLight.indirectSpecular = vec3(0.0);',
                  '} else {',
                  'reflectedLight.indirectDiffuse *= _ao;',
                  // the sun is not stopped by a leaf being near another leaf,
                  // so the direct term takes a much softer share of it
                  'reflectedLight.directDiffuse *= pow(clamp(vAoV, 0.0, 1.0), uAoBake * 0.35);',
                  '}'
                 ].join(NL));
  };
  mat.needsUpdate = true;
}

// WHICH DIAL REACHES WHICH MATERIAL. A cutout material is the foliage and
// takes hue / saturation / lightness; an OPAQUE one is bark or ground and
// takes only `bark`, its own lightness. Tinting a trunk with its crown is how
// a tree stops looking like a tree, so the hue never crosses over.
function applyTune(mat, t) {
  hookTint(mat);
  const leaf = mat.userData.alphaMode !== 'OPAQUE';
  mat.userData.uHue.value = leaf ? t.hue + MASTER.hue : 0;
  mat.userData.uSat.value = leaf ? t.sat * MASTER.sat : 1;
  mat.userData.uLight.value = (leaf ? t.light : (t.bark === undefined ? 1 : t.bark))
                              * MASTER.light;
}


// ==========================================================================
// COVERAGE-PRESERVING MIPMAPS — why a canopy thins out with distance
//
// A leaf texture is mostly transparent. Averaging it down for the next mip
// averages the ALPHA too, so a texel that was 1.0 with three transparent
// neighbours becomes 0.25 — and at an alpha test of 0.4 it now fails. Every
// mip level loses more of the leaf than the last, so a stand does not just
// soften with distance, it DISSOLVES, and the far tier ends up reporting a
// canopy cover it does not have.
//
// The fix (Castano, 2010) is to make each level carry the same COVERAGE — the
// fraction of texels that survive the alpha test — as level 0 did. Alpha is
// scaled per level by a factor found with a bisection, so the level looks
// thinner but tests the same.
//
// It is done here on the CPU rather than in the shader because WebGL has no
// textureQueryLod: there is no way to ask, in a fragment, which mip you are
// on. Two details that matter:
//   - the box filter is STRAIGHT, not premultiplied, and works off one
//     getImageData rather than repeated canvas draws. A canvas stores
//     premultiplied colour, so downsampling through it repeatedly bleeds the
//     background into every leaf edge — the classic dark fringe.
//   - only power-of-two textures are rebuilt, and only the cutout ones. Bark
//     and ground have nothing to preserve.
// ==========================================================================
let MIPFIX = true;
const MIPPED = new WeakSet();

function isPow2(v) { return (v & (v - 1)) === 0 && v > 0; }

function alphaCoverage(data, cutoff, scale) {
  let n = 0;
  for (let i = 3; i < data.length; i += 4)
    if (Math.min(255, data[i] * scale) >= cutoff) n++;
  return n / (data.length / 4);
}

// scale this level's alpha until it tests the same as level 0 did
function rescaleToCoverage(data, target, cutoff) {
  if (target <= 0) return;
  let lo = 0.0, hi = 64.0, best = 1.0;
  for (let it = 0; it < 12; it++) {
    const mid = (lo + hi) * 0.5;
    const c = alphaCoverage(data, cutoff, mid);
    if (c < target) lo = mid; else { hi = mid; best = mid; }
  }
  if (Math.abs(best - 1) < 0.02) return;
  for (let i = 3; i < data.length; i += 4)
    data[i] = Math.min(255, data[i] * best);
}

function buildCoverageMips(tex, cutoff255) {
  if (!tex || MIPPED.has(tex)) return false;
  const img = tex.image;
  if (!img || !img.naturalWidth) return false;
  const w0 = img.naturalWidth, h0 = img.naturalHeight;
  if (!isPow2(w0) || !isPow2(h0)) return false;
  const c = document.createElement('canvas');
  c.width = w0; c.height = h0;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0);
  let cur = g.getImageData(0, 0, w0, h0);
  const target = alphaCoverage(cur.data, cutoff255, 1);
  const mips = [cur];
  let w = w0, h = h0;
  while (w > 1 || h > 1) {
    const nw = Math.max(1, w >> 1), nh = Math.max(1, h >> 1);
    const nd = new Uint8ClampedArray(nw * nh * 4);
    const sd = cur.data;
    for (let y = 0; y < nh; y++) {
      const y0 = Math.min(h - 1, y * 2), y1 = Math.min(h - 1, y * 2 + 1);
      for (let x = 0; x < nw; x++) {
        const x0 = Math.min(w - 1, x * 2), x1 = Math.min(w - 1, x * 2 + 1);
        const a = (y0 * w + x0) * 4, b = (y0 * w + x1) * 4,
              d = (y1 * w + x0) * 4, e = (y1 * w + x1) * 4, o = (y * nw + x) * 4;
        for (let k = 0; k < 4; k++)
          nd[o + k] = (sd[a + k] + sd[b + k] + sd[d + k] + sd[e + k]) * 0.25;
      }
    }
    rescaleToCoverage(nd, target, cutoff255);
    cur = new ImageData(nd, nw, nh);
    mips.push(cur);
    w = nw; h = nh;
  }
  tex.mipmaps = mips;
  tex.generateMipmaps = false;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  MIPPED.add(tex);
  return true;
}

// run over one collection's LEAF materials, at the threshold they will be
// tested against — the coverage target only means anything against a cutoff
function mipFixAsset(name) {
  const built = cache[name];
  if (!built || !MIPFIX) return 0;
  const t = tuneOf(name);
  let n = 0;
  for (const m of built.mats) {
    if (m.userData.alphaMode === 'OPAQUE' || !m.map) continue;
    const cut = 255 * (m.userData.alphaMode === 'MASK'
      ? Math.max(t.alpha, m.userData.cutoff || 0) : t.alpha);
    if (buildCoverageMips(m.map, cut)) n++;
  }
  return n;
}

let CUT = 0.4;
function applyAlpha(mat) {
  const mode = mat.userData.alphaMode;
  if (mode === 'OPAQUE') return;
  hookTint(mat);
  // One rule for both cutout modes, because BLEND is what a forest cannot
  // afford: sorted, no depth prepass, overdraw unbounded. The pack's own MASK
  // cutoff is kept as the floor; the slider is what makes a crown thin out or
  // go solid in front of you.
  mat.transparent = false; mat.depthWrite = true;
  const cut = mode === 'MASK' ? Math.max(CUT, mat.userData.cutoff || 0) : CUT;
  // With sharpening on, the DIAL becomes the sharpen's cutoff and the hard
  // alpha test drops to a floor that only kills the genuinely empty texels:
  // discarding at the dial as well would throw away the ramp the sharpen has
  // just built, and the leaf would go thin again.
  if (mat.userData.uCut) mat.userData.uCut.value = cut;
  mat.alphaTest = (U_SHARP.value > 0 && mode !== 'OPAQUE') ? 0.01 : cut;
  // ALPHA TO COVERAGE — the actual reason a stand looks like gravel.
  // MSAA runs the fragment shader ONCE per pixel, so `discard` kills every
  // sample at once: a cutout edge gets no anti-aliasing at all, however many
  // samples the buffer has. Alpha-to-coverage turns the alpha value into a
  // coverage mask across those samples instead, which is the one fix that
  // makes a million leaf edges resolve. r128 supports it as a material flag.
  mat.alphaToCoverage = A2C;
  mat.needsUpdate = true;
}

function material(g, bin, mi) {
  if (mi === undefined) return new THREE.MeshStandardMaterial({ color: 0x8a9a7a, roughness: 1 });
  const m = g.materials[mi] || {};
  const pbr = m.pbrMetallicRoughness || {};
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().fromArray((pbr.baseColorFactor || [1, 1, 1, 1]).slice(0, 3)),
    roughness: pbr.roughnessFactor !== undefined ? pbr.roughnessFactor : 1,
    metalness: pbr.metallicFactor !== undefined ? pbr.metallicFactor : 0,
    side: m.doubleSided ? THREE.DoubleSide : THREE.FrontSide,
  });
  // Sketchfab still exports some packs on the retired
  // KHR_materials_pbrSpecularGlossiness, where the base colour lives under
  // `diffuseTexture` and pbrMetallicRoughness is empty. Without this fallback
  // vegetation_set_pine draws as white shards, which reads as a broken asset
  // when it is a missing branch in the reader.
  const sg = (m.extensions || {}).KHR_materials_pbrSpecularGlossiness;
  const baseTex = pbr.baseColorTexture || (sg && sg.diffuseTexture);
  if (baseTex) mat.map = imageTex(g, bin, baseTex.index, true);
  if (!pbr.baseColorFactor && sg && sg.diffuseFactor)
    mat.color.fromArray(sg.diffuseFactor.slice(0, 3));
  mat.userData.alphaMode = m.alphaMode || 'OPAQUE';
  mat.userData.cutoff = m.alphaCutoff;
  mat.userData.matName = m.name || '?';
  applyAlpha(mat);
  return mat;
}

function buildGLB(ab) {
  const p = parseGLB(ab), g = p.json, bin = p.bin;
  const geoms = (g.meshes || []).map(m => m.primitives.map(pr => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(accessor(g, bin, pr.attributes.POSITION), 3));
    if (pr.attributes.NORMAL !== undefined)
      geo.setAttribute('normal', new THREE.BufferAttribute(accessor(g, bin, pr.attributes.NORMAL), 3));
    if (pr.attributes.TEXCOORD_0 !== undefined)
      geo.setAttribute('uv', new THREE.BufferAttribute(accessor(g, bin, pr.attributes.TEXCOORD_0), 2));
    if (pr.indices !== undefined) geo.setIndex(new THREE.BufferAttribute(accessor(g, bin, pr.indices), 1));
    if (pr.attributes.NORMAL === undefined) geo.computeVertexNormals();
    return { geo, mat: material(g, bin, pr.material) };
  }));

  const byNode = new Map(), mats = [];
  const nodeObj = i => {
    const n = g.nodes[i], o = new THREE.Group();
    o.name = n.name || ('node' + i);
    o.userData.node = i;
    if (n.matrix) o.applyMatrix4(new THREE.Matrix4().fromArray(n.matrix));
    else {
      if (n.translation) o.position.fromArray(n.translation);
      if (n.rotation) o.quaternion.fromArray(n.rotation);
      if (n.scale) o.scale.fromArray(n.scale);
    }
    if (n.mesh !== undefined) for (const pr of geoms[n.mesh]) {
      const me = new THREE.Mesh(pr.geo, pr.mat);
      me.name = g.meshes[n.mesh].name || '';
      o.add(me);
      if (mats.indexOf(pr.mat) < 0) mats.push(pr.mat);
    }
    for (const c of (n.children || [])) o.add(nodeObj(c));
    byNode.set(i, o);
    return o;
  };
  const root = new THREE.Group();
  const sc = g.scenes[g.scene || 0];
  for (const i of (sc.nodes || [])) root.add(nodeObj(i));
  root.updateMatrixWorld(true);
  return { root, byNode, mats, json: g };
}

// ==========================================================================
// the rail, the shelf and the ladder — all driven by the INDEX's groups
// ==========================================================================
let INDEX = null, CUR = null, MODE = 'shelf', KIND = 'trees';
let WIRE = false, LODSEL = -1, TRUE_SCALE = true, ISOLATE = null;
const cache = {};
const stage = new THREE.Group(); scene.add(stage);
const LADDER = [25, 50, 100, 250, 500, 1000];

// One group -> one Object3D standing on the origin. `els` are glTF node
// indices from the inspector, each tagged with its LOD; the selector picks
// among them and falls back to what the asset actually has.
function buildGroup(built, G) {
  const want = LODSEL < 0 ? null : LODSEL;
  let els = G.els;
  if (want !== null) {
    const hit = G.els.filter(e => e.lod === want);
    els = hit.length ? hit : null;
  } else {
    const lowest = G.els.reduce((m, e) => e.lod === null ? m : (m === null ? e.lod : Math.min(m, e.lod)), null);
    els = lowest === null ? G.els : G.els.filter(e => e.lod === lowest);
  }
  if (!els) return null;                       // this asset has no such rung
  const grp = new THREE.Group();
  for (const e of els) {
    if (e.clips && e.clips.length) {             // an island of a welded mesh
      for (const cl of e.clips) {
        const host = built.byNode.get(cl.node);
        if (!host) continue;
        const cut = clipObject(host, cl.local);
        if (cut) grp.add(cut);
      }
      continue;
    }
    const src = built.byNode.get(e.node);
    if (!src) continue;
    // clone(), then REPLACE the clone's transform with the source's world
    // matrix. Applying matrixWorld on top of a clone that already carries its
    // own local transform applies that local twice — and since Sketchfab's
    // per-subject nodes carry the Z-up -> Y-up rotation, twice means the tree
    // lies on its side (vegetation_set_pine measured 13.8 m tall by 29.4 m
    // long until this was fixed; the inspector had it right at 29.42 m).
    const c = src.clone(true);
    c.position.set(0, 0, 0);
    c.quaternion.set(0, 0, 0, 1);
    c.scale.set(1, 1, 1);
    c.applyMatrix4(src.matrixWorld);
    grp.add(c);
  }
  if (!grp.children.length) return null;
  const bb = new THREE.Box3().setFromObject(grp);
  if (!isFinite(bb.min.x)) return null;
  const size = bb.getSize(new THREE.Vector3()), ctr = bb.getCenter(new THREE.Vector3());
  // TERRAIN STAYS WHERE IT IS. Everything else is re-seated on the origin so
  // it can stand on a shelf; the ground is the surface we will scatter onto,
  // so moving it would throw away the only thing it is kept for.
  // Sit it on zero first; the sink is applied to the HOLDER afterwards so it
  // stays a distance in world metres and does not get multiplied by `size`.
  if (!G.inPlace) grp.position.set(-ctr.x, -bb.min.y, -ctr.z);
  const holder = new THREE.Group();
  holder.add(grp);
  const t = CUR ? tuneOf(CUR.name) : TUNE_DEFAULT;
  const k = (TRUE_SCALE ? 1 : (CUR.scaleHint || 1)) * (t.size || 1);
  if (k !== 1) holder.scale.setScalar(k);
  // The sink rides in userData as well as in the transform. Placing a tree —
  // in the stand or on the ladder — writes position.set(x, y, z), which
  // silently discarded it: the dial rebuilt the forest and nothing moved.
  holder.userData.sink = G.inPlace ? 0 : (t.sink || 0);
  if (!G.inPlace) holder.position.y = -holder.userData.sink;
  holder.userData = { name: G.name, h: size.y * k,
                      w: Math.max(size.x, size.z) * k, group: G,
                      sink: G.inPlace ? 0 : (t.sink || 0) };
  return holder;
}

// One island out of a welded mesh. The inspector gives a LOCAL box; keep the
// triangles whose centroid falls inside it. That is how a single oak trunk is
// shown out of a mesh holding 3,844 of them, without the page repeating the
// split the inspector already did.
function clipObject(src, box) {
  const out = new THREE.Group();
  src.updateWorldMatrix(true, false);
  src.traverse(m => {
    if (!m.isMesh) return;
    const g = m.geometry, pos = g.attributes.position;
    const idx = g.index ? g.index.array : null;
    const n = idx ? idx.length : pos.count;
    const keep = [];
    for (let t = 0; t + 2 < n; t += 3) {
      const a = idx ? idx[t] : t, b = idx ? idx[t + 1] : t + 1, c = idx ? idx[t + 2] : t + 2;
      const cx = (pos.getX(a) + pos.getX(b) + pos.getX(c)) / 3;
      const cy = (pos.getY(a) + pos.getY(b) + pos.getY(c)) / 3;
      const cz = (pos.getZ(a) + pos.getZ(b) + pos.getZ(c)) / 3;
      if (cx < box[0] || cx > box[3] || cy < box[1] || cy > box[4] || cz < box[2] || cz > box[5]) continue;
      keep.push(a, b, c);
    }
    if (!keep.length) return;
    const ng = new THREE.BufferGeometry();
    for (const k of ['position', 'normal', 'uv']) if (g.attributes[k]) ng.setAttribute(k, g.attributes[k]);
    ng.setIndex(keep);
    const nm = new THREE.Mesh(ng, m.material);
    nm.applyMatrix4(m.matrixWorld);
    out.add(nm);
  });
  return out.children.length ? out : null;
}

function groupsOf(a) { return (a && a[KIND]) || []; }

// A collection can declare that only some of its subjects are wanted:
// mountain_trees ships eight and only its three tall ones are of interest.
// `keepTop` in the tuning takes the N tallest; without it, everything.
function subjectsOf(a) {
  if (!a) return [];
  const t = tuneOf(a.name);
  const all = (a.trees || []).slice();
  if (t.keepTop && t.keepTop < all.length)
    return all.slice().sort((x, y) => y.h - x.h).slice(0, t.keepTop);
  return all;
}

function clearStage() { while (stage.children.length) stage.remove(stage.children[0]); }
function applyWire() { stage.traverse(m => { if (m.isMesh) m.material.wireframe = WIRE; }); }

function tally() {
  let tris = 0, meshes = 0;
  stage.traverse(m => {
    if (!m.isMesh || m.userData.station) return;
    meshes++;
    const g = m.geometry;
    tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
  });
  return { tris: Math.round(tris), meshes };
}

function showShelf(built) {
  clearStage();
  let list = KIND === 'trees' ? subjectsOf(CUR) : groupsOf(CUR);
  if (ISOLATE) list = list.filter(G => G.name === ISOLATE);
  const cols = [];
  for (const G of list) { const h = buildGroup(built, G); if (h) cols.push(h); }
  cols.sort((a, b) => b.userData.h - a.userData.h);
  const inPlace = KIND === 'terrain';
  let x = 0, maxH = 0;
  for (const c of cols) {
    if (!inPlace) {
      const w = Math.max(2.2, c.userData.w * 1.12);
      x += w / 2; c.position.x = x; x += w / 2 + 0.7;
    }
    maxH = Math.max(maxH, c.userData.h);
    stage.add(c);
  }
  applyWire();
  if (inPlace) {
    // the ground drawn as one piece, framed whole — this is the scatter
    // surface, and its own coordinates are what make it one
    const bb = new THREE.Box3().setFromObject(stage);
    const sz = bb.getSize(new THREE.Vector3()), ct = bb.getCenter(new THREE.Vector3());
    man.position.set(ct.x, bb.min.y, ct.z); man.visible = true;
    target.copy(ct);
    dist = Math.max(20, Math.max(sz.x, sz.z) * 1.1);
    yaw = 0.6; pitch = 0.42; place();
  } else {
    man.position.set(-1.8, 0, 0); man.visible = true;
    target.set(x / 2, maxH * 0.45, 0);
    dist = Math.max(14, Math.max(x * 0.8, maxH * 1.9)); place();
  }
  measureStage();
  const t = tally();
  return { count: cols.length, tris: t.tris, meshes: t.meshes, maxH,
           heights: cols.map(c => ({ name: c.userData.name, h: c.userData.h })) };
}

function showLadder(built) {
  clearStage();
  let list = groupsOf(CUR);
  if (ISOLATE) list = list.filter(G => G.name === ISOLATE);
  if (!list.length) return { count: 0, tris: 0, meshes: 0, maxH: 0, heights: [] };
  // the tallest subject is the one worth judging at range, unless one is pinned
  let best = null;
  for (const G of list) {
    const h = buildGroup(built, G);
    if (h && (!best || h.userData.h > best.userData.h)) best = h;
  }
  if (!best) return { count: 0, tris: 0, meshes: 0, maxH: 0, heights: [] };

  // A straight receding line hides every station behind the nearest subject,
  // so the stations sit on a shallow ARC — a constant angular step, which is
  // also the honest comparison: the same tree at the same bearing offset,
  // and only the distance differs.
  const A0 = 5 * Math.PI / 180, DA = 5.5 * Math.PI / 180;
  LADDER.forEach((d, i) => {
    const a = A0 + i * DA;
    const h = best.clone(true);
    h.position.set(d * Math.sin(a), -(h.userData.sink || 0), -d * Math.cos(a));
    stage.add(h);
    // a stake per station: without it the eye cannot tell 250 m from 500 m,
    // which is the one judgement this view exists to support
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 4, 6),
      new THREE.MeshBasicMaterial({ color: 0x5db3ff }));
    post.position.set(d * Math.sin(a) + Math.max(1.5, d * 0.012), 2, -d * Math.cos(a));
    post.userData.station = d;
    stage.add(post);
  });
  man.position.set(LADDER[0] * Math.sin(A0) - 1.7, 0, -LADDER[0] * Math.cos(A0));
  man.visible = true;
  applyWire();
  // the eye stands on the ground at the near end, as a pilot would meet the
  // stand — not a helicopter view
  const ac = A0 + 2.5 * DA;
  target.set(150 * Math.sin(ac), 14, -150 * Math.cos(ac));
  dist = 150;
  yaw = Math.atan2(-target.x, -target.z);
  pitch = Math.asin(Math.max(-0.39, (6 - target.y) / dist));
  place();
  measureStage();
  const t = tally();
  return { count: LADDER.length, tris: t.tris, meshes: t.meshes,
           maxH: best.userData.h, ladderTree: best.userData.name,
           heights: [{ name: best.userData.name, h: best.userData.h }] };
}

async function load(entry, keepIsolate) {
  if (MODE === 'forest') return;         // the stand owns the stage
  if (CUR !== entry) ISOLATE = null;
  else if (!keepIsolate) ISOLATE = ISOLATE;
  CUR = entry;
  $('msg').textContent = 'loading ' + entry.name + '…';
  paintRail();
  if (!entry.renderable) { clearStage(); man.visible = false; $('msg').textContent = ''; paintFacts(null); render(); return; }
  try {
    if (!cache[entry.name]) {
      const ab = await (await fetch(RAW + entry.name)).arrayBuffer();
      cache[entry.name] = buildGLB(ab);
    }
    const built = cache[entry.name];
    await texturesReady();                 // the bake reads these; see imageTex
    retint(entry.name);
    const stats = MODE === 'variants' ? showVariants(built)
                : MODE === 'shelf' ? showShelf(built) : showLadder(built);
    $('msg').textContent = '';
    paintFacts(stats);
    render();
  } catch (e) {
    $('msg').innerHTML = '<span class="bad">' + e.message + '</span>';
    console.error(e);
  }
}

// ---- rail + facts --------------------------------------------------------
function paintRail() {
  const ui = $('ui');
  const isTreeSource = a => a.trees.length && !a.trees.every(t => t.merged);
  const rows = INDEX.assets.filter(a => isTreeSource(a) || !a.renderable).sort((a, b) =>
    (b.renderable ? 1 : 0) - (a.renderable ? 1 : 0) || b.trees.length - a.trees.length || b.tris - a.tris);
  let h = '<div class="grp">CANDIDATES — near asset</div>', off = false;
  for (const a of rows) {
    if (!a.renderable && !off) { h += '<div class="grp">OFFLINE — bake source only</div>'; off = true; }
    const sel = CUR && CUR.name === a.name ? ' sel' : '';
    const n = a.trees.length + a.shrubs.length + a.billboards.length +
              a.terrain.length;
    const bad = a.licence && a.licence.ok === false;
    h += '<div class="item' + sel + (a.renderable ? '' : ' off') + '" data-n="' + a.name + '">' +
         '<span' + (bad ? ' class="bad"' : '') + '>' + (bad ? '⛔ ' : '') +
         a.name.replace(/\.(glb|gltf\.zip)$/, '').slice(0, 30) + '</span>' +
         '<i>' + n + ' subj · ' + (a.tris > 999999 ? (a.tris / 1e6).toFixed(1) + ' M' : a.tris.toLocaleString()) + '</i></div>';
  }
  h += '<div id="facts"></div>';
  ui.innerHTML = h;
  for (const el of ui.querySelectorAll('.item'))
    el.onclick = () => load(INDEX.assets.find(a => a.name === el.dataset.n));
}

function paintFacts(stats) {
  const a = CUR, f = $('facts');
  if (!a || !f) return;
  const num = n => n >= 1e6 ? (n / 1e6).toFixed(2) + ' M' : n.toLocaleString();
  let h = '<h2>' + a.name + '</h2><table>';
  h += '<tr><td class="k">file</td><td>' + a.fileMB + ' MB' +
       (a.binMB ? ' <span style="color:var(--dim)">(' + a.binMB + ' MB geometry)</span>' : '') + '</td></tr>';
  h += '<tr><td class="k">triangles</td><td class="' + (a.tris > 200000 ? 'bad' : a.tris > 40000 ? 'warn' : 'ok') + '">' + num(a.tris) + '</td></tr>';
  h += '<tr><td class="k">textures</td><td>' + a.images + ' images, ' + a.texMB + ' MB</td></tr>';
  h += '<tr><td class="k">subjects</td><td>' + a.trees.length + ' tree · ' + a.shrubs.length +
       ' shrub · ' + a.billboards.length + ' billboard' +
       (a.terrain.length ? ' · ' + a.terrain.length + ' terrain' : '') + '</td></tr>';
  h += '<tr><td class="k">tallest</td><td class="' + (a.scaleFlag ? 'bad' : '') + '">' +
       (a.tallest ? a.tallest.toFixed(1) + ' m' : '—') + '</td></tr>';
  h += '</table>';

  if (a.scaleFlag)
    h += '<div class="note bad">SCALE. The tallest subject measures ' + a.tallest.toFixed(1) +
         ' m — about ' + (1 / a.scaleHint).toFixed(0) + 'x a real conifer. The export is in the wrong units. ' +
         'Turn off "true scale" to view it at x' + a.scaleHint.toFixed(4) + '; the file is not changed.</div>';

  const anyMerged = [].concat(a.trees, a.shrubs, a.billboards, a.terrain)
    .some(G => G.merged);
  if (anyMerged) {
    h += '<div class="note warn">WELDED BY MATERIAL. This export merges every instance of a ' +
         'material into one mesh, so a subject here is ALL the oak trunks, ALL the grass — ' +
         'not a separable tree. Its identity is the MATERIAL NAME (the node names are a ' +
         'leftover from another pack by the same author) and its height is the extent of a ' +
         'collection, not of a trunk. A ground-cover and road reference; not a near asset.</div>';
  }
  if (a.rawMeshes && a.rawMeshes > 30 && !anyMerged) {
    const uniq = a.trees.length + a.shrubs.length + a.billboards.length + a.terrain.length;
    h += '<div class="note">SCENE — ' + a.rawNodes + ' nodes, ' + a.rawMeshes +
         ' meshes, <b>' + uniq + ' unique geometries</b>. The copies are counted, not drawn ' +
         'separately: identical geometry is one subject wearing an instance count.</div>';
  }

  h += '<h2>PROVENANCE</h2>';
  if (a.licence && a.licence.ok === false) {
    h += '<div class="note bad" style="border:1px solid var(--bad);padding:6px;border-radius:4px">' +
         '<b>LICENCE: ' + a.licence.text + '</b><br>' + a.licence.why +
         '<br>It may be looked at here and used as a test display. It must never reach <code>media/</code>, ' +
         'a bake, or the published site — unlike every CC-BY and CC0 asset beside it.</div>';
  }
  if (a.credit) {
    h += '<table><tr><td class="k">title</td><td>' + (a.credit.title || '?') + '</td></tr>' +
         '<tr><td class="k">author</td><td>' + (a.credit.author || '?') + '</td></tr>' +
         '<tr><td class="k">licence</td><td class="ok">' + (a.credit.license || '?') + '</td></tr>' +
         (a.credit.source ? '<tr><td class="k">source</td><td style="word-break:break-all;font-size:10px">' + a.credit.source + '</td></tr>' : '') +
         '</table>';
  } else {
    h += '<div class="note warn">No asset.extras block — the licence is not IN the file. Confirm it at the source before this asset ships, and record it in CREDITS.md.</div>';
  }

  h += '<h2>MATERIALS</h2>';
  for (const m of a.materials) {
    const cls = m.cannotCut ? 'dead' : m.alpha === 'MASK' ? 'mask' : m.alpha === 'BLEND' ? 'blend' : '';
    h += '<span class="tag ' + cls + '">' + m.alpha +
         (m.cutoff != null ? ' ' + (+m.cutoff).toFixed(2) : '') + '</span> ' +
         '<span style="font-size:10px">' + m.name + '</span>' +
         (m.cannotCut ? ' <span class="bad" style="font-size:10px">no alpha channel</span>' : '') + '<br>';
  }
  if (a.cannotCut)
    h += '<div class="note bad">' + a.cannotCut + ' cutout material' + (a.cannotCut > 1 ? 's' : '') +
         ' whose base-colour texture has NO ALPHA CHANNEL (read from the PNG/JPEG header). ' +
         'It renders solid at every threshold — the slider cannot help, and neither can a bake. ' +
         'That is why the branches look like slabs.</div>';
  else if (a.alphaBlend)
    h += '<div class="note warn">' + a.alphaBlend + ' material' + (a.alphaBlend > 1 ? 's' : '') +
         ' in BLEND. Blending needs back-to-front sorting and refuses a depth prepass — the wrong mode at forest density. ' +
         'The page draws them as alpha test at the slider\'s threshold, which is how they would ship.</div>';

  // THE SAME DIALS THE STAND HAS. A species is judged on its own screen and
  // then in the mix, and having to switch modes to change its colour made the
  // two readings drift apart.
  const td = tuneOf(a.name);
  h += '<h2>THIS COLLECTION</h2><table class="fRows">';
  for (const dial of [['hue', -0.5, 0.5, 0.005], ['sat', 0, 1.4, 0.01],

                      ['sink', 0, 4, 0.05], ['proportion', 0, 3, 0.05],
                      ['stick', 0.01, 0.3, 0.005], ['impa', 1, 20, 0.5],
                      ['implight', 0.4, 2, 0.01], ['dead', 0, 0.6, 0.01]]) {

  const list = KIND === 'trees' ? subjectsOf(a) : groupsOf(a);
  h += '<h2>' + KIND.toUpperCase() + ' — ' + list.length + '</h2><table>';
  for (const G of list.slice(0, 30)) {

    h += '<tr class="rowsel' + sel + '" data-g="' + G.name.replace(/"/g, '') + '">' +
         '<td style="font-size:10px">' + G.name.slice(0, 26) +
           (G.parts > 1 ? ' <span style="color:var(--dim)">' + G.parts + 'p</span>' : '') +
           (G.copies > 1 ? ' <span style="color:var(--acc)">x' + G.copies + '</span>' : '') + '</td>' +
         '<td class="n" style="font-size:10px">' + G.h.toFixed(1) + 'm</td>' +
         '<td class="n" style="font-size:10px">' + G.lods.map(l => 'L' + l.lod + ' ' + l.tris.toLocaleString()).join(' · ') + '</td></tr>';
  }
  if (list.length > 30) h += '<tr><td colspan="3" style="color:var(--dim)">… ' + (list.length - 30) + ' more</td></tr>';
  h += '</table>';
  const chains = list.filter(G => G.lods.length > 1).length;
  h += '<div class="note">' + (chains ? chains + ' of ' + list.length + ' carry a shipped LOD chain.'

  if (!a.renderable) {
    h += '<div class="note bad">NOT DRAWN. ' + num(a.tris) + ' triangles in a ' + a.binMB +
         ' MB buffer — an offline-render tree. Its place in §8.3\'s ladder is as the bake source for the impostor atlas and the canopy shell, and as the reference for what the near asset should look like. It is not a near asset.</div>';
  } else if (stats && stats.cells !== undefined) {
    h += '<h2>VARIANT GRID</h2><table>' +
      '<tr><td class="k">cells</td><td>' + stats.cells + '</td></tr></table>' +
      '<table class="fRows">';
    const bySub = {};
    for (const r of stats.stats) (bySub[r.subject] = bySub[r.subject] || []).push(r);
    for (const sub in bySub) {
      h += '<tr><td colspan="2" style="color:var(--fg);padding-top:6px">' + sub.slice(0, 26) + '</td></tr>';
      const fullT = (bySub[sub].find(r => r.variant === 'full') || {}).tris || 1;
      for (const r of bySub[sub])
        h += '<tr><td class="k" style="font-size:10px">' + r.variant + '</td>' +
             '<td class="n" style="font-size:10px">' + r.tris.toLocaleString() +
             '  <span style="color:var(--dim)">' + (100 * r.tris / fullT).toFixed(0) + '%</span></td></tr>';
    }
    h += '</table>';
  } else if (stats && stats.tris !== undefined) {
    h += '<h2>ON SCREEN</h2><table>' +
      '<tr><td class="k">view</td><td>' + MODE + (stats.ladderTree ? ' · ' + stats.ladderTree : '') + '</td></tr>' +
      '<tr><td class="k">drawn</td><td>' + stats.tris.toLocaleString() + ' tris · ' + stats.meshes + ' meshes</td></tr>' +
      '<tr><td class="k">tallest</td><td>' + stats.maxH.toFixed(1) + ' m</td></tr></table>';
    const l0 = list[0] && list[0].lods[0] ? list[0].lods[0].tris : 0;
    if (l0 && KIND === 'trees') {
      const v = l0 >= 2000 && l0 <= 8000 ? ['ok', 'inside §8.3 R1\'s 2–8 k budget']
        : l0 < 2000 ? ['warn', 'below §8.3 R1\'s 2 k floor — cheap, but is it a tree at 25 m?']
        : ['warn', 'above §8.3 R1\'s 8 k ceiling for the biggest tree; the LOD chain is what answers this'];
      h += '<div class="note ' + v[0] + '">largest LOD0 ' + l0.toLocaleString() + ' tris — ' + v[1] + '</div>';
    }
  }
  f.innerHTML = h;
  for (const r of f.querySelectorAll('.rowsel'))
    r.onclick = () => { ISOLATE = ISOLATE === r.dataset.g ? null : r.dataset.g; load(CUR, true); };
  for (const el of f.querySelectorAll('.fDial'))
    el.oninput = () => {
      const t = tuneOf(el.dataset.n);
      t[el.dataset.k] = +el.value;
      TUNE[el.dataset.n] = t;
      saveTune();
      el.nextElementSibling.textContent = (+el.value).toFixed(+el.step < 0.01 ? 3 : 2);
      if (['sink', 'size', 'proportion', 'dead', 'stick', 'impa', 'implight'].indexOf(el.dataset.k) >= 0) { load(CUR, true); return; }
      retint(el.dataset.n);
      render();
    };
}


// ==========================================================================
// MEASURING THE LEAVES — the colour pass starts from numbers, not from taste
//
// Every collection was authored by somebody else under their own light, so a
// mixed forest reads as a set of stickers unless the foliage is brought to
// one place. The correction cannot be guessed: it is computed from what the
// TEXTURES actually contain. For each collection, every cutout (leaf)
// material's base texture is drawn to a small canvas and the pixels that
// SURVIVE THE ALPHA TEST are averaged — the transparent surround of a leaf
// card would otherwise drag every mean toward the background colour.
//
// The mean goes to HSL, and that is the collection's colour in one row.
// ==========================================================================
const MEAS = {};                       // assetName -> { h, s, l, px, mats }

function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  const l = (mx + mn) / 2;
  let h = 0, sat = 0;
  if (d > 1e-6) {
    sat = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
    else if (mx === g) h = ((b - r) / d + 2) / 6;
    else h = ((r - g) / d + 4) / 6;
  }
  return { h: h, s: sat, l: l };
}

const _mcv = document.createElement('canvas');
_mcv.width = _mcv.height = 64;
const _mctx = _mcv.getContext('2d', { willReadFrequently: true });

function measureAsset(name, built) {
  let R = 0, G = 0, B = 0, n = 0, mats = 0, pending = 0;
  for (const m of built.mats) {
    if (m.userData.alphaMode === 'OPAQUE') continue;   // bark and ground: not leaves
    if (!m.map || !m.map.image) { pending++; continue; }
    mats++;
    try {
      _mctx.clearRect(0, 0, 64, 64);
      _mctx.drawImage(m.map.image, 0, 0, 64, 64);
      const d = _mctx.getImageData(0, 0, 64, 64).data;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] < 128) continue;                  // only what the cutout keeps
        R += d[i]; G += d[i + 1]; B += d[i + 2]; n++;
      }
    } catch (e) { /* a texture that will not decode is simply not measured */ }
  }
  if (!n) return pending ? null : { h: 0, s: 0, l: 0, px: 0, mats: 0 };
  const hsl = rgb2hsl(R / n, G / n, B / n);
  return { h: hsl.h, s: hsl.s, l: hsl.l, px: n, mats: mats,
           rgb: [Math.round(R / n), Math.round(G / n), Math.round(B / n)] };
}

// ---- the standardisation, and where it stops -----------------------------
// The tool proposes ONE number per collection per axis and no more. It reads
// a REFERENCE collection's measured hue and lightness as the target, and
// takes the target saturation as the LOWEST measured across the set — so
// every correction is a desaturation and none pushes a texture past what it
// holds. The author keeps the sliders; this only sets a sane starting point.
function pct(arr, q) {
  const a = arr.slice().sort((x, y) => x - y);
  if (!a.length) return 0;
  const i = (a.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i);
  return lo === hi ? a[lo] : a[lo] + (a[hi] - a[lo]) * (i - lo);
}

function suggestTuning(refName) {
  const names = Object.keys(MEAS).filter(n => MEAS[n] && MEAS[n].px);
  if (!names.length) return 0;
  const ref = MEAS[refName] || MEAS[names[0]];

  // SATURATION target: the lower quartile, not the minimum. The minimum in
  // this set is 10 % — one washed-out texture — and equalising to it would
  // grey the whole forest to match the weakest member. The quartile pulls the
  // loud ones down without flattening the set, and because the ratio is
  // clamped at 1, a collection already below the target is left alone: that
  // is what "desaturate to meet, never saturate up" means in practice.
  const targetS = pct(names.map(n => MEAS[n].s), 0.25);
  // LIGHTNESS target: the median, not the reference. Matching the reference
  // here would drag everything to its 23 % and crush the stand dark.
  const targetL = pct(names.map(n => MEAS[n].l), 0.5);

  let done = 0;
  for (const n of names) {
    const m = MEAS[n];
    let dh = ref.h - m.h;                 // shortest way round the wheel
    if (dh > 0.5) dh -= 1;
    if (dh < -0.5) dh += 1;
    const t = tuneOf(n);
    t.hue = +dh.toFixed(3);
    t.sat = +Math.min(1, m.s > 1e-4 ? targetS / m.s : 1).toFixed(3);
    t.light = +Math.min(1.8, Math.max(0.4, m.l > 1e-4 ? targetL / m.l : 1)).toFixed(3);
    TUNE[n] = t;
    done++;
  }
  saveTune();
  return done;
}
function saveTune() {
  try { localStorage.setItem('flydiy.trees.tuning', JSON.stringify(TUNE)); } catch (e) {}
}
function retint(name) {
  const built = cache[name];
  if (!built) return;
  if (MIPFIX) mipFixAsset(name);
  aoFixAsset(name);
  const t = tuneOf(name);
  for (const m of built.mats) { CUT = t.alpha; applyAlpha(m); applyTune(m, t); }
}

// ==========================================================================
// THE FOREST — the only view that says whether a mix works
//
// A shelf shows one pack at a time and flatters all of them. A stand does
// not: it is where a collection that is bluer, or lighter, or simply from
// another author's light announces itself. So every ENABLED collection is
// scattered together, near trees at their finest rung and far ones as the
// billboard the pack already ships (§8.3's R1 and R2 side by side at the
// distances they are meant for), on a flat plane or on a real terrain
// reconstituted from one of the scene files.
// ==========================================================================
// THE FAR TIER IS ON BY DEFAULT. The stand this bench exists to judge is the
// one the game will draw, and that one has impostors in it - a forest opened
// with the far tier off is a picture of a configuration nobody ships. It costs
// the first build a bake of one atlas per prototype; the signature cache means
// it is paid once.
const FOREST = { count: 260, radius: 220, split: 60, ground: 'plane', seed: 7,
                 scale: 1, spread: 0.2, impostor: true, glades: 6, edge: 12,
                 mix: 0.5 };
const PICK = {};                       // assetName -> included in the stand
let forestGround = null;

function rng(seed) {                   // deterministic: a stand you can re-judge
  let x = seed >>> 0;
  return function () {
    x ^= x << 13; x ^= x >>> 17; x ^= x << 5; x >>>= 0;
    return x / 4294967296;
  };
}

async function ensureLoaded(name) {
  if (cache[name]) return cache[name];
  const a = INDEX.assets.find(x => x.name === name);
  if (!a || !a.renderable) return null;
  const ab = await (await fetch(RAW + encodeURIComponent(name))).arrayBuffer();
  cache[name] = buildGLB(ab);
  return cache[name];
}

// the two rungs a collection can offer a stand
function protoOf(built, a, G, far) {
  const saveL = LODSEL, saveC = CUR;
  CUR = a;
  LODSEL = far ? (G.lods.length > 1 ? G.lods[G.lods.length - 1].lod : -1) : -1;
  const h = buildGroup(built, G);
  LODSEL = saveL; CUR = saveC;
  return h;
}

// A collection's `proportion` is its weight in the draw; its prototypes then
// share that weight between them, so adding a fourth pine to a pack does not
// quietly make pines three quarters of the wood.
// the dial says what it does: the ratio range it actually produces
function spreadLabel(v) {
  return v <= 0 ? 'uniform'
    : Math.exp(-v).toFixed(2) + '-' + Math.exp(v).toFixed(2) + 'x';
}

// A SNAG is the tree minus its cutout materials. The same split the tint
// already relies on does the work: a cutout material is foliage, an opaque
// one is bark. If nothing opaque remains — a billboard-only prototype is all
// cutout — there is no snag to make and the caller plants the living tree.
function stripFoliage(src) {
  const c = src.clone(true);
  const kill = [];
  c.traverse(o => {
    if (o.isMesh && o.material && o.material.userData.alphaMode !== 'OPAQUE') kill.push(o);
  });
  for (const o of kill) if (o.parent) o.parent.remove(o);
  let any = false;
  c.traverse(o => { if (o.isMesh) any = true; });
  return any ? c : null;
}

function pickWeighted(pool, r) {
  let total = 0;
  for (const p of pool) total += (tuneOf(p.a.name).proportion || 0) / (p.a._nProto || 1);
  if (total <= 0) return pool[Math.floor(r * pool.length)];
  let acc = r * total;
  for (const p of pool) {
    acc -= (tuneOf(p.a.name).proportion || 0) / (p.a._nProto || 1);
    if (acc <= 0) return p;
  }
  return pool[pool.length - 1];
}


// ==========================================================================
// IMPOSTORS — ported from src/viewer/render_world.js (W17's bake)
//
// The game already does this and has since 2026-08-05; what it has never had
// is a decent tree to bake FROM. So this is the same algorithm, not a new
// one: a G x G grid of view directions folded over the upper hemisphere, each
// rendered to a tile, and a quad that picks the three nearest views and
// blends them barycentrically. A hard nearest-view pick makes the whole
// forest flip at once when the aeroplane turns, which is why it is three taps
// and not one.
//
// The hemi-octahedral fold puts the HORIZON RING on the edge of the square
// and straight-down at the centre — the right distribution for an aeroplane,
// which spends its life looking at trees from slightly above.
//
// Baked with the bench's own sun and environment, tone mapping off: the tile
// holds linear shading and ACES is applied once, at the final draw, like
// every other surface. Cleared to transparent BLACK and unpremultiplied at
// sample time, because that is the form bilinear filtering and mipmaps are
// correct on — anything else fringes dark at distance.
// ==========================================================================
const IMP_G = 8, IMP_TILE = 128;
// A SNAG STANDS IN FROM THE FIRST RUNG, so its sheet is baked finer. Thinning
// the branches off a bare trunk is not a cheaper bare trunk, it is a worse one
// - there is no foliage left to spend - so a dead tree goes from its full mesh
// straight to an impostor, and that impostor has to hold up closer than a
// live tree's ever does.
const IMP_TILE_HI = 224;
const IMP_CACHE = new Map();

const impDir = (i, j) => {
  const a = i / (IMP_G - 1) * 2 - 1, b = j / (IMP_G - 1) * 2 - 1;
  const px = (a + b) / 2, py = (a - b) / 2;
  return new THREE.Vector3(px, 1 - Math.abs(px) - Math.abs(py), py).normalize();
};

// ==========================================================================
// COVERAGE-PRESERVING MIPMAPS FOR THE ATLAS
//
// The leaf textures already get this (see buildCoverageMips); the tile sheet
// did not, and it is the sheet that is minified hardest. A tile is a CUTOUT,
// so averaging it down averages the alpha: a texel that was 1.0 beside three
// empty ones becomes 0.25, fails the test, and the crown thins with every
// level. A tree that is meant to hold its canopy at four kilometres instead
// evaporates into its own trunk.
//
// Three things this has to get right that the single-texture version did not:
//
//   - COVERAGE IS PER TILE. The sheet holds 64 views and they are not equally
//     dense: straight down through a fir is not the same silhouette as side
//     on. One global alpha scale would thicken the sparse views and thin the
//     solid ones, so each tile carries its own level-0 coverage as its target.
//
//   - THE BOX FILTER NEVER CROSSES A TILE. It does not have to be told not to:
//     tiles are a power of two and aligned to it, so a 2x2 box stays inside
//     one tile at every level until the tile is a single texel. Below that the
//     grid is gone and the whole level is held to the mean target instead.
//
//   - THE SHEET IS PREMULTIPLIED and the shader divides by alpha to get the
//     colour back. Scaling alpha alone would break that invariant and the
//     canopy would DARKEN with distance instead of thinning. So the colour is
//     carried by exactly the factor the alpha actually moved, per texel, and
//     rgb/a comes back to the same colour it had at level 0.
// ==========================================================================
function covTile(buf, rowW, x0, y0, w, h, cutoff, scale) {
  let n = 0;
  for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++)
    if (Math.min(255, buf[(y * rowW + x) * 4 + 3] * scale) >= cutoff) n++;
  return n / (w * h);
}

function rescaleTile(buf, rowW, x0, y0, w, h, target, cutoff) {
  if (target <= 0) return;
  let lo = 0.0, hi = 64.0, best = 1.0;
  for (let it = 0; it < 12; it++) {
    const mid = (lo + hi) * 0.5;
    if (covTile(buf, rowW, x0, y0, w, h, cutoff, mid) < target) lo = mid;
    else { hi = mid; best = mid; }
  }
  if (Math.abs(best - 1) < 0.02) return;
  for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
    const i = (y * rowW + x) * 4;
    const a0 = buf[i + 3];
    if (!a0) continue;
    const a1 = Math.min(255, a0 * best);
    const f = a1 / a0;                   // the colour rides the alpha exactly
    buf[i] = buf[i] * f; buf[i + 1] = buf[i + 1] * f; buf[i + 2] = buf[i + 2] * f;
    buf[i + 3] = a1;
  }
}

function buildAtlasMips(rt, N, G, tile0, cutoff, plain) {
  const raw = new Uint8Array(N * N * 4);
  const pRT = renderer.getRenderTarget();
  renderer.readRenderTargetPixels(rt, 0, 0, N, N, raw);
  renderer.setRenderTarget(pRT);
  // readRenderTargetPixels reads bottom-up and setViewport wrote the grid
  // bottom-up, so the two already agree; the DataTexture keeps flipY false.
  let cur = new Uint8ClampedArray(raw.buffer.slice(0));
  const target = [];
  for (let ty = 0; ty < G; ty++) for (let tx = 0; tx < G; tx++)
    target.push(covTile(cur, N, tx * tile0, ty * tile0, tile0, tile0, cutoff, 1));
  let mean = 0;
  for (const v of target) mean += v;
  mean /= Math.max(1, target.length);

  const mips = [{ data: new Uint8Array(cur.buffer), width: N, height: N }];
  let w = N, h = N, tile = tile0;
  while (w > 1 || h > 1) {
    const nw = Math.max(1, w >> 1), nh = Math.max(1, h >> 1);
    const nd = new Uint8ClampedArray(nw * nh * 4);
    for (let y = 0; y < nh; y++) {
      const ya = Math.min(h - 1, y * 2), yb = Math.min(h - 1, y * 2 + 1);
      for (let x = 0; x < nw; x++) {
        const xa = Math.min(w - 1, x * 2), xb = Math.min(w - 1, x * 2 + 1);
        const p0 = (ya * w + xa) * 4, p1 = (ya * w + xb) * 4,
              p2 = (yb * w + xa) * 4, p3 = (yb * w + xb) * 4, o = (y * nw + x) * 4;
        for (let k = 0; k < 4; k++)
          nd[o + k] = (cur[p0 + k] + cur[p1 + k] + cur[p2 + k] + cur[p3 + k]) * 0.25;
      }
    }
    tile = tile >> 1;
    if (plain) { /* a normal sheet keeps its straight average - see mkTex */ }
    else if (tile >= 1) {
      for (let ty = 0; ty < G; ty++) for (let tx = 0; tx < G; tx++)
        rescaleTile(nd, nw, tx * tile, ty * tile, tile, tile, target[ty * G + tx], cutoff);
    } else {
      rescaleTile(nd, nw, 0, 0, nw, nh, mean, cutoff);
    }
    mips.push({ data: new Uint8Array(nd.buffer), width: nw, height: nh });
    cur = nd; w = nw; h = nh;
  }
  return mips;
}

// THE SECOND HALF OF THE G-BUFFER. One material per source material, cut out
// by the same map and the same threshold the albedo pass uses, so the two
// sheets agree texel for texel and a normal is never read where there is no
// leaf. World space rather than view space: the tile is looked up from a
// DIRECTION, not from a camera, and a view-space normal would have to be
// un-rotated by a matrix the draw does not have.
function normalMatFor(src) {
  let m = src.userData.nrmMat;
  if (!m) {
    m = new THREE.ShaderMaterial({
      uniforms: { map: { value: null }, uCut: { value: 0.5 }, uHasMap: { value: 0 } },
      vertexShader: [
        'varying vec3 vWN;', 'varying vec2 vUvN;',
        'void main() {',
        '  vWN = normalize(mat3(modelMatrix) * normal);',
        '  vUvN = uv;',
        '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
        '}',
      ].join(NL),
      fragmentShader: [
        'uniform sampler2D map;', 'uniform float uCut, uHasMap;',
        'varying vec3 vWN;', 'varying vec2 vUvN;',
        'void main() {',
        '  if (uHasMap > 0.5 && texture2D(map, vUvN).a < uCut) discard;',
        // a leaf card is DoubleSide and its far face's normal points away from
        // the light that is meant to be reaching it
        '  vec3 n = normalize(vWN);',
        '  if (!gl_FrontFacing) n = -n;',
        '  gl_FragColor = vec4(n * 0.5 + 0.5, 1.0);',
        '}',
      ].join(NL),
    });
    src.userData.nrmMat = m;
  }
  // refreshed every bake: the dials move uCut, and a map can decode late
  const cutout = src.userData.alphaMode !== 'OPAQUE';
  m.uniforms.map.value = src.map || null;
  m.uniforms.uCut.value = src.userData.uCut ? src.userData.uCut.value : (src.alphaTest || 0.5);
  m.uniforms.uHasMap.value = (cutout && src.map && src.map.image) ? 1 : 0;
  m.side = src.side;
  return m;
}

function bakeImpostor(proto, tile) {
  const TILE = tile || IMP_TILE;
  const staged = proto.clone(true);
  staged.position.set(0, 0, 0);
  staged.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(staged);
  if (!isFinite(bb.min.x)) return null;
  const size = bb.getSize(new THREE.Vector3());
  const cy = (bb.min.y + bb.max.y) * 0.5;
  const R = Math.max(size.x, size.y, size.z) * 0.5;
  const M = R * 1.12;                    // 12% gutter: mips bleed across tiles
  const N = IMP_G * TILE;
  const mkRT = () => new THREE.WebGLRenderTarget(N, N, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat, generateMipmaps: false,   // built on the CPU below
  });
  const rt = mkRT(), rtN = mkRT();       // albedo+coverage, and world normal
  // THE SHEET IS WRITTEN IN THE TARGET'S ENCODING, NOT THE RENDERER'S. r128
  // picks it as `null !== target ? target.texture.encoding : renderer.output-
  // Encoding`, and a WebGLRenderTarget's texture is LinearEncoding by default -
  // so the albedo was landing linear while the draw decoded it as sRGB, which
  // is a flat 2.2x too dark across the whole far band. That was the "much too
  // dark" the stand showed, and no amount of gain is the right answer to it.
  //
  // sRGB rather than "drop the decode", because eight bits of LINEAR is the
  // wrong container for foliage: a leaf's albedo sits near 0.03-0.15, which is
  // eight to thirty-eight levels. sRGB spends its precision where the tree is.
  // The NORMAL sheet stays linear - it is not a colour, and its material writes
  // gl_FragColor raw, with no encodings_fragment to apply one anyway.
  rt.texture.encoding = THREE.sRGBEncoding;
  const sc = new THREE.Scene();
  sc.add(staged);
  sc.environment = scene.environment;
  const dl = new THREE.DirectionalLight(sun.color.clone(), sun.intensity);
  dl.position.copy(sun.position);
  dl.target.position.set(0, cy, 0);
  sc.add(dl, dl.target);
  sc.add(new THREE.HemisphereLight(fill.color.clone(), fill.groundColor.clone(), fill.intensity));
  // THE TILE NO LONGER CARRIES A SHADOW, and that is the point of the change
  // above: a baked shadow is a baked SUN, and this sheet has to work under any.
  // What is left of the tree's own interior darkening is the AO, which IS a
  // property of the tree and travels with it into the albedo pass. So the
  // shadow map is off here; it would cost 64 tiles' worth of nothing.
  dl.castShadow = false;
  dl.shadow.mapSize.set(2048, 2048);
  dl.shadow.bias = -0.0008;
  dl.shadow.normalBias = 0.02;
  const SC = R * 1.25;
  const sd = dl.position.distanceTo(dl.target.position);
  dl.shadow.camera.left = -SC; dl.shadow.camera.right = SC;
  dl.shadow.camera.top = SC; dl.shadow.camera.bottom = -SC;
  dl.shadow.camera.near = Math.max(0.5, sd - R * 4);
  dl.shadow.camera.far = sd + R * 4;
  dl.shadow.camera.updateProjectionMatrix();
  staged.traverse(o => { if (o.isMesh) { o.castShadow = SHADOWS; o.receiveShadow = SHADOWS; } });

  const cam = new THREE.OrthographicCamera(-M, M, M, -M, 0.1, R * 8);
  const ctr = new THREE.Vector3(0, cy, 0);
  const pRT = renderer.getRenderTarget(), pAC = renderer.autoClear;
  const pTM = renderer.toneMapping, pSh = renderer.shadowMap.enabled;
  const pCol = new THREE.Color(); renderer.getClearColor(pCol);
  const pA = renderer.getClearAlpha();
  renderer.toneMapping = THREE.NoToneMapping;   // ACES once, at the real draw
  const pAU = renderer.shadowMap.autoUpdate;
  renderer.shadowMap.enabled = SHADOWS;
  renderer.shadowMap.autoUpdate = false;
  renderer.shadowMap.needsUpdate = true;   // once, then held for all 64 tiles
  // THE BAKE MUST NOT USE THE SCREEN'S CUTOUT PATH, and this is why the far
  // band came back as bare trunks. Alpha-to-coverage needs MSAA samples to
  // spread coverage across; a plain render target has none, so coverage
  // collapses to one bit. And the sharpen divides by fwidth(alpha), which at
  // a 128 px tile is enormous — every leaf texel lands near 0.5, that one bit
  // rounds it away, and only the OPAQUE trunk survives. So the tile is
  // rendered with a plain alpha test at the material's own cutoff: no
  // coverage, no sharpen.
  const bakeRestore = [];
  for (const n in cache) for (const m of cache[n].mats) {
    if (m.userData.alphaMode === 'OPAQUE') continue;
    bakeRestore.push([m, m.alphaToCoverage, m.alphaTest]);
    m.alphaToCoverage = false;
    m.alphaTest = 0.5;                 // the mask is binary now; see uBakeCut
    m.needsUpdate = true;
  }
  const prevSharp = U_SHARP.value, prevBakeCut = U_BAKECUT.value;
  U_SHARP.value = 0;
  U_BAKECUT.value = 1;
  for (const [m] of bakeRestore) m.needsUpdate = true;
  renderer.setRenderTarget(rt);
  renderer.autoClear = false;
  renderer.setClearColor(0x000000, 0);
  renderer.clear(true, true, false);
  // THE TILE RECT MUST LIVE ON THE RENDER TARGET, NOT ON THE RENDERER.
  // renderer.setViewport() writes the GL viewport immediately, but any pass
  // that re-binds a render target - the shadow map does, once - restores the
  // viewport from the TARGET's own `viewport`, which is the whole sheet. Every
  // tile after that one drew the tree at eight times the size, clipped to its
  // tile, and the atlas came out as a canopy smeared across the middle: 100%
  // coverage on a top-down tile whose geometry can only reach 30%. Setting the
  // rect on the target and re-binding per tile is the form that survives it.
  // ONE CAMERA BASIS, TWO SHEETS. The fold, the roll and the tile rect are
  // computed once and used by both passes, so albedo texel (x,y) and normal
  // texel (x,y) are the same point on the same tree - which is the whole
  // reason the draw is allowed to light one with the other.
  const drawAll = target => {
   renderer.setRenderTarget(target);
   renderer.autoClear = false;
   renderer.setClearColor(0x000000, 0);
   renderer.clear(true, true, false);
   for (let j = 0; j < IMP_G; j++) for (let i = 0; i < IMP_G; i++) {
    const d = impDir(i, j);
    // THE BAKE'S BASIS MUST BE THE BILLBOARD'S BASIS, exactly, or the tile is
    // sampled with the wrong ROLL and a near-vertical view smears into a pale
    // slab. A world up is fine near the horizon and degenerate looking down —
    // which is the one direction a flight sim cannot afford to get wrong. So
    // the camera is given the same right/up the CPU billboard will build,
    // pole fallback included, rather than a world up and a hope.
    const rgt = Math.abs(d.y) > 0.999
      ? new THREE.Vector3(1, 0, 0)
      : new THREE.Vector3(d.z, 0, -d.x).normalize();
    cam.up.copy(new THREE.Vector3().crossVectors(d, rgt));
    cam.position.copy(ctr).addScaledVector(d, R * 4);
    cam.lookAt(ctr);
