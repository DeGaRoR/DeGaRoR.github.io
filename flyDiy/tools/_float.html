<!DOCTYPE html>
<!--
  WIPLINE FLOAT BENCH (G451) — the drawn float alone, to judge by eye what
  GATE WIPLINE measures: the hull family of src/core/32_hydro.js at every
  catalogue preset, drawn by tools/_float_gen.js.

  What to judge here:
    - the PROFILE: the flat keel ahead of the step, the rocker into a near-
      vertical stem, the level deck, the afterbody's rise to a small transom;
    - the SECTIONS view: the warped V, the flare, and every hard edge as a
      ROUND (keel, chine, gunwale, lip, transom) under a grazing light — a
      highlight that sits inside the radius and flats that stay flat;
    - the NORMALS view: no smearing of a flat's colour into a fillet;
    - the details: covers, hatch, cups, cleats, the straps, the sister
      keelsons, the bumper, the water rudder with its pivots, the paddle on
      the inboard flank (the port float's starboard side here);
    - the stat line: closed hull, its volume against the catalogue.

  Serve from the repo root (launch: flydiy-float, port 8437) and open
  /flyDiy/tools/_float.html.  ?preset=Wipline%203000
-->
<meta charset="utf-8">
<title>flyDiy — Wipline float bench</title>
<style>
  :root{--bg:#12151a;--fg:#dfe6ee;--dim:#7d8996;--acc:#5db3ff;--grid:#242a33}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  header{padding:8px 12px;border-bottom:1px solid var(--grid);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font-size:13px;margin:0}
  label{color:var(--dim);display:inline-flex;gap:5px;align-items:center}
  select,button,input{background:#1a1f27;color:var(--fg);border:1px solid var(--grid);padding:3px 8px;border-radius:4px;font:inherit}
  main{display:flex;height:calc(100vh - 40px)}
  #view{position:relative;flex:1;min-width:0}
  canvas{display:block;width:100%;height:100%}
  #stat{position:absolute;left:10px;top:8px;color:var(--dim);z-index:2;white-space:pre;line-height:1.5}
  .ok{color:#6fd08c} .bad{color:#ff6b5a}
</style>
<header>
  <h1>Wipline float</h1>
  <label>preset <select id="preset"></select></label>
  <label>view <select id="view">
    <option value="paint" selected>paint</option><option value="normals">normals</option>
    <option value="wire">wire</option><option value="sections">sections</option></select></label>
  <label>camera <select id="cam">
    <option value="iso" selected>iso</option><option value="side">side</option><option value="plan">plan</option>
    <option value="bow">bow</option><option value="stern">stern</option><option value="under">under</option><option value="inboard">inboard side</option>
    <option value="step">step close</option><option value="rudder">rudder close</option><option value="bow close">bow close</option></select></label>
  <label>light az <input id="az" type="range" min="0" max="360" value="220" style="width:90px"></label>
  <label>el <input id="el" type="range" min="-70" max="85" value="35" style="width:70px"></label>
  <label><input id="detail" type="checkbox" checked> details</label>
  <label><input id="both" type="checkbox"> pair</label>
  <label>rudder <input id="rud" type="range" min="-1" max="1" step="0.05" value="0" style="width:70px"></label>
  <label>retract <input id="ret" type="range" min="0" max="1" step="0.05" value="0" style="width:70px"></label>
</header>
<main><div id="view"><div id="stat"></div><canvas id="c"></canvas></div></main>
<script src="../vendor/three.min.js"></script>
<script src="../src/core/32_hydro.js"></script>
<script src="_float_gen.js"></script>
<script>
'use strict';
const HY = window.HYDRO_GEN, FG = window.FLOAT_GEN;
const $ = id => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1c2129);
const camera = new THREE.PerspectiveCamera(32, 1, 0.02, 200);
const sun = new THREE.DirectionalLight(0xfff2e0, 2.6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.normalBias = 0.02; sun.shadow.bias = -0.0004; sun.shadow.camera.left = -8; sun.shadow.camera.right = 8; sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8; sun.shadow.camera.near = 1; sun.shadow.camera.far = 40;
scene.add(sun); scene.add(new THREE.HemisphereLight(0x9fb8d6, 0x3a3430, 0.9));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x2a2f36, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(20, 40, 0x39424e, 0x232a33); scene.add(grid);

for (const n of HY.FLOAT_PRESET_NAMES) { const o = document.createElement('option'); o.value = o.textContent = n; $('preset').appendChild(o); }
const q = new URLSearchParams(location.search); if (q.get('preset')) $('preset').value = q.get('preset');

const MAT = {
  paint: new THREE.MeshStandardMaterial({ color: 0xe9e4d6, roughness: 0.35, metalness: 0.0 }),
  deck: new THREE.MeshStandardMaterial({ color: 0x2d3034, roughness: 0.95, metalness: 0.0 }),
  hard: new THREE.MeshStandardMaterial({ color: 0xb9bec4, roughness: 0.4, metalness: 0.25 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x1d1f23, roughness: 0.9, metalness: 0.0 }),
  wood: new THREE.MeshStandardMaterial({ color: 0xb08a5a, roughness: 0.6, metalness: 0.0 }),
  normals: new THREE.MeshNormalMaterial(),
  wire: new THREE.MeshBasicMaterial({ color: 0x5db3ff, wireframe: true }),
};
let group = null, rudders = [];
const geo = part => {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(part.pos), 3));
  g.setIndex(part.idx.length > 65535 ? new THREE.Uint32BufferAttribute(part.idx, 1) : new THREE.Uint16BufferAttribute(part.idx, 1));
  g.computeVertexNormals();
  return g;
};
function build() {
  if (group) { scene.remove(group); group.traverse(o => o.geometry && o.geometry.dispose()); }
  group = new THREE.Group(); rudders = [];
  const name = $('preset').value, P = HY.presetParams(name), R = HY.FLOAT_PRESETS[name];
  const view = $('view').value, detail = $('detail').checked;
  const mat = k => view === 'normals' ? MAT.normals : view === 'wire' ? MAT.wire : MAT[k];
  const sides = $('both').checked ? [-1, 1] : [1];
  let stat = '';
  for (const sd of sides) {
    const o = FG.build(P, { HY, detail: detail ? 1 : 0, paddle: sd > 0 ? -1 : 0, rudder: 1 });
    const fg = new THREE.Group();
    const addPart = (part, k, cast) => { if (!part || !part.idx.length) return null; const m = new THREE.Mesh(geo(part), mat(k)); m.castShadow = cast !== false; m.receiveShadow = true; fg.add(m); return m; };
    addPart(o.hull, 'paint');
    if (o.protrusions) addPart(o.protrusions, 'paint');
    if (o.bumper) addPart(o.bumper, 'rubber');
    if (o.deck) addPart(o.deck, 'deck', false);
    if (o.hard) addPart(o.hard, 'hard');
    if (o.paddle) { addPart(o.paddle.shaft, 'hard'); addPart(o.paddle.blade, 'wood'); }
    if (o.rudder) {
      addPart(o.rudder.hard, 'hard');
      const rg = new THREE.Group();
      const bm = addPart(o.rudder.blade, 'paint'); fg.remove(bm); rg.add(bm);
      rg.userData.r = o.rudder; fg.add(rg); rudders.push(rg);
    }
    // the pair: mirror the port float (its paddle side flips with it)
    fg.position.z = sd * (sides.length > 1 ? 0.5 * (P.B + 1.2 * P.scale) : 0);
    if (sd < 0) fg.scale.z = -1;
    group.add(fg);
    if (sd === sides[sides.length - 1]) {
      const s = o.stats, F = HY.makeFloat(P);
      stat = `${name}${R.est ? '  (dims estimated)' : ''}\n` +
        `L ${P.L.toFixed(2)}  W ${P.B.toFixed(2)}  H ${P.H.toFixed(2)} m   step ${(P.xs / P.L * 100).toFixed(0)} %  deadrise ${P.beta.toFixed(0)}/${P.betaA.toFixed(0)}°  fineness ${P.fineK.toFixed(2)}\n` +
        `hull ${s.tris} tris, ${s.verts} verts, ${s.open === 0 ? '<closed>' : 'OPEN ' + s.open}  drawn ${(s.vol * 1000).toFixed(0)} kg  physics ${(F.volDeck * 1000).toFixed(0)} kg  catalogue ${R.flot} max / ${R.disp} disp\n` +
        `rudder blade ${o.rudder.span.toFixed(2)} x ${o.rudder.depth.toFixed(2)} m (${P.wrArea.toFixed(3)} m2)   hull mass ${P.mFloat.toFixed(0)} kg   for ${R.for}`;
    }
  }
  // sections view: the rings as lines
  if (view === 'sections') {
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const x = -P.xs + P.L * i / 40;
      const s = HY.sectionOf(P, x === 0 ? -1e-9 : x), side = FG.ringSide(P, s, { rKeel: 0.55 * P.keelW, rChine: P.rChine, rGun: P.rGun, margin: 0.035 * P.scale });
      for (let k = 0; k + 1 < side.length; k++) { pts.push(x, side[k][0], side[k][1], x, side[k + 1][0], side[k + 1][1]); pts.push(x, side[k][0], -side[k][1], x, side[k + 1][0], -side[k + 1][1]); }
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts), 3));
    group.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xffd479 })));
  }
  // stand the float on its keel flat
  group.position.y = 0.002;
  scene.add(group);
  $('stat').innerHTML = stat.replace('<closed>', '<span class=ok>closed</span>').replace(/OPEN \d+/, m => `<span class=bad>${m}</span>`);
  poseRudders();
  aim(P);
}
function poseRudders() {
  const st = +$('rud').value * HY.WR_TRAVEL, rt = +$('ret').value * (80 * Math.PI / 180);
  for (const rg of rudders) {
    const r = rg.userData.r;
    // steer about the post (y through post), then retract about the arm pivot (z through pivot)
    rg.position.set(0, 0, 0); rg.rotation.set(0, 0, 0);
    const m = new THREE.Matrix4();
    const T1 = new THREE.Matrix4().makeTranslation(-r.pivot[0], -r.pivot[1], -r.pivot[2]);
    const Rz = new THREE.Matrix4().makeRotationZ(rt);
    const T2 = new THREE.Matrix4().makeTranslation(r.pivot[0], r.pivot[1], r.pivot[2]);
    const T3 = new THREE.Matrix4().makeTranslation(-r.post[0], 0, -r.post[2]);
    const Ry = new THREE.Matrix4().makeRotationY(st);
    const T4 = new THREE.Matrix4().makeTranslation(r.post[0], 0, r.post[2]);
    m.copy(T4).multiply(Ry).multiply(T3).multiply(T2).multiply(Rz).multiply(T1);
    rg.matrixAutoUpdate = false; rg.matrix.copy(m);
  }
}
let P0 = null;
function aim(P) {
  P0 = P || P0; if (!P0) return;
  const L = P0.L, c = new THREE.Vector3(0.5 * (P0.L - 2 * P0.xs), 0.5 * P0.H, 0);
  const cam = $('cam').value;
  const set = (dx, dy, dz, d, tgt) => { const t = tgt || c; camera.position.set(t.x + dx * d, t.y + dy * d, t.z + dz * d); camera.lookAt(t); };
  if (cam === 'iso') set(-0.55, 0.45, 0.7, 1.55 * L);
  else if (cam === 'side') set(0, 0.05, 1, 1.7 * L);
  else if (cam === 'inboard') set(-0.15, 0.12, -1, 1.5 * L);
  else if (cam === 'plan') set(0.001, 1, 0, 1.7 * L);
  else if (cam === 'bow') set(-1, 0.25, 0.35, 1.3 * L);
  else if (cam === 'stern') set(1, 0.25, 0.35, 1.3 * L);
  else if (cam === 'under') set(-0.4, -0.7, 0.6, 1.5 * L);
  else if (cam === 'step') set(-0.35, -0.35, 0.85, 0.45 * L, new THREE.Vector3(0, 0.1, 0));
  else if (cam === 'rudder') set(0.8, 0.2, 0.55, 0.32 * L, new THREE.Vector3(P0.L - P0.xs, 0.5 * P0.H, 0));
  else if (cam === 'bow close') set(-0.8, 0.3, 0.55, 0.35 * L, new THREE.Vector3(-P0.xs + 0.2, 0.7 * P0.H, 0));
  const az = +$('az').value * Math.PI / 180, el = +$('el').value * Math.PI / 180;
  // under the float: no floor in the way, the sun from below
  ground.visible = grid.visible = camera.position.y >= 0 && el >= 0;
  sun.position.set(Math.cos(az) * Math.cos(el) * 14, Math.sin(el) * 14, Math.sin(az) * Math.cos(el) * 14);
  sun.target.position.copy(c); sun.target.updateMatrixWorld();
  render();
}
function render() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * renderer.getPixelRatio() || canvas.height !== h * renderer.getPixelRatio()) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
}
for (const id of ['preset', 'view', 'detail', 'both']) $(id).addEventListener('change', build);
for (const id of ['cam', 'az', 'el']) $(id).addEventListener('input', () => aim());
for (const id of ['rud', 'ret']) $(id).addEventListener('input', () => { poseRudders(); render(); });
window.addEventListener('resize', render);
window.BENCH = { build, aim, render, HY, FG, shot: () => canvas.toDataURL('image/png') };
build();
</script>
