<svg xmlns="http://www.w3.org/2000/svg" width="760" height="434" viewBox="0 0 760 434" role="img" aria-label="DMG-SETTLE debris: drops held before and after"><style>
:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--zero:#9b9a95;--phys:#2a78d6;--draw:#eb6834;--band:#f0efec}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--grid:#383835;--zero:#6f6e69;--phys:#3987e5;--draw:#d95926;--band:#262624}}
svg{background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.t{fill:var(--ink);font-size:13px;font-weight:600}.s{fill:var(--ink2);font-size:11px}.a{fill:var(--ink2);font-size:10px}
.g{stroke:var(--grid);stroke-width:1}.z{stroke:var(--zero);stroke-width:1}.band{fill:var(--band)}
.p{stroke:var(--phys);fill:none;stroke-width:2}.d{stroke:var(--draw);fill:none;stroke-width:2}.b{stroke-dasharray:5 4;stroke-width:1.5;opacity:.85}
.pm{fill:var(--phys)}.dm{fill:var(--draw)}
</style><text class="t" x="12" y="22" style="font-size:16px">DMG-SETTLE - debris bodies resting HELD by their drawing (of 20 seeded drops)</text><text class="s" x="12" y="38">hollow: before (contact on the box's 8 corners) - solid: after (the drawn part's support points)</text><text class="s" x="12" y="52">held = its centre over its drawn points on the ground (the stand-ins: each build's own sizes)</text><line class="g" x1="260" x2="260" y1="66" y2="414"/><text class="a" x="260" y="428" text-anchor="middle">0</text><line class="g" x1="365" x2="365" y1="66" y2="414"/><text class="a" x="365" y="428" text-anchor="middle">5</text><line class="g" x1="470" x2="470" y1="66" y2="414"/><text class="a" x="470" y="428" text-anchor="middle">10</text><line class="g" x1="575" x2="575" y1="66" y2="414"/><text class="a" x="575" y="428" text-anchor="middle">15</text><line class="g" x1="680" x2="680" y1="66" y2="414"/><text class="a" x="680" y="428" text-anchor="middle">20</text><text class="s" x="12" y="84">Cub - wheel+leg</text><line class="g" x1="638" x2="680" y1="80" y2="80" style="stroke-width:2"/><circle cx="638" cy="80" r="5" style="fill:var(--bg);stroke:var(--draw);stroke-width:2"><title>before: 18/20 held</title></circle><circle class="pm" cx="680" cy="80" r="5"><title>after: 20/20 held</title></circle><text class="a" x="690" y="84">18 -> 20</text><text class="s" x="12" y="106">Cub - eng+prop</text><line class="g" x1="554" x2="680" y1="102" y2="102" style="stroke-width:2"/><circle cx="554" cy="102" r="5" style="fill:var(--bg);stroke:var(--draw);stroke-width:2"><title>before: 14/20 held</title></circle><circle class="pm" cx="680" cy="102" r="5"><title>after: 20/20 held</title></circle><text class="a" x="690" y="106">14 -> 20</text><text class="s" x="12" y="128">Cub - cowl</text><line class="g" x1="680" x2="680" y1="124" y2="124" style="stroke-width:2"/><circle cx="680" cy="124" r="5" style="fill:var(--bg);stroke:var(--draw);stroke-width:2"><title>before: 20/20 held</title></c