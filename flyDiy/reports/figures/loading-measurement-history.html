<script type="module">
  import { mountChart } from "https://persistent.oaistatic.com/plugins/visualize/charts/1.8.1/element.js";
  const root = document.getElementById("loading-measurement-history");
  const select = root.querySelector("select");
  const configs = new Map([...root.querySelectorAll("[data-viz-chart]")].map(node => [node.dataset.group, JSON.parse(node.textContent)]));
  const initial = window.openai?.widgetState?.modelContent?.measurements;
  select.value = configs.has(initial) ? initial : "geometry";
  const chart = mountChart(root.querySelector("[data-viz-container]"), configs.get(select.value));
  select.addEventListener("change", () => {
    chart.config = configs.get(select.value);
    window.openai?.setWidgetState({modelContent: {measurements: select.value}}).catch(() => {});
  });
  window.addEventListener("openai:set_globals", event => {
    const key = event.detail?.globals?.widgetState?.modelContent?.measurements;
    if (configs.has(key)) { select.value = key; chart.config = configs.get(key); }
  });
  select.disabled = false;
</script>
