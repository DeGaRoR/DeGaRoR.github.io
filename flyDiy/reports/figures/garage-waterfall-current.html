<script type="module">
  import "https://persistent.oaistatic.com/plugins/visualize/widgets/1.0.59/waterfall.js";
  const root = document.getElementById("wingsmith-current-waterfall");
  const runs = JSON.parse(root.querySelector("[data-waterfall-runs]").textContent);
  const select = root.querySelector("select");
  const steps = document.getElementById("wingsmith-current-steps");
  const programs = document.getElementById("wingsmith-current-programs");
  for (const run of runs) { const option = document.createElement("option"); option.value = run.id; option.textContent = run.label; select.append(option); }
  const restore = state => {
    if (runs.some(run => run.id === state?.run)) select.value = state.run;
    const run = runs.find(run => run.id === select.value) || runs[0];
    if (!run) return;
    steps.setAttribute("title", run.label);
    steps.setAttribute("description", run.description);
    steps.durationMs = run.durationMs; steps.spans = run.spans;
    programs.hidden = !run.programs.length;
    if (run.programs.length) { programs.setAttribute("description", "Navigation clock. Link submission to first observed completion; includes queueing, parallel work and polling gaps. Intervals overlap and are not exclusive costs. Source-identified examples only; cold captures do not identify every cloud, building or vegetation program."); programs.durationMs = run.programDurationMs; programs.spans = run.programs; }
  };
  restore(window.openai?.widgetState?.modelContent);
  select.addEventListener("change", () => { restore({run:select.value}); window.openai?.setWidgetState({modelContent:{run:select.value}}).catch(() => {}); });
  window.addEventListener("openai:set_globals", event => restore(event.detail?.globals?.widgetState?.modelContent));
  select.disabled = false;
</script>
