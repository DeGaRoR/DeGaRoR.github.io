<canvas id="c"></canvas>
<div id="ui">
  <header id="top">
    <div id="card" class="panel">
      <span id="brand">Garage Flight Sim</span>
      <b id="acName"></b>
      <span id="acSpec"></span>
    </div>
    <div id="rail" class="panel"><b id="phName">HOLDING</b><div id="track"></div></div>
    <div id="pfd" class="panel">
      <div class="rd"><b id="r-ias">0</b><i>km/h ias</i></div>
      <div class="rd"><b id="r-alt">0</b><i>m alt</i></div>
      <div class="rd"><b id="r-vs">0.0</b><i>m/s vs</i></div>
    </div>
  </header>
  <footer id="south">
    <section id="telp" class="panel">
      <header><h2>Telemetry</h2><span id="tsum"></span></header>
      <canvas id="tel" width="1052" height="264"></canvas>
      <div id="grid">
        <div class="cell"><span>AoA</span><b id="r-aoa">0.0°</b></div>
        <div class="cell"><span>Bank</span><b id="r-bank">0.0°</b></div>
        <div class="cell"><span>AGL</span><b id="r-agl">0.0 m</b></div>
        <div class="cell"><span>Throttle</span><b id="r-thr">0%</b></div>
        <div class="cell"><span>Elevator</span><b id="r-de">0.0°</b></div>
        <div class="cell"><span>Aileron</span><b id="r-da">0.0°</b></div>
        <div class="cell"><span>Rudder</span><b id="r-dr">0.0°</b></div>
        <div class="cell"><span>Peak strain</span><b id="r-str">0</b></div>
      </div>
      <div id="legend">
        <em><i style="background:var(--cyan)"></i>altitude</em>
        <em><i style="background:var(--amber)"></i>speed</em>
        <em style="margin-left:auto"><i style="background:var(--cyan)"></i>compression</em>
        <em><i style="background:var(--amber)"></i>tension</em>
      </div>
    </section>
    <div id="bottom">
      <select id="selAc" aria-label="Aircraft">
        <option value="cub">Piper J-3 Cub</option>
        <option value="drone">Foam Trainer 1.4 m</option>
        <option value="dc3">Douglas DC-3</option>
        <option value="jojo">Jodel DR-1050</option>
        <option value="c172">Cessna 172S</option>
        <option value="chnk">Chinook 1S</option>
      </select>
      <div id="grp">
        <button id="bGo" class="pri">Fly the circuit</button>
        <button id="bReset">Reset</button>
        <button id="bPause">Pause</button>
      </div>
      <button id="bTel">Telemetry</button>
    <button id="bSkin">Skin</button>
      <span id="hint">drag to orbit · scroll to zoom</span>
    </div>
  </footer>
</div>
