<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garage plane — G5 look pass</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html,body{margin:0;height:100%;background:#e9e6de}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<three-d-stage name="garage-plane" background="#e9e6de"></three-d-stage>
<script src="gen/00_registry.js"></script>
<script src="gen/60_gen_spec.js"></script>
<script src="gen/61_gen_frame.js"></script>
<script src="gen/63_gen_skin.js"></script>
<script src="gen/garage.js"></script>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const spec = (window.__spec || GEN_DEFAULT);
const R = resolveSpec(spec);
const S = R.spec; S._auto = R.auto;
const fr = genFrame(S);
for (const [k, v] of [['track', fr.parts.tr], ['x', fr.parts.gx],
                      ['twX', fr.parts.twX], ['twY', fr.parts.twY]]) S.gear[k] = v;
const def = { nodes: fr.nodes, beams: fr.beams, refs: fr.refs, parts: fr.parts, spec: S };
const data = genSkin(def);
window.__data = data;

// --- baked sheets. `linTex` names the DATA maps: those decode LINEAR ---
const srcs = {
  paint: genPaintDataURI(S), reg: genRegDataURI(S), tyre: genTyreDataURI(),
  bump: genBumpDataURI(S), mr: genMrDataURI(S), glaze: genGlazeDataURI(S),
};
const lin = new Set(data.linTex || []);
const loader = new THREE.TextureLoader();
const T = {};
for (const k in srcs) {
  T[k] = loader.load(srcs[k]);
  if (!lin.has(k)) T[k].colorSpace = THREE.SRGBColorSpace;
  T[k].anisotropy = 8;
}

const PBR = {
  _: { r: 0.72, m: 0.0 }, skin: { r: 0.42, m: 0.0 }, glass: { r: 0.06, m: 0.0, e: 1.5 },
  frame: { r: 0.45, m: 0.85 }, cowl: { r: 0.30, m: 0.10 }, engine: { r: 0.55, m: 0.70 },
  prop: { r: 0.42, m: 0.20 }, gearmetal: { r: 0.38, m: 0.80 }, liftstrut: { r: 0.30, m: 0.10 },
  tyre: { r: 0.96, m: 0.0 }, wheelhub: { r: 0.28, m: 0.90 },
};
const mats = data.mats, matCache = {};
const matFor = name => {
  const mn = mats[name] ? name : 'skin';
  if (matCache[mn]) return matCache[mn];
  const m = mats[mn], s = PBR[mn] || PBR._;
  const op = m.opacity !== undefined ? m.opacity : 1;
  const p = {
    name: mn, side: THREE.DoubleSide,
    transparent: op < 1, opacity: op, depthWrite: op >= 1,
    roughness: m.rough !== undefined ? m.rough : s.r,
    metalness: m.metal !== undefined ? m.metal : s.m,
    envMapIntensity: s.e !== undefined ? s.e : 1,
  };
  if (m.alphaTest) p.alphaTest = m.alphaTest;
  if (m.tex) p.map = T[m.tex];
  else p.color = new THREE.Color(m.color != null ? m.color : 0xffffff);
  if (m.mr) { p.roughnessMap = T[m.mr]; p.metalnessMap = T[m.mr]; }
  if (m.nrm) {
    p.normalMap = T[m.nrm];
    if (m.nrmScale) p.normalScale = new THREE.Vector2(m.nrmScale, m.nrmScale);
  }
  return matCache[mn] = new THREE.MeshStandardMaterial(p);
};

// covering vs bare frame: the truss and the engine block live under the fabric
const COVERED_HIDE = new Set(['frame', 'engine']);
const model = new THREE.Group();
model.name = 'plane';
for (const name in data.groups) {
  const g = data.groups[name];
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(g.pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(g.uv, 2));
  geo.setIndex(new THREE.BufferAttribute(g.idx, 1));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, matFor(name));
  mesh.name = name;
  if (COVERED_HIDE.has(name)) mesh.visible = false;
  model.add(mesh);
}

// a sky environment, as the sim has (W18): gloss and metal need something to see
{
  const c = document.createElement('canvas');
  c.width = 8; c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0.00, '#9dbfe8');
  grd.addColorStop(0.44, '#d6e0ea');
  grd.addColorStop(0.52, '#efe8dc');
  grd.addColorStop(0.75, '#ddd4c4');
  grd.addColorStop(1.00, '#c3bcae');
  g.fillStyle = grd; g.fillRect(0, 0, 8, 256);
  const eq = new THREE.CanvasTexture(c);
  eq.mapping = THREE.EquirectangularReflectionMapping;
  eq.colorSpace = THREE.SRGBColorSpace;
  const pm = new THREE.PMREMGenerator(stage._renderer);
  stage._scene.environment = pm.fromEquirectangular(eq).texture;
  pm.dispose();
}

model.rotation.y = Math.PI / 2;
stage.setObject(model);
</script>
</body>
</html>
