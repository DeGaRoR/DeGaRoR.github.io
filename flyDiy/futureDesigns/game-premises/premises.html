<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premises mock-up</title>
<!-- GAME-PREMISES (G2095): a STATIC mock-up of the PREMISES screen (GAME-PREMISES-2026-10-06.md §6). Every number
     comes from premises_data.js, which tools/gameprem_shot.js writes from 71_player_bases.js's own rules over the v2
     vintage fixture. The palette is the editor's (src/viewer/editor.css :root, as mobile-garage/mock.css). -->
<style>
:root{
  --ed-panel:#201d1a; --ed-board:#1a1815; --ed-plate:rgba(32,29,26,.94);
  --ed-ink:#f4efe6; --ed-dim:#c0b8ac; --ed-faint:#97907f;
  --ed-acc:#e6dbc9; --ed-acc-ink:#221f1b; --ed-acc-soft:rgba(230,219,201,.14);
  --ed-hair:rgba(255,248,236,.09); --ed-border:rgba(255,248,236,.14);
  --ed-btn-bg:rgba(255,255,255,.06); --ed-btn-bd:rgba(255,255,255,.18);
  --ed-warn:#d8a07a; --ed-bad:#e08a5a; --ed-ok:#9cc08a; --amber:#ffb257; --cyan:#63d3cc;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0f0e0c;color:var(--ed-ink);font:400 13.5px/1.35 'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--ed-board);border-bottom:1px solid var(--ed-hair)}
.top h1{font:600 13px/1 'IBM Plex Sans',sans-serif;letter-spacing:.14em;margin:0;color:var(--ed-acc)}
.top .sub{color:var(--ed-faint);font-size:12px}
.top .sp{flex:1}
.wallet{display:flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--ed-border);border-radius:18px;background:var(--ed-btn-bg)}
.wallet b{font-weight:600;font-size:15px}
.wallet .mode{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ed-acc-ink);background:var(--ed-acc);padding:2px 7px;border-radius:9px}
.ledger{color:var(--ed-faint);font-size:11.5px;max-width:330px;line-height:1.3}
.main{display:grid;grid-template-columns:300px 1fr 330px;min-height:0}
.col{overflow:auto;padding:14px;border-right:1px solid var(--ed-hair)}
.col:last-child{border-right:0}
.h{margin:4px 0 8px;font:600 11px/1 'IBM Plex Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ed-faint)}
.base{padding:10px 12px;border:1px solid var(--ed-border);border-radius:10px;margin-bottom:8px;background:var(--ed-panel)}
.base.sel{border-color:var(--ed-acc);box-shadow:inset 0 0 0 1px var(--ed-acc)}
.base .n{font-weight:500}.base .w{color:var(--ed-faint);font-size:12px}
.base .c{color:var(--ed-dim);font-size:12px;margin-top:4px}
.offer{padding:9px 12px;border:1px dashed var(--ed-btn-bd);border-radius:10px;margin-bottom:7px}
.offer .n{font-weight:500}.offer .w{color:var(--ed-faint);font-size:12px}
.offer .p{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--ed-btn-bd);background:var(--ed-btn-bg);font-size:12px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill.acc{background:var(--ed-acc);color:var(--ed-acc-ink);border-color:var(--ed-acc);font-weight:500}
.pill.off{opacity:.45}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:8px;border:1px solid var(--ed-btn-bd);color:var(--ed-dim)}
.tag.here{border-color:var(--cyan);color:var(--cyan)}
.tag.rent{border-color:var(--ed-warn);color:var(--ed-warn)}
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--ed-panel);border:1px solid var(--ed-border);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.card .ch{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.card .ch .t{font-weight:600;font-size:15px}
.card .ch .s{color:var(--ed-faint)}
.card .ch .sp{flex:1}
.plan{grid-row:2/5}
.stats{display:grid;grid-template-columns:auto auto;gap:3px 14px;align-content:start;font-size:12.5px}
.stats span{color:var(--ed-faint)}
.kits{display:flex;flex-wrap:wrap;gap:5px;align-content:start}
.kit{height:24px;padding:0 9px;border-radius:12px;font-size:11.5px;display:inline-flex;align-items:center;border:1px solid var(--ed-btn-bd)}
.kit.on{background:var(--ed-acc-soft);border-color:var(--ed-acc);color:var(--ed-ink)}
.kit.off{color:var(--ed-faint);border-style:dashed}
.verbs{font-size:11.5px;color:var(--ed-dim)}
.acts{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.res{font-size:12px;color:var(--ed-dim)}
.out{margin-top:2px;padding:10px 12px;border:1px dashed var(--ed-btn-bd);border-radius:10px;color:var(--ed-dim);font-size:12.5px}
.ac{padding:9px 11px;border:1px solid var(--ed-border);border-radius:10px;margin-bottom:7px;background:var(--ed-panel)}
.ac .n{font-weight:500;display:flex;gap:7px;align-items:center}
.ac .wh{font-size:12px;color:var(--ed-dim);margin:3px 0 6px}
.k-in{color:var(--ed-ok)}.k-out{color:var(--amber)}.k-away{color:var(--ed-bad)}
.foot{font-size:11px;color:var(--ed-faint);margin-top:10px}
svg text{font:500 9.5px 'IBM Plex Sans',sans-serif;fill:var(--ed-ink)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>PREMISES</h1><span class="sub" id="sub"></span>
    <span class="sp"></span>
    <div class="ledger" id="ledger"></div>
    <div class="wallet" id="wallet"></div>
  </div>
  <div class="main">
    <div class="col" id="left"></div>
    <div class="col" id="centre"></div>
    <div class="col" id="right"></div>
  </div>
</div>
<script src="premises_data.js"></script>
<script>
(function () {
  const D = window.PREM_DATA, q = new URLSearchParams(location.search), sel = q.get('base') || 'HOME';
  const $ = id => document.getElementById(id);
  const n0 = v => Math.round(v).toLocaleString('en-GB').replace(/,/g, ' ');
  const hrs = s => Math.floor(s / 3600) + ' h ' + String(Math.round((s % 3600) / 60)).padStart(2, '0');
  const tail = w => { const i = String(w).indexOf(' · '); return i >= 0 ? String(w).slice(i + 3) : w; };   // the words after the field's own name
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  $('sub').textContent = 'your bases, your hangars, where every aeroplane stands · flown ' + hrs(D.clock);
  $('wallet').innerHTML = '<span class="mode">' + D.mode + '</span>' +
    (D.mode === 'career' ? '<b>' + n0(D.wallet) + '</b><span style="color:var(--ed-faint)">credits</span>' : '<span>nothing is charged</span>');
  $('ledger').innerHTML = D.ledger.map(l => esc(l.k) + (l.ref ? ' ' + esc(l.ref) : '') + ' · ' + (l.amt > 0 ? '−' : '+') + n0(Math.abs(l.amt))).join('<br>');

  // ---- left: bases, then offers
  let L = '<div class="h">Your bases</div>';
  for (const b of D.bases) {
    const nAc = b.hangars.reduce((s, h) => s + h.residents.length, 0) + b.out.length;
    L += '<div class="base' + (b.id === sel ? ' sel' : '') + '"><div class="n">' + esc(b.name) + '</div><div class="w">' + esc(tail(b.words)) +
      '</div><div class="c">' + b.hangars.length + ' hangar' + (b.hangars.length > 1 ? 's' : '') + ' · ' + nAc + ' aeroplane' + (nAc === 1 ? '' : 's') + '</div></div>';
  }
  L += '<div class="h" style="margin-top:16px">To buy or rent</div>';
  for (const o of D.offers) {
    L += '<div class="offer"><div class="n">' + esc(o.name) + (o.derelict ? ' <span class="tag">derelict</span>' : '') + (o.water ? ' <span class="tag">slipway</span>' : '') +
      '</div><div class="w">' + esc(tail(o.words)) + '</div><div class="p">' +
      o.shells.map(s => '<span class="pill">' + s.shell + ' · ' + n0(s.price) + ' or ' + n0(s.rent) + '/h</span>').join('') + '</div></div>';
  }
  $('left').innerHTML = L;

  // ---- centre: the selected base's hangars
  const K = 7;      // px per metre: every hangar at one scale, so their sizes compare
  const plan = h => {
    const P = h.plan, W = 2 * P.HW * K, H = 2 * P.HD * K, sx = z => (z + P.HW) * K, sy = x => (P.HD - x) * K;
    let s = '<svg class="plan" width="' + (W + 2) + '" height="' + (H + 14) + '" viewBox="-1 -1 ' + (W + 2) + ' ' + (H + 14) + '">';
    s += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#2a2622" stroke="rgba(255,248,236,.35)"/>';
    const dw = h.door.w * K;
    s += '<line x1="' + (W / 2 - dw / 2) + '" y1="' + H + '" x2="' + (W / 2 + dw / 2) + '" y2="' + H + '" stroke="#63d3cc" stroke-width="3"/>';
    s += '<text x="' + (W / 2) + '" y="' + (H + 11) + '" text-anchor="middle" style="fill:#63d3cc">door ' + h.door.w.toFixed(0) + ' m</text>';
    for (const o of P.obs) s += '<rect x="' + sx(o[2]) + '" y="' + sy(o[1]) + '" width="' + ((o[3] - o[2]) * K) + '" height="' + ((o[1] - o[0]) * K) + '" fill="rgba(192,184,172,.28)"/>';
    for (const a of P.planes) {
      const f = a.f, r = a.r;
      s += '<rect x="' + sx(r[2]) + '" y="' + sy(r[1]) + '" width="' + ((r[3] - r[2]) * K) + '" height="' + ((r[1] - r[0]) * K) + '" fill="none" stroke="rgba(255,178,87,.55)" stroke-dasharray="3 2"/>';
      const nose = a.x - f.fwd, tail = a.x + f.aft, wing = nose + 0.28 * (f.fwd + f.aft), cz = a.z;
      const g = 'stroke="#ffb257" stroke-linecap="round"';
      s += '<line ' + g + ' stroke-width="3" x1="' + sx(cz) + '" y1="' + sy(nose) + '" x2="' + sx(cz) + '" y2="' + sy(tail) + '"/>';
      s += '<line ' + g + ' stroke-width="4" x1="' + sx(cz - f.half) + '" y1="' + sy(wing) + '" x2="' + sx(cz + f.half) + '" y2="' + sy(wing) + '"/>';
      s += '<line ' + g + ' stroke-width="2.5" x1="' + sx(cz - f.half * 0.33) + '" y1="' + sy(tail - 0.4) + '" x2="' + sx(cz + f.half * 0.33) + '" y2="' + sy(tail - 0.4) + '"/>';
      s += '<text x="' + (sx(cz) + 6) + '" y="' + (sy(wing) - 6) + '">' + esc(a.name) + '</text>';
    }
    return s + '</svg>';
  };
  const B = D.bases.find(b => b.id === sel) || D.bases[0];
  let C = '<div class="h">' + esc(B.name) + ' · ' + esc(tail(B.words)) + '</div><div class="cards">';
  for (const h of B.hangars) {
    const pct = Math.round(100 * h.used / h.area);
    C += '<div class="card"><div class="ch"><span class="t">' + esc(h.name) + '</span><span class="s">' + esc(h.shellName) + '</span>' +
      (h.here ? '<span class="tag here">the garage is here</span>' : '') +
      (h.tenure === 'rent' ? '<span class="tag rent">rented · ' + n0(h.rent) + ' / flown h</span>' : '<span class="tag">owned</span>') +
      '<span class="sp"></span>' + (h.here ? '' : '<button class="pill acc">Open the garage here</button>') + '</div>';
    C += plan(h);
    C += '<div class="stats"><span>size</span><b>' + (2 * h.dims.HW).toFixed(0) + ' × ' + (2 * h.dims.HD).toFixed(0) + ' m, eave ' + h.dims.EAVE.toFixed(1) + '</b>' +
      '<span>door</span><b>' + h.door.w.toFixed(1) + ' × ' + h.door.h.toFixed(1) + ' m</b>' +
      '<span>floor taken</span><b>' + n0(h.used) + ' of ' + n0(h.area) + ' m² (' + pct + ' %)</b>' +
      '<span>room</span><b>' + (h.roomCub ? h.roomCub + ' more Cub' + (h.roomCub > 1 ? 's' : '') : 'no more Cubs') + '</b>' +
      '<span>inside</span><b class="res">' + (h.residents.length ? h.residents.map(esc).join(', ') : 'empty') + '</b></div>';
    C += '<div class="kits">' + h.kits.filter(k => k.on || k.price).map(k => '<span class="kit ' + (k.on ? 'on' : 'off') + '">' + (k.on ? '' : '+ ') + esc(k.name) + (k.on || !k.price ? '' : ' · ' + n0(k.price)) + '</span>').join('') + '</div>';
    C += '<div class="verbs">can: ' + h.caps.join(' · ') + '</div>';
    C += '<div class="acts"><button class="pill">Extend</button><button class="pill">Rebuild as…</button>' +
      '<button class="pill' + (h.residents.length ? ' off' : '') + '" title="' + (h.residents.length ? 'not empty' : '') + '">Release</button></div></div>';
  }
  C += '</div>';
  if (B.out.length) C += '<div class="h" style="margin-top:14px">Tied down outside</div><div class="out">' + B.out.map(esc).join(', ') + ' — <button class="pill">Wheel in</button></div>';
  $('centre').innerHTML = C;

  // ---- right: the fleet, each where it stands
  let R = '<div class="h">Fleet · ' + D.fleet.length + ' aeroplanes</div>';
  const word = a => a.kind === 'in' ? 'in ' + a.hangar + ' · ' + a.at : a.kind === 'out' ? 'tied down at ' + a.at : 'away · ' + a.at;
  for (const a of D.fleet) {
    R += '<div class="ac"><div class="n">' + esc(a.name) + '</div><div class="wh"><span class="k-' + a.kind + '">●</span> ' + esc(word(a)) + '</div>' +
      '<button class="pill acc">Fly from there</button> ' + (a.kind === 'in' ? '<button class="pill">Wheel out</button>' : a.kind === 'out' ? '<button class="pill">Wheel in</button>' : '') + '</div>';
  }
  R += '<div class="foot">Mock-up — ' + esc(D.from) + '. Moving an aeroplane between bases is flying it there.</div>';
  $('right').innerHTML = R;
  window.PREM_READY = true;
})();
</script>
</body>
</html>
