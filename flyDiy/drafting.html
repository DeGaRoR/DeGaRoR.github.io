<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drafting Table</title>
<meta name="theme-color" content="#12151a">
<!--
  THE DRAFTING TABLE (design: tools/DRAFTING_TABLE.md): a light page that takes a real aeroplane from its references
  to a matched shape, and writes the SAME plane file the garage loads. The page is this file alone (no game, no 3D
  engine); the garage's generator and layers run in a worker (tools/drafting/dt_worker.js) that loads behind the first
  paint. Claude sessions drive the same steps headless: tools/drafting/table.js.
  The blueprint image never leaves the device: it is kept in this browser's IndexedDB, keyed by its SHA-256.
-->
<style>
:root{--bg:#12151a;--panel:#1a1f27;--line:#2a313c;--fg:#dfe6ee;--dim:#8b97a5;--acc:#5db3ff;--ok:#40c057;--bad:#fa5252;--warn:#fab005;
  --paper:#ffffff;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.35 var(--font);-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px}
button{padding:7px 11px;cursor:pointer}button.acc{background:var(--acc);color:#06121f;border-color:var(--acc);font-weight:600}
button:disabled{opacity:.45}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
header h1{font-size:15px;margin:0;white-space:nowrap}
#steps{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
#steps button{padding:5px 9px;font-size:12.5px;white-space:nowrap;border-radius:14px}
#steps button.on{background:var(--acc);color:#06121f;border-color:var(--acc)}
#status{font-size:12px;color:var(--dim);white-space:nowrap}
main{flex:1;display:flex;min-height:0}
#stage{flex:1.4;display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
#viewbar{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#viewbar .tog{padding:4px 9px;font-size:12.5px}
#viewbar .tog.on{border-color:var(--acc);color:var(--acc)}
#canvasWrap{flex:1;position:relative;min-height:0;background:#0d1015;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%}
#hint{position:absolute;left:8px;bottom:8px;font-size:12px;color:var(--dim);background:rgba(18,21,26,.8);padding:3px 7px;border-radius:6px;pointer-events:none}
#side{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#numbers{flex:0 0 auto;max-height:38%;overflow:auto;border-bottom:1px solid var(--line);padding:6px 8px}
#numbers table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
#numbers td{padding:2px 4px;border-bottom:1px solid #20262f;white-space:nowrap}
#numbers td.l{white-space:normal;width:48%}
#numbers td.n{text-align:right}
#numbers .ok{color:var(--ok)}#numbers .bad{color:var(--bad)}
#numbers .sum{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-bottom:4px}
#panel{flex:1;overflow:auto;padding:8px 10px 60px}
#panel h2{font-size:14px;margin:4px 0 2px}#panel p.what{color:var(--dim);margin:0 0 8px;font-size:12.5px}
#panel h3{font-size:12.5px;color:var(--dim);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.row{display:grid;grid-template-columns:1fr 64px;gap:2px 8px;align-items:center;margin:2px 0 6px}
.row label{font-size:12.5px;color:var(--fg)}.row label small{color:var(--dim)}
.row input[type=range]{grid-column:1/3;width:100%;accent-color:var(--acc);height:26px}
.row input[type=number]{width:64px;padding:3px 4px;text-align:right}
.row.changed label{color:var(--acc)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}.kv div:nth-child(odd){color:var(--dim)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.note{font-size:12px;color:var(--dim);margin:6px 0}
.marks{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:12.5px;align-items:center}
.marks button{padding:3px 8px;font-size:12px}.marks button.on{background:var(--warn);color:#000}
#drop{border:1px dashed var(--line);border-radius:8px;padding:10px;text-align:center;color:var(--dim);font-size:12.5px;margin:6px 0}
@media (max-width: 820px){
  main{flex-direction:column}
  #stage{flex:0 0 52%;border-right:0;border-bottom:1px solid var(--line)}
  #numbers{max-height:30%}
  header h1{display:none}
}
</style>
</head>
<body>
<header>
  <h1>Drafting Table</h1>
  <nav id="steps"></nav>
  <span id="status">starting...</span>
</header>
<main>
  <section id="stage">
    <div id="viewbar">
      <button class="tog on" data-view="side">side</button>
      <button class="tog" data-view="top">top</button>
      <button class="tog" data-view="front">front</button>
      <button class="tog" data-view="q">3D</button>
      <span style="flex:1"></span>
      <label style="font-size:12px;color:var(--dim)">sheet <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.55" style="width:80px;vertical-align:middle"></label>
      <button class="tog" id="fitBtn" title="fit the view">fit</button>
    </div>
    <div id="canvasWrap"><canvas id="cv"></canvas><div id="hint"></div></div>
  </section>
  <section id="side">
    <div id="numbers"></div>
    <div id="panel"></div>
  </section>
</main>
<script src="tools/drafting/dt_core.js"></script>
<script src="tools/drafting/dt_steps.js"></script>
<script>
'use strict';
/* global DT_CORE, DT_STEPS */
// ======================================================================================================================
// STATE: one plane document (the garage's save format) with its reference block; the sheet image; the UI's own state
// ======================================================================================================================
const C = DT_CORE, ST = DT_STEPS.STEPS;
const S = {
  doc: null,            // {what:'flydiy-build', v, name, spec, ref}
  over: {},             // rows changed in this session, not yet folded into doc.spec.cage
  step: 'refs', view: 'side', img: null, imgHash: null,
  rows: null, cards: null, built: null, buildId: 0, pending: null, busy: false, workerReady: false,
  zoom: 1, panX: 0, panY: 0, placing: null, opacity: 0.55, shade: null, yaw: 35, pitch: 18,
};
const $ = s => document.querySelector(s);
const status = t => { $('#status').textContent = t; };

// ---- storage: the doc in localStorage (small), the sheet image in IndexedDB (never uploaded anywhere) ----
const LS = 'dt.doc.v1';
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(currentDoc())); } catch (e) {} }
function loadLocal() { try { const j = localStorage.getItem(LS); return j ? JSON.parse(j) : null; } catch (e) { return null; } }
function idb() {
  return new Promise((res, rej) => { const r = indexedDB.open('drafting-table', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('sheets'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function putSheet(hash, blob) { try { const db = await idb(); db.transaction('sheets', 'readwrite').objectStore('sheets').put(blob, hash); } catch (e) {} }
async function getSheet(hash) {
  try { const db = await idb(); return await new Promise(res => { const q = db.transaction('sheets').objectStore('sheets').get(hash); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); }
  catch (e) { return null; }
}
async function sha256(buf) { const h = await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join(''); }

function currentDoc() {
  if (!S.doc) return null;
  const d = JSON.parse(JSON.stringify(S.doc));
  d.spec.cage = Object.assign({}, d.spec.cage, S.over);
  return d;
}
function log(step, line) {
  S.doc.ref = S.doc.ref || {}; S.doc.ref.history = S.doc.ref.history || [];
  S.doc.ref.history.push({ date: new Date().toISOString().slice(0, 16), who: 'table', step, line });
}

// ======================================================================================================================
// THE WORKER: the garage's code, off this thread. Builds are coalesced: a drag sends the latest rows only.
// ======================================================================================================================
const WK = new Worker('tools/drafting/dt_worker.js');
const waits = {};
WK.onmessage = ev => {
  const m = ev.data;
  if (m.op === 'ready') {
    S.workerReady = true; S.rows = m.rows; S.cards = m.cards;
    status('garage loaded in ' + (m.ms / 1000).toFixed(1) + ' s' + (m.errors.length ? ' (' + m.errors.length + ' errors)' : ''));
    if (m.errors.length) console.warn(m.errors);
    renderPanel(); requestBuild();
    return;
  }
  if (m.op === 'error') { status('worker: ' + m.message.split('\n')[0]); S.busy = false; console.error(m.message); pump(); return; }
  if (waits[m.id]) { waits[m.id](m); delete waits[m.id]; return; }
  if (m.op === 'built') {
    S.busy = false;
    if (m.id >= (S.built ? S.built.id : -1)) { S.built = m; if (m.shade) S.shade = m.shade; }
    status('built in ' + m.ms + ' ms');
    renderNumbers(); draw(); pump();
  }
};
function ask(msg) { return new Promise(res => { const id = 'w' + (++S.buildId); waits[id] = res; WK.postMessage(Object.assign({ id }, msg)); }); }
function requestBuild(opts) { S.pending = Object.assign({}, S.pending || {}, opts || {}); pump(); }
function pump() {
  if (S.busy || !S.pending || !S.workerReady || !S.doc) return;
  const o = S.pending; S.pending = null; S.busy = true;
  const ref = S.doc.ref || {};
  const views = {};
  for (const v of C.VIEWS) if (ref.views && ref.views[v]) views[v] = ref.views[v];
  const msg = { op: 'build', id: ++S.buildId, spec: S.doc.spec, over: S.over, passes: o.passes || 1, level: 0,
    views, stations: C.stations(ref), probes: C.probes(ref) };
  if (S.view === 'q') msg.shade = { W: 900, H: 600, yaw: S.yaw, pitch: S.pitch };
  status('building...');
  WK.postMessage(msg);
}

// ======================================================================================================================
// THE DRAWING: the current view's box of the sheet, faded, with our outline (in parts) and the reference's marks
// ======================================================================================================================
const cv = $('#cv'), cx = cv.getContext('2d');
function resize() { const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); draw(); }
function viewBox() {
  const ref = S.doc && S.doc.ref, V = ref && ref.views && ref.views[S.view];
  if (V && V.box) return V.box;
  return S.img ? [0, 0, S.img.width, S.img.height] : [0, 0, 1000, 600];
}
function fit() {
  const [x0, y0, x1, y1] = viewBox(); const W = cv.width, H = cv.height;
  S.zoom = Math.min(W / (x1 - x0), H / (y1 - y0)) * 0.96; S.panX = (W - (x1 - x0) * S.zoom) / 2 - x0 * S.zoom; S.panY = (H - (y1 - y0) * S.zoom) / 2 - y0 * S.zoom;
  draw();
}
const edgeCache = {};
function edgeCanvas(view) {
  const v = S.built && S.built.views && S.built.views[view]; if (!v) return null;
  const key = S.built.id + view; if (edgeCache.key === key) return edgeCache.cv;
  const c = document.createElement('canvas'); c.width = v.W; c.height = v.H;
  const g = c.getContext('2d'), im = g.createImageData(v.W, v.H), E = v.edges;
  const col = {}; C.PARTS.forEach((p, i) => { const h = C.COLOURS[p]; if (h) col[i] = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; });
  for (let i = 0; i < E.length; i++) { const e = E[i]; if (!e) continue; const c3 = col[e] || [0, 0, 0]; im.data[i * 4] = c3[0]; im.data[i * 4 + 1] = c3[1]; im.data[i * 4 + 2] = c3[2]; im.data[i * 4 + 3] = 255; }
  g.putImageData(im, 0, 0); edgeCache.key = key; edgeCache.cv = c; return c;
}
function draw() {
  const W = cv.width, H = cv.height; cx.setTransform(1, 0, 0, 1, 0, 0); cx.fillStyle = '#0d1015'; cx.fillRect(0, 0, W, H);
  if (S.view === 'q') { drawShade(); return; }
  cx.setTransform(S.zoom, 0, 0, S.zoom, S.panX, S.panY);
  const [x0, y0, x1, y1] = viewBox();
  cx.fillStyle = '#fff'; cx.fillRect(x0, y0, x1 - x0, y1 - y0);
  if (S.img) { cx.globalAlpha = S.opacity; cx.drawImage(S.img, x0, y0, x1 - x0, y1 - y0, x0, y0, x1 - x0, y1 - y0); cx.globalAlpha = 1; }
  else { cx.fillStyle = '#868e96'; cx.font = '16px system-ui'; cx.fillText('no sheet on this device: add the blueprint image (step 1)', x0 + 20, y0 + 30); }
  const e = edgeCanvas(S.view), v = S.built && S.built.views && S.built.views[S.view];
  if (e && v) { cx.imageSmoothingEnabled = false; cx.drawImage(e, v.x0, v.y0); }
  // the reference's marks
  const ref = S.doc && S.doc.ref;
  if (ref && ref.marks) {
    cx.lineWidth = 1.2 / S.zoom * (window.devicePixelRatio || 1);
    for (const k of Object.keys(ref.marks)) {
      const m = ref.marks[k]; if (m.view !== S.view) continue;
      cx.strokeStyle = S.placing === k ? '#f59f00' : '#111';
      for (const p of m.pts) { const r = 4 / S.zoom * (window.devicePixelRatio || 1); cx.beginPath(); cx.moveTo(p[0] - r, p[1]); cx.lineTo(p[0] + r, p[1]); cx.moveTo(p[0], p[1] - r); cx.lineTo(p[0], p[1] + r); cx.stroke(); }
    }
    const V = ref.views && ref.views[S.view];
    if (V) { cx.strokeStyle = '#e03131'; const r = 6 / S.zoom * (window.devicePixelRatio || 1); cx.beginPath(); cx.arc(V.ox, V.oy, r, 0, 7); cx.stroke(); }
  }
  $('#hint').textContent = S.placing ? 'tap the sheet to place "' + S.placing + '"' : 'drag to pan, pinch or wheel to zoom';
}
function drawShade() {
  const sh = S.shade; cx.setTransform(1, 0, 0, 1, 0, 0);
  if (!sh) { cx.fillStyle = '#8b97a5'; cx.font = '14px system-ui'; cx.fillText('building the 3D view...', 20, 30); return; }
  const c = document.createElement('canvas'); c.width = sh.W; c.height = sh.H;
  c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(sh.rgba.buffer || sh.rgba), sh.W, sh.H), 0, 0);
  const k = Math.min(cv.width / sh.W, cv.height / sh.H);
  cx.drawImage(c, (cv.width - sh.W * k) / 2, (cv.height - sh.H * k) / 2, sh.W * k, sh.H * k);
  $('#hint').textContent = 'drag to turn';
}
// ---- touch / mouse: pan, pinch-zoom, tap to place a mark, drag to turn the 3D ----
const ptrs = new Map(); let tapStart = null, pinch0 = null;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); tapStart = { x: e.clientX, y: e.clientY, t: Date.now() };
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: S.zoom, px: S.panX, py: S.panY, mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2 }; } });
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return; const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  const d = window.devicePixelRatio || 1;
  if (S.view === 'q') { S.yaw += (e.clientX - prev[0]) * 0.5; S.pitch = Math.max(-80, Math.min(80, S.pitch + (e.clientY - prev[1]) * 0.4)); requestBuild(); return; }
  if (ptrs.size === 2 && pinch0) { const [a, b] = [...ptrs.values()]; const dd = Math.hypot(a[0] - b[0], a[1] - b[1]); const r = cv.getBoundingClientRect();
    const k = dd / pinch0.d; const mx = (pinch0.mx - r.left) * d, my = (pinch0.my - r.top) * d;
    S.zoom = pinch0.z * k; S.panX = mx - (mx - pinch0.px) * k; S.panY = my - (my - pinch0.py) * k; draw(); return; }
  S.panX += (e.clientX - prev[0]) * d; S.panY += (e.clientY - prev[1]) * d; draw();
});
cv.addEventListener('pointerup', e => {
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null;
  if (tapStart && Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y) < 6 && Date.now() - tapStart.t < 400) onTap(e);
  tapStart = null;
});
cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; const mx = (e.clientX - r.left) * d, my = (e.clientY - r.top) * d;
  const k = Math.exp(-e.deltaY * 0.0015); S.zoom *= k; S.panX = mx - (mx - S.panX) * k; S.panY = my - (my - S.panY) * k; draw(); }, { passive: false });
function sheetPoint(e) { const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; return [((e.clientX - r.left) * d - S.panX) / S.zoom, ((e.clientY - r.top) * d - S.panY) / S.zoom]; }
function onTap(e) {
  if (!S.placing || S.view === 'q') return;
  const p = sheetPoint(e).map(v => +v.toFixed(1)), ref = S.doc.ref;
  const k = S.placing;
  if (k.startsWith('origin:')) { const V = ref.views[k.slice(7)]; V.ox = p[0]; V.oy = p[1]; log('sheet', k + ' at ' + p); S.placing = null; }
  else {
    const m = ref.marks[k] || (ref.marks[k] = { view: S.view, pts: [] });
    const need = /^(profile\.|window\.|wheel\.dia)/.test(k) ? 2 : 1;
    if (m.view !== S.view || m.pts.length >= need || m._fresh !== true) { m.view = S.view; m.pts = []; m._fresh = true; }
    m.pts.push(p);
    if (m.pts.length >= need) { delete m._fresh; S.placing = null; log('refs', 'mark ' + k + ' ' + JSON.stringify(m.pts)); }
  }
  saveLocal(); renderPanel(); renderNumbers(); draw();
}

// ======================================================================================================================
// THE NUMBERS STRIP: ours against the reference, the step's rows only (the check step: all)
// ======================================================================================================================
function compareNow() {
  if (!S.built || !S.doc || !S.doc.ref) return null;
  return C.compare(S.doc.ref, S.built.measure, S.built.windows);
}
const f3 = (v, u) => v == null ? '-' : (u === 'deg' ? v.toFixed(1) : v.toFixed(3));
function renderNumbers() {
  const T = compareNow(), el = $('#numbers');
  if (!T) { el.innerHTML = '<div class="sum">no build yet</div>'; return; }
  const step = ST.find(s => s.id === S.step);
  const rows = T.rows.filter(r => DT_STEPS.kmIn(step, r.id));
  const sc = rows.filter(r => r.ok != null);
  el.innerHTML = '<div class="sum"><span>' + step.title + ': ' + sc.filter(r => r.ok).length + ' / ' + sc.length + ' inside tolerance</span><span>all: ' + T.pass + ' / ' + T.n + '</span></div>' +
    '<table>' + rows.map(r => '<tr><td class="l">' + r.label + '</td><td class="n">' + f3(r.ours, r.unit) + '</td><td class="n" style="color:var(--dim)">' + f3(r.ref, r.unit) +
      '</td><td class="n ' + (r.ok == null ? '' : r.ok ? 'ok' : 'bad') + '">' + (r.diff == null ? '' : (r.diff >= 0 ? '+' : '') + f3(r.diff, r.unit)) + '</td></tr>').join('') + '</table>';
}

// ======================================================================================================================
// THE STEP PANEL: the garage's rows the step needs (their labels and ranges are the garage's own)
// ======================================================================================================================
function renderSteps() {
  $('#steps').innerHTML = ST.map(s => '<button data-step="' + s.id + '" class="' + (s.id === S.step ? 'on' : '') + '">' + s.n + ' ' + s.title + '</button>').join('');
  $('#steps').querySelectorAll('button').forEach(b => b.onclick = () => { S.step = b.dataset.step; S.placing = null; renderSteps(); renderPanel(); renderNumbers(); draw(); });
}
function cur(k) { if (k in S.over) return S.over[k]; const c = S.doc && S.doc.spec && S.doc.spec.cage; return c && k in c ? c[k] : (S.built && S.built.P ? S.built.P[k] : undefined); }
function rowHtml(k) {
  const d = S.rows && S.rows[k]; if (!d) return '<div class="note">' + k + ': no such garage row</div>';
  const v = cur(k); const val = v == null ? d.min : v;
  return '<div class="row' + (k in S.over ? ' changed' : '') + '"><label>' + d.label + ' <small>' + k + '</small></label>' +
    '<input type="number" data-k="' + k + '" step="' + d.step + '" value="' + (+val).toFixed(3).replace(/\.?0+$/, '') + '">' +
    '<input type="range" data-k="' + k + '" min="' + d.min + '" max="' + d.max + '" step="' + d.step + '" value="' + val + '"></div>';
}
function renderPanel() {
  const step = ST.find(s => s.id === S.step), p = $('#panel');
  let h = '<h2>' + step.n + ' · ' + step.title + '</h2><p class="what">' + step.what + '</p>';
  if (!S.doc) { h += startHtml(); p.innerHTML = h; bindStart(); return; }
  if (step.id === 'refs') h += refsHtml();
  else if (step.id === 'sheet') h += sheetHtml();
  else if (step.id === 'arch') h += archHtml();
  else if (step.id === 'check') h += checkHtml();
  if (step.groups) {
    if (!S.rows) h += '<div class="note">the garage is loading...</div>';
    else for (const [g, keys] of step.groups) h += '<h3>' + g + '</h3>' + keys.map(rowHtml).join('');
  }
  if (step.id !== 'refs' && step.id !== 'sheet') h += marksHtml(step.id);
  p.innerHTML = h;
  bindPanel();
}
function startHtml() {
  return '<div class="btns"><button class="acc" id="openPlane">Open a plane file</button><button id="openRef">Start from a reference</button></div>' +
    '<p class="note">A plane file is the garage\'s own save (with the reference block beside it). A reference file (tools/drafting/refs/*.json) starts a new plane.</p>' +
    '<p class="note"><button id="demoPc6">PC-6 reference (built in)</button></p>';
}
function refsHtml() {
  const R = S.doc.ref || {}, I = R.identity || {};
  let h = '<div class="kv"><div>name</div><div>' + (I.name || '-') + '</div><div>variant</div><div><b>' + (I.variant || '-') + '</b></div><div>engine</div><div>' + (I.engine || '-') + '</div></div>';
  h += '<h3>figures</h3><div class="kv">' + Object.keys(R.figures || {}).map(k => { const f = R.figures[k];
    return '<div>' + k + '</div><div>' + (Array.isArray(f.v) ? f.v.join(' - ') : typeof f.v === 'object' ? JSON.stringify(f.v) : f.v) + ' ' + (f.unit || '') + (f.cond ? ' <small style="color:var(--dim)">(' + f.cond + ')</small>' : '') + '</div>'; }).join('') + '</div>';
  h += '<h3>the sheet</h3>' + (S.img ? '<p class="note">on this device: ' + S.img.width + ' x ' + S.img.height + ' px' + (R.image && R.image.sha256 && S.imgHash && R.image.sha256 !== S.imgHash ? ' <b style="color:var(--warn)">(not the image the marks were read on)</b>' : '') + '</p>' : '') +
    '<div id="drop">add the blueprint image <input type="file" id="imgFile" accept="image/*"></div>' +
    '<p class="note">' + ((R.image && R.image.how) || '') + '</p>';
  h += '<h3>marks</h3>' + marksHtml('refs');
  return h;
}
function sheetHtml() {
  const R = S.doc.ref || {}; R.views = R.views || {};
  let h = '';
  for (const v of C.VIEWS) {
    const V = R.views[v] || {};
    h += '<h3>' + v + '</h3><div class="kv"><div>box</div><div>' + (V.box ? V.box.join(', ') : '-') + '</div><div>origin</div><div>' + (V.ox != null ? V.ox + ', ' + V.oy : '-') + '</div>' +
      '<div>scale</div><div>' + (V.k ? V.k.toFixed(2) + ' px / m' : '-') + ' <small style="color:var(--dim)">' + (V.scaleBy || '') + '</small></div><div>turn</div><div>' + (V.rot || 0) + ' deg' + (V.flip ? ', mirrored' : '') + '</div></div>' +
      '<div class="btns"><button data-place="origin:' + v + '">place the origin</button></div>';
  }
  h += '<p class="note">Origin: the spinner\'s tip in the side and top views, the hub head-on. Scale: px per metre from the published figure named.</p>';
  return h;
}
function archHtml() {
  const R = S.doc.ref || {}, A = R.architecture || {};
  let h = '<div class="kv"><div>started from</div><div><b>' + (A.start || '-') + '</b></div><div>candidates</div><div>' + (A.candidates || []).join(', ') + '</div></div>';
  h += '<p class="note">' + (A.why || '') + '</p>';
  if (S.cards) h += '<h3>re-birth from a card</h3><div class="btns">' + S.cards.filter(c => !A.candidates || A.candidates.includes(c.key) || c.key === A.start).map(c => '<button data-card="' + c.key + '">' + c.name + '</button>').join('') + '</div>' +
    '<p class="note">A re-birth replaces the cage rows with the card\'s; the reference stays.</p>';
  if (A.sel) h += '<h3>choices</h3><div class="kv">' + Object.keys(A.sel).map(k => '<div>' + k + '</div><div>' + A.sel[k] + '</div>').join('') + '</div>';
  return h;
}
function checkHtml() {
  const T = compareNow();
  let h = '';
  if (T) h += '<p><b>' + T.pass + ' / ' + T.n + '</b> key measurements inside tolerance.</p>';
  h += '<div class="btns"><button class="acc" id="savePlane">Save the plane file</button><button id="saveRef">Save the reference</button></div>';
  h += '<p class="note">The plane file opens in the garage as any saved build (Load). The light checks (mass, CG, standing) come from the garage\'s own bookkeeping: run <code>node tools/drafting/table.js check</code> or open it in the garage.</p>';
  const hist = (S.doc.ref && S.doc.ref.history) || [];
  h += '<h3>history</h3>' + hist.slice(-12).reverse().map(x => '<div class="note">' + x.date + ' · ' + x.who + ' · ' + x.step + ': ' + x.line + '</div>').join('');
  return h;
}
const MARKS_OF = {
  refs: null,
  arch: [],
  body: ['body.front', 'cowl.back', 'tailpost', 'body.halfw', 'profile.0', 'profile.1', 'profile.2', 'profile.3', 'profile.4', 'profile.5', 'window.cockpit', 'window.door1', 'window.door2', 'window.round'],
  wing: ['wing.le', 'wing.te', 'wing.top', 'fin.top', 'fin.te', 'stab.le'],
  drive: ['wheel', 'wheel.bottom', 'wheel.dia', 'tailwheel'],
  check: [],
};
function marksHtml(stepId) {
  const R = S.doc.ref || {}; R.marks = R.marks || {};
  const keys = MARKS_OF[stepId] === null ? Object.keys(R.marks) : (MARKS_OF[stepId] || []);
  if (!keys.length) return '';
  return (stepId === 'refs' ? '' : '<h3>marks on the sheet</h3>') + '<div class="marks">' + keys.map(k => {
    const m = R.marks[k]; return '<div>' + k + ' <small style="color:var(--dim)">' + (m ? m.view + ' ' + m.pts.map(p => p.join(',')).join(' ') : 'not placed') + '</small></div><button data-place="' + k + '" class="' + (S.placing === k ? 'on' : '') + '">' + (m ? 're-place' : 'place') + '</button>'; }).join('') + '</div>';
}
let dragT = null;
function bindPanel() {
  const p = $('#panel');
  p.querySelectorAll('input[data-k]').forEach(inp => {
    inp.oninput = () => {
      const k = inp.dataset.k, v = +inp.value; S.over[k] = v;
      p.querySelectorAll('input[data-k="' + k + '"]').forEach(o => { if (o !== inp) o.value = o.type === 'number' ? v : v; });
      clearTimeout(dragT); dragT = setTimeout(() => requestBuild({ passes: 1 }), 60);
    };
    inp.onchange = () => { saveLocal(); requestBuild({ passes: 2 }); };
  });
  p.querySelectorAll('[data-place]').forEach(b => b.onclick = () => {
    const k = b.dataset.place; S.placing = S.placing === k ? null : k;
    const m = S.doc.ref.marks && S.doc.ref.marks[k];
    if (k.startsWith('origin:')) setView(k.slice(7)); else if (m && m.view !== S.view) setView(m.view);
    renderPanel(); draw();
  });
  p.querySelectorAll('[data-card]').forEach(b => b.onclick = () => rebirth(b.dataset.card));
  const imf = $('#imgFile'); if (imf) imf.onchange = () => imf.files[0] && loadSheetFile(imf.files[0]);
  const sp = $('#savePlane'); if (sp) sp.onclick = () => download((S.doc.name || 'plane').replace(/[^\w.-]+/g, '_') + '.json', currentDoc());
  const sr = $('#saveRef'); if (sr) sr.onclick = () => download('ref.json', S.doc.ref);
}
function bindStart() {
  $('#openPlane').onclick = () => pickJson(j => { if (j.what !== 'flydiy-build' || !j.spec) { status('not a plane file'); return; } setDoc(j); });
  $('#openRef').onclick = () => pickJson(j => startFromRef(j));
  $('#demoPc6').onclick = () => fetch('tools/drafting/refs/pc6.json').then(r => r.json()).then(startFromRef);
}
async function startFromRef(ref) {
  const key = (ref.architecture && (ref.architecture.start || (ref.architecture.candidates || [])[0])) || 'c172';
  status('birth from ' + key + '...');
  while (!S.workerReady) await new Promise(r => setTimeout(r, 100));
  const m = await ask({ op: 'birth', key, sel: ref.architecture && ref.architecture.sel });
  ref.architecture = Object.assign({}, ref.architecture, { start: key });
  setDoc({ what: 'flydiy-build', v: 8, name: (ref.identity && ref.identity.variant) || key, spec: m.spec, ref });
  log('architecture', 'born from the ' + key + ' card'); saveLocal();
}
async function rebirth(key) {
  const m = await ask({ op: 'birth', key, sel: S.doc.ref.architecture && S.doc.ref.architecture.sel });
  S.doc.spec = m.spec; S.over = {}; S.doc.ref.architecture = Object.assign({}, S.doc.ref.architecture, { start: key });
  log('architecture', 're-born from the ' + key + ' card'); saveLocal(); renderPanel(); requestBuild({ passes: 2 });
}
function setDoc(d) {
  S.doc = d; S.over = {}; S.built = null;
  if (d.ref && d.ref.image && d.ref.image.sha256) getSheet(d.ref.image.sha256).then(b => { if (b) useSheetBlob(b, d.ref.image.sha256); });
  renderSteps(); renderPanel(); fit(); requestBuild({ passes: 2 });
}
function pickJson(cb) { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = () => { const f = i.files[0]; if (!f) return; f.text().then(t => { try { cb(JSON.parse(t)); } catch (e) { status('bad JSON: ' + e.message); } }); }; i.click(); }
function download(name, obj) { const b = new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
async function loadSheetFile(f) {
  const buf = await f.arrayBuffer(), hash = await sha256(buf);
  await putSheet(hash, f); useSheetBlob(f, hash);
  const R = S.doc.ref; R.image = Object.assign({}, R.image, { file: f.name });
  if (!R.image.sha256) R.image.sha256 = hash;
  // the image the marks were read on is remembered too, so the same sheet is found again next time
  await putSheet(R.image.sha256, f); saveLocal();
}
function useSheetBlob(blob, hash) {
  const im = new Image(); im.onload = () => { S.img = im; S.imgHash = hash; renderPanel(); fit(); }; im.src = URL.createObjectURL(blob);
}
function setView(v) {
  S.view = v; document.querySelectorAll('#viewbar .tog[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  if (v === 'q') requestBuild(); fit();
}
document.querySelectorAll('#viewbar .tog[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
$('#fitBtn').onclick = fit;
$('#opacity').oninput = e => { S.opacity = +e.target.value; draw(); };
window.addEventListener('resize', resize);

// ---- boot: paint at once, then ask the worker for the garage ----
renderSteps();
const saved = loadLocal();
if (saved) setDoc(saved); else renderPanel();
resize();
WK.postMessage({ op: 'init' });
// the headless door (tools/drafting/dt_page_check.js): the page's own state, for a script driving it
window.DT_PAGE = { S, setDoc, startFromRef, setView, requestBuild, compareNow, useSheetBlob, putSheet, fit };
</script>
