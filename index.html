<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>degaror — arcade</title>
<meta name="description" content="Jeux et expériences construits à la main, vanilla JS.">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-H1B93Q8D1X"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #0b0d12;
    --bg-2: #10131b;
    --ink: #e8eaf0;
    --ink-dim: #8b92a5;
    --line: rgba(232,234,240,.08);
    --card: rgba(255,255,255,.025);
    --radius: 14px;
  }

  *{ box-sizing: border-box; }
  html{ background: var(--bg); }
  body{
    margin: 0;
    color: var(--ink);
    font-family: "Archivo", system-ui, sans-serif;
    font-variation-settings: "wdth" 100;
    background:
      radial-gradient(1200px 500px at 70% -10%, rgba(90,120,255,.07), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(255,80,180,.05), transparent 60%),
      var(--bg);
    min-height: 100vh;
  }

  .wrap{ max-width: 1180px; margin: 0 auto; padding: 0 24px 80px; }

  /* ---------- header ---------- */
  header{ padding: 56px 0 40px; border-bottom: 1px solid var(--line); margin-bottom: 40px; }
  .eyebrow{
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-dim); margin: 0 0 14px;
  }
  h1{
    margin: 0;
    font-size: clamp(44px, 8vw, 84px);
    line-height: .95;
    font-weight: 900;
    font-variation-settings: "wdth" 120;
    letter-spacing: -.01em;
    text-transform: uppercase;
  }
  h1 .tint{
    background: linear-gradient(90deg, #ffb454, #ff5fa2 45%, #5aa0ff 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tagline{ margin: 16px 0 0; color: var(--ink-dim); font-size: 15px; max-width: 46ch; line-height: 1.5; }

  /* ---------- grid ---------- */
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 18px;
  }

  /* ---------- carte "plexi" ---------- */
  .card{
    --plexi: #5aa0ff; /* remplacé en JS par la teinte de la carte */
    position: relative;
    display: flex; flex-direction: column; gap: 14px;
    padding: 18px 18px 16px;
    border-radius: var(--radius);
    background: linear-gradient(180deg, color-mix(in srgb, var(--plexi) 7%, transparent), transparent 55%), var(--card);
    border: 1px solid color-mix(in srgb, var(--plexi) 22%, var(--line));
    text-decoration: none; color: inherit;
    overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  /* tranche lumineuse — le chant du plexi éclairé */
  .card::before{
    content: "";
    position: absolute; inset: 0 0 auto 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--plexi), transparent);
    opacity: .85;
  }
  .card:hover, .card:focus-visible{
    transform: translateY(-3px);
    border-color: color-mix(in srgb, var(--plexi) 55%, var(--line));
    box-shadow:
      0 10px 30px -12px color-mix(in srgb, var(--plexi) 45%, transparent),
      0 0 0 1px color-mix(in srgb, var(--plexi) 25%, transparent) inset;
  }
  .card:focus-visible{ outline: 2px solid var(--plexi); outline-offset: 3px; }

  .card-top{ display: flex; align-items: flex-start; gap: 14px; }

  .app-icon{
    width: 56px; height: 56px; flex: none;
    border-radius: 13px;
    background: color-mix(in srgb, var(--plexi) 16%, var(--bg-2));
    border: 1px solid color-mix(in srgb, var(--plexi) 35%, transparent);
    display: grid; place-items: center;
    overflow: hidden;
  }
  .app-icon img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .app-icon .mono{
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500; font-size: 20px;
    color: var(--plexi);
    text-transform: uppercase;
  }

  .card h2{
    margin: 2px 0 0;
    font-size: 19px; font-weight: 800; line-height: 1.15;
    font-variation-settings: "wdth" 108;
  }
  .badges{ display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .badge{
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: color-mix(in srgb, var(--plexi) 80%, var(--ink));
    border: 1px solid color-mix(in srgb, var(--plexi) 40%, transparent);
    border-radius: 99px; padding: 2px 8px;
  }

  .card p{
    margin: 0; flex: 1;
    color: var(--ink-dim); font-size: 13.5px; line-height: 1.5;
  }

  .card .go{
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--plexi);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .card .go::after{ content: "→"; transition: transform .18s ease; }
  .card:hover .go::after{ transform: translateX(4px); }

  /* ---------- archives ---------- */
  .archive{ margin-top: 56px; border-top: 1px solid var(--line); padding-top: 24px; }
  .archive summary{
    cursor: pointer; list-style: none;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  .archive summary::before{ content: "▸ "; }
  .archive[open] summary::before{ content: "▾ "; }
  .archive ul{ margin: 16px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .archive a{ color: var(--ink-dim); text-decoration: none; font-size: 14px; }
  .archive a:hover{ color: var(--ink); text-decoration: underline; }
  .archive .note{ font-family: "IBM Plex Mono", monospace; font-size: 11px; opacity: .6; margin-left: 8px; }

  footer{
    margin-top: 64px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-dim); opacity: .7;
  }

  @media (prefers-reduced-motion: reduce){
    .card, .card .go::after{ transition: none; }
    .card:hover{ transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">degaror.github.io</p>
    <h1>Salle <span class="tint">d'arcade</span></h1>
    <p class="tagline">Jeux et expériences construits à la main — vanilla JS, zéro framework, beaucoup de soirées.</p>
  </header>

  <div class="grid" id="grid"></div>

  <details class="archive" id="archive-box" hidden>
    <summary>Archives</summary>
    <ul id="archive-list"></ul>
  </details>

  <footer>fait main · liège</footer>

</div>

<script>
/* ============================================================
   AJOUTER UNE APP = COPIER UNE LIGNE, CHANGER titre/desc/url.
   Options :
     archived: true   → rangée dans la liste "Archives" en bas
     icon: "chemin"   → forcer une icône (sinon détection auto)
   ============================================================ */
const APPS = [
  { title: "X Boson Conquest",            desc: "RTS minimaliste en temps réel.",                                    url: "XBC/index.html" },
  { title: "Vivarioops",            desc: "Evolve creatures",                                    url: "vivarioops/index.html" },
   { title: "Process This in Space",       desc: "Survie thermodynamique avancée sur Planet X.",                      url: "processor/processThis.html" }, 
  { title: "AI Roboclash",            desc: "Construis ton robot, détruis les autres.",                          url: "battlebotsPWA/index.html" },
  { title: "Écurie de Légendes",          desc: "Collectionne les chevaux — gacha familial.",                        url: "ecurieDeLegende/index.html" },
  { title: "Gronosaures et trilobytes",   desc: "Deviens paléontologue en testant ta culture générale (niveau adulte).", url: "gronosaures/index.html" },
  { title: "Recycle",                 desc: "Un Factorio inversé — enfin là, et presque fun.",                   url: "recyclePWA/index.html" },
  { title: "Cybernetic Experiments",      desc: "Quatre bacs à sable sur la rétroaction, l'autonomie et l'émergence.", url: "cyberneticExperiments/index.html" },
{ title: "Fly Diy",      desc: "Simulateur de vol bnode-beam based, aim at very small aircrafts, those you build in a garage", url: "flyDiy/index.html" },
  { title: "Random Claw Machine On Fire", desc: "Quel extincteur artistique vas-tu pêcher ?",                        url: "onfire/extincteurGrapinRandom.html" },


  /* --- archives (n'apparaissent que dans la liste du bas) --- */
    { title: "Roboclash",                   desc: "Version single-file originale.",                                    url: "battleBots/ai-roboclash.html" , archived:true},
  { title: "The God Engineer",            desc: "Survie / gestion au tour par tour.",     url: "TGE/index.html",                                   archived: true },
  { title: "PTIS stable",                 desc: "Ancienne version stable.",               url: "PTIS_stable/processThis.html",                     archived: true },
  { title: "Recycle (single-file)",       desc: "Première version.",                      url: "Recycle/recycle.html",                             archived: true },
  { title: "Pugface Production",          desc: "Site du studio.",                        url: "webgames/index.html",                              archived: true },
  { title: "Time Flies",                  desc: "Scroll shooter à travers le temps.",     url: "timeFlies/index.html",                             archived: true },
  { title: "Écurie standalone",           desc: "Version single-file.",                   url: "ecurieDeLegende/archive/ecurie-de-legendes.html",  archived: true },
];

/* Palette plexi — attribuée dans l'ordre, boucle si plus d'apps que de teintes */
const PLEXI = ["#ffb454", "#ff5fa2", "#5aa0ff", "#4de0b3", "#c792ff", "#ff7a59", "#ffe14d", "#6ee7f2"];

const grid = document.getElementById("grid");
const archiveBox = document.getElementById("archive-box");
const archiveList = document.getElementById("archive-list");

const initials = t => {
  const w = t.replace(/[^\p{L}\p{N} ]/gu, "").trim().split(/\s+/);
  return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || "?").slice(0, 2));
};

let colorIdx = 0;
for (const app of APPS) {
  if (app.archived) {
    const li = document.createElement("li");
    li.innerHTML = `<a href="${app.url}">${app.title}</a><span class="note">${app.desc || ""}</span>`;
    archiveList.appendChild(li);
    archiveBox.hidden = false;
    continue;
  }

  const color = PLEXI[colorIdx++ % PLEXI.length];
  const card = document.createElement("a");
  card.className = "card";
  card.href = app.url;
  card.style.setProperty("--plexi", color);
  card.innerHTML = `
    <div class="card-top">
      <div class="app-icon"><span class="mono">${initials(app.title)}</span></div>
      <div>
        <h2>${app.title}</h2>
        <div class="badges"></div>
      </div>
    </div>
    <p>${app.desc || ""}</p>
    <span class="go">Jouer</span>`;
  grid.appendChild(card);

  hydrate(app, card).catch(() => {});
}

/* ---- détection auto : favicon / apple-touch-icon / manifest PWA ---- */
async function hydrate(app, card) {
  const appURL = new URL(app.url, location.href);
  const iconBox = card.querySelector(".app-icon");
  const badges = card.querySelector(".badges");

  if (app.icon) { setIcon(iconBox, new URL(app.icon, location.href)); return; }

  const res = await fetch(appURL, { credentials: "same-origin" });
  if (!res.ok) return;
  const doc = new DOMParser().parseFromString(await res.text(), "text/html");

  // 1) manifest PWA → badge + meilleure icône disponible
  const manifestLink = doc.querySelector('link[rel="manifest"]');
  if (manifestLink) {
    addBadge(badges, "PWA");
    try {
      const mURL = new URL(manifestLink.getAttribute("href"), appURL);
      const manifest = await (await fetch(mURL)).json();
      if (Array.isArray(manifest.icons) && manifest.icons.length) {
        const best = manifest.icons.reduce((a, b) =>
          (parseInt(b.sizes) || 0) > (parseInt(a.sizes) || 0) ? b : a);
        setIcon(iconBox, new URL(best.src, mURL));
        return;
      }
    } catch (e) { /* manifest illisible → on continue */ }
  }

  // 2) apple-touch-icon, sinon favicon classique
  const link =
    doc.querySelector('link[rel="apple-touch-icon"]') ||
    doc.querySelector('link[rel="icon"], link[rel="shortcut icon"]');
  if (link) { setIcon(iconBox, new URL(link.getAttribute("href"), appURL)); return; }

  // 3) convention maison : un icon.png posé dans le dossier de l'app suffit
  setIcon(iconBox, new URL("icon.png", appURL));
}

function setIcon(iconBox, url) {
  const img = new Image();
  img.alt = "";
  img.onload = () => { iconBox.textContent = ""; iconBox.appendChild(img); };
  img.src = url;
}

function addBadge(badges, text) {
  const b = document.createElement("span");
  b.className = "badge";
  b.textContent = text;
  badges.appendChild(b);
}
</script>
</body>
</html>
