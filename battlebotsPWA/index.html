<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI Roboclash</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#181b22">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <h1>AI ROBOCLASH</h1>
      <div class="progress"><span id="lvlLabel"></span><span class="dots" id="dots"></span>
        <span class="bolts" id="boltsLabel"></span><span id="badgesLabel"></span></div>
    </div>
    <button class="lang" id="navBack" style="display:none">←</button>
    <button class="lang" id="langBtn">FR</button>
  </div>

  <div id="homeScreen">
    <div class="tabs">
      <button class="tab" id="tabWorkshop" data-i18n="tabWorkshop"></button>
      <button class="tab active" id="tabFight" data-i18n="tabFight"></button>
      <button class="tab" id="tabShop" data-i18n="tabShop"></button>
    </div>

    <div id="fightTab">
      <div class="card" id="tournaments"></div>
      <div class="card" id="leagueStandings" style="display:none"></div>
      <div class="card" id="bracketView" style="display:none"></div>
      <div class="tbanner" id="tourneyBanner" style="display:none">
        <div class="ttitle" id="tourneyTitle"></div>
        <div class="tprize" id="tourneyPrize"></div>
      </div>
      <div class="actions">
        <button class="btn big" id="fightBtn" data-i18n="fight"></button>
        <button class="btn ghost" id="friendlyBtn" style="display:none" data-i18n="friendly"></button>
      </div>
      <div class="versus">
        <div class="botcard mine">
          <canvas id="playerCv" width="132" height="132"></canvas>
          <div class="name" id="playerName">RUSTY</div>
          <div class="chips"><span class="chip" id="playerClass"></span></div>
          <div class="numdash" id="playerNums"></div>
        </div>
        <div class="vs">VS</div>
        <div class="botcard foe">
          <canvas id="scoutCv" width="132" height="132"></canvas>
          <div class="name" id="oppName"></div>
          <div class="chips">
            <span class="chip" id="oppClass"></span>
            <span class="chip" id="oppWeight"></span>
            <span class="chip tend" id="oppTend"></span>
          </div>
          <div class="numdash" id="oppNums"></div>
        </div>
      </div>
    </div>

    <div id="workshopTab" style="display:none">
      <div class="card" id="garageStrip"></div>
      <div class="card mybot">
        <div class="editorhead">
          <div class="layertabs" id="layerTabs"></div>
          <button class="toolbtn" id="cgToggle" data-i18n="cgShow"></button>
          <button class="toolbtn" id="hbToggle" data-i18n="hbShow"></button>
          <button class="toolbtn action" id="resetLayout" data-i18n="editReset"></button>
        </div>
        <div class="editorwrap">
          <canvas id="editorCv" width="640" height="640"></canvas>
          <div class="numdash" id="myNums"></div>
        </div>
        <div class="stats" id="statBars"></div>
      </div>
      <div class="card">
        <div id="slotRows"></div>
      </div>
      <div class="card params">
        <h2 data-i18n="yourBot"></h2>
        <div id="paramRows"></div>
        <div class="style-line" id="styleLine"></div>
        <h2 style="margin-top:12px" data-i18n="machine"></h2>
        <div id="powerRow"></div>
      </div>
      <div class="card">
        <div class="persohead" data-i18n="persoColor"></div>
        <div id="colorRow" class="swatchrow"></div>
        <div class="persohead" data-i18n="persoSticker"></div>
        <div id="stickerRow" class="swatchrow"></div>
      </div>
    </div>

    <div id="shopTab" style="display:none">
      <div class="card garage">
        <div id="garageRows"></div>
      </div>
    </div>
  </div>

  <div id="matchScreen">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="gauge" id="gA"><i style="width:100%"></i></div>
      <div id="clock">0.0</div>
      <div class="gauge" id="gB"><i style="width:100%"></i></div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="speedBtn">×1</button>
      <button class="btn ghost" id="forfeitBtn" data-i18n="forfeit"></button>
    </div>
  </div>
</div>

<div id="overlay"><div class="ocard">
  <h2 id="ovTitle"></h2>
  <div id="ovCause"></div>
  <div id="ovDuels"></div>
  <div id="ovStats" class="ovstats"></div>
  <div id="ovUnlock"></div>
  <div class="actions" style="justify-content:center">
    <button class="btn" id="ovMain"></button>
    <button class="btn ghost" id="ovBack" data-i18n="settings"></button>
  </div>
</div></div>
<div id="toast"><div class="tcard" id="toastText"></div></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<script>
// PWA : enregistrement du service worker (http(s) seulement ; inoffensif ailleurs)
if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
