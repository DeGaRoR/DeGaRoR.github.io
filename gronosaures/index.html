<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0f1a">
<meta name="description" content="Atlas de paléontologie : fouiller, documenter, comprendre.">
<title>Gronosaures et Trilobytes</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icones/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Fond illustré global : une créature déjà découverte, jamais un écran nu -->
<div id="fond-global"></div>

<header id="entete">
  <div class="ent-titre">
    <span class="ent-nom">Gronosaures</span>
    <span class="ent-sous">et Trilobytes</span>
  </div>
  <div id="solde" title="Crédits de recherche">
    <span class="sol-ico">◈</span><span id="solde-nb">0</span>
  </div>
  <button id="btn-reglages" onclick="ouvrirReglages()" aria-label="Profil et réglages"><span id="btn-profil-nom">Profil</span></button>
</header>

<main id="app">

  <!-- ============ FOUILLE ============ -->
  <section id="ecran-fouille" class="ecran actif">

    <!-- 1. Carte du monde -->
    <div id="vue-carte">
      <svg id="svg-monde" viewBox="0 0 1535 1024" preserveAspectRatio="xMidYMid slice"
           xmlns="http://www.w3.org/2000/svg" role="application" aria-label="Carte des sites de fouille">
        <image id="img-monde" href="monde-min.webp" xlink:href="monde-min.webp" x="0" y="0" width="1535" height="1024"/>
        <g id="pins"></g>
      </svg>
    </div>

    <!-- 2. Chantier : plein écran, fond illustré, un seul bouton -->
    <div id="vue-chantier" style="display:none">
      <div id="chantier-fond"></div>
      <div class="ch-corps">
        <div class="ch-haut">
          <button id="ch-retour" class="retour" aria-label="Retour à la carte">←</button>
          <div class="ch-ident">
            <h2 id="ch-nom"></h2>
            <p id="ch-meta"></p>
          </div>
        </div>
        <div class="ch-bas">
          <div id="ch-vignettes" class="ch-vignettes"></div>
          <div id="ch-jauge"></div>
          <p id="ch-avance" class="ch-avance"></p>
          <button id="btn-fouiller" class="btn-primaire btn-pioche">
            Fouiller · <b id="ch-cout"></b> ◈
          </button>
          <button id="ch-relire" class="btn-fant">Relire la présentation du site</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ COLLECTION ============ -->
  <section id="ecran-collection" class="ecran">
    <div class="col-tete">
      <h2>Collection</h2>
      <span id="col-compte" class="col-compte"></span>
    </div>
    <div class="col-tri" id="col-tri" role="group" aria-label="Classement de la collection">
      <button data-tri="chantier" class="on">Par chantier</button>
      <button data-tri="periode">Par période</button>
      <button data-tri="groupe">Par famille</button>
      <button data-tri="frise">Frise</button>
    </div>
    <div id="col-corps"></div>
  </section>

  <!-- ============ BOURSE ============ -->
  <section id="ecran-bourse" class="ecran">
    <div class="col-tete"><h2>Bourse de recherche</h2></div>
    <div id="bourse-corps"></div>
  </section>

</main>

<!-- Accueil : premier écran d'un profil neuf. Il nomme la joueuse et explique
     la boucle de jeu en trois lignes, puis ne revient plus. -->
<div id="accueil">
  <div id="acc-fond"></div>
  <div class="acc-voile"></div>
  <div class="acc-corps">
    <p class="acc-sur">Atlas du temps profond</p>
    <h1 class="acc-titre">Gronosaures<br><span>et Trilobytes</span></h1>
    <p class="acc-phrase">Prête à remonter les âges et à rencontrer les bêtes
      les plus invraisemblables qui aient jamais existé&nbsp;?</p>
    <label class="acc-lab" for="acc-nom">Comment veux-tu qu’on t’appelle&nbsp;?</label>
    <input id="acc-nom" type="text" maxlength="24" autocomplete="off"
           placeholder="Ton nom" enterkeyhint="go">
    <button class="btn-primaire acc-go" onclick="validerAccueil()">C’est parti</button>
    <p class="acc-credit" id="acc-credit"></p>
  </div>
</div>

<!-- Choix du profil au lancement, dès qu'il y en a plus d'un. Aucun mot de passe :
     tout est local, et le seul enjeu est de ne pas jouer sur la mauvaise partie. -->
<div id="choix-profil"><div class="cp-corps" id="cp-corps"></div></div>

<div id="guide"><div class="md-panneau" id="guide-corps"></div></div>

<div id="reglages"><div class="md-panneau" id="reglages-corps"></div></div>
<input type="file" id="fichier-import" accept="application/json,.json" hidden
       onchange="importerProgression(this.files[0]); this.value='';">

<nav class="tabs">
  <button data-ecran="bourse"><span>🎓</span>Bourse</button>
  <button data-ecran="fouille" class="on"><span>⛏️</span>Fouille</button>
  <button data-ecran="collection"><span>🧬</span>Collection</button>
</nav>

<!-- ============ SUPERPOSITIONS ============ -->

<!-- Déblocage d'un site -->
<div id="modal"><div class="md-panneau" id="modal-corps"></div></div>

<!-- Introduction théorique d'un site -->
<div id="intro">
  <div id="intro-fond"></div>
  <figure id="intro-globe" aria-hidden="true"><img id="intro-globe-img" src="" alt=""></figure>
  <div class="intro-corps">
    <p id="intro-accroche" class="intro-accroche"></p>
    <h2 id="intro-titre"></h2>
    <p id="intro-txt"></p>
    <div id="intro-dots" class="dots"></div>
    <button id="intro-next" class="btn-primaire"></button>
  </div>
</div>

<!-- Question d'entrée en tranchée -->
<div id="tranchee"><div class="tr-panneau" id="tranchee-corps"></div></div>

<!-- Révélation de la pièce extraite -->
<div id="reveal"><div id="reveal-corps"></div></div>

<!-- Fiche documentaire -->
<div id="fiche">
  <div class="fi-panneau">
    <button id="fiche-fermer" class="fermer" aria-label="Fermer">✕</button>
    <div id="fiche-corps"></div>
  </div>
</div>

<div id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
